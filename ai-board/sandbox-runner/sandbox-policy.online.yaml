# Online-profile runner policy: zero guest egress (network: none). Strict schema (src/policy.js); change only via reviewed deploy + restart.
# Guest = upstream alpine pinned by manifest digest. scripts/verify-online-guest.mjs checks the pin and shows how to re-verify it.
version: 1
vm: { cpus: 1, memory_mib: 512, disk_mib: 2048, ttl_s: 300, lease_s: 120 }
concurrency: 1
guest_image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
egress: []
network: none
guest_env: { CI: "1" }
archive: { max_bytes: 1048576, max_expanded_bytes: 4194304, max_files: 100 }
exec: { timeout_s: 20, max_stdout_bytes: 65536, max_stderr_bytes: 65536, workdir: /workspace }
artifacts: { max_file_bytes: 65536, max_total_bytes: 262144 }
