guest_image: image-registry:5000/gate5@sha256:deba52bb1a25ce0a80e46ea3c3c404b2fe5ed728369524bac5ca06d6c675e14e
network: none
egress: []
guest_env: { CI: "1", GATE5_CA_SHA256: "4b386847e6e3fbd65e91086e284957d53d96c17916afc0c12ea8c58f01ac313a" }
