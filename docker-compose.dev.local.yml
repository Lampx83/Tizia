# Chạy cả web + AI board + storage trên MỘT máy local chỉ với file này:
#   docker compose -f docker-compose.dev.local.yml up --build -d
# Mạng tizia-bridge do compose tự tạo (không cần docker network create). Mọi profile của stack AI được bật sẵn.
# Server demo dùng riêng docker-compose.dev.web.yml và docker-compose.dev.ai.yml, không dùng file này.
include:
  - docker-compose.dev.web.yml
  - docker-compose.dev.ai.yml

networks:
  tizia-bridge: !override
    name: ${TIZIA_BRIDGE_NETWORK:-tizia-bridge}

services:
  aiboard-server: { profiles: !reset [] }
  aiboard-postgres: { profiles: !reset [] }
  ai-board-worker: { profiles: !reset [] }
  image-registry: { profiles: !reset [] }
  sandbox-runner: { profiles: !reset [] }
  online-runner: { profiles: !reset [] }
  seaweedfs: { profiles: !reset [] }
  seaweedfs-ui-auth:
    profiles: !reset []
    ports: !override ["127.0.0.1:9333:9333", "127.0.0.1:8888:8888"]  # UI SeaweedFS chỉ nghe loopback host
