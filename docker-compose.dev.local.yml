# LF/110 - Test cục bộ hai stack trên CÙNG host (Windows Docker Desktop hoặc Linux):
# docker compose -f docker-compose.dev.local.yml --profile ai-board up -d
# (thêm --profile storage khi cần SeaweedFS cho đính kèm ảnh thô như trước đây)
# - Hai cầu nội bộ riêng: webnet (web + postgres web) và boardnet (aiboard-server + postgres board);
#   một cầu chia sẻ external tizia-internal để gọi nhau qua tên DNS service, không publish IP/port chéo.
# - Không chạy cùng lúc docker-compose.dev.yml hoặc docker-compose.dev.prod.yml: trùng tên container/volume.
# Bí mật: từ .env của host hoặc env của stack (AI_BOARD_INTERNAL_SECRET dùng chung cho hai phía).
services:
  # ---- Phía web (service names giữ nguyên: tizia-dev, tizia-postgres) ----
  tizia-dev:
    extends: { file: docker-compose.dev.yml, service: tizia-dev }
    networks: !override
      - webnet            # cầu riêng của web trong file dev.local
      - tizia-internal    # cầu chia sẻ: gọi aiboard-server + seaweedfs bằng DNS service

  tizia-postgres:
    extends: { file: docker-compose.dev.yml, service: tizia-postgres }
    networks: !override [webnet]

  # ---- Phía AI board: aiboard-server + POSTGRES + storage trong stack này (worker/sandbox opt-in profile ai-board) ----
  aiboard-server:
    extends: { file: docker-compose.dev.prod.yml, service: aiboard-server }
    networks: !override [boardnet, tizia-internal]   # KHÔNG publish port; web gọi http://aiboard-server:8081

  aiboard-postgres:
    extends: { file: docker-compose.dev.prod.yml, service: aiboard-postgres }
    networks: !override [boardnet]

  seaweedfs:
    extends: { file: docker-compose.dev.prod.yml, service: seaweedfs }
    networks: !override [boardnet, tizia-internal]

  seaweedfs-ui-auth:
    extends: { file: docker-compose.dev.prod.yml, service: seaweedfs-ui-auth }
    networks: !override [boardnet]   # UI bind loopback host; seaweedfs cũng phải với tới 9333/8888 qua cùng cầu

  image-registry:
    extends: { file: docker-compose.dev.prod.yml, service: image-registry }
    networks: !override [boardnet]

  sandbox-runner:
    extends: { file: docker-compose.dev.prod.yml, service: sandbox-runner }
    networks: !override [boardnet, sandbox-api]      # worker gọi sandbox bằng DNS sandbox-runner chứ không qua host

  ai-board-worker:
    extends: { file: docker-compose.dev.prod.yml, service: ai-board-worker }
    environment:  # ghi đè cùng các biến; bare = lấy từ .env / stack env
      AI_BOARD_SERVER_URL: http://aiboard-server:8081
    networks: !override
      - boardnet
      - sandbox-api

  ai-board-worker-2:
    extends: { file: docker-compose.dev.prod.yml, service: ai-board-worker-2 }
    networks: !override [boardnet, sandbox-api]

networks:
  webnet: {}       # cầu nội bộ web
  boardnet: {}     # cầu nội bộ board (git/egress qua NAT mặc định)
  sandbox-api: {}  # worker <-> sandbox-runner
  tizia-internal:
    external: true  # tạo một lần trên host: docker network create tizia-internal

volumes:
  pharmacysim-data:
    name: tizia_pharmacysim-data
    driver: local
  tizia-dev-data:
    name: tizia_tizia-dev-data
    driver: local
  tizia-postgres-data:
    name: tizia_tizia-postgres-data
  aiboard-postgres-data:
    name: tizia_aiboard-postgres-data
  ai-board-repo:
    name: tizia_ai-board-repo
  ai-board-memory:
    name: tizia_ai-board-memory
  ai-board-repo-2:
    name: tizia_ai-board-repo-2
  ai-board-memory-2:
    name: tizia_ai-board-memory-2
  sandbox-runner-state:
    name: tizia_sandbox-runner-state
  sandbox-registry:
    name: tizia_sandbox-registry
  seaweedfs-data:
    name: tizia_seaweedfs-data
