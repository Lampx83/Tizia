# Stack dev AI BOARD: aiboard-server, PostgreSQL board, worker(+2), sandbox-runner, image-registry, SeaweedFS.
# Stack riêng với docker-compose.dev.web.yml (không gộp với nó).
# Portainer: stack "tizia-dev-ai", Git nhánh dev, file docker-compose.dev.ai.yml, profiles `ai-board`
# (+ `storage` cho SeaweedFS, `multi-worker` cho worker thứ hai).
# Cùng host với stack web: tạo một lần `docker network create tizia-bridge` (tên đổi bằng TIZIA_BRIDGE_NETWORK).
# Chỉ aiboard-server và seaweedfs nối vào cầu này, với alias cùng tên; web gọi http://aiboard-server:8081 và http://seaweedfs:8333.
# Khác host: profile `expose-internal` mở aiboard-server:8081 và seaweedfs:8333 trên ${AI_BOARD_BIND_IP} (phải đặt
# IP nội bộ của host này; mặc định 127.0.0.1 nên bật nhầm vẫn không tới được từ host khác; không dùng 0.0.0.0). Không bật khi cùng host.
# Cross-host PHẢI có TLS (reverse proxy hoặc WireGuard) và firewall chỉ cho IP host web: HMAC không phủ path và body,
# cửa sổ thời gian 60 s (server/ai-board/internal-auth.js). Không có TLS thì traffic lộ nội dung.
# Chỉ aiboard-server/seaweedfs/sandbox nối với nhau qua boardnet, sandbox-api; không có cổng publish mặc định.
# Bí mật đưa bằng env của stack (Portainer), không đặt trong repo: POSTGRES_USER/PASSWORD/DB, AI_BOARD_INTERNAL_SECRET,
# AI_BOARD_KEY, AI_BOARD_WORKER_KEY, VLLM_URL/OLLAMA_URL + SECKEY, AI_BOARD_SHOTS_S3_*, SEAWEED_UI_PASSWORD.
services:
  aiboard-server:
    extends: { file: docker-compose.yml, service: tizia }
    build:
      context: .
    image: aiboard-server:dev
    container_name: aiboard-server
    profiles: [ai-board]
    restart: unless-stopped
    command: ["node", "server/aiboard-server.js"]  # entry board-only: migration + intake/request/worker routes trên DB riêng
    depends_on: !override  # không kế thừa depends_on của service web
      aiboard-postgres: { condition: service_healthy }
    environment:
      NODE_ENV: development
      PORT: 8081
      AI_BOARD_DATABASE_URL: postgres://${POSTGRES_USER:-tizia}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD}@aiboard-postgres:5432/${POSTGRES_DB:-tizia}
      AI_BOARD_INTERNAL_SECRET: ${AI_BOARD_INTERNAL_SECRET:?đặt AI_BOARD_INTERNAL_SECRET}
      AI_BOARD_KEY: ${AI_BOARD_KEY:-}  # trống = không mount worker API
      AI_BOARD_WORKER_KEY: ${AI_BOARD_WORKER_KEY:-}
      VLLM_URL: ${VLLM_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      VLLM_SECKEY: ${VLLM_SECKEY:-}  # gateway vllm chỉ nhận Bearer/x-ollama-seckey; thiếu = classifier 401
      OLLAMA_SECKEY: ${OLLAMA_SECKEY:-}
      AI_BOARD_MODEL_ROUTING: ${AI_BOARD_MODEL_ROUTING:-true}  # false/trống = /ollama/api/generate fallback → gateway 404
      AI_BOARD_CLASSIFIER_MODEL: ${AI_BOARD_CLASSIFIER_MODEL:-}
    ports: !override []
    volumes: !override  # base mount token bị bỏ; token qua secret
      - pharmacysim-data:/data
    secrets: [{ source: sandbox_runner_token, target: sandbox-runner-token }]
    networks: !override
      boardnet: {}
      tizia-bridge:
        aliases: [aiboard-server]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Postgres riêng cho AI board (entry tự migrate khi boot).
  aiboard-postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    container_name: aiboard-postgres
    profiles: [ai-board]
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tizia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tizia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - aiboard-postgres-data:/var/lib/postgresql/data
    networks: !override [boardnet]

  ai-board-worker:
    extends: { file: docker-compose.yml, service: ai-board-worker }
    build:
      context: .
      dockerfile: ai-board/worker.Dockerfile
      args:
        WORKER_CHROMIUM: "0"  # gate 5 chạy trong guest của sandbox-runner
    image: tizia-ai-board-worker:dev
    container_name: aiboard-worker
    depends_on: !override  # worker gọi entry board và sandbox; base depends_on (tizia) không áp dụng
      aiboard-server: { condition: service_healthy }
      sandbox-runner: { condition: service_healthy }
    networks: !override [boardnet, sandbox-api]
    volumes: !override  # token đi bằng secret, không bind-mount file ngoài repo
      - ai-board-repo:/repo
      - ai-board-memory:/opt/ai-board/ai-board/memory
    secrets: [{ source: sandbox_runner_token, target: sandbox-runner-token }]
    environment:
      AI_BOARD_SERVER_URL: http://aiboard-server:8081
      # Mặc định demo/dev cho vLLM dùng chung; ghi đè bằng env của stack/Portainer.
      AI_BOARD_WORKER_MODE: ${AI_BOARD_WORKER_MODE:-active}
      AI_BOARD_GATE25_ANSWERED: ${AI_BOARD_GATE25_ANSWERED:-1}
      AI_BOARD_FANOUT_MAX: ${AI_BOARD_FANOUT_MAX:-1}  # GPU dùng chung: một lượt model mỗi lúc
      BUDGET_MAX_TOKENS: ${BUDGET_MAX_TOKENS:-1000000}
      AI_BOARD_REASONING_OFF: ${AI_BOARD_REASONING_OFF:-gate3_heavy}  # gate3_heavy hết ngân sách đầu ra vào suy luận nên trả rỗng
      AI_BOARD_GATE3_CONTEXT: ${AI_BOARD_GATE3_CONTEXT:-hybrid}
      AI_BOARD_GATE25_FIXES: ${AI_BOARD_GATE25_FIXES:-quotes,ellipsis,context,retry,truncated,tokens,shortquote,literal}
      AI_BOARD_BEST_MATCH: ${AI_BOARD_BEST_MATCH:-advisory}
      AI_BOARD_RETRIEVAL: ${AI_BOARD_RETRIEVAL:-literal}
      AI_BOARD_GATE3_GUARDS: ${AI_BOARD_GATE3_GUARDS:-noop,refs,schema}
      AI_BOARD_REACT_PLAN: ${AI_BOARD_REACT_PLAN:-1}
      AI_BOARD_PROMPT_ROLE_SPLIT: ${AI_BOARD_PROMPT_ROLE_SPLIT:-1}
      AI_BOARD_GRAPH_PERSISTENCE: ${AI_BOARD_GRAPH_PERSISTENCE:-1}
      AI_BOARD_PROGRESS_LOOP: ${AI_BOARD_PROGRESS_LOOP:-1}
      AI_BOARD_MODEL_REPAIR: ${AI_BOARD_MODEL_REPAIR:-1}
      # Cờ đo (B0 = tất cả tắt; B1 = bật hết): đổi bằng env của stack rồi Update.
      AI_BOARD_COMPILE_PROSE_VERIFY: ${AI_BOARD_COMPILE_PROSE_VERIFY:-0}
      AI_BOARD_ORACLE_CSS_SIZE: ${AI_BOARD_ORACLE_CSS_SIZE:-0}
      AI_BOARD_EXPLORE_LOW_CONFIDENCE: ${AI_BOARD_EXPLORE_LOW_CONFIDENCE:-0}
      AI_BOARD_PROCEDURE_IN_SPLIT: ${AI_BOARD_PROCEDURE_IN_SPLIT:-0}
      AI_BOARD_TOOL_LOOP: ${AI_BOARD_TOOL_LOOP:-}  # rỗng | 1 | auto; worker từ chối '0'
      AI_BOARD_STOP_REPORT_V2: ${AI_BOARD_STOP_REPORT_V2:-0}
      AI_BOARD_REPAIR_DIAGNOSE: ${AI_BOARD_REPAIR_DIAGNOSE:-0}
      AI_BOARD_GATE1_PROBE_TIMEOUT_S: ${AI_BOARD_GATE1_PROBE_TIMEOUT_S:-45}

  # Worker thứ hai (profile multi-worker, bật cùng --profile ai-board): repo và memory riêng.
  ai-board-worker-2:
    extends: { service: ai-board-worker }
    container_name: aiboard-worker-2
    hostname: ai-board-worker-2
    profiles: !override [multi-worker]
    volumes: !override
      - ai-board-repo-2:/repo
      - ai-board-memory-2:/opt/ai-board/ai-board/memory

  image-registry:
    extends: { file: docker-compose.yml, service: image-registry }
    container_name: aiboard-registry
    networks: !override [boardnet]

  sandbox-runner:
    extends: { file: docker-compose.yml, service: sandbox-runner }
    image: tizia-sandbox-runner:dev
    container_name: aiboard-sandbox-runner
    networks: !override [boardnet, sandbox-api]
    volumes: !override  # token đi bằng secret, không bind-mount file ngoài repo
      - sandbox-runner-state:/home/node/.microsandbox
      - ./ai-board/sandbox-runner/sandbox-policy.large.yaml:/etc/sandbox/sandbox-policy.yaml:ro
    secrets: [{ source: sandbox_runner_token, target: sandbox-runner-token }]

  seaweedfs:
    extends: { file: docker-compose.yml, service: seaweedfs }
    container_name: aiboard-seaweedfs
    networks: !override
      boardnet: {}
      tizia-bridge:
        aliases: [seaweedfs]  # web gọi http://seaweedfs:8333 qua cầu tizia-bridge
    ports: !override []  # UI đi qua seaweedfs-ui-auth
    logging: *logging

  # UI SeaweedFS sau basic-auth; không publish cổng.
  seaweedfs-ui-auth:
    container_name: aiboard-seaweedfs-ui
    image: node:24-alpine
    profiles: [storage]
    restart: unless-stopped
    depends_on: [seaweedfs]
    command: sh -c 'export SEAWEED_UI_PASSWORD="${SEAWEED_UI_PASSWORD:-}"; node /app/scripts/seaweed-ui-auth.js'
    environment:
      SEAWEED_UI_USER: ${SEAWEED_UI_USER:-admin}
      SEAWEED_UI_PASSWORD: ${SEAWEED_UI_PASSWORD:-}
    networks: !override [boardnet]
    volumes:
      - ./scripts/seaweed-ui-auth.js:/app/scripts/seaweed-ui-auth.js:ro

  # Cầu TCP mở aiboard-server:8081 và seaweedfs:8333 ra IP nội bộ cho web khác host. Không có secret; HMAC vẫn áp dụng.
  # Compose không đổi ports theo profile trên cùng service nên cần service riêng. Bật cùng --profile ai-board --profile storage.
  aiboard-internal-relay:
    image: node:24-alpine
    container_name: aiboard-internal-relay
    profiles: [expose-internal]
    restart: unless-stopped
    depends_on: [aiboard-server, seaweedfs]
    command:
      - node
      - -e
      - "const net=require('net');for(const [p,h] of [[8081,'aiboard-server'],[8333,'seaweedfs']])net.createServer(c=>{const u=net.connect(p,h);c.pipe(u);u.pipe(c);c.on('error',()=>{});u.on('error',()=>{})}).listen(p)"
    ports:
      - "${AI_BOARD_BIND_IP:-127.0.0.1}:8081:8081"  # đặt IP nội bộ khi bật profile; `:?` sẽ lỗi cả khi tắt profile
      - "${AI_BOARD_BIND_IP:-127.0.0.1}:8333:8333"
    networks: [boardnet]
    logging: *logging

secrets:
  sandbox_runner_token:
    environment: SANDBOX_RUNNER_TOKEN  # chuỗi ngẫu nhiên dài; đặt trong env của stack

networks:
  boardnet: {}
  sandbox-api: {}
  tizia-bridge:
    name: ${TIZIA_BRIDGE_NETWORK:-tizia-bridge}
    external: true

volumes:
  pharmacysim-data:
    name: tizia_pharmacysim-data  # mount /data kế thừa từ service tizia cho aiboard-server
  aiboard-postgres-data:
    name: tizia_aiboard-postgres-data
  ai-board-repo:
    name: tizia_ai-board-repo  # tái dùng data khi chuyển từ stack cũ
  ai-board-memory:
    name: tizia_ai-board-memory
  ai-board-repo-2:
    name: tizia_ai-board-repo-2
  ai-board-memory-2:
    name: tizia_ai-board-memory-2
  sandbox-runner-state:
    name: tizia_sandbox-runner-state
  sandbox-registry:
    name: tizia_sandbox-registry
  seaweedfs-data:
    name: tizia_seaweedfs-data
