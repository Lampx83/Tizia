services:
  tizia-dev:
    build:
      context: .
    image: tizia:dev
    container_name: tizia-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8041}:8041"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8041
      HOST: 0.0.0.0
      DATA_DIR: /data
      AI_BOARD_WORKER_KEY: ${AI_BOARD_WORKER_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_SECKEY: ${OLLAMA_SECKEY:-}
      AI_BOARD_CLASSIFIER_MODEL: ${AI_BOARD_CLASSIFIER_MODEL:-qwen3.5:4b}
      TIZIA_MODEL_AI_BOARD_GRILL: ${TIZIA_MODEL_AI_BOARD_GRILL:-qwen3.5:4b}
      TIZIA_MODEL_AI_BOARD_SPEC: ${TIZIA_MODEL_AI_BOARD_SPEC:-qwen3:8b}
      AI_BOARD_SHOT_RETENTION_DAYS: ${AI_BOARD_SHOT_RETENTION_DAYS:-30}  # dev only; production keeps screenshots unless this is set
    volumes:
      - tizia-dev-data:/data

  ai-board-worker:
    container_name: tizia-ai-board-worker
    build:
      context: .
      dockerfile: ai-board/worker.Dockerfile
    image: tizia-ai-board-worker:latest
    profiles: [ai-board]
    depends_on: [tizia-dev, sandbox-runner]
    restart: on-failure
    cap_add: [NET_ADMIN]  # egress lock only; Gate 5 runs in the sandbox microVM, so no privileged mode or Docker daemon
    networks: [default, sandbox-api]
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
    environment:
      AI_BOARD_SERVER_URL: http://tizia-dev:8041
      AI_BOARD_WORKER_KEY: ${AI_BOARD_WORKER_KEY:?AI_BOARD_WORKER_KEY is required}
      AI_BOARD_WORKER_MODE: ${AI_BOARD_WORKER_MODE:-off}
      AI_BOARD_REPO_DIR: /repo
      AI_BOARD_SANDBOX_URL: http://sandbox-runner:8090
      AI_BOARD_GITHUB_TOKEN: ${AI_BOARD_GITHUB_TOKEN:-}
      PR_BASE_BRANCH: dev
      OLLAMA_URL: ${OLLAMA_URL:?OLLAMA_URL is required}
      OLLAMA_SECKEY: ${OLLAMA_SECKEY:-}
      GATE1_MODEL: ${GATE1_MODEL:-qwen3:8b}
      GATE3_MODEL_HEAVY: ${GATE3_MODEL_HEAVY:-qwen2.5-coder:14b}
      GATE3_MODEL_LIGHT: ${GATE3_MODEL_LIGHT:-qwen2.5-coder:14b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      AI_BOARD_CLASSIFIER_MODEL: ${AI_BOARD_CLASSIFIER_MODEL:-qwen3.5:4b}
      BUDGET_MAX_WALL_CLOCK_S: "1200"
    volumes:
      - ai-board-repo:/repo
      - ai-board-memory:/opt/ai-board/ai-board/memory
      - ./ai-board/sandbox-runner/secrets/runner-token:/run/secrets/sandbox-runner-token:ro

  image-registry:
    container_name: tizia-image-registry
    image: registry:2
    profiles: [ai-board]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"  # loopback only: push the pinned guest image from this machine
    volumes:
      - sandbox-registry:/var/lib/registry

  sandbox-runner:
    container_name: tizia-sandbox-runner
    build:
      context: ai-board/sandbox-runner
    image: tizia-sandbox-runner:dev
    profiles: [ai-board]
    restart: on-failure
    user: node
    devices:
      - /dev/kvm
    group_add:
      - "${KVM_GID:-109}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 3g
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [default, sandbox-api]
    volumes:
      - sandbox-runner-state:/home/node/.microsandbox
      - ./ai-board/sandbox-runner/sandbox-policy.dev.yaml:/etc/sandbox/sandbox-policy.yaml:ro
      - ./ai-board/sandbox-runner/secrets/runner-token:/run/secrets/sandbox-runner-token:ro

  # Tùy chọn: kho ảnh bản nháp AI Board trên SeaweedFS (S3 gateway). `docker compose --profile storage up -d seaweedfs`,
  # rồi đặt cho tizia-dev (trong file env của nó): AI_BOARD_SHOTS_S3_ENDPOINT=http://seaweedfs:8333
  # AI_BOARD_SHOTS_S3_BUCKET=ai-board-shots AI_BOARD_SHOTS_S3_ACCESS_KEY / _SECRET_KEY = SEAWEED_S3_ACCESS_KEY / _SECRET_KEY
  # (bucket tự tạo ở lần ghi đầu). Mặc định dưới đây CHỈ cho dev cục bộ — đặt SEAWEED_S3_* thật nếu máy có người khác truy cập.
  # Đã chạy thật: put/get/miss/remove qua chữ ký SigV4 của shot-storage.js (seaweedfs 4.48).
  seaweedfs:
    container_name: tizia-seaweedfs
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d  # 4.48
    profiles: [storage]
    restart: unless-stopped
    command: server -s3 -dir=/data  # master + volume + filer + S3 trong 1 container
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_S3_ACCESS_KEY:-tizia-dev-only}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_S3_SECRET_KEY:-tizia-dev-only-secret}
    ports:
      - "127.0.0.1:8333:8333"  # loopback only; tizia-dev gọi qua mạng compose http://seaweedfs:8333
    volumes:
      - seaweedfs-data:/data

networks:
  sandbox-api: {}

volumes:
  tizia-dev-data:
    driver: local
  ai-board-repo:
  ai-board-memory:
  sandbox-runner-state:
  sandbox-registry:
  seaweedfs-data:
