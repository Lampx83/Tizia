# Stack web (LF/110): chỉ web + Postgres web, cổng duy nhất 8041.
# Mọi thứ AI board (server/Postgres/worker/sandbox/seaweed/registry) thuộc stack khác:
#   - cùng host  : docker compose -f docker-compose.dev.local.yml --profile ai-board up -d
#   - host riêng : docker compose -f docker-compose.dev.prod.yml --profile ai-board up -d (Portainer)
# Hai stack gặp nhau qua external network `tizia-internal` (tạo một lần trên host: docker network create tizia-internal).
services:
  tizia-dev:
    extends: { file: docker-compose.yml, service: tizia }
    image: tizia:dev
    container_name: tizia-dev
    depends_on: !override  # the app needs PostgreSQL at boot
      tizia-postgres: { condition: service_healthy }
    ports: !override
      - "${PORT:-8041}:8041"  # cửa duy nhất: web; AI board/preview không publish thêm cổng
    env_file:
      - .env
    environment:  # chỉ nối dây trong container; mọi cấu hình (khóa, model, retention) nằm trong file .env
      NODE_ENV: development
      AI_BOARD_PREVIEW_BIND_HOST: 0.0.0.0
      AI_BOARD_PRIVATE_PREVIEW_ENABLED: "false"  # preview phải đi qua 8041; chưa mở cổng riêng
      BASE_PATH: !reset null
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tizia-postgres:5432/${POSTGRES_DB}  # ghi đè DATABASE_URL trong .env (dành cho chạy ngoài container)
      # Board chạy ở stack khác khi có aiboard-server; trống hai biến này app chỉ chạy luồng nội bộ.
      AI_BOARD_SERVER_URL: ${AI_BOARD_SERVER_URL:-http://aiboard-server:8081}
      AI_BOARD_INTERNAL_SECRET: ${AI_BOARD_INTERNAL_SECRET:-}
      # Ảnh bản nháp AI board: S3 gateway của SeaweedFS (DNS qua tizia-internal).
      AI_BOARD_SHOTS_S3_ENDPOINT: http://seaweedfs:8333
    volumes: !override
      - tizia-dev-data:/data  # sao lưu pg_dump + file tải lên; dữ liệu chính nằm trong PostgreSQL
    networks: !override
      - default   # cầu nội bộ project (PLC web có cổng publish)
      - tizia-internal  # gọi aiboard-server/seaweedfs bằng DNS service của stack kia

  # PostgreSQL của web. Chỉ trên mạng compose nội bộ: KHÔNG publish cổng ra host.
  tizia-postgres:
    extends: { file: docker-compose.yml, service: postgres }
    container_name: tizia-postgres
    environment:  # bare = lấy từ .env / shell, như trước khi gộp compose
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - tizia-postgres-data:/var/lib/postgresql/data

networks:
  tizia-internal:
    external: true  # tạo một lần trên host; dev.prod/dev.local dùng chung

volumes:
  tizia-dev-data:
    name: tizia_tizia-dev-data
    driver: local
  tizia-postgres-data:
    name: tizia_tizia-postgres-data
