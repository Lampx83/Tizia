# Dev override: docker compose -f docker-compose.yml -f docker-compose.dev.yml [--profile ai-board] up -d
# Chỉ khác biệt dev: tên container tizia-dev, cổng, file .env, volume dữ liệu dev, bản dev của image, DATABASE_URL cho chạy ngoài container.
services:
  tizia:
    image: tizia:dev
    container_name: tizia-dev
    ports: !override
      - "${PORT:-8041}:8041"
      - "127.0.0.1:8042:8042"  # private preview host remains loopback-only
    env_file:
      - .env
    environment:  # mọi cấu hình (khóa, model, retention) nằm trong file .env
      NODE_ENV: development
      AI_BOARD_PREVIEW_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}  # ghi đè DATABASE_URL trong .env (dành cho chạy ngoài container)
    volumes:
      - tizia-dev-data:/data  # sao lưu pg_dump + file tải lên; dữ liệu chính nằm trong PostgreSQL

  sandbox-runner:
    image: tizia-sandbox-runner:dev

volumes:
  tizia-dev-data:
    driver: local
