<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CV / Portfolio · Tizia</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#0ea5e9" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 10px; justify-content: center; align-items: center;
    padding: 12px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid #e2e8f0;
  }
  .toolbar button, .toolbar a {
    padding: 9px 16px; border: 1px solid #cbd5e1; border-radius: 8px;
    background: white; color: #0f172a; cursor: pointer; font-weight: 600;
    text-decoration: none; font-size: 14px; font-family: inherit;
  }
  .toolbar button.primary { background: linear-gradient(135deg, #0ea5e9, #22c55e); color: white; border: none; }
  .toolbar button:hover { background: #f8fafc; }
  .toolbar button.primary:hover { filter: brightness(1.08); }

  .cv {
    max-width:none; margin: 24px auto; background: white;
    border-radius: 12px; box-shadow: 0 6px 30px rgba(15,23,42,0.08);
    padding: 40px 50px;
  }
  @media print {
    body { background: white; }
    .toolbar { display: none; }
    .cv { box-shadow: none; margin: 0; max-width: none; border-radius: 0; }
  }
  .head { display: flex; gap: 24px; align-items: center; padding-bottom: 24px; border-bottom: 2px solid #0ea5e9; }
  .avatar {
    width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #0ea5e9, #22c55e);
    color: white; font-size: 36px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .head h1 { margin: 0; font-size: 28px; }
  .head .sub { margin-top: 4px; color: #475569; font-size: 14px; }
  .meta { margin-top: 6px; color: #0ea5e9; font-size: 13px; font-weight: 600; }

  .section { margin-top: 28px; }
  .section h2 { margin: 0 0 14px; font-size: 15px; color: #0ea5e9; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
  .grid-2 .k { color: #64748b; font-size: 13px; }
  .grid-2 .v { font-weight: 600; font-size: 14px; }

  .badge-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px;
    background: linear-gradient(135deg, #fef3c7, #fed7aa);
    border: 1px solid #fbbf24; color: #78350f; font-size: 13px; font-weight: 600;
  }
  .empty { color: #94a3b8; font-style: italic; font-size: 14px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; text-align: center; }
  .stat .num { font-size: 26px; font-weight: 800; color: #0ea5e9; }
  .stat .lbl { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  table.attempts { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.attempts th, table.attempts td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  table.attempts th { color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  table.attempts td .pct { font-weight: 700; color: #0ea5e9; }

  .footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body data-no-auth-header data-no-notifications-bell data-no-suggestion-fab>
<div class="toolbar">
  <button class="primary" onclick="window.print()">🖨️ In / Lưu PDF</button>
  <a href="./" class="back">← Về trang chủ</a>
</div>

<div class="cv" id="cv">
  <div class="head">
    <div class="avatar" id="cv-avatar">…</div>
    <div>
      <h1 id="cv-name">Đang tải…</h1>
      <div class="sub" id="cv-sub"></div>
      <div class="meta" id="cv-meta"></div>
    </div>
  </div>

  <div class="section">
    <h2>Hồ sơ</h2>
    <div class="grid-2" id="cv-profile"></div>
  </div>

  <div class="section">
    <h2>Số liệu học tập</h2>
    <div class="stat-grid" id="cv-stats">
      <div class="stat"><div class="num" id="stat-attempts">…</div><div class="lbl">Lượt hoàn thành</div></div>
      <div class="stat"><div class="num" id="stat-badges">…</div><div class="lbl">Huy hiệu đạt được</div></div>
      <div class="stat"><div class="num" id="stat-perfect">…</div><div class="lbl">Lượt Perfect (100%)</div></div>
    </div>
  </div>

  <div class="section">
    <h2>Huy hiệu</h2>
    <div class="badge-list" id="cv-badges"><span class="empty">Chưa có</span></div>
  </div>

  <div class="section">
    <h2>Top 10 lượt nổi bật</h2>
    <table class="attempts">
      <thead><tr><th>Bài</th><th style="width:90px">Điểm</th><th style="width:80px">Đúng</th><th style="width:120px">Ngày</th></tr></thead>
      <tbody id="cv-attempts"><tr><td colspan="4" class="empty">Chưa có lượt nào</td></tr></tbody>
    </table>
  </div>

  <div class="footer">
    Sinh từ <b>Tizia</b> · The Intelligent Zone for Interactive Academy · tizia.vn
  </div>
</div>

<script type="module">
  import { fetchMe } from './js/auth.js';
  import { getBadges } from './js/api.js';

  const MAJOR_LABEL = {
    pharmacy:'💊 Dược', it:'💻 Công nghệ thông tin', economics:'📉 Kinh tế',
    business:'📈 Kinh doanh', finance:'🏦 Tài chính – Ngân hàng', medicine:'⚕️ Y',
    nursing:'🩺 Điều dưỡng', law:'⚖️ Luật', education:'🎓 Sư phạm',
    engineering:'⚙️ Kỹ thuật – Công nghệ', architecture:'🏛️ Kiến trúc – Xây dựng',
    languages:'🗣️ Ngoại ngữ', agriculture:'🌾 Nông nghiệp', tourism:'🏖️ Du lịch – Khách sạn',
    arts:'🎨 Mỹ thuật – Thiết kế', media:'📰 Báo chí – Truyền thông',
    'social-sciences':'📚 KHXH & Nhân văn', 'natural-sciences':'🔬 Khoa học tự nhiên',
    logistics:'🚚 Logistics', 'public-admin':'🏢 Quản trị Nhà nước',
  };

  const me = await fetchMe();
  if (!me) { location.replace('login.html?return=' + encodeURIComponent('/cv.html')); throw new Error('need login'); }
  if (me.role !== 'student' && me.role !== 'teacher') {
    // Cho phép GV xem để demo; HS không có trang CV (gamification của HS là sticker, không phải portfolio)
    document.querySelector('.cv').innerHTML = `<div style="padding:40px;text-align:center"><h2>📋 Trang này dành cho Sinh viên</h2><p>Học sinh có hệ thống huy hiệu vui ở <a href="/">trang chủ</a> 🎒</p></div>`;
    throw new Error('not student');
  }

  // Header
  const initials = (me.display_name || '?').split(' ').slice(-2).map(w => w[0]).join('').toUpperCase();
  document.getElementById('cv-avatar').textContent = initials;
  document.getElementById('cv-name').textContent = me.display_name;
  document.getElementById('cv-sub').textContent = `@${me.username} · ${me.role === 'student' ? 'Sinh viên' : 'Giảng viên'}`;
  const majorLabel = MAJOR_LABEL[me.major] || me.major || '—';
  document.getElementById('cv-meta').textContent = `${majorLabel}${me.cohort ? ' · ' + me.cohort : ''}${me.school_name ? ' · ' + me.school_name : ''}`;

  // Hồ sơ
  const profile = document.getElementById('cv-profile');
  const rows = [
    ['Họ và tên', me.display_name],
    ['Email', me.email || '—'],
    ['Ngành học', majorLabel],
    ['Khoá', me.cohort || '—'],
    ['Trường', me.school_name || '—'],
    ['Tuổi', me.age != null ? me.age : '—'],
  ];
  profile.innerHTML = rows.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');

  // Achievements + attempts
  const playerEnc = encodeURIComponent(me.display_name);
  const [achs, allBadges, attemptsRes] = await Promise.all([
    fetch(`/api/achievements?player=${playerEnc}`).then(r => r.ok ? r.json() : []).catch(() => []),
    getBadges(me.role),
    fetch(`/api/players/${playerEnc}/attempts?limit=200`).then(r => r.ok ? r.json() : { attempts: [] }).catch(() => ({ attempts: [] })),
  ]);
  const attempts = Array.isArray(attemptsRes) ? attemptsRes : (attemptsRes?.attempts || []);

  // Stats
  document.getElementById('stat-attempts').textContent = attempts.length;
  document.getElementById('stat-badges').textContent = `${achs.length}/${allBadges.length}`;
  const perfect = attempts.filter(a => a.correct === a.total && a.total > 0).length;
  document.getElementById('stat-perfect').textContent = perfect;

  // Badge list
  const unlockedIds = new Set(achs.map(a => a.badge_id));
  const unlocked = allBadges.filter(b => unlockedIds.has(b.id));
  const badgeEl = document.getElementById('cv-badges');
  if (unlocked.length) {
    badgeEl.innerHTML = unlocked.map(b => `<span class="badge">${b.icon} ${b.label}</span>`).join('');
  }

  // Top 10 attempts by score
  const top = [...attempts].sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 10);
  const tbody = document.getElementById('cv-attempts');
  if (top.length) {
    tbody.innerHTML = top.map(a => `
      <tr>
        <td>${a.version || '—'}</td>
        <td><span class="pct">${a.score || 0}</span> / 100</td>
        <td>${a.correct || 0}/${a.total || 0}</td>
        <td>${new Date(a.created_at).toLocaleDateString('vi-VN')}</td>
      </tr>
    `).join('');
  }
</script>
</body>
</html>
