<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#312e81" />
<meta name="robots" content="noindex,nofollow" />
<title>Tizia · Quản lý lớp · Giảng viên</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
    color: white; padding: 28px 18px;
  }
  body > header:not(#auth-header) { max-width: 1100px; margin: 0 auto 22px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; }
  .sub { opacity: 0.7; font-size: 13px; }
  .right { margin-left: auto; display: flex; gap: 8px; }
  a.lnk { color: white; text-decoration: none; font-size: 12px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; }
  a.lnk:hover { background: rgba(255,255,255,0.25); }
  .grid { max-width:none; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 880px) { .grid { grid-template-columns: 360px 1fr; } }

  .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 18px; }
  .card label { display: block; font-size: 12px; opacity: 0.8; margin: 8px 0 4px; }
  .card input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px; font-family: inherit; }
  .card button { width: 100%; padding: 11px 18px; border: none; border-radius: 8px; background: #10b981; color: white; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px; margin-top: 12px; }
  .card button:hover { background: #34d399; }

  .classes-list { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
  .cls { padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,0.22); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
  .cls:hover { background: rgba(0,0,0,0.32); border-color: rgba(255,255,255,0.2); }
  .cls.active { border-color: #fbbf24; background: rgba(251,191,36,0.12); }
  .cls .name { font-weight: 700; font-size: 14px; }
  .cls .meta { font-size: 11px; opacity: 0.7; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .cls .code { background: rgba(255,255,255,0.15); padding: 1px 8px; border-radius: 8px; font-family: monospace; font-weight: 700; }

  .detail { min-height: 400px; }
  .detail .header-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .detail h2 { margin: 0; }
  .detail .invite {
    background: rgba(251,191,36,0.15); border: 1px dashed #fbbf24;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .detail .invite .label { font-size: 11px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.4px; }
  .detail .invite code { background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 6px; font-size: 16px; font-weight: 700; color: #fbbf24; }
  .detail .invite a { font-size: 12px; color: #fbbf24; text-decoration: none; }
  .detail .invite .copy { font-size: 11px; padding: 4px 10px; background: #fbbf24; color: #1f2937; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat-row .s { background: rgba(0,0,0,0.22); padding: 8px 12px; border-radius: 8px; text-align: center; }
  .stat-row .v { font-size: 20px; font-weight: 800; color: #fbbf24; }
  .stat-row .l { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { font-weight: 600; opacity: 0.7; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  td.r, th.r { text-align: right; }
  tr.row { cursor: pointer; transition: background 0.12s; }
  tr.row:hover { background: rgba(255,255,255,0.05); }
  .star { color: #fbbf24; }
  .empty { padding: 30px; text-align: center; opacity: 0.5; font-style: italic; }
  .csv-btn { background: #f59e0b; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 700; }
  .csv-btn:hover { background: #fbbf24; color: #1f2937; }

  #player-detail { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
  #player-detail h3 { margin: 0 0 8px; font-size: 16px; }
  #player-detail .att { padding: 6px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; justify-content: space-between; }
  #player-detail .att .badge { background: rgba(255,255,255,0.15); padding: 1px 6px; border-radius: 4px; font-size: 10px; }
</style>
</head>
<body>
<header>
  <h1>👨‍🏫 Quản lý lớp</h1>
  <span class="sub">Tạo lớp · phát mã mời cho SV · theo dõi tiến độ</span>
  <span class="right">
    <a class="lnk" href="teacher-live.html">🔴 Live Quiz</a>
    <a class="lnk" href="lesson-builder.html">🧩 Soạn bài</a>
    <a class="lnk" href="dashboard.html">📊 Dashboard tổng</a>
    <a class="lnk" href="./">← Trang chính</a>
  </span>
</header>

<div class="grid">
  <div class="card">
    <h2>➕ Tạo lớp mới</h2>
    <label>Tên lớp</label>
    <input id="new-name" placeholder="VD: Dược 2025 — K15" maxlength="60" />
    <label>Tên giảng viên</label>
    <input id="new-teacher" placeholder="VD: PGS.TS. Nguyễn Văn A" maxlength="40" />
    <button id="create-btn">Tạo lớp + sinh mã</button>
    <h2 style="margin-top:18px">📚 Các lớp đã tạo</h2>
    <div class="classes-list" id="classes-list">đang tải...</div>
  </div>

  <div class="card detail" id="detail">
    <div class="empty">← Chọn 1 lớp ở bên trái để xem chi tiết</div>
  </div>
</div>

<script type="module">
const list = document.getElementById('classes-list');
const detail = document.getElementById('detail');
let active = null;

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmt(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  return d.toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
}

async function loadClasses() {
  const r = await fetch('api/classes');
  const cls = await r.json();
  if (!cls.length) {
    list.innerHTML = '<div class="empty" style="padding:14px;font-size:12px">Chưa có lớp — tạo lớp đầu tiên!</div>';
    return;
  }
  list.innerHTML = cls.map(c => `
    <div class="cls ${active === c.code ? 'active' : ''}" data-code="${c.code}">
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="meta">
        <span class="code">${c.code}</span>
        <span>👨‍🏫 ${escapeHtml(c.teacher_name)}</span>
        <span>👥 ${c.student_count} SV</span>
        <span>🎮 ${c.attempt_count} lượt</span>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.cls').forEach(el => {
    el.addEventListener('click', () => loadDetail(el.dataset.code));
  });
}

async function loadDetail(code) {
  active = code;
  await loadClasses();
  detail.innerHTML = '<div class="empty">đang tải...</div>';
  const [info, members] = await Promise.all([
    fetch('api/classes/' + code).then(r => r.json()),
    fetch('api/classes/' + code + '/members').then(r => r.json()),
  ]);

  const totalAttempts = members.reduce((s, m) => s + m.attempts, 0);
  const avg = members.length ? Math.round(members.reduce((s, m) => s + (m.avg_score || 0), 0) / members.length) : 0;
  const totalPerfect = members.reduce((s, m) => s + (m.perfect_count || 0), 0);

  const inviteUrl = `${location.origin}/?class=${code}`;
  detail.innerHTML = `
    <div class="header-row">
      <h2>${escapeHtml(info.name)}</h2>
      <span class="sub">👨‍🏫 ${escapeHtml(info.teacher_name)} · tạo ${fmt(info.created_at)}</span>
    </div>

    <div class="invite">
      <span class="label">Mã mời SV:</span>
      <code>${info.code}</code>
      <a href="${inviteUrl}" target="_blank">${inviteUrl}</a>
      <button class="copy" id="copy-link">Sao chép link</button>
    </div>

    <div class="stat-row">
      <div class="s"><div class="v">${members.length}</div><div class="l">Sinh viên</div></div>
      <div class="s"><div class="v">${totalAttempts}</div><div class="l">Tổng lượt</div></div>
      <div class="s"><div class="v">${avg}</div><div class="l">Điểm TB</div></div>
      <div class="s"><div class="v">${totalPerfect}</div><div class="l">Perfect</div></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <h3 style="margin:0;font-size:14px">📋 Roster (${members.length} SV)</h3>
      <span style="flex:1"></span>
      <a class="csv-btn" href="api/classes/${code}/export.csv" download>⬇️ Export CSV lớp</a>
    </div>

    ${members.length === 0 ? '<div class="empty">Chưa có SV nào tham gia.<br><small>Chia sẻ link mời ở trên cho SV vào.</small></div>' : `
    <table>
      <thead><tr><th>Sinh viên</th><th class="r">Lượt</th><th class="r">Tốt nhất</th><th class="r">TB</th><th class="r">🎯 Perfect</th><th class="r">Lần cuối</th></tr></thead>
      <tbody>
      ${members.map((m, i) => `
        <tr class="row" data-player="${escapeHtml(m.player_name)}">
          <td><b>${i+1}.</b> ${escapeHtml(m.player_name)}</td>
          <td class="r">${m.attempts}</td>
          <td class="r" style="color:#fbbf24;font-weight:700">${m.best_score}</td>
          <td class="r">${m.avg_score ?? '—'}</td>
          <td class="r">${m.perfect_count > 0 ? '⭐'.repeat(Math.min(m.perfect_count, 5)) + (m.perfect_count > 5 ? '+' : '') : '—'}</td>
          <td class="r" style="font-size:11px;opacity:0.7">${fmt(m.last_seen)}</td>
        </tr>
      `).join('')}
      </tbody>
    </table>
    <div id="player-detail" style="display:none"></div>
    `}
  `;

  document.getElementById('copy-link')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(inviteUrl);
    const btn = document.getElementById('copy-link');
    btn.textContent = '✓ Đã sao chép';
    setTimeout(() => btn.textContent = 'Sao chép link', 1500);
  });

  document.querySelectorAll('tr.row').forEach(tr => {
    tr.addEventListener('click', () => loadPlayerDetail(tr.dataset.player));
  });
}

async function loadPlayerDetail(playerName) {
  const pd = document.getElementById('player-detail');
  pd.style.display = 'block';
  pd.innerHTML = `<h3>📈 Chi tiết: ${escapeHtml(playerName)}</h3><div class="empty">đang tải...</div>`;
  const r = await fetch('api/players/' + encodeURIComponent(playerName) + '/attempts?limit=30');
  const atts = await r.json();
  if (!atts.length) {
    pd.innerHTML = `<h3>📈 ${escapeHtml(playerName)}</h3><div class="empty">Chưa có lượt nào</div>`;
    return;
  }
  pd.innerHTML = `
    <h3>📈 ${escapeHtml(playerName)} — ${atts.length} lượt gần nhất</h3>
    ${atts.map(a => `
      <div class="att">
        <span><span class="badge">${a.version}${a.level_n ? ' L'+a.level_n : ''}</span> ${a.correct}/${a.total} · <b style="color:#fbbf24">${a.score}đ</b></span>
        <span style="opacity:0.6">${fmt(a.created_at)}</span>
      </div>
    `).join('')}
  `;
}

document.getElementById('create-btn').addEventListener('click', async () => {
  const name = document.getElementById('new-name').value.trim();
  const teacherName = document.getElementById('new-teacher').value.trim();
  if (!name) { alert('Nhập tên lớp'); return; }
  const r = await fetch('api/classes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, teacherName }) });
  const data = await r.json();
  if (data.code) {
    document.getElementById('new-name').value = '';
    document.getElementById('new-teacher').value = '';
    await loadClasses();
    loadDetail(data.code);
  } else {
    alert('Lỗi: ' + (data.error || 'không tạo được'));
  }
});

loadClasses();
</script>
<script src="./js/pwa-register.js" defer></script>
<script src="./js/tutor-floating.js" data-domain="general" defer></script>
<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/onboarding-60s.js?v=2026-06-08-r8"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-10-tl1"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
