<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎵 Đô-Rê-Mi Bay: Âm nhạc Lớp 2 · Tizia</title>
<style>
  :root { --bg-1:#fdf2f8; --bg-2:#fce7f3; --accent:#db2777; --ok:#22c55e; --bad:#ef4444;
    --border:rgba(0,0,0,.08); --ink:#1f2937; --muted:#6b7280; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:'Inter','Quicksand',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse 90% 50% at 50% 0%, #fbcfe8, transparent),linear-gradient(180deg,var(--bg-1),#fae8ff)}
  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.7);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
  .back{color:var(--ink);text-decoration:none;opacity:.85;font-size:14px;background:rgba(0,0,0,.06);padding:8px 14px;border-radius:10px;font-weight:600}
  .back:hover{background:rgba(0,0,0,.12)}
  .top h1{margin:0;font-size:18px;font-weight:800}
  .top .sub{font-size:12.5px;opacity:.6;font-weight:500}
  .top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .stat{background:white;border:1px solid var(--border);border-radius:14px;padding:7px 13px;font-weight:700}
  .stat .v{color:var(--accent);font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 60px}
  .intro{text-align:center;margin:6px 0 12px;opacity:.85;font-size:14px}
  .stage{position:relative;height:62vh;min-height:420px;background:linear-gradient(180deg,#fff1f9,#fdf4ff);
    border-radius:18px;border:1px solid var(--border);overflow:hidden;box-shadow:inset 0 0 20px rgba(219,39,119,.08)}
  .lane{position:absolute;top:0;bottom:0;width:14.28%;border-left:1px dashed rgba(0,0,0,.06)}
  .lane:last-child{border-right:1px dashed rgba(0,0,0,.06)}
  .hitline{position:absolute;left:0;right:0;bottom:64px;height:3px;background:linear-gradient(90deg,#f0abfc,#f472b6,#db2777,#f472b6,#f0abfc);box-shadow:0 0 14px #db2777}
  .note{position:absolute;width:11.5%;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;font-size:16px;left:1.4%;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .keys{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex}
  .key{flex:1;border-right:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--ink);background:rgba(255,255,255,.6);cursor:pointer;font-size:14px;user-select:none}
  .key:last-child{border-right:none}
  .key small{opacity:.55;font-size:11px;margin-top:2px;font-weight:600}
  .key.hit{background:#fce7f3}
  .key.bad{background:#fee2e2}
  .fx{position:absolute;font-size:24px;font-weight:800;pointer-events:none;animation:rise .8s forwards}
  @keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.85);text-align:center;padding:20px}
  .center.hide{display:none}
  .center .big{font-size:60px;margin-bottom:8px}
  .center button{margin-top:14px;padding:12px 26px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.hide{display:none}
  .panel{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:28px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .panel .ic{font-size:64px}
  .panel h2{margin:6px 0 8px;font-size:22px}
  .panel p{margin:4px 0;color:var(--muted);font-size:14px}
  .panel .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
  .btn.ghost{background:rgba(0,0,0,.06);color:var(--ink)}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<script type="module">import { applyViewOnlyGate } from "/js/enrollment.js"; applyViewOnlyGate("primary");</script>
<div class="top">
  <a class="back" href="/space.html?b=g2&domain=primary">← Lớp 2</a>
  <div><h1>🎵 Đô-Rê-Mi Bay</h1><div class="sub">Âm nhạc Lớp 2, gõ nốt rơi đúng nhịp</div></div>
  <div class="right">
    <div class="stat">🎯 <span class="v" id="score">0</span></div>
    <div class="stat">🔥 <span class="v" id="combo">0</span></div>
    <div class="stat">⏱ <span class="v" id="time">60s</span></div>
  </div>
</div>

<div class="wrap">
  <p class="intro">Gõ phím <b>A S D F G H J</b> (hoặc bấm thanh nốt phía dưới) khi nốt rơi tới vạch hồng.</p>
  <div class="stage" id="stage">
    <div class="hitline"></div>
    <div class="keys" id="keys"></div>
    <div class="center" id="center"><div class="big">🎶</div><div>Sẵn sàng hoà nhạc?</div><button id="btn-start">Bắt đầu</button></div>
  </div>
</div>

<div class="modal hide" id="modal-over">
  <div class="panel">
    <div class="ic">🎼</div>
    <h2 id="ov-title">Hết giờ!</h2>
    <p id="ov-msg">Một bản nhạc đáng yêu!</p>
    <p>Điểm: <b id="ov-score">0</b> · Combo max: <b id="ov-combo">0</b></p>
    <p>Best: <b id="ov-best">-</b></p>
    <div class="row">
      <button class="btn" id="btn-restart">🔁 Chơi lại</button>
      <a class="btn ghost" href="/space.html?b=g2&domain=primary">← Về Lớp 2</a>
    </div>
  </div>
</div>

<script>
// Tần số chuẩn 7 nốt quãng C4–B4 (Đô–Si). Mỗi nốt 1 phím tắt.
const NOTES=[
  {n:'Đô', c:'#ef4444', k:'a', f:261.63},
  {n:'Rê', c:'#f97316', k:'s', f:293.66},
  {n:'Mi', c:'#eab308', k:'d', f:329.63},
  {n:'Fa', c:'#22c55e', k:'f', f:349.23},
  {n:'Sol',c:'#0ea5e9', k:'g', f:392.00},
  {n:'La', c:'#8b5cf6', k:'h', f:440.00},
  {n:'Si', c:'#db2777', k:'j', f:493.88},
];

// WebAudio — tạo lazy khi user bấm Start (browser yêu cầu gesture).
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return audioCtx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  audioCtx = new Ctx();
  return audioCtx;
}
// Tạo 1 nốt piano-like: 2 oscillator (sine + triangle nhẹ) + envelope ADSR ngắn.
function playNote(freq, dur=0.4, vol=0.18){
  const ctx = ensureAudio();
  if(!ctx) return;
  const t0 = ctx.currentTime;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  gain.connect(ctx.destination);

  const o1 = ctx.createOscillator();
  o1.type='sine'; o1.frequency.value=freq;
  o1.connect(gain);
  const o2 = ctx.createOscillator();
  o2.type='triangle'; o2.frequency.value=freq*2; // overtone nhẹ
  const g2 = ctx.createGain(); g2.gain.value=0.25;
  o2.connect(g2).connect(gain);

  o1.start(t0); o2.start(t0);
  o1.stop(t0+dur+0.05); o2.stop(t0+dur+0.05);
}
// Âm "tịt" khi miss/lệch quá xa: tần số thấp, ngắn
function playMiss(){
  const ctx = ensureAudio(); if(!ctx) return;
  const t0=ctx.currentTime;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.001,t0); g.gain.linearRampToValueAtTime(0.08,t0+0.01); g.gain.exponentialRampToValueAtTime(0.001,t0+0.18);
  g.connect(ctx.destination);
  const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=110;
  o.connect(g); o.start(t0); o.stop(t0+0.2);
}
const $=s=>document.querySelector(s);
const stage=$('#stage'), keysEl=$('#keys'), center=$('#center');
let activeNotes=[], score=0, combo=0, maxCombo=0, timeLeft=60, timer=null, raf=null, spawnT=null, running=false, lastTs=0;

// Build keys
NOTES.forEach((nt,i)=>{
  const k=document.createElement('div');
  k.className='key'; k.dataset.i=i;
  k.innerHTML=`${nt.n}<small>${nt.k.toUpperCase()}</small>`;
  k.style.borderTop=`3px solid ${nt.c}`;
  k.addEventListener('mousedown',()=>hit(i));
  k.addEventListener('touchstart',e=>{e.preventDefault();hit(i)},{passive:false});
  keysEl.appendChild(k);
});

document.addEventListener('keydown',e=>{
  if(!running) return;
  const i=NOTES.findIndex(n=>n.k===e.key.toLowerCase());
  if(i>=0) hit(i);
});

function spawn(){
  if(!running) return;
  const lane=Math.floor(Math.random()*NOTES.length);
  const nt=NOTES[lane];
  const el=document.createElement('div');
  el.className='note'; el.textContent=nt.n;
  el.style.background=`linear-gradient(180deg, ${nt.c}cc, ${nt.c})`;
  el.style.left=(lane*14.28+1.4)+'%';
  el.style.top='-50px';
  stage.appendChild(el);
  // Lớp 2 — chậm hơn nhiều: 0.10 → 0.16 (px/ms), tăng dần rất ít theo điểm.
  activeNotes.push({el,lane,y:-50,vy:0.10 + Math.min(0.06, score/2400)});
  // Khoảng spawn 1.2–1.6s, giảm dần nhưng không dưới 800ms để bé kịp nhìn.
  const gap = Math.max(800, 1600 - score*0.8);
  spawnT=setTimeout(spawn, gap);
}

function tick(ts){
  if(!running) return;
  const dt = lastTs ? (ts-lastTs) : 16;
  lastTs=ts;
  const h = stage.clientHeight;
  const hitY = h - 64 - 3; // hitline
  for(let i=activeNotes.length-1;i>=0;i--){
    const a=activeNotes[i];
    a.y += a.vy*dt;
    a.el.style.top = a.y+'px';
    if(a.y > hitY + 38){ // miss
      a.el.remove(); activeNotes.splice(i,1);
      combo=0; $('#combo').textContent=0;
      flashKey(a.lane,'bad');
      playMiss();
    }
  }
  raf=requestAnimationFrame(tick);
}

function hit(lane){
  flashKey(lane,'hit');
  const h=stage.clientHeight;
  const hitY = h - 64 - 3;
  // Tìm nốt gần vạch nhất trên cùng lane
  let best=-1, bestDist=1e9;
  activeNotes.forEach((a,i)=>{
    if(a.lane!==lane) return;
    const d = Math.abs((a.y+21) - hitY);
    if(d < bestDist){ bestDist=d; best=i; }
  });
  if(best<0 || bestDist>60){
    combo=0; $('#combo').textContent=0;
    playMiss();
    return;
  }
  const a=activeNotes[best];
  const perfect = bestDist<20;
  const gained = perfect ? 30 : 15;
  // Phát đúng tần số nốt — chính xác hơn → vang dài hơn 1 chút
  playNote(NOTES[lane].f, perfect ? 0.55 : 0.35, perfect ? 0.22 : 0.16);
  score += gained + combo*2;
  combo++; maxCombo=Math.max(maxCombo,combo);
  $('#score').textContent=score; $('#combo').textContent=combo;
  // FX
  const fx=document.createElement('div');
  fx.className='fx';
  fx.textContent = perfect?'✨ PERFECT':'👍 GOOD';
  fx.style.color = NOTES[lane].c;
  fx.style.left=(lane*14.28+2)+'%';
  fx.style.top=(hitY-30)+'px';
  stage.appendChild(fx);
  setTimeout(()=>fx.remove(),800);
  a.el.remove(); activeNotes.splice(best,1);
}

function flashKey(i, cls){
  const k=keysEl.children[i];
  k.classList.add(cls);
  setTimeout(()=>k.classList.remove(cls),140);
}

function start(){
  // Mở audio context trong user gesture, sau đó chơi 7 nốt intro để bé nghe
  // được scale Đô-Rê-Mi rồi mới bắt đầu spawn.
  ensureAudio();
  NOTES.forEach((nt,i)=> setTimeout(()=>playNote(nt.f, 0.28, 0.16), i*140));

  score=0;combo=0;maxCombo=0;timeLeft=60;activeNotes=[];lastTs=0;running=true;
  $('#score').textContent=0; $('#combo').textContent=0; $('#time').textContent='60s';
  Array.from(stage.querySelectorAll('.note')).forEach(n=>n.remove());
  center.classList.add('hide');
  // Trì hoãn spawn 1.2s để intro melody chạy xong trước khi nốt rơi.
  setTimeout(()=>{ if(running) spawn(); }, 1200);
  raf=requestAnimationFrame(tick);
  timer=setInterval(()=>{
    timeLeft--; $('#time').textContent=timeLeft+'s';
    if(timeLeft<=0) end();
  },1000);
}

function end(){
  running=false;
  clearInterval(timer); clearTimeout(spawnT); cancelAnimationFrame(raf);
  activeNotes.forEach(a=>a.el.remove()); activeNotes=[];
  const key='lop2-am-nhac.best';
  const prev=Number(localStorage.getItem(key)||0);
  const best=Math.max(prev,score);
  if(score>prev) localStorage.setItem(key,score);
  $('#ov-score').textContent=score; $('#ov-combo').textContent=maxCombo; $('#ov-best').textContent=best;
  $('#ov-title').textContent = score>=800?'🏆 Hoà nhạc xuất sắc!':score>=400?'🌟 Bản nhạc hay!':'🎶 Hết bản!';
  $('#ov-msg').textContent = maxCombo>=15?'Combo siêu đỉnh!':'Tập gõ nhịp thường xuyên nhé.';
  $('#modal-over').classList.remove('hide');
  try{
    const xp=Math.floor(score/20);
    if(xp>0 && window.fetch){
      fetch('/api/wallet',{credentials:'include'}).then(r=>r.ok?r.json():null).then(w=>{
        if(!w) return;
        fetch('/api/wallet',{method:'PUT',credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({...w, xp:(w.xp||0)+xp})});
      });
    }
  }catch{}
}

$('#btn-start').addEventListener('click',start);
$('#btn-restart').addEventListener('click',()=>{
  $('#modal-over').classList.add('hide');
  center.classList.remove('hide');
  start();
});
</script>
</body>
</html>
