<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>✋ Đếm Ngón Tay · Tizia</title>
<meta name="description" content="Bé nhìn bàn tay giơ X ngón rồi tap số đúng. Trò chơi đếm 1-10 cho 3-5 tuổi." />
<style>
  :root { --ink:#1f1147; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--ink); }
  body { min-height:100vh; background: linear-gradient(180deg, #d1fae5 0%, #bae6fd 60%, #ddd6fe 100%); }
  .wrap { max-width:none; margin: 0 auto; padding: 16px 16px 32px; }
  .top { display:flex; align-items:center; gap:14px; padding: 10px 16px; background: rgba(255,255,255,.75);
    border-radius: 20px; backdrop-filter: blur(8px); margin-bottom: 14px; }
  .top h1 { margin:0; font-size: clamp(20px, 3vw, 28px); font-weight: 900; }
  .top .back { padding: 8px 16px; border-radius: 999px; background: #fff; text-decoration:none; color: var(--ink);
    font-weight: 800; border: 2px solid #34d399; }
  .stats { margin-left:auto; display:flex; gap: 10px; font-weight: 900; }
  .stats .b { padding: 6px 14px; border-radius: 999px; background:#d1fae5; border:2px solid #34d399; }

  .stage { background: rgba(255,255,255,.85); border-radius: 28px; padding: 20px 16px;
    text-align:center; box-shadow: 0 10px 24px rgba(0,0,0,.08); margin-bottom: 14px; }
  .ask { font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; color:#047857; }
  .hands { display:flex; gap: 14px; justify-content:center; flex-wrap:wrap; margin: 14px 0 6px; font-size: clamp(80px, 14vw, 140px); line-height:1; }
  .tts { width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:#3b82f6; color:#fff; font-size:26px; vertical-align: middle;
    box-shadow:0 6px 14px rgba(59,130,246,.4); margin-left:10px; }
  .tts:active { transform: translateY(2px); }

  .choices { display:grid; gap: 14px; grid-template-columns: repeat(3, 1fr); max-width: 560px; margin: 0 auto; }
  @media (min-width: 720px) { .choices { grid-template-columns: repeat(5, 1fr); } }
  .ch { border:none; cursor:pointer; padding: 18px 8px; border-radius: 22px; font-family:inherit;
    font-size: clamp(40px, 6vw, 60px); font-weight: 900; color: var(--ink);
    border: 4px solid rgba(255,255,255,.55);
    box-shadow: 0 8px 0 rgba(0,0,0,.16), 0 14px 24px rgba(0,0,0,.18);
    transition: transform .12s, filter .18s; }
  .ch.c0 { background: linear-gradient(135deg,#fde68a,#fbbf24); }
  .ch.c1 { background: linear-gradient(135deg,#fecaca,#f87171); }
  .ch.c2 { background: linear-gradient(135deg,#bbf7d0,#34d399); }
  .ch.c3 { background: linear-gradient(135deg,#bfdbfe,#60a5fa); }
  .ch.c4 { background: linear-gradient(135deg,#e9d5ff,#c084fc); }
  .ch:hover { transform: translateY(-3px); }
  .ch:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.16); }
  .ch.is-correct { animation: pop .55s cubic-bezier(.2,.9,.3,1.6); border-color:#16a34a; }
  .ch.is-wrong { animation: wob .5s ease; filter:grayscale(.5) brightness(.85); }
  @keyframes pop { 40%{transform:scale(1.2)} 100%{transform:scale(1.05)} }
  @keyframes wob { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }

  .feedback { text-align:center; margin-top: 14px; font-size: 22px; font-weight: 900; min-height: 1.2em; }
  .feedback.ok { color: #16a34a; }
  .feedback.bad { color: #dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="javascript:history.back()">← Quay lại</a>
    <h1>✋ Đếm Ngón Tay</h1>
    <div class="stats">
      <span class="b">⭐ <span id="st-score">0</span></span>
      <span class="b">🎯 Câu <span id="st-q">1</span></span>
    </div>
  </div>

  <div class="stage">
    <div class="ask">Cô đang giơ mấy ngón tay? <button class="tts" id="btn-tts">🔊</button></div>
    <div class="hands" id="hands">🖐️</div>
  </div>

  <div class="choices" id="choices"></div>
  <div class="feedback" id="fb"></div>
</div>

<script type="module">
import { speak } from '/js/engine/preschool-ui.js';

const $ = (s) => document.querySelector(s);

// Map số ngón → emoji bàn tay phù hợp (1-10).
// 1: ☝️ · 2: ✌️ · 3: 🤟 (gần đúng, có thể dùng custom SVG về sau)
//   · 4: ✋ trừ 1 ngón cái (khó render) — tạm dùng cách: render 1 hoặc 2 bàn tay nguyên + dấu hiệu.
// Đơn giản nhất: 1 ngón = ☝️, 2 = ✌️, 5 = 🖐️, 10 = 🖐️🖐️, các số khác dùng "🖐️" + ô số phụ.
// Để tránh khó hiểu với bé, ta hiển thị: số ngón giơ = N ngón "👆" liền nhau cho N=1..5,
// còn N=6..10 = 🖐️ + (N-5) ngón "👆".
function renderHands(n) {
  if (n <= 5) return Array.from({length:n}, () => '👆').join('');
  return '🖐️' + Array.from({length:n-5}, () => '👆').join('');
}

let score = 0, q = 0, target = 1;

function shuffle(arr) { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function nextQ() {
  q++;
  $('#st-q').textContent = q;
  $('#fb').textContent = '';
  $('#fb').className = 'feedback';
  // Mầm non: dải 1..10
  target = 1 + Math.floor(Math.random() * 10);
  $('#hands').textContent = renderHands(target);
  // 5 đáp án: 1 đúng + 4 sai trong khoảng [1..10]
  const wrong = new Set();
  while (wrong.size < 4) {
    const c = 1 + Math.floor(Math.random() * 10);
    if (c !== target) wrong.add(c);
  }
  const choices = shuffle([target, ...wrong]);
  $('#choices').innerHTML = choices.map((c, i) =>
    `<button type="button" class="ch c${i % 5}" data-n="${c}">${c}</button>`
  ).join('');
  speak('Cô đang giơ mấy ngón tay?');
  $('#choices').querySelectorAll('.ch').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const n = Number(btn.dataset.n);
      if (n === target) {
        btn.classList.add('is-correct');
        $('#choices').querySelectorAll('.ch').forEach(b => b.disabled = true);
        $('#fb').className = 'feedback ok';
        $('#fb').textContent = '🎉 Đúng rồi! Có ' + target + ' ngón tay!';
        speak('Đúng rồi! Có ' + target + ' ngón tay!');
        score += 10;
        $('#st-score').textContent = score;
        confetti();
        setTimeout(nextQ, 1700);
      } else {
        btn.classList.add('is-wrong');
        $('#fb').className = 'feedback bad';
        $('#fb').textContent = '😅 Chưa đúng. Bé đếm lại nha!';
        speak('Chưa đúng. Bé đếm lại nha!');
        setTimeout(() => btn.classList.remove('is-wrong'), 600);
      }
    });
  });
}

$('#btn-tts').addEventListener('click', () => speak('Cô đang giơ mấy ngón tay?'));

function confetti() {
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
  const colors = ['#fbbf24','#ef4444','#10b981','#3b82f6','#a855f7','#ec4899'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    const size = 8 + Math.random() * 10;
    const left = 30 + Math.random() * 40;
    const top = 25 + Math.random() * 30;
    const dx = (Math.random() - 0.5) * 480;
    const dy = 200 + Math.random() * 300;
    const rot = Math.random() * 720;
    p.style.cssText = `position:absolute;left:${left}%;top:${top}%;width:${size}px;height:${size}px;background:${colors[i%6]};border-radius:${Math.random()>0.5?'50%':'2px'};transform:translate(0,0) rotate(0);transition:transform 1.1s cubic-bezier(.2,.6,.4,1), opacity 1.1s;`;
    layer.appendChild(p);
    requestAnimationFrame(() => { p.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`; p.style.opacity='0'; });
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1300);
}

nextQ();
</script>
</body>
</html>
