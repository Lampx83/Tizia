<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🐣 Pet Tri Thức · Tizia</title>
<meta name="description" content="Nuôi Tiziamon: sinh vật ảo lớn lên theo kiến thức của em. Trả lời quiz để cho ăn, học, chơi cùng pet!" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg-1:#a7f3d0; --bg-2:#fde68a; --bg-3:#fbcfe8;
    --ink:#1f2937; --ink-soft:#475569;
    --accent:#f59e0b; --good:#16a34a; --bad:#dc2626; --info:#3b82f6;
    --pet-skin:#fde047; --pet-skin-2:#facc15; --pet-mouth:#9a3412;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment:fixed; overflow-x:hidden;
  }

  /* Top bar */
  .top { position:fixed; top:14px; left:14px; right:14px; z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .back { background:rgba(15,23,42,.75); color:#fff; text-decoration:none; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; backdrop-filter:blur(6px); }
  .back:hover { background:rgba(15,23,42,.9); }
  .pet-name-wrap { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pet-name-wrap input { background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.6); padding:7px 13px; border-radius:18px; font-size:13px; font-weight:700; color:var(--ink); font-family:inherit; max-width:160px; }
  .pet-name-wrap button { background:var(--accent); color:#fff; border:none; padding:7px 13px; border-radius:18px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .grade-pill { background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.6); border-radius:18px; padding:6px 10px; font-size:12.5px; font-weight:800; color:var(--ink); font-family:inherit; cursor:pointer; }

  /* Layout */
  main { padding:80px 14px 24px; max-width:980px; margin:0 auto; display:grid; gap:16px; grid-template-columns: 1fr; }
  @media (min-width:840px) { main { grid-template-columns: 320px 1fr; } }

  .card { background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.6); border-radius:18px; padding:16px 18px; box-shadow:0 8px 24px rgba(31,41,55,.08); backdrop-filter:blur(8px); }

  /* Stats */
  .stats h3 { margin:0 0 12px; font-size:14px; color:var(--ink-soft); letter-spacing:.5px; text-transform:uppercase; font-weight:800; }
  .stat-row { display:flex; align-items:center; gap:10px; margin-bottom:11px; font-size:13.5px; }
  .stat-row .ic { width:24px; text-align:center; font-size:17px; }
  .stat-row .lbl { font-weight:700; color:var(--ink); flex:0 0 70px; }
  .stat-row .val { font-weight:800; color:var(--accent); margin-left:auto; font-variant-numeric:tabular-nums; }
  .bar { flex:1; height:10px; background:rgba(15,23,42,.08); border-radius:6px; overflow:hidden; position:relative; }
  .bar > i { display:block; height:100%; border-radius:6px; transition: width .4s cubic-bezier(.34,1.56,.64,1); }
  .bar.hp > i { background: linear-gradient(90deg,#ef4444,#f87171); }
  .bar.xp > i { background: linear-gradient(90deg,#3b82f6,#60a5fa); }
  .mood-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:800; }
  .mood-happy { background:#dcfce7; color:#15803d; }
  .mood-ok    { background:#dbeafe; color:#1e40af; }
  .mood-sad   { background:#fee2e2; color:#b91c1c; }

  /* Pet stage */
  .stage { position:relative; min-height:380px; display:flex; align-items:center; justify-content:center; padding:30px 18px; }
  .pet-wrap { position:relative; cursor:pointer; transition: transform .25s; }
  .pet-wrap:hover { transform: scale(1.05); }
  .pet-wrap.shake { animation: shake .5s ease-in-out infinite; }
  .pet-wrap.morph { animation: morph 1s cubic-bezier(.34,1.56,.64,1); }
  .pet-wrap.bounce { animation: bounce 1.6s ease-in-out infinite; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  @keyframes morph { 0%{transform:scale(1);} 40%{transform:scale(1.5) rotate(15deg);} 70%{transform:scale(.9);} 100%{transform:scale(1);} }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

  .pet-svg { display:block; }

  .pet-label { text-align:center; margin-top:8px; font-weight:800; color:var(--ink); font-size:15px; }
  .pet-stage-name { text-align:center; margin-top:2px; font-size:12.5px; color:var(--ink-soft); font-weight:600; }

  /* Action buttons */
  .actions { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top:14px; }
  .act-btn { background:linear-gradient(180deg,#fff 0%, #f8fafc 100%); border:2px solid rgba(15,23,42,.1); border-radius:14px; padding:14px 8px; text-align:center; cursor:pointer; transition: all .15s; font-family:inherit; }
  .act-btn:hover { border-color:var(--accent); transform: translateY(-3px); box-shadow:0 6px 16px rgba(245,158,11,.25); }
  .act-btn .ic { font-size:28px; display:block; margin-bottom:4px; }
  .act-btn .lb { font-weight:800; font-size:13px; color:var(--ink); }
  .act-btn .sub { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .act-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

  /* Modal */
  .backdrop { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:50; display:none; align-items:center; justify-content:center; padding:18px; backdrop-filter:blur(4px); }
  .backdrop.show { display:flex; }
  .modal { background:#fff; border-radius:20px; max-width:480px; width:100%; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .modal h2 { margin:0 0 6px; font-size:18px; }
  .modal .qprompt { font-size:16px; font-weight:700; color:var(--ink); margin:14px 0 16px; line-height:1.5; }
  .modal .qopts { display:grid; gap:8px; }
  .modal .qopt { background:#f8fafc; border:2px solid #e2e8f0; padding:12px 14px; border-radius:12px; cursor:pointer; font-weight:700; font-size:14px; text-align:left; color:var(--ink); transition: all .15s; font-family:inherit; }
  .modal .qopt:hover { background:#fef3c7; border-color:var(--accent); }
  .modal .qopt.good { background:#dcfce7; border-color:var(--good); color:var(--good); }
  .modal .qopt.bad { background:#fee2e2; border-color:var(--bad); color:var(--bad); }
  .modal .qopt:disabled { cursor:default; }
  .modal .qresult { margin-top:14px; padding:12px 14px; border-radius:12px; font-weight:700; font-size:14px; display:none; }
  .modal .qresult.show { display:block; }
  .modal .qresult.ok { background:#dcfce7; color:var(--good); }
  .modal .qresult.no { background:#fee2e2; color:var(--bad); }
  .modal .qclose { margin-top:14px; background:var(--ink); color:#fff; border:none; padding:10px 18px; border-radius:14px; font-weight:700; cursor:pointer; font-family:inherit; display:none; }
  .modal .qclose.show { display:inline-block; }

  /* Mini-game (count) */
  .count-game { text-align:center; padding:10px 0; }
  .count-game .emojis { font-size:34px; line-height:1.4; margin:12px 0; user-select:none; word-wrap:break-word; }
  .count-game .qopts { grid-template-columns: repeat(4,1fr); }
  .count-game .qopt { text-align:center; }

  /* Toast */
  #toast { position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-20px); z-index:60; background:#16a34a; color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; opacity:0; transition: opacity .2s, transform .2s; box-shadow:0 8px 24px rgba(22,163,74,.5); max-width:90vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.bad { background:#dc2626; box-shadow:0 8px 24px rgba(220,38,38,.5); }
  #toast.info { background:#3b82f6; box-shadow:0 8px 24px rgba(59,130,246,.5); }

  /* Confetti */
  .confetti { position:fixed; pointer-events:none; font-size:22px; z-index:55; animation: conf 1.6s ease-out forwards; }
  @keyframes conf { from { transform: translateY(0) scale(.4) rotate(0deg); opacity:1; } to { transform: translateY(-220px) scale(1.4) rotate(540deg); opacity:0; } }

  /* Sparkles around pet (legendary) */
  .sparkle { position:absolute; font-size:18px; pointer-events:none; animation: sparkle 2s ease-in-out infinite; }
  @keyframes sparkle { 0%,100%{ opacity:.4; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.2); } }
</style>
</head>
<body>

<div class="top">
  <a class="back" href="/">← Tizia</a>
  <a class="back" href="/cay-tri-thuc.html">🌳 Cây Tri Thức</a>
  <div class="pet-name-wrap">
    <input id="petname-input" type="text" placeholder="Đặt tên cho pet…" maxlength="20" />
    <button id="petname-save">Lưu</button>
  </div>
</div>

<main>
  <!-- Stats panel -->
  <div class="card stats">
    <h3>📊 Trạng thái Tiziamon</h3>
    <div style="display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;">
      <span style="font-size:12px;font-weight:800;color:var(--ink-soft);">🎓 Cấp học:</span>
      <select id="grade-select" class="grade-pill" title="Chọn cấp học để pet hỏi câu phù hợp">
        <option value="mam-non">🐤 Mầm non (3–5 tuổi)</option>
        <option value="tieu-hoc">🎒 Tiểu học (lớp 1–5)</option>
        <option value="thcs">📚 THCS (lớp 6–9)</option>
        <option value="thpt">🎓 THPT (lớp 10–12)</option>
      </select>
    </div>
    <div class="stat-row">
      <span class="ic">❤️</span>
      <span class="lbl">HP</span>
      <span class="bar hp"><i id="bar-hp" style="width:100%"></i></span>
      <span class="val" id="st-hp">100</span>
    </div>
    <div class="stat-row">
      <span class="ic">✨</span>
      <span class="lbl">XP</span>
      <span class="bar xp"><i id="bar-xp" style="width:0%"></i></span>
      <span class="val" id="st-xp">0/100</span>
    </div>
    <div class="stat-row">
      <span class="ic">🎚️</span>
      <span class="lbl">Cấp</span>
      <span class="val" id="st-level" style="margin-left:0">0</span>
      <span style="margin-left:auto" id="st-mood-wrap"><span class="mood-pill mood-ok" id="st-mood">😐 bình thường</span></span>
    </div>
    <div class="stat-row">
      <span class="ic">🔥</span>
      <span class="lbl">Streak</span>
      <span class="val" id="st-streak">0 ngày</span>
    </div>

    <div class="actions">
      <button class="act-btn" data-action="feed">
        <span class="ic">🍎</span><span class="lb">Cho ăn</span>
        <div class="sub">Toán · +HP</div>
      </button>
      <button class="act-btn" data-action="study">
        <span class="ic">📖</span><span class="lb">Học bài</span>
        <div class="sub">Văn · +XP</div>
      </button>
      <button class="act-btn" data-action="play">
        <span class="ic">🎮</span><span class="lb">Chơi</span>
        <div class="sub">Đếm số · +mood</div>
      </button>
    </div>

    <div style="margin-top:14px; font-size:11.5px; color:var(--ink-soft); line-height:1.55;">
      💡 Mỗi 30 giây pet tiêu thụ 2 HP. Trả lời đúng câu hỏi để cho pet ăn, học, chơi cùng pet. Level up mỗi 100 XP, pet sẽ tiến hoá!
    </div>
  </div>

  <!-- Pet stage -->
  <div class="card stage">
    <div style="position:absolute; top:14px; right:18px; font-size:11px; color:var(--ink-soft); font-weight:700;">
      <span id="stage-label">🥚 Trứng</span>
    </div>
    <div style="text-align:center;">
      <div class="pet-wrap" id="pet-wrap">
        <svg id="pet-svg" class="pet-svg" width="220" height="220" viewBox="0 0 200 200"></svg>
      </div>
      <div class="pet-label" id="pet-display-name">Tiziamon</div>
      <div class="pet-stage-name" id="pet-stage-name">Bấm vào pet để vuốt ve!</div>
    </div>
  </div>
</main>

<!-- Quiz modal -->
<div class="backdrop" id="modal-back">
  <div class="modal" id="modal">
    <h2 id="modal-title">🍎 Cho pet ăn</h2>
    <div id="modal-body"></div>
    <button class="qclose" id="modal-close">Đóng</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
'use strict';
// =============================================================
// Pet Tri Thức — virtual pet "Tiziamon" tiến hoá theo XP.
// Lưu state vào localStorage('pet-tri-thuc.state').
// Sync XP với /api/wallet khi user đã login (PUT mỗi lần level up).
// =============================================================

const STATE_KEY = 'pet-tri-thuc.state';
const DEFAULT_STATE = {
  level: 0, xp: 0, hp: 100, mood: 'ok',
  streak: 0, lastVisit: '', name: 'Tiziamon',
};

// ── Bank câu hỏi inline — chia theo CẤP HỌC để phù hợp lứa tuổi ──
// mam-non: 3–5 tuổi · đếm 1–5, màu, hình, kỹ năng sống
// tieu-hoc: lớp 1–5 · cộng trừ <100, nhân chia đơn giản, từ loại cơ bản
// thcs: lớp 6–9 · toán phân số/số nguyên, văn THCS, kiến thức chung
// thpt: lớp 10–12 · toán nâng cao, văn học VN, kiến thức XH
const QUIZ_BANKS = await fetch('/api/content/pet-quiz-banks', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : { items: [] }).then(j => (j.items || [])[0] || {}).catch(() => ({}));

// Range đếm cho mini-game "play" theo cấp
const COUNT_RANGE = {
  'mam-non': { min:1, max:5,  fillerMin:2, fillerMax:5  },
  'tieu-hoc':{ min:3, max:12, fillerMin:5, fillerMax:10 },
  'thcs':    { min:5, max:20, fillerMin:10,fillerMax:18 },
  'thpt':    { min:5, max:25, fillerMin:10,fillerMax:20 },
};

// ── Detect grade từ URL ?grade= → localStorage → default mam-non ──
const GRADE_KEY = 'pet-tri-thuc.grade';
const VALID_GRADES = ['mam-non','tieu-hoc','thcs','thpt'];
function detectGrade() {
  try {
    const u = new URLSearchParams(location.search);
    const fromUrl = u.get('grade');
    if (fromUrl && VALID_GRADES.includes(fromUrl)) {
      localStorage.setItem(GRADE_KEY, fromUrl);
      return fromUrl;
    }
    const stored = localStorage.getItem(GRADE_KEY);
    if (stored && VALID_GRADES.includes(stored)) return stored;
  } catch {}
  return 'mam-non';
}
let currentGrade = detectGrade();
function getQuizBank() { return QUIZ_BANKS[currentGrade] || QUIZ_BANKS['mam-non']; }
function getCountRange() { return COUNT_RANGE[currentGrade] || COUNT_RANGE['mam-non']; }

// ── State management ──
function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      return { ...DEFAULT_STATE, ...s };
    }
  } catch {}
  return { ...DEFAULT_STATE };
}
function saveState(s) {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch {}
}

let state = loadState();

// ── Streak ──
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function updateStreak() {
  const today = todayKey();
  if (state.lastVisit === today) return;
  if (!state.lastVisit) { state.streak = 1; }
  else {
    const last = new Date(state.lastVisit);
    const now = new Date(today);
    const diff = Math.round((now - last) / 86400000);
    if (diff === 1) state.streak++;
    else if (diff > 1) state.streak = 1;
  }
  state.lastVisit = today;
  saveState(state);
}

// ── Pet evolution stages ──
function getStage(level) {
  if (level === 0) return { id:0, name:'Trứng', emoji:'🥚' };
  if (level <= 5)  return { id:1, name:'Tiziamon baby', emoji:'🐣' };
  if (level <= 15) return { id:2, name:'Tiziamon teen', emoji:'🦊' };
  if (level <= 30) return { id:3, name:'Tiziamon adult', emoji:'🦄' };
  return { id:4, name:'Tiziamon legendary', emoji:'🐉' };
}

// ── Render pet SVG theo stage ──
function renderPet() {
  const svg = document.getElementById('pet-svg');
  const wrap = document.getElementById('pet-wrap');
  const stage = getStage(state.level);
  const mood = state.mood;
  const happy = mood === 'happy';
  const sad = mood === 'sad' || state.hp <= 0;

  // Mắt: bình thường tròn, vui cong, buồn rớm
  const eyeShape = (cx, cy) => {
    if (happy) return `<path d="M ${cx-7} ${cy} Q ${cx} ${cy-8} ${cx+7} ${cy}" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    if (sad)   return `<g><circle cx="${cx}" cy="${cy}" r="4" fill="#1f2937"/><path d="M ${cx} ${cy+6} L ${cx-2} ${cy+12}" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/></g>`;
    return `<circle cx="${cx}" cy="${cy}" r="5" fill="#1f2937"/><circle cx="${cx+1.5}" cy="${cy-1.5}" r="1.5" fill="#fff"/>`;
  };
  const mouthShape = (cx, cy) => {
    if (happy) return `<path d="M ${cx-12} ${cy} Q ${cx} ${cy+12} ${cx+12} ${cy}" stroke="var(--pet-mouth)" stroke-width="3" fill="#fb7185" stroke-linecap="round"/>`;
    if (sad)   return `<path d="M ${cx-10} ${cy+5} Q ${cx} ${cy-3} ${cx+10} ${cy+5}" stroke="var(--pet-mouth)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return `<path d="M ${cx-8} ${cy} Q ${cx} ${cy+5} ${cx+8} ${cy}" stroke="var(--pet-mouth)" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  };

  let body = '';

  if (stage.id === 0) {
    // Trứng có hoa văn zig-zag
    body = `
      <defs>
        <radialGradient id="egg" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#facc15"/>
        </radialGradient>
      </defs>
      <ellipse cx="100" cy="105" rx="55" ry="72" fill="url(#egg)" stroke="#a16207" stroke-width="3"/>
      <path d="M 50 95 L 60 90 L 70 95 L 80 90 L 90 95 L 100 90 L 110 95 L 120 90 L 130 95 L 140 90 L 150 95" stroke="#a16207" stroke-width="2.5" fill="none"/>
      <path d="M 50 130 L 60 125 L 70 130 L 80 125 L 90 130 L 100 125 L 110 130 L 120 125 L 130 130 L 140 125 L 150 130" stroke="#a16207" stroke-width="2.5" fill="none"/>
      <ellipse cx="80" cy="60" rx="20" ry="12" fill="#fff" opacity=".4"/>
    `;
  } else if (stage.id === 1) {
    // Baby: hình tròn, 2 mắt to, miệng cười
    body = `
      <defs>
        <radialGradient id="baby" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="var(--pet-skin-2)"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="105" r="60" fill="url(#baby)" stroke="#a16207" stroke-width="3"/>
      <ellipse cx="80" cy="75" rx="14" ry="9" fill="#fff" opacity=".5"/>
      ${eyeShape(82, 100)} ${eyeShape(118, 100)}
      ${mouthShape(100, 122)}
      <circle cx="70" cy="120" r="4" fill="#fb7185" opacity=".55"/>
      <circle cx="130" cy="120" r="4" fill="#fb7185" opacity=".55"/>
    `;
  } else if (stage.id === 2) {
    // Teen: thêm chân, tay, đuôi
    body = `
      <defs>
        <radialGradient id="teen" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f59e0b"/>
        </radialGradient>
      </defs>
      <!-- đuôi -->
      <path d="M 155 130 Q 175 110 170 90 Q 165 75 175 65" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="175" cy="63" r="6" fill="#f59e0b"/>
      <!-- chân -->
      <ellipse cx="80" cy="170" rx="14" ry="8" fill="#d97706"/>
      <ellipse cx="120" cy="170" rx="14" ry="8" fill="#d97706"/>
      <rect x="73" y="155" width="14" height="14" fill="#f59e0b"/>
      <rect x="113" y="155" width="14" height="14" fill="#f59e0b"/>
      <!-- thân -->
      <circle cx="100" cy="105" r="55" fill="url(#teen)" stroke="#92400e" stroke-width="3"/>
      <!-- tay -->
      <ellipse cx="45" cy="115" rx="10" ry="16" fill="#f59e0b" transform="rotate(-20 45 115)" stroke="#92400e" stroke-width="2"/>
      <ellipse cx="155" cy="115" rx="10" ry="16" fill="#f59e0b" transform="rotate(20 155 115)" stroke="#92400e" stroke-width="2"/>
      <!-- mặt -->
      <ellipse cx="82" cy="78" rx="12" ry="7" fill="#fff" opacity=".4"/>
      ${eyeShape(82, 100)} ${eyeShape(118, 100)}
      ${mouthShape(100, 122)}
      <!-- má hồng -->
      <circle cx="70" cy="118" r="5" fill="#fb7185" opacity=".55"/>
      <circle cx="130" cy="118" r="5" fill="#fb7185" opacity=".55"/>
    `;
  } else if (stage.id === 3) {

// ── Render stats ──
function renderStats() {
  document.getElementById('st-hp').textContent = Math.max(0, state.hp|0);
  document.getElementById('bar-hp').style.width = Math.max(0, Math.min(100, state.hp)) + '%';
  const xpInLvl = state.xp % 100;
  document.getElementById('st-xp').textContent = `${xpInLvl}/100`;
  document.getElementById('bar-xp').style.width = xpInLvl + '%';
  document.getElementById('st-level').textContent = state.level;
  document.getElementById('st-streak').textContent = `${state.streak} ngày`;

  const moodEl = document.getElementById('st-mood');
  moodEl.className = 'mood-pill';
  if (state.hp <= 0 || state.mood === 'sad') {
    moodEl.classList.add('mood-sad'); moodEl.textContent = '😢 đói/buồn';
  } else if (state.mood === 'happy') {
    moodEl.classList.add('mood-happy'); moodEl.textContent = '😊 rất vui';
  } else {
    moodEl.classList.add('mood-ok'); moodEl.textContent = '😐 bình thường';
  }

  document.getElementById('pet-display-name').textContent = state.name || 'Tiziamon';
  document.getElementById('petname-input').value = state.name || '';
}

// ── Apply XP (handles level up + morph + sync wallet) ──
function addXp(amount) {
  const oldLevel = state.level;
  state.xp += amount;
  while (state.xp >= (state.level + 1) * 100 && state.level < 99) {
    state.level++;
  }
  if (state.level > oldLevel) {
    triggerMorph(oldLevel, state.level);
    syncWalletXP(amount);
  } else {
    syncWalletXP(amount); // sync xp tăng dần (debounced)
  }
  saveState(state);
  renderStats();
  renderPet();
}

function triggerMorph(oldLvl, newLvl) {
  const wrap = document.getElementById('pet-wrap');
  wrap.classList.remove('morph'); void wrap.offsetWidth; wrap.classList.add('morph');
  toast(`🎉 Lên cấp! Tiziamon đã đạt cấp ${newLvl}!`);
  spawnConfetti();
  const oldStage = getStage(oldLvl).id;
  const newStage = getStage(newLvl).id;
  if (newStage > oldStage) {
    setTimeout(() => toast(`✨ Tiến hoá! Pet trở thành ${getStage(newLvl).name}!`, 'info'), 2400);
  }
}

// ── Sync XP với /api/wallet (debounced + best-effort) ──
let _walletPushTimer = null;
let _walletCache = null;
async function syncWalletXP(deltaXp) {
  if (!deltaXp) return;
  try {
    if (!_walletCache) {
      const r = await fetch('/api/wallet', { credentials:'same-origin' });
      if (!r.ok) return; // guest hoặc 401 → skip
      _walletCache = (await r.json()) || { xp:0, coin:0, streak:0 };
    }
    _walletCache.xp = (_walletCache.xp|0) + deltaXp;
    if (_walletPushTimer) clearTimeout(_walletPushTimer);
    _walletPushTimer = setTimeout(async () => {
      try {
        await fetch('/api/wallet', {
          method:'PUT', credentials:'same-origin',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify(_walletCache),
        });
      } catch {}
    }, 600);
  } catch {}
}

// ── Toast ──
function toast(msg, kind='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ''; if (kind) t.classList.add(kind);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Confetti ──
function spawnConfetti() {
  const emojis = ['🎉','✨','⭐','🎊','💫','🌟'];
  const wrap = document.getElementById('pet-wrap');
  const r = wrap.getBoundingClientRect();
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = emojis[i % emojis.length];
    c.style.left = (r.left + r.width/2 + (Math.random()-0.5)*60) + 'px';
    c.style.top  = (r.top  + r.height/2) + 'px';
    c.style.animationDelay = (i * 0.04) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1700);
  }
}

// ── HP tick: -2 mỗi 30s ──
setInterval(() => {
  if (state.hp > 0) {
    state.hp = Math.max(0, state.hp - 2);
    if (state.hp <= 20 && state.mood !== 'sad') {
      state.mood = 'sad';
      toast('😢 Tiziamon đang đói! Hãy cho ăn nhé!', 'bad');
    }
    saveState(state);
    renderStats();
    renderPet();
  }
}, 30000);

// ── Quiz modal logic ──
const backdrop = document.getElementById('modal-back');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');
const modalClose = document.getElementById('modal-close');

modalClose.addEventListener('click', () => {
  backdrop.classList.remove('show');
  modalClose.classList.remove('show');
});
backdrop.addEventListener('click', e => {
  if (e.target === backdrop) { backdrop.classList.remove('show'); modalClose.classList.remove('show'); }
});

function pickRandom(arr, n) {
  const copy = [...arr];
  const out = [];
  while (out.length < n && copy.length) {
    out.push(copy.splice(Math.floor(Math.random()*copy.length), 1)[0]);
  }
  return out;
}

function openQuiz(action) {
  if (action === 'play') return openCountGame();
  const bank = getQuizBank()[action];
  if (!bank || !bank.length) { toast('Chưa có câu hỏi cho cấp này.', 'bad'); return; }
  const q = bank[Math.floor(Math.random()*bank.length)];
  const labels = { feed:'🍎 Cho pet ăn (Toán)', study:'📖 Pet học bài (Văn / Nhận biết)' };
  modalTitle.textContent = labels[action];
  // Shuffle options
  const opts = [...q.o].sort(() => Math.random()-0.5);
  modalBody.innerHTML = `
    <div class="qprompt">${q.q}</div>
    <div class="qopts">
      ${opts.map(o => `<button class="qopt" data-val="${escapeAttr(o)}">${escapeHtml(o)}</button>`).join('')}
    </div>
    <div class="qresult" id="qresult"></div>
  `;
  modalClose.classList.remove('show');
  backdrop.classList.add('show');

  modalBody.querySelectorAll('.qopt').forEach(btn => {
    btn.addEventListener('click', () => answer(btn, q.a, action));
  });
}

function answer(btn, correct, action) {
  const buttons = modalBody.querySelectorAll('.qopt');
  buttons.forEach(b => { b.disabled = true; });
  const chosen = btn.dataset.val;
  const ok = chosen === correct;
  const res = document.getElementById('qresult');
  if (ok) {
    btn.classList.add('good');
    res.className = 'qresult ok show';
    res.textContent = `✅ Chính xác! +20 XP${action==='feed' ? ', +15 HP' : ''}.`;
    addXp(20);
    if (action === 'feed') { state.hp = Math.min(100, state.hp + 15); }
    if (state.hp > 50) state.mood = 'happy';
    saveState(state); renderStats(); renderPet();
  } else {
    btn.classList.add('bad');
    buttons.forEach(b => { if (b.dataset.val === correct) b.classList.add('good'); });
    res.className = 'qresult no show';
    res.textContent = `❌ Sai rồi. Đáp án đúng: ${correct}. -5 HP.`;
    state.hp = Math.max(0, state.hp - 5);
    if (state.hp <= 20) state.mood = 'sad';
    saveState(state); renderStats(); renderPet();
  }
  modalClose.classList.add('show');
}

// ── Mini-game đếm số ──
function openCountGame() {
  modalTitle.textContent = '🎮 Đếm thật nhanh!';
  const emojis = ['🍎','🍌','🍓','⭐','🐱','🌸','🎈','🌈'];
  const target = emojis[Math.floor(Math.random()*emojis.length)];
  const range = getCountRange();
  const total = range.min + Math.floor(Math.random()*(range.max - range.min + 1));
  // Sinh chuỗi emoji ngẫu nhiên, có 'total' lần xuất hiện 'target'
  const fillers = emojis.filter(e => e !== target);
  const arr = [];
  for (let i = 0; i < total; i++) arr.push(target);
  const fillerCount = range.fillerMin + Math.floor(Math.random()*(range.fillerMax - range.fillerMin + 1));
  for (let i = 0; i < fillerCount; i++) arr.push(fillers[Math.floor(Math.random()*fillers.length)]);
  arr.sort(() => Math.random()-0.5);
  // 4 options bao quanh đáp án đúng (giới hạn dương)
  const opts = new Set([total]);
  const spread = currentGrade === 'mam-non' ? 2 : 3;
  while (opts.size < 4) {
    const d = total + (Math.floor(Math.random()*(spread*2+1)) - spread);
    if (d > 0 && d !== total) opts.add(d);
  }
  const optArr = [...opts].sort(() => Math.random()-0.5);

  modalBody.innerHTML = `
    <div class="count-game">
      <div style="font-size:14px; color:var(--ink-soft); font-weight:700;">Có bao nhiêu <span style="font-size:24px">${target}</span> trong dãy này?</div>
      <div class="emojis">${arr.join(' ')}</div>
      <div class="qopts">
        ${optArr.map(n => `<button class="qopt" data-val="${n}">${n}</button>`).join('')}
      </div>
      <div class="qresult" id="qresult"></div>
    </div>
  `;
  modalClose.classList.remove('show');
  backdrop.classList.add('show');

  modalBody.querySelectorAll('.qopt').forEach(btn => {
    btn.addEventListener('click', () => answer(btn, String(total), 'play'));
  });
}

// ── Action buttons ──
document.querySelectorAll('.act-btn').forEach(btn => {
  btn.addEventListener('click', () => openQuiz(btn.dataset.action));
});

// ── Vuốt ve pet ──
document.getElementById('pet-wrap').addEventListener('click', () => {
  const wrap = document.getElementById('pet-wrap');
  wrap.classList.remove('morph'); void wrap.offsetWidth; wrap.classList.add('morph');
  if (state.hp > 0) {
    state.mood = 'happy';
    saveState(state); renderStats(); renderPet();
    setTimeout(() => { state.mood = 'ok'; renderStats(); renderPet(); }, 3000);
  } else {
    toast('💔 Pet quá đói, hãy cho ăn trước!', 'bad');
  }
});

// ── Pet name ──
document.getElementById('petname-save').addEventListener('click', () => {
  const v = document.getElementById('petname-input').value.trim().slice(0, 20);
  if (v) { state.name = v; saveState(state); renderStats(); toast('✅ Đã đặt tên cho pet!'); }
});

// ── Utils ──
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

// ── Grade selector ──
const GRADE_LABEL = { 'mam-non':'Mầm non', 'tieu-hoc':'Tiểu học', 'thcs':'THCS', 'thpt':'THPT' };
(function initGradeSelect(){
  const sel = document.getElementById('grade-select');
  if (!sel) return;
  sel.value = currentGrade;
  sel.addEventListener('change', () => {
    if (!VALID_GRADES.includes(sel.value)) return;
    currentGrade = sel.value;
    try { localStorage.setItem(GRADE_KEY, currentGrade); } catch {}
    toast(`📚 Đã chuyển sang câu hỏi ${GRADE_LABEL[currentGrade]}`, 'info');
  });
})();

// ── Boot ──
updateStreak();
renderStats();
renderPet();
// Welcome toast theo cấp
setTimeout(() => {
  const stage = getStage(state.level);
  const gradeLbl = GRADE_LABEL[currentGrade] || '';
  const suffix = gradeLbl ? ` · câu hỏi ${gradeLbl}` : '';
  if (state.level === 0) toast(`🥚 Trứng đang chờ ấp${suffix}. Trả lời câu hỏi để pet nở!`, 'info');
  else toast(`👋 ${state.name} (cấp ${state.level}, ${stage.name})${suffix}`, 'info');
}, 500);
</script>
