<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tizia · Chợ bài giảng GV</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#fbbf24" />
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --info: #0ea5e9;
    --card: rgba(255,255,255,0.06); --card-h: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; padding: 24px 18px; min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.25), transparent),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%, var(--bg-3));
  }
  .wrap { max-width:none; margin: 0 auto; }
  .head { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
  .head a.back { padding: 7px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; color: white; text-decoration: none; font-size: 12px; }
  .head h1 {
    margin: 0; font-size: 28px;
    background: linear-gradient(135deg, #ffffff, #fbbf24, #f97316);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head .cta {
    margin-left: auto;
    padding: 9px 18px; border-radius: 10px;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    font-weight: 700; cursor: pointer; border: none; font-size: 13px; text-decoration: none;
  }
  .tagline { opacity: 0.85; max-width: 760px; line-height: 1.6; font-size: 14px; margin: 0 0 22px; }
  .filters {
    background: var(--card); border: 1px solid var(--border);
    padding: 14px 18px; border-radius: 14px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px;
  }
  .filters input, .filters select {
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06);
    color: white; font-family: inherit; font-size: 13px;
  }
  .filters input[type=search] { flex: 1; min-width: 180px; }
  .filters button {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: rgba(14,165,233,0.2); color: #7dd3fc; cursor: pointer;
    font-size: 12px; font-weight: 600;
  }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .lesson {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    position: relative;
  }
  .lesson:hover { background: var(--card-h); transform: translateY(-2px); border-color: var(--accent); }
  .lesson h3 { margin: 0 0 6px; font-size: 16px; }
  .lesson .author { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }
  .lesson .desc { font-size: 13px; opacity: 0.9; line-height: 1.5; margin-bottom: 12px; min-height: 60px; }
  .lesson .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .lesson .badge {
    font-size: 10px; padding: 3px 9px; border-radius: 999px;
    background: rgba(14,165,233,0.15); color: #7dd3fc;
  }
  .lesson .stats {
    display: flex; gap: 12px; font-size: 11px; opacity: 0.75;
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .empty {
    text-align: center; padding: 80px 20px; opacity: 0.7; font-size: 14px;
  }
  .empty button {
    padding: 12px 24px; border-radius: 10px;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    border: none; cursor: pointer; font-weight: 700; margin-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a href="./index.html" class="back">←</a>
    <h1>📚 Chợ bài giảng cộng đồng</h1>
    <a class="cta" href="./lesson-builder.html">✏️ Tạo bài giảng mới</a>
  </div>
  <p class="tagline">
    Bài giảng tương tác do giáo viên Việt Nam tự tạo bằng <b>Lesson Builder no-code</b>. Free để xem, free để clone về sửa.
    Mỗi bài có thể nhúng video, quiz, AI tutor, danh nhân, ca lâm sàng, đàm phán.
  </p>

  <div class="filters">
    <input type="search" id="q" placeholder="Tìm theo tên, mô tả…" />
    <select id="subject">
      <option value="">Tất cả môn</option>
      <option value="toan">Toán</option>
      <option value="vat_ly">Vật lý</option>
      <option value="hoa">Hoá</option>
      <option value="sinh">Sinh</option>
      <option value="ngu_van">Ngữ văn</option>
      <option value="lich_su">Lịch sử</option>
      <option value="dia">Địa lí</option>
      <option value="tin_hoc">Tin học</option>
      <option value="duoc">Dược</option>
      <option value="y">Y khoa</option>
    </select>
    <select id="grade">
      <option value="">Tất cả lớp</option>
      <option value="1">Lớp 1</option><option value="2">Lớp 2</option><option value="3">Lớp 3</option>
      <option value="4">Lớp 4</option><option value="5">Lớp 5</option><option value="6">Lớp 6</option>
      <option value="7">Lớp 7</option><option value="8">Lớp 8</option><option value="9">Lớp 9</option>
      <option value="10">Lớp 10</option><option value="11">Lớp 11</option><option value="12">Lớp 12</option>
    </select>
    <select id="sort">
      <option value="recent">Mới nhất</option>
      <option value="likes">❤️ Nhiều thích</option>
      <option value="views">👁 Nhiều xem</option>
    </select>
    <button id="refresh">🔄</button>
  </div>

  <div id="grid" class="grid">
    <div class="empty">Đang tải…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function load() {
  const params = new URLSearchParams({
    q: $('q').value, subject: $('subject').value,
    grade: $('grade').value, sort: $('sort').value, limit: '60',
  });
  const r = await fetch('./api/lessons?' + params.toString());
  const d = await r.json();
  const grid = $('grid');
  if (!d.items?.length) {
    grid.innerHTML = `<div class="empty">
      <p>Chưa có bài giảng nào phù hợp.</p>
      <button onclick="location.href='./lesson-builder.html'">✏️ Tạo bài giảng đầu tiên</button>
    </div>`;
    return;
  }
  grid.innerHTML = d.items.map(l => `
    <div class="lesson" onclick="location.href='./lesson.html?slug=${l.slug}'">
      <h3>${escape(l.title)}</h3>
      <div class="author">👤 ${escape(l.author || 'Ẩn danh')} · ${formatTime(l.created_at)}</div>
      <div class="desc">${escape((l.description || '').slice(0, 140))}${(l.description||'').length > 140 ? '…' : ''}</div>
      <div class="badges">
        ${l.subject ? `<span class="badge">${escape(l.subject)}</span>` : ''}
        ${l.grade ? `<span class="badge">Lớp ${escape(l.grade)}</span>` : ''}
      </div>
      <div class="stats">
        <span>👁 ${l.views}</span>
        <span>❤️ ${l.likes}</span>
      </div>
    </div>
  `).join('');
}

$('q').addEventListener('input', debounce(load, 300));
$('subject').addEventListener('change', load);
$('grade').addEventListener('change', load);
$('sort').addEventListener('change', load);
$('refresh').addEventListener('click', load);

function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function escape(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function formatTime(t) {
  const d = new Date(t);
  return d.toLocaleDateString('vi-VN');
}
load();
</script>
<script src="./js/pwa-register.js" defer></script>
</body>
</html>
