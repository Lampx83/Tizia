<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🛒 Cửa hàng skin & avatar · Tizia</title>
<meta name="description" content="Đổi coin lấy skin pet, frame avatar, emoji pack, danh hiệu. Limited items theo mùa." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 20% 0%, rgba(251,191,36,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }
  .top .coins { margin-left:auto; padding:7px 14px; border-radius:14px;
    background:rgba(251,191,36,.15); color:var(--accent);
    font-weight:800; font-size:14px; }

  .wrap { max-width:none; margin:0 auto; padding:18px; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tab { padding:7px 16px; border-radius:18px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    font-size:13px; cursor:pointer; font-weight:600; transition:background .12s; }
  .tab:hover { background:rgba(255,255,255,.10); }
  .tab.cur { background:var(--purple); color:#fff; border-color:var(--purple); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px 14px; text-align:center; transition:transform .15s, border-color .15s; }
  .item:hover { transform:translateY(-2px); }
  .item.rarity-common  { border-color:rgba(255,255,255,.12); }
  .item.rarity-rare    { border-color:rgba(96,165,250,.4); box-shadow:0 4px 14px rgba(96,165,250,.15); }
  .item.rarity-epic    { border-color:rgba(167,139,250,.5); box-shadow:0 4px 18px rgba(167,139,250,.2); }
  .item.rarity-legendary { border-color:rgba(251,191,36,.55); box-shadow:0 6px 22px rgba(251,191,36,.25); }
  .item .ico { font-size:48px; line-height:1; margin-bottom:8px; display:block;
    animation:tz-item-float 3s ease-in-out infinite; }
  .item .nm { font-size:14px; font-weight:800; margin-bottom:3px; }
  .item .desc { font-size:11.5px; color:var(--text-soft); margin-bottom:10px;
    line-height:1.4; min-height:32px; }
  .item .rarity { display:inline-block; padding:2px 10px; border-radius:999px;
    font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    margin-bottom:10px; }
  .item .rarity.common    { background:rgba(255,255,255,.08); color:var(--text-soft); }
  .item .rarity.rare      { background:rgba(96,165,250,.2); color:#60a5fa; }
  .item .rarity.epic      { background:rgba(167,139,250,.25); color:#c4b5fd; }
  .item .rarity.legendary { background:rgba(251,191,36,.25); color:#fbbf24; }
  .item .price { font-size:13px; color:var(--accent); font-weight:800; margin-bottom:8px; }
  .item button { padding:8px 14px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    border:none; cursor:pointer; font:700 12.5px 'Inter', system-ui, sans-serif;
    transition:transform .1s; width:100%; }
  .item button:hover:not(:disabled) { transform:scale(1.03); }
  .item button:disabled { opacity:.5; cursor:not-allowed; }
  .item button.owned    { background:rgba(34,197,94,.18); color:var(--good); border:1px solid var(--good); }
  .item button.equipped { background:var(--good); color:#052e16; }
  @keyframes tz-item-float {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-4px); }
  }

  .empty, .loading { text-align:center; padding:40px; color:var(--text-soft); }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🛒 Cửa hàng skin & avatar</h1>
  <div class="coins"><span id="coin-count">0</span> 🪙</div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <div class="tab cur" data-type="">Tất cả</div>
    <div class="tab" data-type="pet-skin">🐲 Skin Pet</div>
    <div class="tab" data-type="avatar-frame">🖼 Khung Avatar</div>
    <div class="tab" data-type="emoji-pack">😀 Emoji Pack</div>
    <div class="tab" data-type="title">👑 Danh hiệu</div>
    <div class="tab" data-type="inventory">📦 Của tôi</div>
  </div>

  <div class="grid" id="grid">
    <div class="loading" style="grid-column:1/-1">Đang tải…</div>
  </div>
</div>

<script type="module">
let items = [];
let inventory = new Map();   // item_id → row
let currentTab = '';

async function load() {
  try {
    const [shopRes, invRes, walletRes] = await Promise.all([
      fetch('/api/shop/items'),
      fetch('/api/shop/me', { credentials:'same-origin' }),
      fetch('/api/wallet', { credentials:'same-origin' }),
    ]);
    if (shopRes.ok) items = (await shopRes.json()).items || [];
    if (invRes.ok) {
      const d = await invRes.json();
      inventory = new Map((d.inventory || []).map(i => [i.item_id, i]));
    }
    if (walletRes.ok) {
      const w = await walletRes.json();
      document.getElementById('coin-count').textContent = w.coins || 0;
    }
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML = `<p style="color:var(--bad);grid-column:1/-1">Lỗi: ${e.message}</p>`;
  }
}

function render() {
  const grid = document.getElementById('grid');
  let display;
  if (currentTab === 'inventory') {
    display = [...inventory.values()].map(i => ({
      id: i.item_id, name: i.name, type: i.type, icon: i.icon,
      description: i.description, rarity: i.rarity, price_coin: 0,
      equipped: !!i.equipped, owned: true,
    }));
  } else {
    display = items.filter(i => !currentTab || i.type === currentTab).map(i => ({
      ...i, owned: inventory.has(i.id),
      equipped: inventory.get(i.id)?.equipped,
    }));
  }
  if (display.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Không có item nào.</div>`;
    return;
  }
  grid.innerHTML = display.map(i => `
    <div class="item rarity-${i.rarity}">
      <span class="ico">${esc(i.icon || '🎁')}</span>
      <div class="rarity ${i.rarity}">${rarityLabel(i.rarity)}</div>
      <div class="nm">${esc(i.name)}</div>
      <div class="desc">${esc(i.description || '')}</div>
      ${i.owned ? '' : `<div class="price">${i.price_coin} 🪙</div>`}
      ${i.owned
        ? (i.equipped
          ? '<button class="equipped" disabled>✓ Đang dùng</button>'
          : `<button class="owned" data-equip="${esc(i.id)}">Dùng item này</button>`)
        : `<button data-buy="${esc(i.id)}">Mua</button>`}
    </div>
  `).join('');
  grid.querySelectorAll('[data-buy]').forEach(b => {
    b.addEventListener('click', () => buy(b.dataset.buy));
  });
  grid.querySelectorAll('[data-equip]').forEach(b => {
    b.addEventListener('click', () => equip(b.dataset.equip));
  });
}

async function buy(id) {
  const r = await fetch('/api/shop/buy', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ item_id: id }), credentials:'same-origin',
  });
  const d = await r.json();
  if (!d.ok) {
    if (d.error === 'no_coins') alert(`Không đủ coin. Cần ${d.need}, hiện có ${d.have}.`);
    else alert(d.error || 'Lỗi');
    return;
  }
  await load();
  try { window.__tziaEngagementHud?.refresh(); } catch {}
}
async function equip(id) {
  const r = await fetch('/api/shop/equip', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ item_id: id }), credentials:'same-origin',
  });
  const d = await r.json();
  if (d.ok) load();
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('cur'));
  t.classList.add('cur');
  currentTab = t.dataset.type;
  render();
});

function rarityLabel(r) {
  return ({ common:'Thường', rare:'Hiếm', epic:'Sử thi', legendary:'Huyền thoại' }[r] || r);
}
function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
load();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-07"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
