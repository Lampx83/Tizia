<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎯 Năng lực của em · Tizia</title>
<meta name="description" content="Cây năng lực của HS theo khung GDPT 2018 (Thông tư 32/2018): 5 phẩm chất + 10 năng lực. Theo dõi tiến độ kỹ năng đã đạt qua tất cả các trường." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a; --card-2:#1d2547;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185;
    --pham-chat:#f472b6; --nl-chung:#60a5fa; --nl-chuyen:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--text);
    background: radial-gradient(1200px 700px at 20% 0%, rgba(96,165,250,.12), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(167,139,250,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px); background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px; background:rgba(255,255,255,.08); border:1px solid var(--border); font-size:13px; font-weight:600; }
  .back:hover { background:rgba(255,255,255,.16); }
  .top h1 { margin:0; font-size:18px; }
  .top .meta { margin-left:auto; font-size:13px; color:var(--text-soft); }

  .wrap { max-width:none; margin:0 auto; padding:24px 18px 80px; }
  .hero { background: linear-gradient(135deg, rgba(251,191,36,.18), rgba(251,191,36,.03));
    border:1px solid rgba(251,191,36,.35); border-radius:18px; padding:22px 24px; margin-bottom:24px;
    display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  .donut { position:relative; width:120px; height:120px; flex-shrink:0; }
  .donut svg { width:100%; height:100%; transform:rotate(-90deg); }
  .donut .track { fill:none; stroke:rgba(255,255,255,.08); stroke-width:12; }
  .donut .arc { fill:none; stroke:var(--accent); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .6s ease-out; }
  .donut .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut .pct { font-size:24px; font-weight:800; color:var(--accent); }
  .donut .lbl { font-size:11px; color:var(--text-soft); font-weight:600; }
  .hero-text { flex:1; min-width:260px; }
  .hero-text h2 { margin:0 0 6px; font-size:22px; }
  .hero-text p  { margin:0; font-size:14px; color:var(--text-soft); line-height:1.55; }
  .hero-cta { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .hero-cta a { background:var(--accent); color:#1f1147; text-decoration:none; padding:8px 14px; border-radius:12px; font-weight:700; font-size:13px; }
  .hero-cta a:hover { filter:brightness(1.08); }
  .hero-cta a.ghost { background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--border); }

  .kind-title { display:flex; align-items:center; gap:10px; margin:28px 0 12px; font-size:16px; font-weight:700; }
  .kind-title .dot { width:10px; height:10px; border-radius:50%; }
  .kind-title.pham-chat .dot { background:var(--pham-chat); }
  .kind-title.nl-chung  .dot { background:var(--nl-chung); }
  .kind-title.nl-chuyen .dot { background:var(--nl-chuyen); }
  .kind-title .sub { font-size:12.5px; font-weight:500; color:var(--text-soft); margin-left:auto; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .comp { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; transition:transform .15s, border-color .15s; }
  .comp:hover { border-color:rgba(251,191,36,.4); }
  .comp.empty { opacity:.62; }
  .comp h3 { margin:0 0 6px; font-size:15.5px; display:flex; align-items:center; gap:8px; }
  .comp h3 .ic { font-size:20px; }
  .comp .desc { font-size:12.5px; color:var(--text-soft); margin:0 0 12px; line-height:1.5; min-height:36px; }
  .bar { height:8px; border-radius:8px; background:rgba(255,255,255,.07); overflow:hidden; margin-bottom:10px; }
  .bar > i { display:block; height:100%; border-radius:8px; background:linear-gradient(90deg, var(--good), var(--accent)); transition:width .5s ease-out; }
  /* Bar "thành thạo" — màu tím phân biệt với bar "đã đạt" (vàng/xanh) */
  .bar.mastery > i { background:linear-gradient(90deg, #a78bfa, #ec4899); }
  /* Skill chip có mini progress bar bên dưới — show độ thành thạo từng kỹ năng */
  .skill-chip { display:inline-flex; flex-direction:column; align-items:stretch; gap:3px; }
  .skill-chip .mini-bar { height:3px; background:rgba(255,255,255,.18); border-radius:2px; overflow:hidden; }
  .skill-chip .mini-bar > i { display:block; height:100%; background:linear-gradient(90deg, #a78bfa, #34d399); transition:width .5s; }
  .progress-line { display:flex; justify-content:space-between; font-size:12px; color:var(--text-soft); margin-bottom:8px; }
  .progress-line b { color:var(--good); }
  .skill-list { display:flex; gap:6px; flex-wrap:wrap; }
  .skill-list .chip { background:rgba(16,185,129,.16); border:1px solid rgba(16,185,129,.4); color:var(--good); padding:4px 10px; border-radius:14px; font-size:11.5px; font-weight:500; }
  .skill-list .more { background:rgba(255,255,255,.06); border:1px dashed var(--border); color:var(--text-soft); padding:4px 10px; border-radius:14px; font-size:11.5px; cursor:pointer; }
  .empty-msg { font-size:12.5px; color:var(--text-soft); font-style:italic; }

  .loading { text-align:center; padding:60px 20px; color:var(--text-soft); }
  .empty-state { text-align:center; padding:40px 20px; background:var(--card); border:1px dashed var(--border); border-radius:14px; }
  .empty-state h3 { margin:0 0 8px; }
  .empty-state p { color:var(--text-soft); margin:0 0 14px; }
  .empty-state a { display:inline-block; background:var(--accent); color:#1f1147; padding:10px 18px; border-radius:12px; font-weight:700; text-decoration:none; }

  /* Switcher: xem cây năng lực của ai (bản thân / con / HS trong lớp) */
  .switcher { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding:10px 12px; background:var(--card-2); border:1px solid var(--border); border-radius:14px; align-items:center; }
  .switcher b { font-size:13px; color:var(--text-soft); margin-right:6px; }
  .switcher .pill { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.06); border:1px solid var(--border); padding:6px 12px; border-radius:14px; font-size:13px; cursor:pointer; transition:background .12s; }
  .switcher .pill:hover { background:rgba(255,255,255,.12); }
  .switcher .pill.active { background:var(--accent); color:#1f1147; border-color:var(--accent); font-weight:700; }
  .switcher .pill .who { opacity:.7; font-size:11px; }
  .switcher .pill.active .who { opacity:.85; color:#3a2410; }
  .switcher select { background:rgba(255,255,255,.06); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:10px; font-family:inherit; font-size:13px; }

  /* Class roster — list HS trong lớp (cho GV) */
  .class-roster { margin-bottom:18px; }
  .class-roster .roster-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  .class-roster .stu { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; cursor:pointer; transition:border-color .12s; }
  .class-roster .stu:hover { border-color:var(--accent); }
  .class-roster .stu .name { font-weight:700; font-size:14px; }
  .class-roster .stu .mini-bar { height:6px; border-radius:6px; background:rgba(255,255,255,.07); margin-top:6px; overflow:hidden; }
  .class-roster .stu .mini-bar > i { display:block; height:100%; background:linear-gradient(90deg, var(--good), var(--accent)); transition:width .4s; }
  .class-roster .stu .sub { font-size:11.5px; color:var(--text-soft); margin-top:4px; display:flex; justify-content:space-between; }

  /* Modal show all skills của 1 competency */
  .modal { position:fixed; inset:0; background:rgba(8,11,22,.72); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal.show { display:flex; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:16px; max-width:560px; width:100%; max-height:80vh; overflow:auto; padding:22px 24px; }
  .modal-box h2 { margin:0 0 4px; }
  .modal-box .desc { color:var(--text-soft); font-size:13.5px; margin:0 0 14px; }
  .modal-box .skill-row { padding:10px 0; border-top:1px solid var(--border); font-size:13.5px; display:flex; align-items:center; gap:10px; }
  .modal-box .skill-row .src { font-size:11.5px; color:var(--text-soft); margin-left:auto; }
  .modal-box .x { position:absolute; cursor:pointer; }
  .modal-box .close-btn { background:rgba(255,255,255,.08); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:10px; cursor:pointer; font-family:inherit; margin-top:14px; }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🎯 Năng lực của em</h1>
  <span class="meta">Khung Chương trình GDPT 2018 (TT 32/2018)</span>
</div>

<!-- Per-school enrollment: hiện trường đang theo học + nút Đổi trường. Render
     bằng module script bên dưới để dùng showEnrollmentModal/DOMAIN_META. -->
<div id="enrollment-host"></div>

<div class="wrap" id="wrap">
  <div class="loading">Đang tải cây năng lực…</div>
</div>

<script type="module">
  import { DOMAIN_META } from './js/engine/domain.js';
  import { getMe, showEnrollmentModal } from './js/enrollment.js';
  const host = document.getElementById('enrollment-host');
  const me = await getMe();
  if (me && me.role !== 'admin') {
    const cur = me.enrolled_domain;
    const meta = cur ? DOMAIN_META.find(d => d.id === cur) : null;
    host.innerHTML = `
      <style>
        #enrollment-host .es { max-width:880px; margin:14px auto 6px; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; box-shadow:0 4px 12px rgba(0,0,0,.04); }
        #enrollment-host .es-ic { font-size:34px; }
        #enrollment-host .es-body { flex:1; min-width:200px; }
        #enrollment-host .es-lbl { font-size:11px; letter-spacing:1.2px; color:#64748b; font-weight:800; text-transform:uppercase; }
        #enrollment-host .es-name { font-size:17px; font-weight:800; color:#0f172a; }
        #enrollment-host .es-sub { font-size:12.5px; color:#64748b; margin-top:2px; }
        #enrollment-host .es-btn { background:#0f172a; color:#fff; border:0; border-radius:10px; padding:9px 15px; font-weight:700; cursor:pointer; font-size:13px; font-family:inherit; }
        #enrollment-host .es-btn:hover { background:#1e293b; }
      </style>
      <div class="es">
        <div class="es-ic">${meta ? meta.icon : '❓'}</div>
        <div class="es-body">
          <div class="es-lbl">Trường đang theo học</div>
          <div class="es-name">${meta ? meta.name : 'Chưa chọn trường'}</div>
          <div class="es-sub">${meta ? meta.tagline : 'Hãy chọn một trường để bắt đầu theo dõi năng lực.'}</div>
        </div>
        <button class="es-btn" id="es-switch">${cur ? '🔄 Đổi trường' : '🎓 Chọn trường'}</button>
      </div>
    `;
    host.querySelector('#es-switch').addEventListener('click', async () => {
      try {
        await showEnrollmentModal({ mode: cur ? 'switch' : 'enroll', current: cur });
        location.reload();   // reload để cây năng lực vẽ lại theo trường mới
      } catch { /* user huỷ */ }
    });
  }
</script>

<div class="modal" id="modal"><div class="modal-box">
  <h2 id="m-name"></h2>
  <p class="desc" id="m-desc"></p>
  <div id="m-body"></div>
  <button class="close-btn" id="m-close">Đóng</button>
</div></div>

<script>
const KIND_META = {
  pham_chat:           { label: '5 Phẩm chất',         cls: 'pham-chat', icon: '💖' },
  nang_luc_chung:      { label: '3 Năng lực chung',    cls: 'nl-chung',  icon: '🧭' },
  nang_luc_chuyen_mon: { label: '7 Năng lực chuyên môn', cls: 'nl-chuyen', icon: '🛠️' },
};
const DOMAIN_LABEL = {
  preschool: 'Mầm non', primary: 'Tiểu học', secondary: 'THCS', highschool: 'THPT',
  pharmacy: 'Trường Dược', it: 'Trường CNTT'
};
const COMP_ICON = {
  PC_YEU_NUOC: '🇻🇳', PC_NHAN_AI: '🤝', PC_CHAM_CHI: '🐝', PC_TRUNG_THUC: '🕊️', PC_TRACH_NHIEM: '🛡️',
  NL_TU_CHU: '🧭', NL_GIAO_TIEP: '💬', NL_GQVD: '💡',
  NL_NGON_NGU: '📚', NL_TINH_TOAN: '🔢', NL_KHOA_HOC: '🔬', NL_CONG_NGHE: '⚙️',
  NL_TIN_HOC: '💻', NL_THAM_MY: '🎨', NL_THE_CHAT: '⚽',
};

function esc(s){ return String(s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// State chung: context hiện tại (self | child | classMember) + tree đã load.
let _state = { context: 'self', label: 'Em', subject: null, me: null, children: [], classes: [] };

async function init(){
  const wrap = document.getElementById('wrap');
  // 1) Lấy info user hiện tại
  try {
    const meRes = await fetch('/api/auth/me', { credentials:'same-origin' });
    if (meRes.status === 401) {
      wrap.innerHTML = `<div class="empty-state">
        <h3>🔐 Em chưa đăng nhập</h3>
        <p>Đăng nhập để theo dõi cây năng lực theo khung GDPT 2018.</p>
        <a href="/login.html">Đăng nhập</a>
      </div>`;
      return;
    }
    const meData = await meRes.json();
    _state.me = meData.user || meData;
  } catch(e) {
    wrap.innerHTML = `<div class="empty-state"><h3>⚠️ Không tải được</h3><p>${esc(e.message)}</p></div>`;
    return;
  }

  // 2) Song song: list con (qua family_links) + list lớp (nếu role=teacher)
  const [childrenData, classesData] = await Promise.all([
    fetch('/api/family/me', { credentials:'same-origin' }).then(r => r.ok ? r.json() : { children: [] }).catch(() => ({ children: [] })),
    (_state.me?.role === 'teacher' || _state.me?.role === 'admin')
      ? fetch('/api/classes', { credentials:'same-origin' }).then(r => r.ok ? r.json() : []).catch(() => [])
      : Promise.resolve([])
  ]);
  _state.children = childrenData?.children || [];
  // GV chỉ thấy lớp do mình tạo (teacher_name khớp display_name); admin thấy tất.
  _state.classes = (classesData || []).filter(c =>
    _state.me?.role === 'admin' || c.teacher_name === _state.me?.display_name
  );

  // 3) Load mặc định: bản thân.
  await loadSubject({ context: 'self', label: 'Bản thân (' + (_state.me?.display_name || 'tôi') + ')' });
}

async function loadSubject(subject){
  const wrap = document.getElementById('wrap');
  _state.context = subject.context;
  _state.label = subject.label;
  _state.subject = subject;
  wrap.innerHTML = renderSwitcher() + '<div class="loading">Đang tải…</div>';
  bindSwitcher();

  let data;
  try {
    let url = '/api/skills/me';
    if (subject.context === 'child') url = `/api/skills/child/${subject.child_id}`;
    else if (subject.context === 'class') url = `/api/skills/class/${encodeURIComponent(subject.class_code)}`;
    const res = await fetch(url, { credentials:'same-origin' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch(e) {
    wrap.innerHTML = renderSwitcher() + `<div class="empty-state"><h3>⚠️ Lỗi tải</h3><p>${esc(e.message)}</p></div>`;
    bindSwitcher();
    return;
  }

  if (subject.context === 'class') {
    renderClassRoster(data, subject);
    return;
  }

  renderTree(data, subject);
}

function renderSwitcher(){
  const pills = [];
  const isActive = (k, extra='') => (_state.context === k && (!extra || _state.subject?.class_code === extra || _state.subject?.child_id == extra)) ? ' active' : '';
  pills.push(`<button class="pill${isActive('self')}" data-ctx="self">👤 Bản thân<span class="who">${esc(_state.me?.display_name||'')}</span></button>`);
  for (const c of _state.children) {
    pills.push(`<button class="pill${isActive('child', String(c.id))}" data-ctx="child" data-id="${c.id}">👶 ${esc(c.display_name)}<span class="who">con</span></button>`);
  }
  for (const cls of _state.classes) {
    pills.push(`<button class="pill${isActive('class', cls.code)}" data-ctx="class" data-code="${esc(cls.code)}">🎓 ${esc(cls.name || cls.code)}<span class="who">lớp</span></button>`);
  }
  if (pills.length === 1) return ''; // chỉ self → ẩn switcher
  return `<div class="switcher"><b>Xem cây năng lực của:</b>${pills.join('')}</div>`;
}

function bindSwitcher(){
  document.querySelectorAll('.switcher .pill').forEach(b => {
    b.addEventListener('click', () => {
      const ctx = b.dataset.ctx;
      if (ctx === 'self') loadSubject({ context:'self', label:'Bản thân' });
      else if (ctx === 'child') {
        const id = +b.dataset.id;
        const c = _state.children.find(x => x.id === id);
        loadSubject({ context:'child', label:'Con: '+ (c?.display_name||id), child_id: id });
      } else if (ctx === 'class') {
        const code = b.dataset.code;
        const cls = _state.classes.find(x => x.code === code);
        loadSubject({ context:'class', label:'Lớp: '+ (cls?.name||code), class_code: code });
      }
    });
  });
}

function renderClassRoster(data, subject){
  const wrap = document.getElementById('wrap');
  const members = data.members || [];
  const cls = data.class || {};
  const total = data.total_skills || 0;
  const switcher = renderSwitcher();
  let html = switcher + `
    <div class="hero">
      <div class="hero-text">
        <h2>🎓 Lớp <span style="color:var(--good)">${esc(cls.name || cls.code)}</span></h2>
        <p>${members.length} HS trong lớp. Bấm vào HS để xem cây năng lực chi tiết. (Chỉ HS đã làm bài qua mã lớp <code style="background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px">${esc(cls.code)}</code> mới hiển thị.)</p>
      </div>
    </div>
  `;
  if (members.length === 0) {
    html += `<div class="empty-state"><h3>👥 Chưa có HS nào</h3><p>HS làm bài với class_code=<b>${esc(cls.code)}</b> sẽ tự xuất hiện ở đây.</p></div>`;
  } else {
    html += '<div class="class-roster"><div class="roster-grid">';
    for (const m of members) {
      const pct = total > 0 ? Math.round((m.summary.earned/total)*100) : 0;
      html += `<div class="stu" data-uid="${m.user_id}" data-name="${esc(m.display_name)}">
        <div class="name">${esc(m.display_name)}</div>
        <div class="mini-bar"><i style="width:${pct}%"></i></div>
        <div class="sub"><span>${m.summary.earned}/${total} kỹ năng</span><span>${pct}%</span></div>
      </div>`;
    }
    html += '</div></div>';
  }
  wrap.innerHTML = html;
  bindSwitcher();
  wrap.querySelectorAll('.stu').forEach(el => {
    el.addEventListener('click', () => loadSubject({
      context:'child', // dùng endpoint /child/:id (admin/teacher có quyền)
      label: 'HS: ' + el.dataset.name,
      child_id: +el.dataset.uid,
    }));
  });
}

function renderTree(data, subject){
  const wrap = document.getElementById('wrap');
  const summary = data.summary || { earned:0, total:0 };
  const tree = data.tree || [];
  const child = data.child;
  const pct = summary.total > 0 ? Math.round((summary.earned / summary.total) * 100) : 0;

  // Hero donut + tiêu đề tuỳ context
  const CIRC = 2 * Math.PI * 52;
  const arcLen = (pct / 100) * CIRC;
  const whoName = child ? esc(child.display_name) : 'Em';
  const sub = subject.context === 'self'
    ? 'Mỗi kỹ năng thuộc 1 trong <b>5 phẩm chất</b> hoặc <b>10 năng lực</b> của Chương trình GDPT 2018. Hoàn thành quiz tại mỗi không gian (đạt ≥70%) để mở khoá kỹ năng mới.'
    : `Cây năng lực của <b>${whoName}</b> theo khung Chương trình GDPT 2018. Bạn đang xem ở chế độ ${subject.context === 'child' ? 'phụ huynh / quản lý' : 'giáo viên'}.`;
  const switcher = renderSwitcher();
  const heroHtml = switcher + `
    <div class="hero">
      <div class="donut" aria-label="Tiến độ tổng">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="arc"   cx="60" cy="60" r="52"
            stroke-dasharray="${arcLen} ${CIRC - arcLen}"></circle>
        </svg>
        <div class="center"><div class="pct">${pct}%</div><div class="lbl">Tiến độ</div></div>
      </div>
      <div class="hero-text">
        <h2>${whoName} đã đạt <span style="color:var(--good)">${summary.earned}</span> / ${summary.total} kỹ năng</h2>
        <p>${sub}</p>
        ${subject.context === 'self' ? `<div class="hero-cta">
          <a href="/index.html">🏫 Khám phá các trường</a>
          <a class="ghost" href="/cay-tri-thuc.html">🌳 Cây Tri Thức</a>
        </div>` : ''}
      </div>
    </div>
  `;

  // Group competencies by kind
  const byKind = { pham_chat: [], nang_luc_chung: [], nang_luc_chuyen_mon: [] };
  for (const node of tree) {
    const k = node.competency.kind;
    if (byKind[k]) byKind[k].push(node);
  }

  let html = heroHtml;
  if (summary.earned === 0) {
    html += `<div class="empty-state">
      <h3>🌱 Hãy bắt đầu khám phá!</h3>
      <p>Em chưa đạt kỹ năng nào — vào một không gian (ví dụ Trường Mầm non → Lớp Mầm) và làm quiz đạt ≥70% để mở khoá.</p>
      <a href="/school.html?domain=preschool">🏫 Vào Trường Mầm non</a>
    </div>`;
  }

  for (const kind of ['pham_chat', 'nang_luc_chung', 'nang_luc_chuyen_mon']) {
    const list = byKind[kind];
    if (!list || list.length === 0) continue;
    const meta = KIND_META[kind];
    const totalEarned = list.reduce((s,n)=>s+n.earned_skills.length, 0);
    const totalAll    = list.reduce((s,n)=>s+n.total_skills, 0);
    html += `<div class="kind-title ${meta.cls}"><span class="dot"></span>${meta.icon} ${meta.label}<span class="sub">${totalEarned}/${totalAll} kỹ năng</span></div>`;
    html += '<div class="grid">';
    for (const node of list) {
      const c = node.competency;
      const earned = node.earned_skills.length;
      const total = node.total_skills;
      const coveragePct = total > 0 ? Math.round((earned/total)*100) : 0;
      // mastery_pct = avg mastery × coverage (đã tính ở backend). Hiển thị
      // SONG SONG với coverage để HS biết "biết rộng" vs "biết sâu" khác nhau.
      const masteryPct = node.mastery_pct ?? 0;
      const avgMasteryPct = node.avg_mastery_pct ?? 0;
      const isEmpty = earned === 0;
      const icon = COMP_ICON[c.code] || '⭐';
      // Skill chip + mini mastery bar dưới mỗi chip (Trục B — "học sâu thật").
      const renderChip = s => `
        <span class="chip skill-chip" title="${esc(s.domain ? DOMAIN_LABEL[s.domain] : '')} · Thành thạo ${s.mastery_pct}%">
          ${esc(s.name)}
          <span class="mini-bar"><i style="width:${s.mastery_pct}%"></i></span>
        </span>`;
      const earnedChips = node.earned_skills.slice(0, 4).map(renderChip).join('');
      const more = earned > 4 ? `<span class="more" data-comp="${c.code}">+${earned - 4} khác</span>` : '';
      html += `
        <div class="comp ${isEmpty ? 'empty' : ''}">
          <h3><span class="ic">${icon}</span>${esc(c.name)}</h3>
          <p class="desc">${esc(c.description||'')}</p>
          <div class="progress-line">
            <span>Đã đạt</span>
            <span><b>${earned}</b>/${total} (${coveragePct}%)</span>
          </div>
          <div class="bar"><i style="width:${coveragePct}%"></i></div>
          <div class="progress-line" style="margin-top:10px">
            <span>Thành thạo</span>
            <span><b>${masteryPct}%</b><span style="opacity:.6;font-size:11px"> · TB ${avgMasteryPct}%</span></span>
          </div>
          <div class="bar mastery"><i style="width:${masteryPct}%"></i></div>
          <div class="skill-list">
            ${isEmpty ? '<span class="empty-msg">Chưa có kỹ năng nào — vào trường và làm quiz đi em!</span>' : earnedChips + more}
          </div>
          ${total > earned && !isEmpty ? `<div style="margin-top:8px"><span class="more" data-comp="${c.code}">Xem ${total - earned} kỹ năng chưa đạt →</span></div>` : ''}
        </div>
      `;
    }
    html += '</div>';
  }
  wrap.innerHTML = html;
  bindSwitcher();

  // Bind "Xem tất cả" → modal
  wrap.querySelectorAll('.more[data-comp]').forEach(btn => {
    btn.addEventListener('click', () => openCompModal(btn.dataset.comp, tree));
  });
}

async function openCompModal(compCode, tree){
  const node = tree.find(n => n.competency.code === compCode);
  if (!node) return;
  const c = node.competency;
  document.getElementById('m-name').textContent = `${COMP_ICON[c.code]||'⭐'} ${c.name}`;
  document.getElementById('m-desc').textContent = c.description || '';
  // Cần list TOÀN BỘ skill của competency (cả chưa đạt) — gọi catalog API.
  const body = document.getElementById('m-body');
  body.innerHTML = '<p style="color:var(--text-soft)">Đang tải…</p>';
  try {
    const res = await fetch('/api/skills/catalog');
    const cat = await res.json();
    const compId = cat.competencies.find(x => x.code === compCode)?.id;
    if (!compId) { body.innerHTML = '<p>Không tìm thấy năng lực này.</p>'; return; }
    const all = cat.skills.filter(s => s.competency_id === compId);
    const earnedSet = new Set(node.earned_skills.map(s => s.code));
    const earnedBySource = new Map(node.earned_skills.map(s => [s.code, s]));
    body.innerHTML = all.map(s => {
      const isEarned = earnedSet.has(s.code);
      const src = earnedBySource.get(s.code);
      const domainLabel = s.domain ? DOMAIN_LABEL[s.domain] || s.domain : '';
      return `<div class="skill-row">
        <span style="font-size:16px">${isEarned ? '✅' : '⬜'}</span>
        <span style="${isEarned?'':'opacity:.65'}">${esc(s.name)}</span>
        <span class="src">${esc(domainLabel)}${src?.score != null ? ' · '+src.score+'%' : ''}</span>
      </div>`;
    }).join('') || '<p style="color:var(--text-soft)">Năng lực này chưa có kỹ năng cụ thể nào trong catalog.</p>';
  } catch(e) {
    body.innerHTML = `<p>Lỗi tải catalog: ${esc(e.message)}</p>`;
  }
  document.getElementById('modal').classList.add('show');
}

document.getElementById('m-close').addEventListener('click', ()=> document.getElementById('modal').classList.remove('show'));
document.getElementById('modal').addEventListener('click', e=> { if (e.target.id==='modal') document.getElementById('modal').classList.remove('show'); });
document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('modal').classList.remove('show'); });

init();
</script>
