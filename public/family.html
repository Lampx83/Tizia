<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Gia đình · Tizia</title>
<meta name="description" content="Quản lý gia đình Tizia — liên kết tài khoản con, chia sẻ gói cước, theo dõi tiến độ học tập." />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#0ea5e9" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: #1f2937; min-height: 100vh; background: #f1f5f9;
  }
  .wrap { max-width:none; margin: 0 auto; padding: 30px 20px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .sub { color: #475569; margin-bottom: 20px; font-size: 14px; }
  .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); margin-bottom: 16px; }
  .plan-card {
    background: linear-gradient(135deg, #0ea5e9, #22c55e); color: white;
    padding: 20px 24px; border-radius: 12px; margin-bottom: 16px;
  }
  .plan-card .plan-name { font-size: 22px; font-weight: 800; }
  .plan-card .plan-sub { opacity: 0.9; font-size: 14px; margin-top: 4px; }
  form.add-form { display: flex; gap: 8px; margin-bottom: 14px; }
  input {
    flex: 1; padding: 10px 13px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-family: inherit;
  }
  button.primary {
    padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, #0ea5e9, #22c55e); color: white; font-weight: 700; font-family: inherit;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.danger {
    padding: 6px 12px; border: 1px solid #fca5a5; border-radius: 6px; cursor: pointer;
    background: white; color: #b91c1c; font-size: 12px; font-weight: 600; font-family: inherit;
  }
  button.danger:hover { background: #fee2e2; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th { color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .empty { color: #94a3b8; font-style: italic; padding: 24px; text-align: center; }
  .err { color: #b91c1c; font-size: 13px; margin-top: 8px; }
  .ok  { color: #16a34a; font-size: 13px; margin-top: 8px; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.pro  { background: #fef3c7; color: #92400e; }
  .badge.plus { background: #ddd6fe; color: #5b21b6; }
  .badge.free { background: #e5e7eb; color: #475569; }
</style>
<script type="module" src="./js/auth-header.js"></script>
</head>
<body>
<div class="wrap">
  <h1>👨‍👩‍👧 Gia đình</h1>
  <p class="sub">Link tài khoản con (Học sinh) với tài khoản của bạn để chia sẻ gói cước.</p>

  <div class="plan-card" id="plan-card">
    <div class="plan-name" id="plan-name">…</div>
    <div class="plan-sub" id="plan-sub">Đang tải…</div>
  </div>

  <div class="card">
    <h3 style="margin: 0 0 12px; font-size: 16px;">Thêm con</h3>
    <form class="add-form" id="form-add">
      <input id="child-username" placeholder="Tên đăng nhập tài khoản con (vd: lampx-con1)" required />
      <button type="submit" class="primary">+ Link</button>
    </form>
    <div id="add-msg"></div>
  </div>

  <div class="card">
    <h3 style="margin: 0 0 12px; font-size: 16px;">Con đã link</h3>
    <table id="tbl-children">
      <thead><tr><th>Tên hiển thị</th><th>Tài khoản</th><th>Lớp</th><th>Trường</th><th></th></tr></thead>
      <tbody id="tbody-children"><tr><td colspan="5" class="empty">Đang tải…</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { fetchMe } from './js/auth.js';

  const PLAN_LABEL = { guest: 'Khách', free: 'Miễn phí', plus: 'Plus', pro: 'Pro' };

  const me = await fetchMe();
  if (!me) { location.replace('login.html?return=' + encodeURIComponent('/family.html')); throw new Error(); }

  async function refresh() {
    const r = await fetch('/api/family/me', { credentials: 'include' });
    const data = await r.json();

    document.getElementById('plan-name').textContent = `Gói ${PLAN_LABEL[data.parent_plan] || data.parent_plan || 'Miễn phí'}`;
    document.getElementById('plan-sub').textContent = data.can_be_parent ? data.message
      : 'Tài khoản Học sinh không thể làm phụ huynh. Đổi vai trò sang Sinh viên hoặc Giảng viên.';

    const tbody = document.getElementById('tbody-children');
    if (!data.can_be_parent) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">—</td></tr>';
      document.getElementById('form-add').style.display = 'none';
      return;
    }
    if (!data.children?.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Chưa link con nào.</td></tr>';
      return;
    }
    tbody.innerHTML = data.children.map(c => {
      const grade = c.grade == null ? '—' : (c.grade === 0 ? 'Mầm non' : 'Lớp ' + c.grade);
      return `<tr>
        <td><b>${esc(c.display_name)}</b></td>
        <td>@${esc(c.username)}</td>
        <td>${grade}</td>
        <td>${esc(c.school_name || '—')}</td>
        <td><button class="danger" data-child="${c.id}">Bỏ link</button></td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('button.danger').forEach(btn => btn.addEventListener('click', () => unlinkChild(Number(btn.dataset.child))));
  }

  async function unlinkChild(childId) {
    if (!confirm('Bỏ link tài khoản con này? Gói sẽ ngừng chia sẻ.')) return;
    await fetch('/api/family/unlink', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ childId }) });
    refresh();
  }

  document.getElementById('form-add').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('child-username').value.trim();
    const msg = document.getElementById('add-msg');
    msg.textContent = ''; msg.className = '';
    try {
      const r = await fetch('/api/family/link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ childUsername: username }) });
      const data = await r.json();
      if (r.ok) {
        msg.textContent = `✓ Đã link ${data.child.display_name} (@${data.child.username})`;
        msg.className = 'ok';
        document.getElementById('child-username').value = '';
        refresh();
      } else {
        msg.textContent = '⚠️ ' + (data.message || data.error);
        msg.className = 'err';
      }
    } catch {
      msg.textContent = '⚠️ Lỗi mạng. Thử lại.';
      msg.className = 'err';
    }
  });

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  refresh();
</script>
<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/onboarding-60s.js?v=2026-06-08-r8"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-10-tl1"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
