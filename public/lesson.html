<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tizia · Bài giảng</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#fbbf24" />
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --success: #10b981; --info: #0ea5e9; --danger: #ef4444;
    --card: rgba(255,255,255,0.06); --card-h: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; padding: 0 0 40px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.2), transparent),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%, var(--bg-3));
    min-height: 100vh;
  }
  .head {
    padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: rgba(15,23,42,0.65); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .head a.back { padding: 7px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; color: white; text-decoration: none; font-size: 12px; }
  .head .title-area { flex: 1; min-width: 200px; }
  .head h1 { margin: 0; font-size: 20px; }
  .head .meta { font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .head .actions { display: flex; gap: 6px; }
  .head .actions button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.08); color: white; cursor: pointer; font-size: 12px;
  }
  .head .like.on { background: linear-gradient(135deg, #ef4444, #b91c1c); border-color: transparent; }

  .wrap { max-width:none; margin: 0 auto; padding: 24px 18px; }
  .b { margin: 14px 0; }

  /* heading */
  .b-heading h2, .b-heading h3 {
    background: linear-gradient(135deg, #ffffff, #fbbf24, #f97316);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 26px 0 10px;
  }
  .b-heading h2 { font-size: 26px; }
  .b-heading h3 { font-size: 20px; }

  /* text */
  .b-text { font-size: 15px; line-height: 1.7; opacity: 0.93; }

  /* image */
  .b-image { text-align: center; }
  .b-image img { max-width: 100%; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .b-image .cap { margin-top: 6px; font-size: 12px; opacity: 0.7; font-style: italic; }

  /* video */
  .b-video iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; }

  /* quiz */
  .b-quiz {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .b-quiz .stem { font-weight: 600; font-size: 15px; line-height: 1.5; margin-bottom: 10px; }
  .b-quiz .opt {
    padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 14px;
    background: rgba(255,255,255,0.05); margin: 6px 0;
    transition: background 0.15s;
  }
  .b-quiz .opt:hover { background: rgba(255,255,255,0.1); }
  .b-quiz .opt.correct { background: rgba(16,185,129,0.25); border-left: 3px solid #10b981; }
  .b-quiz .opt.wrong { background: rgba(239,68,68,0.25); border-left: 3px solid #ef4444; }
  .b-quiz .explain { font-size: 13px; opacity: 0.85; margin-top: 10px; padding: 10px 14px; background: rgba(14,165,233,0.1); border-radius: 8px; display: none; }
  .b-quiz.answered .explain { display: block; }

  /* 3d-model */
  .b-3d {
    background: linear-gradient(135deg, #1e293b, #312e81); border-radius: 12px;
    aspect-ratio: 4/3; max-height: 400px; position: relative; overflow: hidden;
    border: 1px solid var(--border);
  }
  .b-3d canvas { width: 100% !important; height: 100% !important; }
  .b-3d .cap {
    position: absolute; left: 12px; bottom: 10px; font-size: 12px;
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px;
  }

  /* AI tutor / character / patient / negotiation — CTA card */
  .cta {
    background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(249,115,22,0.1));
    border: 1px solid rgba(251,191,36,0.4);
    border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: center;
    cursor: pointer; transition: transform 0.15s, border-color 0.15s;
  }
  .cta:hover { transform: translateY(-2px); border-color: var(--accent); }
  .cta .ico { font-size: 38px; }
  .cta h3 { margin: 0 0 4px; font-size: 16px; }
  .cta p { margin: 0; font-size: 13px; opacity: 0.85; }
  .cta .arrow { margin-left: auto; font-size: 22px; opacity: 0.6; }

  /* link */
  .b-link {
    display: inline-flex; gap: 8px; align-items: center;
    padding: 8px 14px; background: rgba(14,165,233,0.15); border: 1px solid rgba(14,165,233,0.3);
    border-radius: 999px; color: #7dd3fc; text-decoration: none;
  }
  .b-link:hover { background: rgba(14,165,233,0.25); }

  /* callout */
  .b-callout {
    border-left: 4px solid; padding: 12px 16px; border-radius: 8px;
    font-size: 14px; line-height: 1.6;
  }
  .b-callout.info { border-color: #0ea5e9; background: rgba(14,165,233,0.1); }
  .b-callout.warn { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
  .b-callout.tip { border-color: #10b981; background: rgba(16,185,129,0.1); }
  .b-callout.danger { border-color: #ef4444; background: rgba(239,68,68,0.1); }

  /* divider */
  .b-divider { border-top: 1px solid var(--border); margin: 24px 0; }

  .end {
    margin: 40px auto 0; max-width: 600px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; text-align: center;
  }
  .end h3 { margin: 0 0 10px; }
  .end button {
    padding: 10px 18px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    font-weight: 700; cursor: pointer; margin: 4px;
  }

  /* comments */
  .comments {
    max-width: 800px; margin: 30px auto 0;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  }
  .comments h3 { margin: 0 0 12px; font-size: 15px; }
  .comments .item {
    border-left: 3px solid var(--info); padding: 8px 12px; margin: 8px 0;
    background: rgba(255,255,255,0.04); border-radius: 8px;
  }
  .comments .item .author { font-weight: 600; font-size: 12px; color: #7dd3fc; }
  .comments .item .text { font-size: 13px; opacity: 0.9; line-height: 1.5; margin-top: 4px; }
  .comments .item .when { font-size: 10px; opacity: 0.5; }
  .comments .new {
    display: flex; gap: 6px; margin-top: 10px; align-items: flex-end;
  }
  .comments input, .comments textarea {
    flex: 1; padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06);
    color: white; font-family: inherit; font-size: 13px;
  }
  .comments button {
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723; font-weight: 700;
  }
</style>
</head>
<body>
<div class="head">
  <a href="./index.html" class="back">←</a>
  <div class="title-area">
    <h1 id="title">Đang tải…</h1>
    <div class="meta" id="meta">—</div>
  </div>
  <div class="actions">
    <button id="like" class="like">❤️ <span id="likes-count">0</span></button>
    <button id="share">🔗 Share</button>
    <a id="edit-link" href="#" style="display:none;">✏️ Sửa</a>
  </div>
</div>

<div class="wrap" id="content">
  <p style="text-align:center;opacity:0.6;padding:60px 20px;">Đang tải bài giảng…</p>
</div>

<div class="end" id="end" style="display:none;">
  <h3>🎉 Bạn đã học hết bài!</h3>
  <p style="opacity:0.85;font-size:14px;line-height:1.5;">Cảm ơn em đã học. Chia sẻ phản hồi để giáo viên cải thiện bài giảng tốt hơn nhé.</p>
  <button onclick="document.getElementById('cmt-input').focus()">💬 Viết phản hồi</button>
  <button onclick="location.href='./marketplace.html'">📚 Xem bài giảng khác</button>
</div>

<div class="comments" id="comments-box" style="display:none;">
  <h3>💬 Phản hồi từ học sinh</h3>
  <div id="comments-list">—</div>
  <div class="new">
    <input id="cmt-name" placeholder="Tên (tuỳ chọn)" style="max-width:160px;" />
    <input id="cmt-input" placeholder="Viết phản hồi…" />
    <button id="cmt-send">Gửi</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const slug = new URLSearchParams(location.search).get('slug') || (location.hash || '').replace('#', '');
const userKey = (() => {
  try {
    let k = localStorage.getItem('player.uid');
    if (!k) { k = 'u-' + Math.random().toString(36).slice(2, 12); localStorage.setItem('player.uid', k); }
    return k;
  } catch { return 'anon'; }
})();

if (!slug) {
  $('content').innerHTML = '<p style="text-align:center;opacity:0.7;padding:60px;">⚠️ Thiếu mã bài. URL phải có ?slug=…</p>';
} else {
  init();
}

async function init() {
  try {
    const res = await fetch('./api/lessons/' + slug);
    if (!res.ok) throw new Error('Bài không tồn tại hoặc đã xoá');
    const lesson = await res.json();
    document.title = 'Tizia · ' + lesson.title;
    $('title').textContent = lesson.title;
    $('meta').textContent =
      (lesson.subject ? lesson.subject + ' · ' : '') +
      (lesson.grade ? 'Lớp ' + lesson.grade + ' · ' : '') +
      (lesson.author ? 'GV: ' + lesson.author + ' · ' : '') +
      lesson.views + ' lượt xem · ' + lesson.likes + ' thích';
    $('likes-count').textContent = lesson.likes;
    $('edit-link').href = './lesson-builder.html?slug=' + lesson.slug;
    $('edit-link').style.display = 'inline-block';
    renderBlocks(lesson.blocks || []);
    $('end').style.display = 'block';
    $('comments-box').style.display = 'block';
    loadComments();
  } catch (e) {
    $('content').innerHTML = '<p style="text-align:center;opacity:0.7;padding:60px;">⚠️ ' + e.message + '</p>';
  }
}

function renderBlocks(blocks) {
  const c = $('content'); c.innerHTML = '';
  blocks.forEach((b, i) => c.appendChild(renderBlock(b, i)));
  // Track view progress for adaptive
  try {
    window.EduAdaptive?.event({
      skill: 'lesson-' + slug, correct: true, domain: 'school', context: slug,
    });
  } catch {}
}

function renderBlock(b, i) {
  const el = document.createElement('div');
  el.className = 'b b-' + b.type;
  switch (b.type) {
    case 'heading':
      el.innerHTML = b.level === 3 ? `<h3>${escape(b.text)}</h3>` : `<h2>${escape(b.text)}</h2>`;
      break;
    case 'text':
      el.textContent = b.text || '';
      break;
    case 'image':
      el.innerHTML = `<img src="${escape(b.url)}" alt="${escape(b.alt)}" loading="lazy" />${b.caption ? `<div class="cap">${escape(b.caption)}</div>` : ''}`;
      break;
    case 'video': {
      let u = b.url || '';
      if (/youtube\.com\/watch\?v=/.test(u)) u = u.replace('watch?v=', 'embed/');
      if (/youtu\.be\//.test(u)) u = u.replace('youtu.be/', 'www.youtube.com/embed/');
      el.innerHTML = `<iframe src="${escape(u)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      break;
    }
    case 'quiz': {
      el.innerHTML = `
        <div class="stem">${escape(b.stem)}</div>
        ${(b.options||[]).map((o, j) => `<div class="opt" data-i="${j}">${String.fromCharCode(65+j)}. ${escape(o)}</div>`).join('')}
        <div class="explain">💡 ${escape(b.explain || '')}</div>
      `;
      el.querySelectorAll('.opt').forEach((opt) => {
        opt.addEventListener('click', () => {
          if (el.classList.contains('answered')) return;
          el.classList.add('answered');
          const chosen = +opt.dataset.i;
          el.querySelectorAll('.opt').forEach((e2, j) => {
            if (j === b.correct) e2.classList.add('correct');
            else if (j === chosen) e2.classList.add('wrong');
          });
          // Push adaptive
          try { window.EduAdaptive?.event({ skill: 'lesson-' + slug + '-q' + i, correct: chosen === b.correct, domain: 'school', context: slug }); } catch {}
        });
      });
      break;
    }
    case '3d-model':
      el.innerHTML = b.caption ? `<div class="cap">${escape(b.caption)}</div>` : '';
      setTimeout(() => mountGlb(el, b.url), 100);
      break;
    case 'ai-tutor':
      el.className = 'b cta';
      el.innerHTML = `<div class="ico">🦉</div>
        <div><h3>Hỏi AI Tutor về bài này</h3><p>${escape(b.prompt || 'Bấm để mở tutor và đặt câu hỏi.')}</p></div>
        <div class="arrow">→</div>`;
      el.addEventListener('click', () => {
        if (window.EduTutor?.open) window.EduTutor.open();
        else alert('AI Tutor chưa sẵn sàng. Tải lại trang nhé.');
      });
      break;
    case 'ai-character':
      el.className = 'b cta';
      el.innerHTML = `<div class="ico">👤</div>
        <div><h3>Gặp danh nhân</h3><p>Bấm để chat với nhân vật ${escape(b.characterId)} (AI đóng vai)</p></div>
        <div class="arrow">→</div>`;
      el.addEventListener('click', () => window.open('./history-vn.html#char=' + b.characterId, '_blank'));
      break;
    case 'patient-sim':
      el.className = 'b cta';
      el.innerHTML = `<div class="ico">🩺</div>
        <div><h3>Mô phỏng bệnh nhân</h3><p>Bấm để thực hành ca lâm sàng ${escape(b.caseId)}</p></div>
        <div class="arrow">→</div>`;
      el.addEventListener('click', () => window.open('./patient-sim.html#case=' + b.caseId, '_blank'));
      break;
    case 'negotiation':
      el.className = 'b cta';
      el.innerHTML = `<div class="ico">🤝</div>
        <div><h3>Mô phỏng đàm phán</h3><p>Bấm để chơi kịch bản ${escape(b.scenarioId)}</p></div>
        <div class="arrow">→</div>`;
      el.addEventListener('click', () => window.open('./negotiation.html#scenario=' + b.scenarioId, '_blank'));
      break;
    case 'link':
      el.innerHTML = `<a class="b-link" href="${escape(b.url)}" target="_blank">🔗 ${escape(b.label || b.url)}</a>`;
      break;
    case 'callout':
      el.className = 'b b-callout ' + (b.kind || 'info');
      el.innerHTML = escape(b.text);
      break;
    case 'divider':
      el.className = 'b-divider';
      break;
    default:
      el.textContent = '[' + b.type + ']';
  }
  return el;
}

function mountGlb(container, url) {
  if (!url) {
    container.innerHTML += '<div style="padding:30px;text-align:center;opacity:0.6;">⚠️ Chưa có URL model</div>';
    return;
  }
  const w = container.clientWidth, h = container.clientHeight || 300;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  container.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  cam.position.set(4, 3, 5);
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dl = new THREE.DirectionalLight(0xfbbf24, 1); dl.position.set(5, 8, 4); scene.add(dl);
  const controls = new OrbitControls(cam, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.5;
  new GLTFLoader().load(url, (g) => {
    const r = g.scene;
    const bbox = new THREE.Box3().setFromObject(r);
    const size = bbox.getSize(new THREE.Vector3()).length() || 1;
    const center = bbox.getCenter(new THREE.Vector3());
    r.position.sub(center); r.scale.setScalar(3 / size);
    scene.add(r);
  }, undefined, () => {
    container.innerHTML += '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fca5a5;">⚠️ Không tải được model</div>';
  });
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, cam); })();
}

// LIKE
$('like').addEventListener('click', async () => {
  const res = await fetch('./api/lessons/' + slug + '/like', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userKey }),
  });
  const data = await res.json();
  $('like').classList.toggle('on', data.liked);
  // Refresh count
  const lr = await fetch('./api/lessons/' + slug).then(r => r.json()).catch(() => null);
  if (lr) $('likes-count').textContent = lr.likes;
});

// SHARE
$('share').addEventListener('click', async () => {
  const url = location.href;
  try {
    if (navigator.share) {
      await navigator.share({ title: $('title').textContent, url });
    } else {
      await navigator.clipboard.writeText(url);
      $('share').textContent = '✓ Đã copy';
      setTimeout(() => $('share').textContent = '🔗 Share', 2000);
    }
  } catch {}
});

// COMMENTS
async function loadComments() {
  try {
    const r = await fetch('./api/lessons/' + slug + '/comments');
    const d = await r.json();
    const list = $('comments-list');
    if (!d.items?.length) {
      list.innerHTML = '<p style="opacity:0.6;font-size:13px;">Chưa có phản hồi nào. Bạn là người đầu tiên?</p>';
      return;
    }
    list.innerHTML = d.items.map(c => `
      <div class="item">
        <div class="author">${escape(c.author || 'Ẩn danh')} <span class="when">· ${timeAgo(c.created_at)}</span></div>
        <div class="text">${escape(c.text)}</div>
      </div>
    `).join('');
  } catch {}
}
$('cmt-send').addEventListener('click', async () => {
  const text = $('cmt-input').value.trim();
  if (!text) return;
  const author = $('cmt-name').value.trim() || 'Ẩn danh';
  await fetch('./api/lessons/' + slug + '/comments', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ author, text }),
  });
  $('cmt-input').value = '';
  loadComments();
});

function escape(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function timeAgo(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'p';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}
</script>
<script src="./js/pwa-register.js" defer></script>
<script src="./js/tutor-floating.js" data-domain="school" defer></script>
<script src="./js/adaptive-bridge.js" type="module"></script>
<script src="./js/orchestrate-bridge.js" defer></script>
</body>
