<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tizia · Hỗ trợ thiết bị</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
    color: white; padding: 32px 20px;
  }
  body > header:not(#auth-header) { max-width: 1100px; margin: 0 auto 24px; }
  h1 { font-size: 34px; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sub { opacity: 0.75; font-size: 14px; }
  a.back { color: white; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; margin-left: auto; }
  a.back:hover { background: rgba(255,255,255,0.25); }

  .capabilities {
    max-width:none; margin: 0 auto 28px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 18px 20px;
  }
  .capabilities h2 { margin: 0 0 14px; font-size: 16px; opacity: 0.85; }
  .cap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .cap {
    padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,0.25);
    border-left: 4px solid #475569;
  }
  .cap.ok { border-left-color: #10b981; background: rgba(16,185,129,0.1); }
  .cap.no { border-left-color: #ef4444; background: rgba(239,68,68,0.1); }
  .cap.warn { border-left-color: #f59e0b; background: rgba(245,158,11,0.1); }
  .cap .label { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .cap .val { font-size: 15px; font-weight: 700; }

  .devices {
    max-width:none; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px;
  }
  .device {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column;
    transition: transform 0.2s;
  }
  .device:hover { transform: translateY(-3px); background: rgba(255,255,255,0.13); }
  .device h3 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .device .vendor { font-size: 12px; opacity: 0.65; margin-bottom: 12px; }
  .device .status {
    display: inline-block; padding: 3px 9px; border-radius: 10px; font-size: 11px;
    font-weight: 700; margin-bottom: 10px; letter-spacing: 0.3px; text-transform: uppercase;
  }
  .status.full { background: #10b981; color: white; }
  .status.partial { background: #f59e0b; color: white; }
  .status.none { background: #6b7280; color: white; }
  .device ul { padding-left: 18px; margin: 8px 0 14px; font-size: 13px; line-height: 1.7; opacity: 0.9; }
  .device .rec { background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-top: auto; }
  .device .rec b { color: #fbbf24; }
  .modes-row { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
  .modes-row span {
    font-size: 10px; padding: 2px 8px; border-radius: 8px;
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9);
  }
  .modes-row span.no { opacity: 0.35; text-decoration: line-through; }

  footer { max-width: 1100px; margin: 32px auto 0; opacity: 0.7; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>📱 Hỗ trợ thiết bị <a class="back" href="./">← Trang chính</a></h1>
  <div class="sub">Tizia chạy trên đa thiết bị — đây là khả năng đã được phát hiện trên thiết bị hiện tại + hướng dẫn cho từng loại</div>
</header>

<div class="capabilities">
  <h2>🔍 Phát hiện trên thiết bị này</h2>
  <div class="cap-grid" id="cap-grid">đang dò...</div>
</div>

<div class="devices" id="devices"></div>

<script type="module">
const caps = {};

async function detect() {
  caps.touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  caps.webgl = !!document.createElement('canvas').getContext('webgl');
  caps.webaudio = !!(window.AudioContext || window.webkitAudioContext);
  caps.webspeech = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
  caps.getUserMedia = !!(navigator.mediaDevices?.getUserMedia);
  caps.https = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  // WebXR
  caps.xr = !!navigator.xr;
  caps.xrVR = false; caps.xrAR = false; caps.xrHand = false;
  if (navigator.xr) {
    try { caps.xrVR = await navigator.xr.isSessionSupported('immersive-vr'); } catch {}
    try { caps.xrAR = await navigator.xr.isSessionSupported('immersive-ar'); } catch {}
    // Hand tracking: we assume YES if XR is present (actual confirmation needs session)
    caps.xrHand = caps.xrVR;
  }
  caps.ua = navigator.userAgent;

  const items = [
    { key: 'touch',        ok: caps.touch,        label: '👆 Cảm ứng',       desc: caps.touch ? 'Có' : 'Không (chuột)' },
    { key: 'getUserMedia', ok: caps.getUserMedia, label: '📷 Camera',        desc: caps.getUserMedia ? 'API có' : 'Không' },
    { key: 'webgl',        ok: caps.webgl,        label: '🎨 WebGL',         desc: caps.webgl ? 'Có (3D OK)' : 'Không' },
    { key: 'xrVR',         ok: caps.xrVR,         label: '🥽 WebXR VR',      desc: caps.xrVR ? 'Hỗ trợ ✓' : 'Không' },
    { key: 'xrAR',         ok: caps.xrAR,         label: '📲 WebXR AR',      desc: caps.xrAR ? 'Hỗ trợ ✓' : 'Không' },
    { key: 'webaudio',     ok: caps.webaudio,     label: '🔊 WebAudio',      desc: caps.webaudio ? 'SFX OK' : 'Im lặng' },
    { key: 'webspeech',    ok: caps.webspeech,    label: '🎤 Speech API',    desc: caps.webspeech ? 'Có' : 'Không' },
    { key: 'https',        ok: caps.https,        label: '🔒 HTTPS',         desc: caps.https ? 'Bảo mật ✓' : 'HTTP (webcam có thể chặn)', warn: !caps.https },
  ];
  const grid = document.getElementById('cap-grid');
  grid.innerHTML = items.map(i => `
    <div class="cap ${i.warn ? 'warn' : (i.ok ? 'ok' : 'no')}">
      <div class="label">${i.label}</div>
      <div class="val">${i.desc}</div>
    </div>
  `).join('');
}

const DEVICES = [
  {
    name: 'Meta Quest 2 / 3 / Pro', vendor: 'Meta · WebXR + Hand Tracking',
    icon: '🥽', status: 'full',
    works: ['3D Realistic với hand tracking native', 'Metaverse 3D multi-user', '2D Arcade qua trình duyệt'],
    rec: 'Mở <b>Meta Quest Browser</b> → <code>http://&lt;host&gt;:8041/3d-shelf.html</code> → bấm <b>ENTER VR</b> → giơ tay pinch ngón cái+trỏ',
    modes: ['3D ✓', 'Metaverse ✓', '2D ✓', 'AR ✗', 'Quiz ✓'],
  },
  {
    name: 'Apple Vision Pro', vendor: 'Apple · Safari + WebXR',
    icon: '🍎', status: 'partial',
    works: ['3D Realistic (hand tracking qua Safari)', '2D Arcade', 'Quiz'],
    rec: 'Mở <b>Safari</b> trên visionOS → URL trang → <b>ENTER VR</b>. WebXR hỗ trợ một phần; có thể fallback chuột-trỏ.',
    modes: ['3D ✓', 'Metaverse ✓', '2D ✓', 'AR ⚠️', 'Quiz ✓'],
  },
  {
    name: 'Android XR (Samsung HMD)', vendor: 'Google · Android XR 2025+',
    icon: '🤖', status: 'full',
    works: ['Tất cả mode 3D + hand tracking', 'Metaverse multi-user', 'AR mode (nếu thiết bị hỗ trợ)'],
    rec: 'Mở <b>Chrome trên Android XR</b> → URL → <b>ENTER VR</b>. WebXR + hand tracking đầy đủ.',
    modes: ['3D ✓', 'Metaverse ✓', '2D ✓', 'AR ✓', 'Quiz ✓'],
  },
  {
    name: 'Phone (Android/iOS) — AR', vendor: 'Chrome ARCore / Safari ARKit',
    icon: '📱', status: 'partial',
    works: ['2D Arcade với chuột/touch', 'Quiz (rất phù hợp)', 'AR mode khi có WebXR AR'],
    rec: 'Mở Chrome (Android) hoặc Safari (iOS) → bấm <b>2D Arcade</b> chế độ <b>chuột/chạm</b>, hoặc <b>Quiz</b> để học từ vựng phân loại.',
    modes: ['3D ⚠️', 'Metaverse ✓', '2D ✓', 'AR ⚠️', 'Quiz ✓'],
  },
  {
    name: 'Desktop + Webcam', vendor: 'Chrome / Edge — MediaPipe',
    icon: '💻', status: 'full',
    works: ['Mọi mode với MediaPipe pinch (webcam)', 'Hoặc chuột nếu không có webcam', 'Dashboard giảng viên'],
    rec: 'Trình duyệt hiện đại + webcam. Mở bất kỳ mode nào → <b>Bật điều khiển tay</b>.',
    modes: ['3D ✓', 'Metaverse ✓', '2D ✓', 'AR ✗', 'Quiz ✓'],
  },
  {
    name: 'Tablet (iPad / Android tablet)', vendor: 'Touch + Safari/Chrome',
    icon: '🖥️', status: 'partial',
    works: ['2D Arcade kéo-thả bằng tay', 'Quiz nhanh', 'Metaverse với touch'],
    rec: 'Phù hợp cho <b>lớp học</b> — không cần webcam. Mở 2D Arcade → "🖱️ Chơi bằng chuột".',
    modes: ['3D ⚠️', 'Metaverse ✓', '2D ✓', 'AR ⚠️', 'Quiz ✓'],
  },
  {
    name: 'Ray-Ban Meta Smart Glasses', vendor: 'Meta · không có màn hình',
    icon: '🕶️', status: 'none',
    works: ['Không hỗ trợ — kính chỉ có camera + loa, không có màn hình hiển thị web'],
    rec: 'Dùng <b>điện thoại Meta View app</b> để xem nội dung; hoặc kết hợp glass camera với 2D Arcade trên máy khác (sắp có).',
    modes: ['3D ✗', 'Metaverse ✗', '2D ✗', 'AR ✗', 'Quiz ✗'],
  },
  {
    name: 'Google Glass Enterprise', vendor: 'Google · màn hình rất nhỏ',
    icon: '👓', status: 'partial',
    works: ['Quiz mode (text-only) — phù hợp xem nhanh', 'Khó tương tác chính xác'],
    rec: 'Mở Quiz qua trình duyệt nhúng. Tương tác bằng touch pad của kính.',
    modes: ['3D ✗', 'Metaverse ✗', '2D ⚠️', 'AR ✗', 'Quiz ⚠️'],
  },
];

function renderDevices() {
  const cont = document.getElementById('devices');
  cont.innerHTML = DEVICES.map(d => `
    <div class="device">
      <h3>${d.icon} ${d.name}</h3>
      <div class="vendor">${d.vendor}</div>
      <span class="status ${d.status}">${
        d.status === 'full' ? '✓ Hỗ trợ đầy đủ' :
        d.status === 'partial' ? '⚠️ Một phần' : '✗ Không phù hợp'
      }</span>
      <div class="modes-row">${d.modes.map(m => {
        const bad = m.includes('✗');
        return `<span class="${bad ? 'no' : ''}">${m}</span>`;
      }).join('')}</div>
      <ul>${d.works.map(w => `<li>${w}</li>`).join('')}</ul>
      <div class="rec">💡 ${d.rec}</div>
    </div>
  `).join('');
}

detect();
renderDevices();
</script>
</body>
</html>
