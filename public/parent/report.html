<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>📄 Báo cáo tuần · Tizia</title>
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#f8fafc; --bg-2:#fff; --card:#fff;
    --border:#e2e8f0; --text:#0f172a; --text-soft:#64748b;
    --accent:#fbbf24; --good:#16a34a; --bad:#dc2626; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text); background:var(--bg);
  }
  a { color:inherit; }
  .toolbar {
    position:sticky; top:0; z-index:20; background:#fff;
    padding:12px 18px; border-bottom:1px solid var(--border);
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .toolbar .back { text-decoration:none; padding:7px 14px; border-radius:14px;
    background:#f1f5f9; font-size:13px; font-weight:600; color:#0f172a; }
  .toolbar select { padding:6px 12px; border-radius:10px; border:1px solid var(--border); font-family:inherit; font-size:13px; }
  .toolbar h1 { margin:0; font-size:17px; }
  .toolbar .print { margin-left:auto; padding:8px 18px; border-radius:12px;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    border:none; cursor:pointer; font:800 13px 'Inter', system-ui, sans-serif;
    box-shadow:0 4px 12px rgba(251,146,60,.25); }
  .toolbar .print:hover { transform:translateY(-1px); }

  .report {
    max-width:820px; margin:24px auto; padding:32px;
    background:#fff; border-radius:18px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
  }
  .report .head {
    display:flex; gap:16px; align-items:center; flex-wrap:wrap;
    margin-bottom:24px; padding-bottom:18px;
    border-bottom:2px solid var(--accent);
  }
  .report .head .logo {
    width:60px; height:60px; border-radius:14px;
    background:linear-gradient(135deg, var(--accent), #f97316);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; color:#fff;
  }
  .report .head .meta { flex:1; min-width:200px; }
  .report .head .meta h2 { margin:0 0 4px; font-size:20px;
    background:linear-gradient(135deg, #f59e0b, #ec4899);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .report .head .meta .sub { font-size:13px; color:var(--text-soft); }
  .report .head .child {
    text-align:right; padding:8px 16px; border-radius:12px;
    background:#fef3c7; border:1px solid #fcd34d;
  }
  .report .head .child .nm { font-weight:800; font-size:14px; }
  .report .head .child .lbl { font-size:11px; color:#92400e; }

  section { margin-bottom:24px; }
  section h3 {
    font-size:13px; letter-spacing:.6px; text-transform:uppercase;
    color:var(--text-soft); margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  section h3 .ic { font-size:18px; }

  .stats-grid {
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
  }
  .stat {
    background:#f8fafc; border:1px solid var(--border);
    border-radius:12px; padding:14px; text-align:center;
  }
  .stat .v { font-size:22px; font-weight:800; color:var(--accent); }
  .stat.good .v { color:var(--good); }
  .stat.bad .v { color:var(--bad); }
  .stat.purple .v { color:var(--purple); }
  .stat .l { font-size:11.5px; color:var(--text-soft); margin-top:4px; }

  .activity-table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .activity-table th, .activity-table td {
    padding:9px 12px; text-align:left; border-bottom:1px solid var(--border);
  }
  .activity-table th { font-size:11.5px; letter-spacing:.5px; text-transform:uppercase;
    color:var(--text-soft); background:#f8fafc; }
  .activity-table td.right { text-align:right; font-weight:700; color:var(--accent); }

  .new-skills { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .new-skills .chip {
    padding:4px 12px; border-radius:14px;
    background:#dbeafe; color:#1d4ed8; font-size:12px; font-weight:600;
  }

  .top-comp-row {
    display:flex; align-items:center; gap:10px;
    padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .top-comp-row:last-child { border-bottom:none; }
  .top-comp-row .nm { flex:1; }
  .top-comp-row .bar { width:120px; height:6px; background:#e2e8f0; border-radius:4px; overflow:hidden; }
  .top-comp-row .bar i { display:block; height:100%; background:linear-gradient(90deg, #a78bfa, #ec4899); }
  .top-comp-row .pct { width:50px; text-align:right; color:var(--purple); font-weight:700; }

  .tips {
    background:linear-gradient(135deg, #fef3c7, #fed7aa);
    border-radius:14px; padding:16px 20px;
  }
  .tips h3 { margin-top:0; color:#9a3412; }
  .tips ul { margin:0; padding-left:20px; font-size:13.5px; line-height:1.7; color:#7c2d12; }

  .signoff {
    text-align:center; margin-top:30px; padding-top:18px;
    border-top:1px solid var(--border); font-size:12px; color:var(--text-soft);
  }
  .signoff b { color:var(--accent); }

  /* Print styles */
  @media print {
    .toolbar { display:none; }
    body { background:#fff; }
    .report { max-width:none; box-shadow:none; margin:0; padding:18mm; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a class="back" href="/parent/dashboard.html">← Dashboard</a>
  <h1>📄 Báo cáo tuần</h1>
  <select id="child-sel"></select>
  <select id="week-sel"></select>
  <button class="print" onclick="window.print()">🖨 In / Lưu PDF</button>
</div>

<div class="report" id="report">
  <div style="text-align:center;padding:40px;color:var(--text-soft)">Đang tải…</div>
</div>

<script type="module">
let children = [];

async function init() {
  try {
    const [dash, weeks] = await Promise.all([
      fetch('/api/parent/dashboard', { credentials:'same-origin' }).then(r => r.json()),
      fetch('/api/parent/report/weeks', { credentials:'same-origin' }).then(r => r.json()),
    ]);
    children = dash.children || [];
    const sel = document.getElementById('child-sel');
    if (children.length === 0) {
      document.getElementById('report').innerHTML = `<div style="text-align:center;padding:40px">
        <p>Chưa có con nào được liên kết.</p>
        <a href="/family.html" style="padding:10px 22px;background:var(--accent);color:#1e293b;border-radius:12px;font-weight:700;text-decoration:none;display:inline-block">+ Liên kết con</a>
      </div>`;
      return;
    }
    sel.innerHTML = children.map(c => `<option value="${c.id}">${esc(c.display_name || c.username)}</option>`).join('');
    document.getElementById('week-sel').innerHTML = (weeks.weeks || []).map(w =>
      `<option value="${w.week_start}">${esc(w.label)} (${esc(w.week_start)})</option>`
    ).join('');
    sel.addEventListener('change', load);
    document.getElementById('week-sel').addEventListener('change', load);
    await load();
  } catch (e) {
    document.getElementById('report').innerHTML = `<p style="color:var(--bad);text-align:center">Lỗi: ${e.message}</p>`;
  }
}

async function load() {
  const cid = document.getElementById('child-sel').value;
  const week = document.getElementById('week-sel').value;
  try {
    const r = await fetch(`/api/parent/report/${cid}?week=${encodeURIComponent(week)}`, { credentials:'same-origin' });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    render(data.report);
  } catch (e) {
    document.getElementById('report').innerHTML = `<p style="color:var(--bad)">Lỗi: ${e.message}</p>`;
  }
}

function render(R) {
  document.getElementById('report').innerHTML = `
    <div class="head">
      <div class="logo">🦉</div>
      <div class="meta">
        <h2>Báo cáo tuần Tizia</h2>
        <div class="sub">Từ ${esc(R.week.start)} đến ${esc(R.week.end)}</div>
      </div>
      <div class="child">
        <div class="lbl">Học sinh</div>
        <div class="nm">${esc(R.child.name || R.child.username)}</div>
      </div>
    </div>

    <section>
      <h3><span class="ic">🔥</span> Engagement tuần</h3>
      <div class="stats-grid">
        <div class="stat good"><div class="v">🔥 ${R.engagement?.streak ?? 0}</div><div class="l">Streak ngày</div></div>
        <div class="stat"><div class="v">${R.engagement?.longest ?? 0}</div><div class="l">Streak kỷ lục</div></div>
        <div class="stat purple"><div class="v">${R.league?.tier?.icon ?? '🏅'}</div><div class="l">${esc(R.league?.tier?.label || 'Chưa xếp hạng')}</div></div>
        <div class="stat"><div class="v">${R.league?.week_xp ?? 0}</div><div class="l">XP tuần · Hạng ${R.league?.my_rank ?? '-'}</div></div>
      </div>
    </section>

    <section>
      <h3><span class="ic">📚</span> Hoạt động học tập</h3>
      <table class="activity-table">
        <thead><tr><th>Loại</th><th class="right">Số lượng</th><th class="right">Kết quả</th></tr></thead>
        <tbody>
          <tr><td>📝 Trắc nghiệm</td><td class="right">${R.activity.quiz_attempts}</td><td class="right">${R.activity.quiz_correct} đúng (${R.activity.quiz_accuracy}%)</td></tr>
          <tr><td>🎮 Mini-game (scenario)</td><td class="right">${R.activity.scenarios}</td><td class="right">TB ${R.activity.scenarios_avg_score}/100</td></tr>
          <tr><td>💻 Codelab (lập trình)</td><td class="right">${R.activity.codelab_submissions}</td><td class="right">${R.activity.codelab_accepted} accepted</td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <h3><span class="ic">🎯</span> Năng lực GDPT 2018</h3>
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
        <div class="stat"><div class="v">${R.skills.earned}/${R.skills.total}</div><div class="l">Tổng kỹ năng</div></div>
        <div class="stat purple"><div class="v">${R.skills.overall_mastery_pct}%</div><div class="l">Mastery tổng</div></div>
        <div class="stat good"><div class="v">+${R.skills.new_this_week.length}</div><div class="l">Đạt mới tuần này</div></div>
      </div>
      ${R.skills.new_this_week.length > 0 ? `
        <div class="new-skills">${R.skills.new_this_week.map(n => `<span class="chip">✓ ${esc(n)}</span>`).join('')}</div>
      ` : ''}
      <div style="margin-top:16px">
        ${R.skills.top_comp.map(c => `
          <div class="top-comp-row">
            <span class="nm">${esc(c.name)}</span>
            <span style="font-size:11px;color:var(--text-soft)">${c.earned}/${c.total}</span>
            <span class="bar"><i style="width:${c.mastery}%"></i></span>
            <span class="pct">${c.mastery}%</span>
          </div>
        `).join('')}
      </div>
    </section>

    <section>
      <div class="tips">
        <h3 style="text-transform:none;letter-spacing:0;color:#9a3412;font-size:14px;margin-bottom:8px">
          💡 Nhận xét & gợi ý cho phụ huynh
        </h3>
        <ul>${R.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      </div>
    </section>

    <div class="signoff">
      Báo cáo được tạo bởi <b>Tizia</b> · ${new Date(Date.now() + 7*3600_000).toISOString().slice(0,10)}<br>
      Vũ trụ giáo dục ảo, tizia.vn
    </div>
  `;
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
init();
</script>
</body>
</html>
