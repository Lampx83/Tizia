<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>⚔ Trận đấu kiến thức · Tizia</title>
<meta name="description" content="Hạ boss bằng câu trả lời đúng — combat-by-quiz Tizia. Mỗi boss thử thách 1 chủ đề + drop coin/XP/skin." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a; --card-2:#1d2547;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 20% 0%, rgba(239,68,68,.10), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(251,191,36,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }

  .wrap { max-width:none; margin:0 auto; padding:24px 18px 80px; }

  .intro { text-align:center; padding:30px 16px 18px; max-width:600px; margin:0 auto; }
  .intro h2 { font-size:24px; margin:0 0 6px;
    background: linear-gradient(135deg, #fbbf24, #ef4444);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .intro p { font-size:14px; color:var(--text-soft); margin:0; }

  .boss-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:16px; margin-top:24px; }
  .boss { background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px; text-align:center; cursor:pointer;
    transition:transform .15s, border-color .15s, box-shadow .15s; }
  .boss:hover { transform:translateY(-3px); border-color:var(--bad);
    box-shadow:0 12px 30px rgba(239,68,68,.18); }
  .boss .emo { font-size:64px; line-height:1; margin-bottom:8px; display:block;
    animation:tz-boss-float 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 14px rgba(239,68,68,.4)); }
  .boss .name { font-size:17px; font-weight:800; margin-bottom:4px; }
  .boss .subj { font-size:12px; color:var(--text-soft); margin-bottom:10px; }
  .boss .stats { display:flex; justify-content:space-around; padding-top:10px;
    border-top:1px solid var(--border); font-size:12px; color:var(--text-soft); }
  .boss .stats b { color:var(--accent); font-size:14px; }
  .boss .difficulty { display:inline-block; padding:3px 10px; border-radius:999px;
    background:rgba(239,68,68,.10); color:#fca5a5; font-size:11px;
    font-weight:700; margin-bottom:8px; }

  @keyframes tz-boss-float {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-8px); }
  }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>⚔ Trận đấu kiến thức</h1>
</div>

<div class="wrap">
  <div class="intro">
    <h2>Hạ boss bằng câu trả lời đúng!</h2>
    <p>Mỗi boss = 1 chủ đề. Trả lời đúng → boss mất HP. Sai → em mất hearts. Drop coin/XP/skin khi thắng.</p>
  </div>
  <div class="boss-grid" id="boss-grid">
    <div style="text-align:center;color:var(--text-soft);padding:40px;grid-column:1/-1">Đang tải danh sách boss…</div>
  </div>
</div>

<script type="module">
import './js/combat-by-quiz.js?v=2026-06-07';

// Boss catalog — chia theo môn (subjectId rỗng = random)
const BOSSES = [
  { emo:'🧮', name:'Hắc Toán Sư', subj:'Toán học', hp:5, difficulty:'Dễ',  rewardCoin:50, rewardXp:80, subjectId:'' },
  { emo:'🐉', name:'Long Văn Đế', subj:'Ngữ Văn', hp:5, difficulty:'Dễ',  rewardCoin:50, rewardXp:80, subjectId:'' },
  { emo:'🦇', name:'Vampire Anh', subj:'Tiếng Anh', hp:6, difficulty:'TB',  rewardCoin:60, rewardXp:100, subjectId:'' },
  { emo:'🔮', name:'Phù thủy Khoa học', subj:'KHTN', hp:6, difficulty:'TB', rewardCoin:60, rewardXp:100, subjectId:'' },
  { emo:'👹', name:'Quỷ Sử Địa', subj:'Sử – Địa', hp:7, difficulty:'Khó', rewardCoin:80, rewardXp:140, subjectId:'' },
  { emo:'🤖', name:'AI Tin học', subj:'Tin học', hp:7, difficulty:'Khó', rewardCoin:80, rewardXp:140, subjectId:'' },
  { emo:'👻', name:'Hồn ma Lập trình', subj:'Lập trình', hp:8, difficulty:'Cao thủ', rewardCoin:120, rewardXp:200, subjectId:'' },
  { emo:'🐲', name:'Tổ phụ Knowledge', subj:'Tổng hợp', hp:10, difficulty:'Boss cuối', rewardCoin:200, rewardXp:300, subjectId:'' },
];

function render() {
  const grid = document.getElementById('boss-grid');
  grid.innerHTML = BOSSES.map((b, i) => `
    <div class="boss" data-i="${i}">
      <span class="emo">${b.emo}</span>
      <div class="difficulty">${b.difficulty}</div>
      <div class="name">${b.name}</div>
      <div class="subj">Chủ đề: ${b.subj}</div>
      <div class="stats">
        <div>HP: <b>${b.hp}</b></div>
        <div>+${b.rewardCoin}🪙</div>
        <div>+${b.rewardXp}✨</div>
      </div>
    </div>
  `).join('');
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.boss');
    if (!card) return;
    const b = BOSSES[Number(card.dataset.i)];
    window.tziaCombat?.start({
      bossName: b.name, bossEmoji: b.emo, bossHp: b.hp,
      subjectId: b.subjectId, rewardCoin: b.rewardCoin, rewardXp: b.rewardXp,
    });
  });
}
render();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/onboarding-60s.js?v=2026-06-08-r8"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-10-tl1"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
