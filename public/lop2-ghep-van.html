<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🔤 Ghép vần · Tiếng Việt Lớp 2 · Tizia</title>
<style>
  :root { --bg-1:#fff7ed; --bg-2:#fde68a; --accent:#f97316; --ok:#22c55e; --bad:#ef4444;
    --card:#ffffff; --border:rgba(0,0,0,.08); --ink:#1f2937; --muted:#6b7280; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter','Quicksand',system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(ellipse 90% 50% at 50% 0%, #fde68a, transparent), linear-gradient(180deg,var(--bg-1),#ffe4c4); }
  .top { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.7); position:sticky; top:0; z-index:5; backdrop-filter:blur(8px); }
  .back { color:var(--ink); text-decoration:none; opacity:.85; font-size:14px; background:rgba(0,0,0,.06); padding:8px 14px; border-radius:10px; font-weight:600; }
  .back:hover { background:rgba(0,0,0,.12); }
  .top h1 { margin:0; font-size:18px; font-weight:800; }
  .top .sub { font-size:12.5px; opacity:.6; font-weight:500; }
  .top .right { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:13.5px; }
  .stat { background:white; border:1px solid var(--border); border-radius:14px; padding:7px 13px; font-weight:700; }
  .stat .v { color:var(--accent); font-size:16px; }
  .wrap { max-width:none; margin:0 auto; padding:24px 18px 60px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px 22px 18px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
  .prompt { text-align:center; margin-bottom:18px; }
  .prompt .hint { font-size:13.5px; opacity:.65; margin:0 0 10px; }
  .prompt .target { font-size:46px; font-weight:900; color:var(--accent); letter-spacing:1px; }
  .prompt .meaning { font-size:13.5px; opacity:.75; margin-top:4px; font-style:italic; }
  .built { text-align:center; padding:10px 12px; background:#fef3c7; border:1.5px dashed #fbbf24; border-radius:12px;
    font-size:26px; font-weight:800; letter-spacing:2px; min-height:52px; margin-bottom:18px; color:#92400e; }
  .built .placeholder { color:#d1d5db; font-style:italic; font-weight:600; font-size:18px; letter-spacing:0; }
  .pool { margin-bottom:14px; }
  .pool h3 { font-size:12.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 8px; font-weight:700; }
  .tiles { display:flex; flex-wrap:wrap; gap:8px; }
  .tile { background:white; border:2px solid #e5e7eb; border-radius:11px; padding:11px 18px;
    font-size:20px; font-weight:800; color:#374151; cursor:pointer; transition:.15s; user-select:none;
    min-width:54px; text-align:center; font-family:inherit; }
  .tile:hover { transform:translateY(-2px); border-color:#fbbf24; box-shadow:0 4px 10px rgba(0,0,0,.08); }
  .tile.selected { background:var(--accent); color:white; border-color:var(--accent); transform:scale(1.05); }
  .tile.consumed { opacity:.3; pointer-events:none; }
  .row { display:flex; gap:10px; margin-top:14px; justify-content:center; flex-wrap:wrap; }
  .btn { border:none; border-radius:11px; font-weight:800; font-size:14px; padding:11px 22px; cursor:pointer; font-family:inherit; }
  .btn.act { background:var(--accent); color:white; box-shadow:0 4px 12px rgba(249,115,22,.35); }
  .btn.act:hover { filter:brightness(1.06); }
  .btn.act:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  .btn.ghost { background:white; color:var(--ink); border:1px solid var(--border); }
  .btn.ghost:hover { background:#f9fafb; }
  .feedback { margin-top:14px; padding:11px 14px; border-radius:11px; font-size:14px; font-weight:600; text-align:center;
    opacity:0; transform:translateY(6px); transition:.2s; }
  .feedback.show { opacity:1; transform:translateY(0); }
  .feedback.ok { background:#dcfce7; color:#166534; border:1px solid #86efac; }
  .feedback.bad { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
  .progress-bar { height:8px; background:rgba(0,0,0,.08); border-radius:4px; overflow:hidden; margin:18px 0 8px; }
  .progress-bar .fill { height:100%; background:linear-gradient(90deg,#f97316,#fbbf24); transition:.3s; }
  .finish { text-align:center; padding:40px 20px; }
  .finish h2 { font-size:32px; margin:0 0 12px; color:var(--accent); }
  .finish .score-big { font-size:60px; font-weight:900; color:var(--ok); margin:14px 0; }
  .finish p { font-size:15px; opacity:.75; }
  .finish .badge { display:inline-block; background:#fef3c7; border:2px solid #fbbf24; padding:11px 18px; border-radius:30px;
    font-weight:700; color:#92400e; margin-top:8px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ok); color:white;
    font-weight:800; padding:13px 24px; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; transition:.3s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:520px) {
    .prompt .target { font-size:36px; }
    .built { font-size:22px; }
    .tile { font-size:18px; padding:9px 14px; }
  }
</style>
</head>
<body>
<script type="module">import { applyViewOnlyGate } from "/js/enrollment.js"; applyViewOnlyGate("primary");</script>
<div class="top">
  <a class="back" id="back" href="/school.html?domain=primary#campus-hero">← Trường Tiểu học</a>
  <div><h1>🔤 Ghép vần <span class="sub">— Tiếng Việt · Lớp 2</span></h1></div>
  <div class="right">
    <div class="stat">Cờ <span class="v" id="round-n">1</span>/<span id="round-tot">10</span></div>
    <div class="stat">Điểm <span class="v" id="score">0</span></div>
  </div>
</div>

<div class="wrap">
  <div class="card" id="game">
    <div class="prompt">
      <p class="hint">Ghép thành tiếng:</p>
      <div class="target" id="target">—</div>
      <div class="meaning" id="meaning"></div>
    </div>
    <div class="built" id="built"><span class="placeholder">bấm 1 âm đầu + 1 vần + 1 dấu thanh…</span></div>
    <div class="pool">
      <h3>🔠 Âm đầu</h3>
      <div class="tiles" id="onsets"></div>
    </div>
    <div class="pool">
      <h3>🎵 Vần</h3>
      <div class="tiles" id="rhymes"></div>
    </div>
    <div class="pool">
      <h3>🎶 Dấu thanh</h3>
      <div class="tiles" id="tones"></div>
    </div>
    <div class="progress-bar"><div class="fill" id="bar"></div></div>
    <div class="feedback" id="fb"></div>
    <div class="row">
      <button class="btn ghost" id="clearBtn">↺ Xoá</button>
      <button class="btn act" id="checkBtn" disabled>✓ Kiểm tra</button>
    </div>
  </div>

  <div class="card finish" id="finish" style="display:none">
    <h2>🎉 Hoàn thành!</h2>
    <div class="score-big" id="finalScore">0/10</div>
    <p id="finalMsg">Em đã ghép vần rất giỏi!</p>
    <div class="row">
      <button class="btn ghost" id="againBtn">🔄 Chơi lại</button>
      <a class="btn act" href="/space.html?domain=primary" style="text-decoration:none;display:inline-block">← Về trường</a>
    </div>
    <div id="badgeBox"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { getPlayerName, submitAttempt } from '/js/api.js';

// ─────────────────────────────────────────────────────────────
// Bộ dữ liệu — 12 tiếng phổ biến lớp 2, mỗi tiếng = âm đầu + vần
// (Không xét dấu thanh — HS chỉ cần ghép đúng âm đầu + vần)
// ─────────────────────────────────────────────────────────────
// 6 dấu thanh tiếng Việt: ngang (không dấu) · huyền · sắc · hỏi · ngã · nặng
const TONES = [
  { id:'ngang', label:'(không dấu)', sym:'a' },
  { id:'huyen', label:'huyền',       sym:'à' },
  { id:'sac',   label:'sắc',         sym:'á' },
  { id:'hoi',   label:'hỏi',         sym:'ả' },
  { id:'nga',   label:'ngã',         sym:'ã' },
  { id:'nang',  label:'nặng',        sym:'ạ' },
];

const ROUNDS = await fetch('/api/content/lop2-ghep-van', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : { items: [] }).then(j => j.items || []).catch(() => []);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 10 vòng/lần chơi (random từ pool 12)
const N_ROUNDS = 10;
let rounds = shuffle(ROUNDS).slice(0, N_ROUNDS);
let idx = 0;
let score = 0;
let selOnset = null, selRhyme = null, selTone = null;
const startTime = Date.now();

const $ = id => document.getElementById(id);
const toneLabel = id => TONES.find(t => t.id === id)?.label || id;

function renderRound() {
  const r = rounds[idx];
  $('target').textContent = r.word;
  $('meaning').textContent = '(' + r.meaning + ')';
  $('round-n').textContent = idx + 1;
  $('round-tot').textContent = N_ROUNDS;
  $('score').textContent = score;
  $('bar').style.width = ((idx / N_ROUNDS) * 100) + '%';

  // tạo phân tâm: 4 âm đầu + 4 vần + 4 dấu thanh (1 đúng + 3 giả)
  const ALL_ONSETS = ['b','m','c','t','s','ch','ng','tr','nh','x','d','l','k','h'];
  const ALL_RHYMES = ['an','eo','a','ay','ach','im','ương','iên','ưa','ai','ong','ung','am','o','u','anh'];
  const onsetPool = shuffle([r.onset, ...shuffle(ALL_ONSETS.filter(x => x !== r.onset)).slice(0, 3)]);
  const rhymePool = shuffle([r.rhyme, ...shuffle(ALL_RHYMES.filter(x => x !== r.rhyme)).slice(0, 3)]);
  // Dấu thanh: 4 lựa chọn (1 đúng + 3 sai), ưu tiên hiển thị "ngang" nếu đúng để bé hiểu "không cần thêm dấu"
  const tonePool = shuffle([r.tone, ...shuffle(TONES.map(t=>t.id).filter(x => x !== r.tone)).slice(0, 3)]);

  $('onsets').innerHTML = onsetPool.map(o => `<button class="tile" data-kind="onset" data-v="${o}">${o}</button>`).join('');
  $('rhymes').innerHTML = rhymePool.map(o => `<button class="tile" data-kind="rhyme" data-v="${o}">${o}</button>`).join('');
  $('tones').innerHTML = tonePool.map(id => {
    const t = TONES.find(x => x.id === id);
    return `<button class="tile" data-kind="tone" data-v="${id}" title="${t.label}">${t.sym} <span style="opacity:.55;font-size:13px;font-weight:600">${t.label}</span></button>`;
  }).join('');

  selOnset = null; selRhyme = null; selTone = null;
  updateBuilt();
  $('fb').className = 'feedback';
  $('checkBtn').disabled = true;

  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', onTile));
}

function onTile(e) {
  const t = e.currentTarget;
  if (t.classList.contains('consumed')) return;
  const kind = t.dataset.kind;
  const v = t.dataset.v;
  // bỏ chọn cũ cùng nhóm
  document.querySelectorAll(`.tile[data-kind="${kind}"]`).forEach(x => x.classList.remove('selected'));
  if (kind === 'onset')      selOnset = (selOnset === v) ? null : v;
  else if (kind === 'rhyme') selRhyme = (selRhyme === v) ? null : v;
  else                       selTone  = (selTone  === v) ? null : v;
  if ((kind === 'onset' && selOnset) || (kind === 'rhyme' && selRhyme) || (kind === 'tone' && selTone)) t.classList.add('selected');
  updateBuilt();
}

function updateBuilt() {
  if (selOnset || selRhyme || selTone) {
    const toneSym = selTone ? TONES.find(t=>t.id===selTone).sym : '_';
    $('built').innerHTML = `<span style="color:#f97316">${selOnset || '_'}</span>
      <span style="opacity:.4">+</span>
      <span style="color:#f97316">${selRhyme || '_'}</span>
      <span style="opacity:.4">+</span>
      <span style="color:#f97316">${toneSym}</span>`;
  } else {
    $('built').innerHTML = '<span class="placeholder">bấm 1 âm đầu + 1 vần + 1 dấu thanh…</span>';
  }
  $('checkBtn').disabled = !(selOnset && selRhyme && selTone);
}

function check() {
  const r = rounds[idx];
  const ok = (selOnset === r.onset && selRhyme === r.rhyme && selTone === r.tone);
  const fb = $('fb');
  if (ok) {
    score++;
    fb.className = 'feedback ok show';
    fb.innerHTML = `✓ Giỏi quá! <b>${r.onset}</b> + <b>${r.rhyme}</b> + dấu <b>${toneLabel(r.tone)}</b> = <b>${r.word}</b>`;
  } else {
    fb.className = 'feedback bad show';
    fb.innerHTML = `Chưa đúng. Đáp án: <b>${r.onset}</b> + <b>${r.rhyme}</b> + dấu <b>${toneLabel(r.tone)}</b> = <b>${r.word}</b>`;
  }
  $('score').textContent = score;
  $('checkBtn').disabled = true;
  document.querySelectorAll('.tile').forEach(t => t.classList.add('consumed'));
  setTimeout(() => {
    idx++;
    if (idx >= N_ROUNDS) finish();
    else renderRound();
  }, ok ? 900 : 1900);
}

function finish() {
  $('game').style.display = 'none';
  $('finish').style.display = 'block';
  $('finalScore').textContent = score + '/' + N_ROUNDS;
  $('bar').style.width = '100%';
  let msg = '', badge = '';
  if (score === N_ROUNDS) { msg = 'Tuyệt vời! Em ghép đúng tất cả!'; badge = '🏆 Bậc thầy ghép vần'; }
  else if (score >= 8)    { msg = 'Em làm rất tốt! Cố thêm chút nữa nhé!'; badge = '⭐ Thợ ghép vần giỏi'; }
  else if (score >= 5)    { msg = 'Khá tốt rồi! Luyện thêm sẽ giỏi nữa.'; badge = '🌱 Đang tiến bộ'; }
  else                    { msg = 'Đừng nản, ghép thêm vài lần nữa em sẽ giỏi!'; }
  $('finalMsg').textContent = msg;
  if (badge) $('badgeBox').innerHTML = `<div class="badge">${badge}</div>`;

  // Lưu attempts để xuất hiện trong leaderboard / hồ sơ học tập
  submitAttempt({
    version: 'lop2-ghep-van',
    player_name: getPlayerName() || 'Ẩn danh',
    score: score * 10,
    correct: score,
    total: N_ROUNDS,
    duration_ms: Date.now() - startTime,
    details: { rounds: rounds.map(r => r.word) },
  }).catch(() => { /* offline OK */ });
}

$('clearBtn').addEventListener('click', () => {
  selOnset = null; selRhyme = null; selTone = null;
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
  updateBuilt();
});
$('checkBtn').addEventListener('click', check);
$('againBtn').addEventListener('click', () => {
  idx = 0; score = 0; rounds = shuffle(ROUNDS).slice(0, N_ROUNDS);
  $('finish').style.display = 'none'; $('game').style.display = 'block';
  $('badgeBox').innerHTML = '';
  renderRound();
});

// đường về theo domain ?
(function(){
  const d = new URLSearchParams(location.search).get('domain');
  if (d) $('back').href = '/space.html?domain=' + encodeURIComponent(d);
})();

renderRound();
</script>
</body>
</html>
