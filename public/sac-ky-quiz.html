<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sắc ký Quiz · 10 câu — Tizia</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #312e81;
    --accent: #a78bfa;
    --ok: #10b981;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; color: white; }
  body {
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(167,139,250,0.25), transparent),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    padding: 16px;
  }
  .container { max-width:none; margin: 0 auto; }
  .topbar {
    display: flex; gap: 12px; align-items: center; padding: 8px 14px;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; margin-bottom: 24px;
    font-size: 13px;
  }
  .topbar a { color: white; opacity: 0.7; text-decoration: none; }
  .stat { display: inline-flex; gap: 6px; align-items: center; }
  .stat b { color: var(--accent); font-weight: 700; }
  .spacer { flex: 1; }
  .progress-bar {
    height: 6px; background: rgba(255,255,255,0.1); border-radius: 4px;
    overflow: hidden; margin-bottom: 20px;
  }
  .progress-bar > div {
    height: 100%; background: linear-gradient(90deg, var(--accent), #ec4899);
    transition: width 0.3s;
  }
  .timer-bar {
    height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px;
    overflow: hidden; margin-bottom: 16px;
  }
  .timer-bar > div { height: 100%; background: var(--ok); transition: width 0.1s linear; }
  .question-card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 24px;
    backdrop-filter: blur(10px);
  }
  .question-card h2 {
    margin: 0 0 6px; font-size: 14px; opacity: 0.6; font-weight: 600;
    letter-spacing: 0.4px; text-transform: uppercase;
  }
  .question-card .q-text {
    font-size: 19px; line-height: 1.5; margin-bottom: 20px; font-weight: 600;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 14px 16px;
    cursor: pointer; transition: all 0.15s;
    font-size: 15px; line-height: 1.4;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .opt:hover { background: rgba(167,139,250,0.18); border-color: var(--accent); }
  .opt.correct { background: rgba(16,185,129,0.25); border-color: var(--ok); }
  .opt.wrong { background: rgba(239,68,68,0.25); border-color: var(--err); }
  .opt.disabled { cursor: not-allowed; pointer-events: none; }
  .opt-letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.1); display: inline-flex;
    align-items: center; justify-content: center; font-weight: 700;
    flex-shrink: 0; font-size: 14px;
  }
  .opt.correct .opt-letter { background: var(--ok); }
  .opt.wrong .opt-letter { background: var(--err); }
  .explain {
    margin-top: 16px; padding: 12px 14px;
    background: rgba(167,139,250,0.12); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 13px; line-height: 1.55;
    display: none;
  }
  .explain.show { display: block; }
  .next-btn {
    margin-top: 16px; width: 100%;
    padding: 12px 18px; border: none;
    background: var(--accent); color: #1f1147;
    border-radius: 10px; font-family: inherit;
    font-weight: 700; font-size: 14px;
    cursor: pointer; opacity: 0;
    transition: opacity 0.2s;
  }
  .next-btn.show { opacity: 1; }
  .streak-flag {
    font-size: 12px; padding: 2px 8px; border-radius: 8px;
    background: linear-gradient(135deg, #f97316, #ef4444);
    margin-left: 6px;
  }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .modal.show { display: flex; }
  .modal-card { background: linear-gradient(135deg, #1e293b, #312e81); border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; border: 1px solid rgba(255,255,255,0.15); }
  .modal h2 { margin: 0 0 12px; font-size: 24px; }
  .modal .score { font-size: 56px; font-weight: 800; text-align: center; color: var(--accent); line-height: 1; margin: 12px 0; }
  .modal .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; justify-content: center; flex-wrap: wrap; }
  .modal-btns button, .modal-btns a { padding: 10px 18px; border-radius: 10px; border: none; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; color: white; text-align: center; }
  .modal-btns .primary { background: var(--accent); color: #1f1147; }
  .modal-btns .outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <a href="sac-ky-vr.html">← Hub Sắc ký</a>
    <span class="stat">📝 <b><span id="qnum">1</span>/10</b></span>
    <span class="stat">🎯 <b id="score">0</b></span>
    <span class="stat" id="streak-wrap" style="display:none">🔥 <b id="streak">0</b></span>
    <span class="spacer"></span>
    <span class="stat">⏱️ <b id="timer">15s</b></span>
  </div>

  <div class="progress-bar"><div id="progress" style="width: 10%"></div></div>
  <div class="timer-bar"><div id="timer-bar" style="width: 100%"></div></div>

  <div class="question-card">
    <h2 id="q-cat">Định nghĩa</h2>
    <div class="q-text" id="q-text">Đang tải...</div>
    <div class="options" id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next-btn" id="next-btn">Câu tiếp →</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modal-title">🎉 Hoàn thành Quiz</h2>
    <div class="score" id="modal-score">0</div>
    <div id="modal-details"></div>
    <div class="modal-btns">
      <button class="primary" id="modal-replay">↺ Chơi lại</button>
      <a class="outline" href="sac-ky-vr.html">← Hub</a>
      <a class="outline" href="index.html">🏠 Trang chính</a>
    </div>
  </div>
</div>

<script type="module">
import { submitAttempt } from './js/api.js';

const QUESTIONS = [
  {
    cat: 'Định nghĩa',
    q: 'Sắc ký lớp mỏng (TLC) là kỹ thuật phân tích dùng để làm gì?',
    options: [
      'Tách và định tính các thành phần trong hỗn hợp',
      'Đo nồng độ chất bằng quang phổ',
      'Pha chế thuốc theo công thức',
      'Khử trùng dụng cụ thí nghiệm',
    ],
    correct: 0,
    explain: 'TLC = Thin Layer Chromatography — tách các hợp chất dựa vào sự khác biệt về ái lực với pha tĩnh (silica) và pha động (dung môi).',
  },
  {
    cat: 'Vật liệu',
    q: 'Pha tĩnh phổ biến nhất trong TLC là gì?',
    options: [
      'Silica gel (silic dioxide)',
      'Than hoạt tính',
      'Polyethylene',
      'Đường lactose',
    ],
    correct: 0,
    explain: 'Silica gel được phủ lên bản mỏng nhôm/thủy tinh, là pha tĩnh phổ biến nhờ tính phân cực cao.',
  },
  {
    cat: 'Công thức Rf',
    q: 'Hệ số Rf được tính bằng công thức nào?',
    options: [
      'Rf = quãng đường vệt mẫu / quãng đường dung môi',
      'Rf = quãng đường dung môi / quãng đường vệt mẫu',
      'Rf = khối lượng mẫu / thể tích dung môi',
      'Rf = thời gian × tốc độ dung môi',
    ],
    correct: 0,
    explain: 'Rf (Retention factor) = khoảng cách vệt mẫu di chuyển ÷ khoảng cách dung môi di chuyển. Giá trị nằm trong khoảng 0–1.',
  },
  {
    cat: 'Quy trình',
    q: 'Bước đầu tiên trong quy trình TLC là gì?',
    options: [
      'Vạch đường gốc trên bản mỏng',
      'Pha pha động trong bình triển khai',
      'Soi đèn UV',
      'Cắt bản mỏng',
    ],
    correct: 0,
    explain: 'Vạch đường gốc nhẹ bằng bút chì cách mép dưới ~1cm. Đây là nơi sẽ chấm mẫu — KHÔNG vẽ bằng bút bi vì mực sẽ chạy theo dung môi.',
  },
  {
    cat: 'Chấm mẫu',
    q: 'Khi chấm mẫu, vệt chấm KHÔNG được vượt quá bao nhiêu mm đường kính?',
    options: [
      '2–3 mm',
      '10 mm',
      '20 mm',
      'Càng to càng dễ thấy',
    ],
    correct: 0,
    explain: 'Vệt chấm phải nhỏ (≤3mm) — chấm to sẽ làm vệt khi tách bị loang, khó đọc Rf chính xác.',
  },
  {
    cat: 'Pha động',
    q: 'Vì sao bình triển khai phải đậy nắp kín?',
    options: [
      'Để hơi dung môi bão hoà, đảm bảo Rf ổn định',
      'Để giữ ấm cho dung môi',
      'Để tránh côn trùng vào',
      'Để giảm tiếng ồn',
    ],
    correct: 0,
    explain: 'Hơi dung môi bão hoà giúp pha động di chuyển đều, tránh "edge effect" làm vệt biến dạng và Rf sai lệch.',
  },
  {
    cat: 'Triển khai',
    q: 'Đường gốc của bản mỏng phải ở vị trí nào so với mặt dung môi trong bình?',
    options: [
      'CAO HƠN mặt dung môi (cách mép dưới ~1cm)',
      'NGANG mặt dung môi',
      'CHÌM trong dung môi',
      'Bất kỳ vị trí nào',
    ],
    correct: 0,
    explain: 'Nếu đường gốc chìm trong dung môi, mẫu sẽ tan ra hết — không chạy lên được. Phải đặt cao hơn mặt dung môi.',
  },
  {
    cat: 'Quan sát',
    q: 'Khi quan sát kết quả TLC, dùng đèn UV bước sóng nào để soi?',
    options: [
      '254 nm hoặc 365 nm',
      '100 nm',
      '500 nm',
      '700 nm (ánh sáng đỏ)',
    ],
    correct: 0,
    explain: 'UV 254nm phát hiện các chất hấp thụ UV (vệt tối trên nền huỳnh quang). UV 365nm phát hiện chất phát huỳnh quang.',
  },
  {
    cat: 'Đọc kết quả',
    q: 'Hai chất có Rf bằng nhau trong cùng hệ dung môi có nghĩa là gì?',
    options: [
      'Có khả năng cùng một chất — nhưng cần kiểm chứng thêm',
      'Chắc chắn là cùng một chất',
      'Hai chất khác nhau hoàn toàn',
      'Cần đổi dung môi',
    ],
    correct: 0,
    explain: 'Rf giống nhau là dấu hiệu cùng chất, nhưng KHÔNG đủ để khẳng định. Phải kiểm chứng thêm bằng phổ MS, NMR hoặc TLC ở hệ dung môi khác.',
  },
  {
    cat: 'Ứng dụng Dược',
    q: 'TLC trong kiểm nghiệm dược phẩm dùng để làm gì? (chọn câu đầy đủ nhất)',
    options: [
      'Định tính, kiểm tra tinh khiết, theo dõi phản ứng',
      'Chỉ định lượng hoạt chất',
      'Chỉ pha chế dược phẩm',
      'Khử trùng nguyên liệu',
    ],
    correct: 0,
    explain: 'TLC trong Dược: định tính (so với chuẩn), kiểm tra độ tinh khiết (phát hiện tạp chất), theo dõi tiến độ phản ứng tổng hợp.',
  },
];

const TIME_PER_Q = 15;
let qIdx = 0, score = 0, streak = 0, correct = 0;
let answered = false;
let startTime = performance.now();
let qStartTime = 0;
let timerInterval = null;

function $(id) { return document.getElementById(id); }

function renderQuestion() {
  answered = false;
  const q = QUESTIONS[qIdx];
  $('q-cat').textContent = q.cat;
  $('q-text').textContent = q.q;
  $('qnum').textContent = qIdx + 1;
  $('progress').style.width = `${((qIdx + 1) / QUESTIONS.length) * 100}%`;
  const opts = $('options');
  opts.innerHTML = '';
  q.options.forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.idx = i;
    div.innerHTML = `<span class="opt-letter">${'ABCD'[i]}</span><span>${text}</span>`;
    div.addEventListener('click', () => onAnswer(i));
    opts.appendChild(div);
  });
  $('explain').classList.remove('show');
  $('explain').textContent = q.explain;
  $('next-btn').classList.remove('show');
  qStartTime = performance.now();
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  function update() {
    if (answered) return;
    const elapsed = (performance.now() - qStartTime) / 1000;
    const remaining = Math.max(0, TIME_PER_Q - elapsed);
    $('timer').textContent = remaining.toFixed(1) + 's';
    $('timer-bar').style.width = (remaining / TIME_PER_Q * 100) + '%';
    if (remaining <= 0) {
      onAnswer(-1); // timeout
    }
  }
  update();
  timerInterval = setInterval(update, 100);
}

function onAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = QUESTIONS[qIdx];
  const isCorrect = idx === q.correct;
  const opts = $('options').children;
  for (let i = 0; i < opts.length; i++) {
    opts[i].classList.add('disabled');
    if (i === q.correct) opts[i].classList.add('correct');
    else if (i === idx) opts[i].classList.add('wrong');
  }
  if (isCorrect) {
    const elapsed = (performance.now() - qStartTime) / 1000;
    const speedBonus = Math.max(0, Math.floor((TIME_PER_Q - elapsed) * 0.5));
    streak++;
    const streakBonus = Math.min(streak - 1, 5) * 2;
    const pts = 10 + speedBonus + streakBonus;
    score += pts;
    correct++;
    if (streak >= 2) {
      $('streak-wrap').style.display = 'inline-flex';
      $('streak').textContent = streak;
    }
  } else {
    streak = 0;
    $('streak-wrap').style.display = 'none';
  }
  $('score').textContent = score;
  $('explain').classList.add('show');
  $('next-btn').classList.add('show');
}

$('next-btn').addEventListener('click', () => {
  qIdx++;
  if (qIdx >= QUESTIONS.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
});

async function finishQuiz() {
  const durationMs = Math.round(performance.now() - startTime);
  await submitAttempt({
    version: 'sac-ky-quiz',
    score, correct, total: QUESTIONS.length, durationMs,
    details: { topics: QUESTIONS.map(q => q.cat) },
  });
  $('modal-score').textContent = score;
  $('modal-details').innerHTML = [
    ['Câu đúng', correct + '/10'],
    ['Thời gian', (durationMs/1000).toFixed(1) + 's'],
    ['Streak cao nhất', streak >= 2 ? streak : '-'],
  ].map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
  $('modal').classList.add('show');
}

$('modal-replay').addEventListener('click', () => {
  qIdx = 0; score = 0; streak = 0; correct = 0;
  startTime = performance.now();
  $('modal').classList.remove('show');
  $('score').textContent = 0;
  $('streak-wrap').style.display = 'none';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
