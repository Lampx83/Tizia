<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Chi tiết yêu cầu · Tizia</title>
<style>
  :root {
    --bg:#0b1220; --bg2:#111a2e; --bg3:#16213d; --accent:#fbbf24; --accent2:#60a5fa;
    --ok:#22c55e; --warn:#fb923c; --bad:#ef4444;
    --border:rgba(255,255,255,0.10); --txt:#e2e8f0; --muted:#94a3b8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  a { color:var(--accent2); }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:26px 0 10px; }
  .meta { color:var(--muted); font-size:13px; }
  .blk { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .blk.board { border-left:3px solid var(--ok); }
  .blk.student { border-left:3px solid var(--accent2); }
  .who { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:var(--bg3); border:1px solid var(--border); }
  .strip { display:flex; flex-wrap:wrap; gap:4px 18px; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; }
  pre { white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; background:var(--bg); padding:8px; border-radius:6px; margin:4px 0; }
  details summary { cursor:pointer; color:var(--muted); }
  .over { color:var(--bad); font-weight:700; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main id="app"><p class="meta">Đang tải…</p></main>
<script type="module" src="/js/admin-request.js?v=1"></script>
</body>
</html>
