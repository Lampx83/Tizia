<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Chi tiết yêu cầu · Tizia</title>
<style>
  :root {
    --bg:#0b1220; --bg2:#111a2e; --bg3:#16213d; --accent:#fbbf24; --accent2:#60a5fa;
    --ok:#22c55e; --warn:#fb923c; --bad:#ef4444;
    --border:rgba(255,255,255,0.10); --txt:#e2e8f0; --muted:#94a3b8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  a { color:var(--accent2); }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:26px 0 10px; }
  .meta { color:var(--muted); font-size:13px; }
  .blk { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .blk.board { border-left:3px solid var(--ok); }
  .blk.student { border-left:3px solid var(--accent2); }
  .who { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:var(--bg3); border:1px solid var(--border); }
  .strip { display:flex; flex-wrap:wrap; gap:4px 18px; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; }
  pre { white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; background:var(--bg); padding:8px; border-radius:6px; margin:4px 0; }
  details summary { cursor:pointer; color:var(--muted); }
  .over { color:var(--bad); font-weight:700; }
  /* Trạng thái: xanh = qua/ok, cam = hỏi lại/cần xem, đỏ = chặn/lỗi, xám = chưa có kết luận */
  .st-ok { --c:var(--ok); } .st-warn { --c:var(--warn); } .st-bad { --c:var(--bad); } .st-idle { --c:var(--muted); }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--c); color:var(--c); }
  /* Timeline: 1 đường dọc nối các bước theo đúng thứ tự, mỗi bước 1 chấm màu + số thứ tự */
  .timeline { position:relative; margin:6px 0 4px; padding-left:34px; counter-reset:step; }
  .timeline::before { content:""; position:absolute; left:13px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .step { position:relative; background:var(--bg2); border:1px solid var(--border); border-left:3px solid var(--c);
          border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:13px; counter-increment:step; }
  .step::before { content:counter(step); position:absolute; left:-34px; top:7px; width:22px; height:22px; border-radius:50%;
                  background:var(--c); color:#0b1220; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .step.gate { background:var(--bg3); }
  .step .line1 { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
  .step .metrics { color:var(--muted); font-size:12px; margin-top:4px; display:flex; flex-wrap:wrap; gap:2px 14px; }
  .run-head { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:22px 0 8px; padding:8px 12px;
              border-radius:10px; background:var(--bg2); border:1px solid var(--border); border-left:4px solid var(--c); }
  .run-head b { font-size:14px; }
  .embedded .back { display:none; }
  .err { color:var(--bad); }
  code { font-family:ui-monospace,Consolas,monospace; font-size:12px; background:var(--bg3); padding:0 5px; border-radius:4px; }
  /* Đang chạy: xanh dương + nhấp nháy (tắt khi người dùng chọn giảm chuyển động) */
  .st-run { --c:var(--accent2); }
  .step.st-run::before { animation:pulse 1.2s ease-in-out infinite; }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent2); margin-right:6px;
           animation:pulse 1.2s ease-in-out infinite; vertical-align:middle; }
  @keyframes pulse { 0%, 100% { box-shadow:0 0 0 0 rgba(96,165,250,.7); } 50% { box-shadow:0 0 0 6px rgba(96,165,250,0); } }
  /* Thanh tiến độ các cổng của 1 lượt */
  .prog { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .seg { font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); background:var(--bg2); }
  .seg.ok { border-color:var(--ok); color:var(--ok); }
  .seg.bad { border-color:var(--bad); color:var(--bad); }
  .seg.skip { opacity:.45; border-style:dashed; }
  .seg.run { border-color:var(--accent2); color:var(--txt); font-weight:700;
             background:linear-gradient(90deg, rgba(96,165,250,.08) 0%, rgba(96,165,250,.45) 50%, rgba(96,165,250,.08) 100%);
             background-size:200% 100%; animation:sweep 1.4s linear infinite; }
  @keyframes sweep { from { background-position:200% 0; } to { background-position:0 0; } }
  .live-line { font-size:12px; color:var(--accent2); margin:-2px 0 8px; }
  .auto { font-size:12px; }
  .auto.live { color:var(--accent2); }
  @media (prefers-reduced-motion: reduce) { .seg.run, .pulse, .step.st-run::before { animation:none; } }
  .blk.status { border-left:3px solid var(--c); }
  .blk.status .line1 { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
  /* Kế hoạch */
  .plan-head { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:14px; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:10px 0 4px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .sub { color:var(--muted); font-size:12px; margin:12px 0 4px; }
  .plan-steps { margin:0; padding-left:22px; }
  .plan-steps li { padding:6px 0 6px 4px; border-bottom:1px solid var(--border); }
  .plan-steps li:last-child { border-bottom:0; }
  .plan-steps li::marker { color:var(--c); font-weight:700; }
  .plan-steps .line1 { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  /* Nút + xác nhận 2 bước */
  .btn { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--txt);
         font:inherit; font-size:13px; cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#04210f; font-weight:700; margin-top:10px; }
  .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:700; }
  .btn.danger-outline { border-color:var(--bad); color:var(--bad); background:transparent; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0 0; }
  .flash { font-size:13px; color:var(--ok); }
  .confirm { margin-top:10px; padding:12px 14px; border-radius:10px; border:1px solid var(--bad); background:rgba(239,68,68,.08); font-size:13px; }
  .confirm-title { font-weight:700; margin-bottom:6px; }
  .confirm ul { margin:4px 0 10px; padding-left:18px; } .confirm li { margin:3px 0; }
  .confirm .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:6px; }
  .confirm input { padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--txt);
                   font:inherit; width:120px; }
</style>
</head>
<body data-no-auth-header data-no-suggestion-fab data-no-notifications-bell data-no-gamify>
<main id="app"><p class="meta">Đang tải…</p></main>
<script type="module" src="/js/admin-request.js?v=lifecycle"></script>
</body>
</html>
