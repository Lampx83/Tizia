<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Chi tiết yêu cầu · Tizia</title>
<style>
  :root {
    --bg:#0b1220; --bg2:#111a2e; --bg3:#16213d; --accent:#fbbf24; --accent2:#60a5fa;
    --ok:#4ade80; --warn:#fdba74; --bad:#fca5a5;
    --border:rgba(255,255,255,0.10); --txt:#e2e8f0; --muted:#94a3b8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); color-scheme:dark; }
  a { color:var(--accent2); }
  main { max-width:1100px; margin:0 auto; padding:32px 24px 80px; }
  h1 { font-size:26px; line-height:1.35; margin:12px 0; font-weight:700; overflow-wrap:anywhere; }
  h2 { font-size:18px; color:var(--txt); margin:32px 0 12px; font-weight:650; }
  :is(a,button,input,summary):focus-visible { outline:3px solid var(--accent2); outline-offset:3px; }
  ::selection { background:#fbbf24; color:var(--bg); }
  a { text-underline-offset:3px; }
  .back { display:inline-flex; align-items:center; min-height:44px; }
  nav[aria-label] { max-width:1100px; margin:0 auto; padding:0 24px; display:flex; flex-wrap:wrap; gap:0 16px; }
  .request-head { padding-bottom:20px; border-bottom:1px solid var(--border); }
  .write-row { padding:10px 0; border-top:1px solid var(--border); }
  .reconcile-form fieldset { border:1px solid var(--border); border-radius:8px; margin:8px 0; padding:8px 12px; }
  .rf-opt { display:flex; gap:8px; align-items:center; min-height:44px; }
  .rf-field { display:block; margin:8px 0; }
  .rf-field textarea { display:block; width:100%; max-width:72ch; margin-top:4px; }
  .event-list { list-style:none; padding:0; margin:0; }
  .event-row { padding:14px 0; border-bottom:1px solid var(--border); overflow-wrap:anywhere; }
  .event-row:last-child { border-bottom:0; }
  .meta { color:var(--muted); font-size:13px; }
  .blk { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; font-size:14px; overflow-wrap:anywhere; }
  .blk.board .who { color:#86efac; }
  .blk.student .who { color:#93c5fd; }
  .who { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .atts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .atts a { display:block; width:180px; max-width:100%; font-size:11px; color:var(--muted); text-decoration:none; }
  .atts img { display:block; width:100%; border:1px solid var(--border); border-radius:6px; margin-bottom:2px; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:var(--bg3); border:1px solid var(--border); }
  .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px 24px; font-variant-numeric:tabular-nums; }
  .table-wrap { overflow-x:auto; }
  .span-table td.num, .span-table th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .span-table { min-width:760px; }
  .span-table td { padding:6px 12px; } .span-what { white-space:nowrap; }
  .span-row.d1 .span-what { padding-left:24px; } .span-row.d2 .span-what { padding-left:40px; color:var(--txt); } .span-row.d3 .span-what { padding-left:56px; }
  .span-row:hover td { background:var(--bg3); }
  .span-bar-head { min-width:160px; }
  .span-bar { position:relative; min-width:160px; }
  .span-bar::before { content:""; position:absolute; left:12px; right:12px; top:50%; height:1px; background:var(--border); }
  .span-bar i { position:absolute; top:calc(50% - 4px); height:8px; border-radius:2px; background:var(--c); opacity:.85; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; }
  pre { white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; background:var(--bg); padding:8px; border-radius:6px; margin:4px 0; }
  details summary { cursor:pointer; color:var(--muted); min-height:44px; padding:8px 0; }
  .over { color:var(--bad); font-weight:700; }
  /* Trạng thái: xanh = qua/ok, cam = hỏi lại/cần xem, đỏ = chặn/lỗi, xám = chưa có kết luận */
  .st-ok { --c:var(--ok); } .st-warn { --c:var(--warn); } .st-bad { --c:var(--bad); } .st-idle { --c:var(--muted); }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--c); color:var(--c); }
  /* Timeline: 1 đường dọc nối các bước theo đúng thứ tự, mỗi bước 1 chấm màu + số thứ tự */
  /* Cổng: vòng tròn mang số cổng thật; lần gọi model: chấm nhỏ không số. */
  /* Bước phụ 2.5 / 5.5: lùi vào, viền đứt, nhãn vuông — khác hẳn bước chính 1-5. */
  .trace-ref { font-size:12px; color:var(--muted); margin:-2px 0 6px; overflow-wrap:anywhere; }
  .trace-copy { font:12px ui-monospace,Consolas,monospace; color:var(--muted); background:none; border:0; padding:6px 0; min-height:32px; cursor:pointer; overflow-wrap:anywhere; }
  .trace-copy:hover { color:var(--txt); text-decoration:underline; }
  .trace-copy.copied::after { content:" đã copy"; color:var(--ok); font-family:system-ui,sans-serif; }
  .kv { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:2px 12px; margin:6px 0 0; font-size:12.5px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; min-width:0; }
  .raw { margin-top:4px; font-size:12px; }
  .raw summary { cursor:pointer; color:var(--muted); }
  .raw pre { margin:4px 0 0; padding:8px; max-height:260px; overflow:auto; background:var(--bg); border:1px solid var(--border);
             border-radius:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
  /* Scrollbar mảnh theo theme tối (Firefox + Chromium) */
  * { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.22) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.18); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(251,191,36,0.55); background-clip:padding-box; }
  .btn.rerun { padding:2px 10px; font-size:12px; margin-left:auto; border-color:var(--accent2); color:var(--accent2); background:transparent; }
  /* Mỗi lần gọi model: 4 phần gập (Context · Tools · Edit · Evaluation), summary 1 dòng kèm số đếm/trạng thái */
  .s-ok { color:var(--ok); } .s-bad { color:var(--bad); }
  .embedded .back { display:none; }
  .err { color:var(--bad); }
  code { font-family:ui-monospace,Consolas,monospace; font-size:12px; background:var(--bg3); padding:0 5px; border-radius:4px; }
  /* Đang chạy: xanh dương + nhấp nháy (tắt khi người dùng chọn giảm chuyển động) */
  .st-run { --c:var(--accent2); }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent2); margin-right:6px;
           animation:pulse 1.2s ease-in-out infinite; vertical-align:middle; }
  @keyframes pulse { 0%, 100% { box-shadow:0 0 0 0 rgba(96,165,250,.7); } 50% { box-shadow:0 0 0 6px rgba(96,165,250,0); } }
  /* Thanh tiến độ các cổng của 1 lượt */
  .auto { font-size:12px; }
  .auto.live { color:var(--accent2); }
  @media (prefers-reduced-motion: reduce) { .pulse { animation:none; } }
  .blk.status { border-color:var(--c); }
  .blk.status .line1 { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
  /* Kế hoạch */
  .plan-head { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:14px; }
  .kv { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:6px 16px; margin:12px 0 6px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .sub { color:var(--muted); font-size:12px; margin:12px 0 4px; }
  .plan-steps { margin:0; padding-left:22px; }
  .plan-steps li { padding:6px 0 6px 4px; border-bottom:1px solid var(--border); }
  .plan-steps li:last-child { border-bottom:0; }
  .plan-steps li::marker { color:var(--c); font-weight:700; }
  .plan-steps .line1 { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  /* Nút + xác nhận 2 bước */
  .btn { min-height:44px; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--txt);
         font:inherit; font-size:13px; cursor:pointer; }
  a.btn { display:inline-flex; align-items:center; text-decoration:none; }
  .confirm.folder-wait { border-color:var(--warn,#f59e0b); background:rgba(245,158,11,.08); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.ok { background:var(--ok); border-color:var(--ok); color:#04210f; font-weight:700; margin-top:10px; }
  .btn:hover:not(:disabled) { filter:brightness(1.15); }
  .btn.danger { background:#b91c1c; border-color:#b91c1c; color:#fff; font-weight:700; }
  .btn.danger-outline { border-color:var(--bad); color:var(--bad); background:transparent; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0 0; }
  .flash { font-size:13px; color:var(--ok); }
  .confirm { margin-top:10px; padding:12px 14px; border-radius:10px; border:1px solid var(--bad); background:rgba(239,68,68,.08); font-size:13px; }
  .confirm-title { font-weight:700; margin-bottom:6px; }
  .confirm ul { margin:4px 0 10px; padding-left:18px; } .confirm li { margin:3px 0; }
  .confirm .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:6px; }
  .confirm input { padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--txt);
                   font:inherit; min-height:44px; width:120px; }
  @media (max-width:600px) {
    main { padding:20px 16px 60px; }
    h1 { font-size:22px; }
    .blk { padding:14px; }
    .kv { grid-template-columns:minmax(0,1fr); gap:2px; }
    .kv dd { margin-bottom:8px; overflow-wrap:anywhere; }
    .strip { grid-template-columns:minmax(0,1fr); gap:8px; }
    .confirm input { font-size:16px; }
  }
  .claim-evidence code { white-space:normal; overflow-wrap:anywhere; word-break:break-all; }
  .claim-evidence pre { white-space:pre-wrap; overflow-wrap:anywhere; }
  /* Ticket graph: thin edges, no boxes. Colour: one accent plus the state colours. */
  .ticket-graph { margin:24px 0 0; display:grid; gap:14px; }
  .ticket-graph .blk { margin:0; padding:18px; }
  .g-caption { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .g-summary { display:grid; gap:6px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--border); font-size:13px; }
  .g-summary .line1 { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  .g-events { list-style:none; margin:14px 0 0; padding:0; font-size:13px; }
  .g-events li { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--border); }
  .g-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:28px 32px; margin:20px 0 0; }
  .g-cell-label { font-size:12px; color:var(--muted); }
  .g-big { font-size:28px; font-weight:600; line-height:1.2; margin-top:4px; font-variant-numeric:tabular-nums; }
  .g-sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .g-bar { height:3px; margin-top:12px; background:var(--border); border-radius:2px; overflow:hidden; }
  .g-bar i { display:block; height:100%; background:var(--ok); }
  .tone-warn .g-big, .tone-warn .g-sub { color:var(--warn); }
  .tone-warn .g-bar i { background:var(--warn); }
  .tone-bad .g-big, .tone-bad .g-sub { color:var(--bad); }
  .tone-bad .g-bar i { background:var(--bad); }
  .g-legend { display:flex; flex-wrap:wrap; gap:8px 20px; margin:44px 0 0; }
  .g-state { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .g-state.st-succeeded { color:var(--ok); }
  .g-state.st-failed { color:var(--bad); }
  .g-state.st-running { color:var(--accent2); }
  .g-frame { margin-top:28px; overflow-x:auto; overflow-y:hidden; }
  .g-svg { display:block; width:100%; min-width:900px; height:auto; }
  .g-edge { fill:none; stroke:var(--muted); stroke-opacity:.6; stroke-width:1.5; marker-end:url(#g-arr); }
  .g-result { margin:0 0 14px; padding:12px 14px; border:1px solid var(--ok); border-radius:12px; background:rgba(34,197,94,.06); }
  .g-result-row { display:grid; grid-template-columns:120px minmax(0,1fr); gap:10px; padding:4px 0; font-size:13px; }
  .g-result-row ul { margin:0; padding-left:16px; }
  .g-arr { fill:var(--muted); fill-opacity:.8; }
  .g-arr.done { fill:var(--ok); }
  .g-arr.stop { fill:var(--bad); }
  .g-arr.flow { fill:var(--accent2); }
  .g-edge.done { stroke:var(--ok); stroke-opacity:.8; marker-end:url(#g-arr-done); }
  .g-edge.stop { stroke:var(--bad); stroke-opacity:.6; stroke-dasharray:2 4; marker-end:url(#g-arr-stop); }
  .g-edge.flow { stroke:var(--accent2); stroke-opacity:1; stroke-dasharray:4 8; animation:g-flow 1.2s linear infinite; marker-end:url(#g-arr-flow); }
  @keyframes g-flow { to { stroke-dashoffset:-24; } }
  .g-box { fill:var(--bg); stroke:var(--muted); stroke-width:1.5; }
  .g-glyph { color:var(--muted); }
  .g-node.st-succeeded .g-box, .g-node.st-succeeded .g-glyph { stroke:var(--ok); color:var(--ok); }
  .g-node.st-failed .g-box, .g-node.st-failed .g-glyph { stroke:var(--bad); color:var(--bad); }
  .g-node.st-running .g-box, .g-node.st-running .g-glyph { stroke:var(--accent2); color:var(--accent2); }
  .g-node.st-running .g-glyph { animation:g-turn 1.4s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes g-turn { to { transform:rotate(360deg); } }
  .g-halo { fill:none; stroke:var(--accent); stroke-width:1.5; }
  .g-label { font-size:12px; fill:var(--muted); }
  .g-kicker { font-size:10px; fill:var(--muted); letter-spacing:.04em; }
  .g-node { cursor:pointer; outline:none; }
  .g-node:hover .g-label, .g-node.is-selected .g-label { fill:var(--txt); }
  .g-node:focus-visible .g-box { stroke:var(--accent); stroke-width:2.5; }
  .g-loop { margin:28px 0 0; }
  .g-props, .g-graph, .g-log { margin-top:16px; }
  .g-graph { padding-bottom:8px; }
  .g-log { display:grid; grid-template-columns:minmax(180px,240px) minmax(0,1fr); padding:0; overflow:hidden; }
  .g-steps { list-style:none; margin:0; padding:6px; border-right:1px solid var(--border); }
  .g-step { display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:8px 10px; border:0; border-radius:8px; background:none; color:var(--muted); font:inherit; font-size:13px; text-align:left; cursor:pointer; }
  .g-step-name { flex:1; min-width:0; overflow-wrap:anywhere; }
  .g-step-state { font-size:11px; color:var(--muted); }
  .g-step:hover, .g-step.is-selected { background:var(--bg3); color:var(--txt); }
  .g-step.st-succeeded .g-icon { color:var(--ok); } .g-step.st-failed .g-icon { color:var(--bad); } .g-step.st-running .g-icon { color:var(--accent2); }
  .g-pane { padding:20px 24px; min-width:0; min-height:80px; }
  .g-icon { flex:none; }
  .g-empty { margin:0; }
  .g-panel-head { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; justify-content:space-between; }
  .g-panel-head h3 { margin:0; font-size:18px; }
  .g-purpose { margin:8px 0 20px; color:var(--muted); }
  .g-kv { margin:0 0 20px; }
  .g-error { margin:0 0 20px; }
  .g-error b { color:var(--bad); font-weight:600; }
  .g-error p { margin:4px 0 0; }
  .g-pane h4 { font-size:13px; color:var(--muted); margin:24px 0 8px; font-weight:600; }
  .g-list { margin:0; padding-left:20px; font-size:13px; }
  .g-list li { margin:6px 0; overflow-wrap:anywhere; }
  .g-slot { margin:24px 0 0; }
  .g-raw { margin-top:24px; }
  @media (max-width:600px) {
    .g-strip { grid-template-columns:1fr 1fr; }
    .g-big { font-size:22px; }
    .g-log { grid-template-columns:minmax(0,1fr); }
    .g-steps { border-right:0; border-bottom:1px solid var(--border); }
    .g-pane { padding:16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .g-edge.flow, .g-node.st-running .g-glyph { animation:none; }
  }
  .event-row > .line1 { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; }
</style>
</head>
<body data-no-auth-header data-no-suggestion-fab data-no-notifications-bell data-no-gamify>
