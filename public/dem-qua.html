<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🍎 Đếm Quả Trên Cây · Tizia</title>
<meta name="description" content="Bé tap đúng số quả táo cô yêu cầu. Game đếm số đơn giản cho 3-5 tuổi." />
<style>
  :root { --bg-1:#fef3c7; --bg-2:#fde68a; --grass:#86efac; --sky:#bae6fd; --ink:#1f1147; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--ink); }
  body { min-height:100vh; background: linear-gradient(180deg, var(--sky) 0%, var(--bg-1) 60%, var(--bg-2) 100%); overflow-x:hidden; }
  .wrap { max-width:none; margin: 0 auto; padding: 16px 16px 32px; }
  .top { display:flex; align-items:center; gap:14px; padding: 10px 16px; background: rgba(255,255,255,.65);
    border-radius: 20px; backdrop-filter: blur(8px); margin-bottom: 14px; }
  .top h1 { margin:0; font-size: clamp(20px, 3vw, 28px); font-weight: 900; }
  .top .back { padding: 8px 16px; border-radius: 999px; background: #fff; text-decoration:none; color: var(--ink);
    font-weight: 800; border: 2px solid #fbbf24; }
  .stats { margin-left:auto; display:flex; gap: 10px; font-weight: 900; }
  .stats .b { padding: 6px 14px; border-radius: 999px; background:#fef3c7; border:2px solid #fbbf24; }

  .prompt { text-align:center; font-size: clamp(28px, 4.2vw, 42px); font-weight: 900; color: #b45309;
    background: rgba(255,255,255,.75); padding: 18px 24px; border-radius: 28px; margin: 8px 0 14px;
    box-shadow: 0 10px 24px rgba(0,0,0,.08); }
  .tts { width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:#3b82f6; color:#fff; font-size:26px; margin-left: 10px; vertical-align: middle;
    box-shadow:0 6px 14px rgba(59,130,246,.4); }
  .tts:active { transform: translateY(2px); }

  /* Cây táo: SVG-ish vùng vuông, quả là button to */
  .tree {
    position: relative; margin: 0 auto; width: min(92vw, 720px); aspect-ratio: 1 / 0.85;
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%, #86efac 0%, #4ade80 80%, transparent 82%),
      radial-gradient(ellipse 25% 60% at 50% 78%, #92400e 0%, #78350f 80%, transparent 82%);
    border-radius: 24px;
  }
  .ground { width: 100%; height: 60px; margin-top: -30px; background: linear-gradient(180deg, #4ade80, #16a34a);
    border-radius: 0 0 32px 32px; box-shadow: inset 0 -6px 0 #15803d; }

  .apple { position:absolute; transform: translate(-50%, -50%);
    width: clamp(56px, 9vw, 84px); height: clamp(56px, 9vw, 84px);
    border-radius: 50%; border: none; cursor: pointer; font-size: clamp(36px, 6vw, 52px);
    background: transparent; padding: 0; user-select:none;
    transition: transform .12s, filter .18s; }
  .apple:hover { transform: translate(-50%, -50%) scale(1.12); filter: drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
  .apple:active { transform: translate(-50%, -50%) scale(.92); }
  .apple.picked { animation: fall 1s ease-in forwards; pointer-events:none; }
  @keyframes fall {
    0% { transform: translate(-50%, -50%) rotate(0); opacity:1; }
    100% { transform: translate(-50%, 220%) rotate(140deg); opacity: 0; }
  }
  .apple.wrong { animation: wob .5s ease; }
  @keyframes wob { 0%,100%{transform:translate(-50%,-50%) rotate(0)} 25%{transform:translate(calc(-50% - 10px),-50%) rotate(-8deg)} 75%{transform:translate(calc(-50% + 10px),-50%) rotate(8deg)} }

  .basket { text-align:center; font-size: clamp(24px, 3.4vw, 32px); margin-top: 16px;
    background: rgba(255,255,255,.8); border-radius: 20px; padding: 12px 22px;
    font-weight: 900; color: #b45309; }
  .basket .count { color: #16a34a; font-size: 1.4em; }

  .actions { display:flex; gap:14px; justify-content:center; margin-top: 14px; flex-wrap:wrap; }
  .btn { padding: 14px 28px; border:none; border-radius: 999px; cursor:pointer;
    font-family: inherit; font-size: 18px; font-weight: 900; color: var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.15); }
  .btn.primary { background: linear-gradient(90deg,#fbbf24,#f59e0b); }
  .btn.ghost { background: rgba(255,255,255,.85); border: 2px solid #fbbf24; }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.15); }

  .toast { position: fixed; left:50%; bottom: 32px; transform: translateX(-50%);
    background: #16a34a; color:#fff; padding: 14px 28px; border-radius: 999px;
    font-weight: 900; font-size: 20px; opacity:0; transition: opacity .25s;
    box-shadow: 0 10px 24px rgba(0,0,0,.25); pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .toast.bad { background: #dc2626; }

  /* Confetti layer */
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="javascript:history.back()">← Quay lại</a>
    <h1>🍎 Đếm Quả Trên Cây</h1>
    <div class="stats">
      <span class="b">⭐ <span id="st-score">0</span></span>
      <span class="b">🎯 Vòng <span id="st-round">1</span></span>
    </div>
  </div>

  <div class="prompt" id="prompt">
    Cô đã hái sẵn quả 🍎 chưa? Cùng đếm nhé!
    <button class="tts" id="btn-tts" title="Nghe lại" aria-label="Đọc to">🔊</button>
  </div>

  <div class="tree" id="tree" aria-label="Cây táo có nhiều quả"></div>
  <div class="ground"></div>

  <div class="basket">🧺 Đã hái: <span class="count" id="picked">0</span> / <span id="target">3</span> quả</div>

  <div class="actions">
    <button class="btn primary" id="btn-next">▶ Bắt đầu</button>
    <button class="btn ghost" id="btn-reset">🔁 Hái lại</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { speak } from '/js/engine/preschool-ui.js';

const $ = (s) => document.querySelector(s);
const tree = $('#tree');
const promptEl = $('#prompt');
const ttsBtn = $('#btn-tts');

let target = 3, picked = 0, score = 0, round = 1;
let apples = [];

function rand(a, b) { return a + Math.random() * (b - a); }

function spawnApples(n) {
  tree.innerHTML = '';
  apples = [];
  // Trải đều quả trên tán lá — random nhưng không chồng nhau quá.
  const positions = [];
  for (let i = 0; i < n; i++) {
    let tries = 0, x, y;
    do {
      x = rand(18, 82); y = rand(20, 65);
      tries++;
    } while (tries < 20 && positions.some(p => Math.hypot(p.x - x, p.y - y) < 14));
    positions.push({ x, y });
    const a = document.createElement('button');
    a.className = 'apple';
    a.textContent = '🍎';
    a.style.left = x + '%';
    a.style.top = y + '%';
    a.setAttribute('aria-label', 'Quả táo');
    a.addEventListener('click', () => onPick(a));
    tree.appendChild(a);
    apples.push(a);
  }
}

function onPick(a) {
  if (a.classList.contains('picked')) return;
  if (picked >= target) {
    // Quá tay — báo nhẹ
    a.classList.add('wrong');
    speak('Đủ rồi nha! Bé đã hái đủ.');
    setTimeout(() => a.classList.remove('wrong'), 600);
    toast('😅 Đủ rồi nha!', 'bad');
    return;
  }
  a.classList.add('picked');
  picked++;
  $('#picked').textContent = picked;
  speak(String(picked), { rate: 1.05 });
  if (picked === target) {
    score += 10;
    $('#st-score').textContent = score;
    confetti();
    toast('🎉 Hái đúng ' + target + ' quả!');
    speak('Đúng rồi! Bé hái đúng ' + target + ' quả!');
    setTimeout(nextRound, 1600);
  }
}

function nextRound() {
  round++;
  $('#st-round').textContent = round;
  // Random target từ 1..7 (mầm non — không quá 10), số quả trên cây >= target + 2.
  target = 1 + Math.floor(Math.random() * 7);
  const onTree = target + 2 + Math.floor(Math.random() * 4); // 3..12 quả
  picked = 0;
  $('#picked').textContent = 0;
  $('#target').textContent = target;
  spawnApples(onTree);
  const msg = `Hái cho cô <b>${target}</b> quả 🍎 nào!`;
  promptEl.innerHTML = msg + '<button class="tts" id="btn-tts">🔊</button>';
  speak(`Hái cho cô ${target} quả táo nào!`);
  $('#btn-tts').addEventListener('click', () => speak(`Hái cho cô ${target} quả táo nào!`));
}

ttsBtn.addEventListener('click', () => speak('Cùng hái quả táo nào!'));
$('#btn-next').addEventListener('click', () => { $('#btn-next').textContent = '▶ Vòng kế'; nextRound(); });
$('#btn-reset').addEventListener('click', () => {
  picked = 0; $('#picked').textContent = 0;
  spawnApples(apples.length || target + 3);
});

function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('bad', kind === 'bad');
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function confetti() {
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const colors = ['#fbbf24','#ef4444','#10b981','#3b82f6','#a855f7','#ec4899'];
  for (let i = 0; i < 36; i++) {
    const p = document.createElement('div');
    const size = 8 + Math.random() * 10;
    const left = 30 + Math.random() * 40;
    const top = 30 + Math.random() * 30;
    const dx = (Math.random() - 0.5) * 500;
    const dy = 200 + Math.random() * 320;
    const rot = Math.random() * 720;
    p.style.cssText = `position:absolute;left:${left}%;top:${top}%;width:${size}px;height:${size}px;background:${colors[i%6]};border-radius:${Math.random()>0.5?'50%':'2px'};transform:translate(0,0) rotate(0);transition:transform 1.2s cubic-bezier(.2,.6,.4,1), opacity 1.2s;`;
    layer.appendChild(p);
    requestAnimationFrame(() => { p.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`; p.style.opacity='0'; });
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1400);
}

// Hiển thị ngay 5 quả minh hoạ trước khi bấm bắt đầu
spawnApples(5);
</script>
</body>
</html>
