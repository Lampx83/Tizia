<style>
  :root { --bg-1:#0b1220; --bg-2:#0f1830; --accent:#38bdf8; --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.12); --muted:#94a3b8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Inter',system-ui,sans-serif; color:#e5edf7;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(56,189,248,.16), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2)); }
  body { display:flex; flex-direction:column; min-height:100vh; }
  a { color:inherit; }
  .top { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border);
    background:rgba(0,0,0,.25); position:sticky; top:0; z-index:5; }
  .top .home { color:#fff; text-decoration:none; opacity:.85; font-size:13.5px; background:rgba(255,255,255,.08);
    padding:7px 12px; border-radius:9px; }
  .top .home:hover { opacity:1; background:rgba(255,255,255,.16); }
  .top h1 { margin:0; font-size:17px; font-weight:800; }
  .top h1 .dim { opacity:.55; font-weight:600; font-size:13.5px; }
  .top .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .top .right a { font-size:13px; text-decoration:none; opacity:.8; }
  .top .right a:hover { opacity:1; }

  /* ---- grid view ---- */
  .wrap { max-width:none; margin:0 auto; padding:30px 20px 48px; width:100%; }
  .lead { font-size:14.5px; color:var(--muted); line-height:1.6; max-width:680px; margin:0 0 26px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  /* Thẻ gọn: icon + tên + ĐÚNG 1 dòng mô tả. Hover chỉ nâng nhẹ + sáng viền —
     KHÔNG đổ nền vàng vì chữ trắng trên vàng đọc không nổi. */
  .app { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:14px 16px; text-decoration:none; min-width:0;
    transition:transform .15s, border-color .15s, background .15s, box-shadow .15s; }
  .app:hover { transform:translateY(-2px); border-color:rgba(251,191,36,.7);
    background:rgba(255,255,255,.07); box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .app .ico { font-size:24px; line-height:1; width:44px; height:44px; flex:none;
    display:grid; place-items:center; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); transition:border-color .15s; }
  .app:hover .ico { border-color:rgba(251,191,36,.4); }
  .app .txt { min-width:0; }
  .app h3 { margin:0; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .app p { margin:2px 0 0; font-size:12.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .app .badge { display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    padding:2px 8px; border-radius:7px; background:rgba(255,255,255,.08); color:var(--muted); margin-left:8px; }

  /* ---- embed view ---- */
  body.embed #root { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .embedbar { display:flex; align-items:center; gap:12px; padding:9px 18px; border-bottom:1px solid var(--border);
    background:rgba(0,0,0,.18); font-size:13px; flex:none; }
  .embedbar .nm { font-weight:700; }
  .embedbar .nm .ico { margin-right:7px; }
  .embedbar .sp { margin-left:auto; display:flex; gap:14px; }
  .embedbar a { text-decoration:none; opacity:.82; }
  .embedbar a:hover { opacity:1; }
  iframe.app-frame { flex:1; width:100%; border:0; background:#fff; min-height:0; }
  .hint { padding:9px 18px; font-size:12px; color:var(--muted); background:rgba(0,0,0,.12); border-bottom:1px solid var(--border); }
</style>

<body>
<noscript>
  <h1>🧩 Ứng dụng Tizia</h1>
  <p>Công cụ và trò chơi học tập chạy trong Tizia. Bật JavaScript để xem danh sách đầy đủ.</p>
</noscript>
<h1 style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">Ứng dụng Tizia — công cụ và trò chơi học tập</h1>
<div id="root"></div>

<script type="module">
  // Catalog + URL công khai khai trong public/js/integrations.js (1 nguồn dữ liệu
  // dùng chung cả apps.html và khối "Ứng dụng" trên trang chủ).
  import { INTEGRATIONS as APPS } from './js/integrations.js';

  const params = new URLSearchParams(location.search);
  const appParam = params.get('app');
  const root = document.getElementById('root');

  // Icon thẻ app — bản chạy tay của web-next/lib/app-icon.ts (2 bản UI phải khớp nhau).
  // App chuẩn AI Portal đặt icon là TÊN icon Lucide ("FileText") → đổi sang emoji gần
  // nghĩa; đã là emoji thì giữ; không nhận ra thì 🧩.
  const ALIAS_ICON = { qrcode:'🔳', 'library-search':'📚', annota:'🗂️', quantis:'📊',
    bibliomap:'🗺️', scorum:'🎓', convertum:'🧮' };
  const LUCIDE_EMOJI = { filetext:'📄', filesearch:'🔍', file:'📄', files:'🗂️', folder:'📁',
    book:'📕', bookopen:'📖', bookmarked:'🔖', library:'📚', newspaper:'📰',
    sigma:'📊', barchart:'📊', barchart3:'📊', linechart:'📈', piechart:'🥧',
    database:'🗄️', table:'📋', calculator:'🧮', activity:'📈',
    map:'🗺️', mappin:'📍', globe:'🌐', network:'🕸️', share2:'🔗',
    search:'🔎', microscope:'🔬', flask:'🧪', flaskconical:'🧪', atom:'⚛️',
    graduationcap:'🎓', school:'🏫', pencil:'✏️', pentool:'🖊️', notebook:'📓',
    clipboardlist:'📋', checksquare:'✅', target:'🎯', trophy:'🏆', brain:'🧠',
    bot:'🤖', code:'💻', terminal:'⌨️', settings:'⚙️', wrench:'🔧',
    qrcode:'🔳', image:'🖼️', camera:'📷', video:'🎬', music:'🎵',
    palette:'🎨', timer:'⏱️', clock:'🕐', calendar:'📅', zap:'⚡',
    mail:'✉️', messagesquare:'💬', users:'👥', user:'👤', bell:'🔔',
    circledollarsign:'💰', wallet:'👛', shoppingcart:'🛒' };
  function appIcon(raw, alias) {
    const byAlias = alias && ALIAS_ICON[String(alias).trim().toLowerCase()];
    if (byAlias) return byAlias;
    const s = String(raw || '').trim();
    if (!s) return '🧩';
    if (!/[A-Za-z0-9]/.test(s)) return s;
    return LUCIDE_EMOJI[s.toLowerCase().replace(/[^a-z0-9]/g, '')] || '🧩';
  }

  // Portal apps (cài qua /portal-apps.html) — alias hoá thành "portal:<id>"
  async function fetchPortalApps() {
    try {
      const r = await fetch('/api/portal-apps', { credentials: 'include' });
      if (!r.ok) return { own: [], public: [] };
      return await r.json();
    } catch { return { own: [], public: [] }; }
  }

  // Nếu URL ?app=portal:<id> → tìm trong portal apps + nhúng (own/public/builtin)
  if (appParam && appParam.startsWith('portal:')) {
    const id = appParam.slice('portal:'.length);
    fetchPortalApps().then(({ own, public: pub, builtin }) => {
      const all = [...(own || []), ...(pub || []), ...(builtin || [])];
      const pa = all.find(a => String(a.id) === String(id));
      if (pa) renderEmbed({
        id: 'portal:' + pa.id, name: pa.name, icon: appIcon(pa.icon),
        tag: pa.kind === 'builtin' ? (pa.category || 'Built-in') : 'Portal app',
        color: '#fbbf24', path: pa.url, url: pa.url,
      });
      else renderGrid([]);
    });
  } else if (appParam) {
    const active = APPS.find(a => a.id === appParam);
    if (active) {
      try { window.tiziaTrack?.('app_launch', { app_id: active.id, app_name: active.name }); } catch {}
      renderEmbed(active);
    } else {
      renderGrid([]);
    }
  } else {
    try { window.tiziaTrack?.('app_grid_view'); } catch {}
    fetchPortalApps().then(({ own, public: pub, builtin }) =>
      renderGrid([...(own || []), ...(pub || []), ...(builtin || [])]));
  }

  function renderGrid(portalApps = []) {
    document.body.style.display = 'block';
    const portalCards = portalApps.length ? `
        <div class="grid">
          ${portalApps.map(a => `
            <a class="app" href="/app/${encodeURIComponent(a.alias)}" title="${escapeHtml(a.description || a.name)}">
              <div class="ico">${appIcon(a.icon, a.alias)}</div>
              <div class="txt">
                <h3>${escapeHtml(a.name)}</h3>
                <p>${escapeHtml(a.description || 'Ứng dụng trong Tizia')}</p>
              </div>
            </a>`).join('')}
        </div>` : `
        <h2 style="margin:32px 0 14px; font-size:18px;">
          🧩 Apps cộng đồng
          <a href="portal-apps.html" style="float:right; font-size:13px; font-weight:600; color:#fbbf24; text-decoration:none;">
            + Cài app mới (dev) →
          </a>
        </h2>
        <p class="lead" style="opacity:.7;">Chưa có Portal app nào.
          <a href="portal-apps.html" style="color:#fbbf24;">Cài app đầu tiên</a> theo chuẩn manifest + zip.</p>`;
    root.innerHTML = `
      <div class="top">
        <a class="home" href="index.html">← Tizia</a>
        <h1>🧩 Ứng dụng <span class="dim">· Tizia</span></h1>
      </div>
      <div class="wrap">
        <p class="lead">Công cụ và trò chơi học tập chạy ngay trong Tizia — bấm để mở trong khung,
          không rời khỏi trang. Bạn cũng có thể <a href="/dev" style="color:#fbbf24;">tự viết app</a>
          rồi cài vào đây.</p>
        ${portalCards}
      </div>`;
  }
  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderEmbed(a) {
    document.title = `${a.icon} ${a.name} · Tizia`;
    document.body.classList.add('embed');
    const src = a.url || a.path;   // URL công khai nếu có, ngược lại proxy cùng origin
    root.innerHTML = `
      <div class="embedbar">
        <a class="home" href="apps.html" style="text-decoration:none;background:rgba(255,255,255,.08);padding:6px 11px;border-radius:8px">← Ứng dụng</a>
        <span class="nm" style="color:${a.color}"><span class="ico">${a.icon}</span>${a.name}</span>
        <span style="opacity:.6">${a.tag}</span>
        <span class="sp">
          <a href="index.html">🏠 Tizia</a>
          <a href="${src}" target="_blank" rel="noopener">↗ Mở tab mới</a>
        </span>
      </div>
      <iframe class="app-frame" src="${src}"
        allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay"
        referrerpolicy="no-referrer-when-downgrade"></iframe>`;
  }
</script>
