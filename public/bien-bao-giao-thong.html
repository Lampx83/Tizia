<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🚸 Biển báo Giao thông · Tizia</title>
<meta name="description" content="Học và đố biển báo giao thông Việt Nam: cấm, nguy hiểm, hiệu lệnh, chỉ dẫn. SVG vẽ tay, không cần ảnh." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<meta name="theme-color" content="#dc2626" />
<style>
  :root { --bg:#1a1a2e; --card:rgba(255,255,255,.06); --text:#e5edf7;
    --muted:#94a3b8; --border:rgba(255,255,255,.12);
    --red:#dc2626; --blue:#2563eb; --yellow:#fbbf24; --green:#10b981; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Inter',system-ui,sans-serif;
    background: linear-gradient(180deg,var(--bg),#16213e); color:var(--text); padding:18px;
    display:flex; flex-direction:column; align-items:center; gap:18px; }
  h1 { margin:0; font-size:22px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .toolbar button { font-family:inherit; background:var(--card); color:var(--text);
    border:1px solid var(--border); padding:8px 16px; border-radius:9px; font-size:13px; cursor:pointer; }
  .toolbar button.active { background:var(--red); border-color:var(--red); font-weight:700; }

  /* GRID học */
  .signs-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px; max-width:none; width:100%; }
  .sign-card { background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px; text-align:center; cursor:pointer; transition:transform .12s, border-color .15s; }
  .sign-card:hover { transform:translateY(-3px); border-color:var(--yellow); }
  .sign-card svg { width:84px; height:84px; display:block; margin:0 auto 10px; }
  .sign-card .name { font-size:12.5px; line-height:1.4; color: var(--text); }
  .sign-card .id { font-size:11px; color:var(--muted); margin-top:3px; }

  /* QUIZ mode */
  .quiz-area { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px; max-width:520px; width:100%; text-align:center; }
  .quiz-area .big-sign svg { width:160px; height:160px; }
  .quiz-area .question { margin: 12px 0 18px; font-size:16px; color: var(--muted); }
  .answers { display:grid; gap:10px; grid-template-columns: 1fr 1fr; }
  .answers button { padding:14px; border-radius:9px; border:1px solid var(--border); background:rgba(0,0,0,.2);
    color:var(--text); cursor:pointer; font-family:inherit; font-size:13.5px; transition:.15s; }
  .answers button:hover { background:rgba(255,255,255,.06); }
  .answers button.right { background:rgba(16,185,129,.2); border-color:var(--green); color:#6ee7b7; }
  .answers button.wrong { background:rgba(220,38,38,.2); border-color:var(--red); color:#fca5a5; }

  .stats { display:flex; gap:18px; font-size:13px; color: var(--muted); }
  .stats b { color: var(--text); font-size:15px; }

  /* DETAIL modal */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center;
    justify-content:center; z-index:100; padding:20px; }
  .modal-bg.show { display:flex; }
  .modal { background:#1a1a2e; border:1px solid var(--border); border-radius:16px; padding:24px;
    max-width:420px; width:100%; text-align:center; }
  .modal svg { width:140px; height:140px; }
  .modal h3 { margin: 12px 0 6px; }
  .modal .group { color: var(--muted); font-size:13px; }
  .modal .meaning { margin: 14px 0; line-height: 1.6; font-size: 14.5px; }
  .modal button { padding: 9px 20px; border-radius: 9px; border:0; background:var(--red);
    color:white; font-weight:700; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<h1>🚸 Biển báo Giao thông Việt Nam</h1>

<div class="toolbar">
  <button data-mode="learn" class="active">📖 Học</button>
  <button data-mode="quiz">🎯 Đố vui</button>
  <button data-group="all" data-group-tab class="active">Tất cả</button>
  <button data-group="cam" data-group-tab>🚫 Cấm</button>
  <button data-group="nguyhiem" data-group-tab>⚠️ Nguy hiểm</button>
  <button data-group="hieulenh" data-group-tab>✅ Hiệu lệnh</button>
  <button data-group="chidan" data-group-tab>📍 Chỉ dẫn</button>
</div>

<div class="stats" id="quizStats" style="display:none">
  <span>Đúng: <b id="rCnt">0</b></span>
  <span>Sai: <b id="wCnt">0</b></span>
  <span>Streak: <b id="strk">0</b></span>
</div>

<div class="signs-grid" id="learnGrid"></div>

<div class="quiz-area" id="quizArea" style="display:none">
  <div class="big-sign" id="quizSign"></div>
  <div class="question">Biển báo này có ý nghĩa gì?</div>
  <div class="answers" id="quizAnswers"></div>
  <div style="margin-top:14px; color:var(--muted); font-size:13px;" id="quizExplain"></div>
  <button id="nextQuizBtn" style="display:none; margin-top:14px; padding:10px 20px; border-radius:9px;
    border:0; background:var(--red); color:white; font-weight:700; cursor:pointer; font-family:inherit;">
    Câu tiếp →
  </button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>
  // Biển báo — vẽ bằng SVG inline (không cần asset). 4 nhóm theo QCVN 41:2019.
  // Mỗi entry: { id, group, name, meaning, svg }
  // - cam (cấm)     : viền đỏ, nền trắng, gạch đỏ
  // - nguyhiem      : tam giác viền đỏ, nền vàng
  // - hieulenh      : tròn xanh dương, ký hiệu trắng
  // - chidan        : chữ nhật xanh dương, chữ trắng
  function svgCam(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="white" stroke="${'#dc2626'}" stroke-width="7"/>
      ${inner}</svg>`;
  }
  function svgNguyHiem(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,8 92,86 8,86" fill="${'#fbbf24'}" stroke="${'#dc2626'}" stroke-width="6" stroke-linejoin="round"/>
      ${inner}</svg>`;
  }
  function svgHieuLenh(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="${'#2563eb'}" stroke="white" stroke-width="2"/>
      ${inner}</svg>`;
  }
  function svgChiDan(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="20" width="84" height="60" rx="4" fill="${'#2563eb'}" stroke="white" stroke-width="2"/>
      ${inner}</svg>`;
  }

  const SIGNS = [
    // ─── CẤM ───
    { id:'P101', group:'cam', name:'Đường cấm',
      meaning:'Cấm mọi phương tiện (cơ giới và thô sơ) đi vào, trừ xe ưu tiên đang làm nhiệm vụ.',
      svg: svgCam('<line x1="22" y1="50" x2="78" y2="50" stroke="#dc2626" stroke-width="8"/>') },
    { id:'P102', group:'cam', name:'Cấm đi ngược chiều',
      meaning:'Cấm các loại xe (cơ giới và thô sơ) đi vào đoạn đường đặt biển — trừ xe ưu tiên.',
      svg: svgCam('<rect x="22" y="44" width="56" height="12" fill="white" stroke="#dc2626" stroke-width="0"/>') },
    { id:'P103', group:'cam', name:'Cấm ô tô',
      meaning:'Cấm xe ô tô (kể cả mô-tô 3 bánh có thùng).',
      svg: svgCam('<text x="50" y="58" font-family="sans-serif" font-size="36" font-weight="800" text-anchor="middle" fill="#1f2937">🚗</text><line x1="20" y1="80" x2="80" y2="20" stroke="#dc2626" stroke-width="6"/>') },
    { id:'P124', group:'cam', name:'Cấm rẽ trái',
      meaning:'Cấm các phương tiện rẽ trái tại nơi đặt biển. Quay đầu cũng bị cấm theo.',
      svg: svgCam('<path d="M65 35 L40 35 L40 25 L25 50 L40 75 L40 65 L65 65 Z" fill="#1f2937"/><line x1="20" y1="80" x2="80" y2="20" stroke="#dc2626" stroke-width="6"/>') },
    { id:'P127', group:'cam', name:'Cấm vượt',
      meaning:'Cấm các loại xe cơ giới vượt nhau. Được vượt xe máy chuyên dùng và xe thô sơ.',
      svg: svgCam('<text x="35" y="62" font-size="26" fill="#1f2937">🚙</text><text x="65" y="58" font-size="22" fill="#dc2626">🚗</text>') },
    { id:'P130', group:'cam', name:'Cấm dừng và đỗ xe',
      meaning:'Cấm DỪNG và cấm ĐỖ. Hai gạch chéo X.',
      svg: svgCam('<line x1="20" y1="20" x2="80" y2="80" stroke="#dc2626" stroke-width="8"/><line x1="80" y1="20" x2="20" y2="80" stroke="#dc2626" stroke-width="8"/>') },

    // ─── NGUY HIỂM ───
    { id:'W201a', group:'nguyhiem', name:'Chỗ ngoặt nguy hiểm (trái)',
      meaning:'Báo phía trước có khúc cua nguy hiểm về bên trái — phải giảm tốc.',
      svg: svgNguyHiem('<path d="M50 70 L50 55 Q50 45 40 45 L30 45" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/><polygon points="25,38 18,45 25,52" fill="#1f2937"/>') },
    { id:'W202', group:'nguyhiem', name:'Đường nhiều chỗ ngoặt',
      meaning:'Đoạn đường có liên tiếp 2 chỗ ngoặt trở lên — phải đi chậm.',
      svg: svgNguyHiem('<path d="M30 70 Q40 60 50 65 Q60 70 70 60 Q80 50 70 40" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>') },
    { id:'W207', group:'nguyhiem', name:'Giao nhau với đường ưu tiên',
      meaning:'Phía trước có ngã tư giao với đường ưu tiên — phải nhường đường cho xe trên đường ưu tiên.',
      svg: svgNguyHiem('<polygon points="50,35 65,55 50,75 35,55" fill="white" stroke="#1f2937" stroke-width="3"/>') },
    { id:'W210', group:'nguyhiem', name:'Đường sắt cắt qua',
      meaning:'Phía trước có đường sắt cắt ngang KHÔNG có rào chắn — phải dừng quan sát.',
      svg: svgNguyHiem('<line x1="32" y1="45" x2="68" y2="65" stroke="#1f2937" stroke-width="4"/><line x1="68" y1="45" x2="32" y2="65" stroke="#1f2937" stroke-width="4"/><circle cx="50" cy="55" r="3" fill="#1f2937"/>') },
    { id:'W219', group:'nguyhiem', name:'Đường có dốc xuống nguy hiểm',
      meaning:'Đoạn đường dốc xuống — số phần trăm chỉ độ dốc. Giảm tốc, đi số thấp.',
      svg: svgNguyHiem('<polygon points="25,55 70,75 70,55" fill="#1f2937"/><text x="40" y="50" font-size="14" font-weight="700" fill="#1f2937">10%</text>') },
    { id:'W224', group:'nguyhiem', name:'Người đi bộ cắt ngang',
      meaning:'Có vạch sang đường cho người đi bộ phía trước — phải giảm tốc, nhường đường.',
      svg: svgNguyHiem('<text x="50" y="68" font-size="34" text-anchor="middle">🚶</text>') },

    // ─── HIỆU LỆNH ───
    { id:'R301a', group:'hieulenh', name:'Hướng đi phải theo: thẳng',
      meaning:'Các xe chỉ được đi thẳng — không được rẽ.',
      svg: svgHieuLenh('<polygon points="50,25 60,40 53,40 53,75 47,75 47,40 40,40" fill="white"/>') },
    { id:'R302', group:'hieulenh', name:'Hướng phải đi vòng chướng ngại vật',
      meaning:'Phương tiện phải vòng qua chướng ngại vật theo hướng mũi tên.',
      svg: svgHieuLenh('<path d="M35 50 Q50 30 65 50" fill="none" stroke="white" stroke-width="5"/><polygon points="65,55 75,50 65,45" fill="white"/>') },
    { id:'R303', group:'hieulenh', name:'Nơi giao nhau chạy theo vòng xuyến',
      meaning:'Xe phải đi vòng theo chiều mũi tên (đảo tròn) — nhường xe đã trong vòng xuyến.',
      svg: svgHieuLenh('<circle cx="50" cy="50" r="20" fill="none" stroke="white" stroke-width="4" stroke-dasharray="10 5"/><polygon points="70,38 78,42 70,46" fill="white"/>') },
    { id:'R304', group:'hieulenh', name:'Đường dành cho xe thô sơ',
      meaning:'Đường chỉ dành cho xe đạp + xe thô sơ.',
      svg: svgHieuLenh('<text x="50" y="68" font-size="40" text-anchor="middle">🚲</text>') },
    { id:'R305', group:'hieulenh', name:'Đường dành cho người đi bộ',
      meaning:'Đường chỉ dành cho người đi bộ — cấm xe.',
      svg: svgHieuLenh('<text x="50" y="68" font-size="40" text-anchor="middle">🚶</text>') },

    // ─── CHỈ DẪN ───
    { id:'I401', group:'chidan', name:'Bắt đầu đường ưu tiên',
      meaning:'Báo bắt đầu đoạn đường có quyền ưu tiên — xe trên đường khác phải nhường.',
      svg: svgChiDan('<polygon points="50,32 65,50 50,68 35,50" fill="#fbbf24" stroke="white" stroke-width="2"/>') },
    { id:'I423a', group:'chidan', name:'Đường cho người đi bộ sang ngang',
      meaning:'Báo có vạch kẻ đường cho người đi bộ — phương tiện phải nhường.',
      svg: svgChiDan('<text x="50" y="62" font-size="30" text-anchor="middle">🚶</text>') },
    { id:'I425', group:'chidan', name:'Bệnh viện',
      meaning:'Báo có bệnh viện gần đó — xe phải đi chậm, không bóp còi.',
      svg: svgChiDan('<rect x="38" y="32" width="24" height="36" fill="white"/><rect x="44" y="44" width="12" height="4" fill="#dc2626"/><rect x="48" y="40" width="4" height="12" fill="#dc2626"/>') },
    { id:'I431', group:'chidan', name:'Chỗ đỗ xe',
      meaning:'Bãi đỗ xe được phép. Có thể có thêm biển phụ ghi thời gian/loại xe.',
      svg: svgChiDan('<text x="50" y="68" font-size="42" font-weight="900" text-anchor="middle" fill="white">P</text>') },
  ];

  const GROUP_LABELS = { cam:'Biển CẤM', nguyhiem:'Biển NGUY HIỂM', hieulenh:'Biển HIỆU LỆNH', chidan:'Biển CHỈ DẪN' };
  const el = id => document.getElementById(id);
  let mode = 'learn', group = 'all';
  let quiz = null, rCnt = 0, wCnt = 0, strk = 0;

  function renderLearn() {
    el('learnGrid').style.display = '';
    el('quizArea').style.display = 'none';
    el('quizStats').style.display = 'none';
    const list = group === 'all' ? SIGNS : SIGNS.filter(s => s.group === group);
    el('learnGrid').innerHTML = list.map(s => `
      <div class="sign-card" data-id="${s.id}">
        ${s.svg}
        <div class="name">${s.name}</div>
        <div class="id">${s.id}</div>
      </div>`).join('');
    document.querySelectorAll('.sign-card').forEach(c => c.onclick = () => showDetail(c.dataset.id));
  }
  function showDetail(id) {
    const s = SIGNS.find(x => x.id === id);
    el('modalContent').innerHTML = `
      ${s.svg}
      <h3>${s.name}</h3>
      <div class="group">${GROUP_LABELS[s.group]} · ${s.id}</div>
      <div class="meaning">${s.meaning}</div>
      <button onclick="document.getElementById('modalBg').classList.remove('show')">Đóng</button>`;
    el('modalBg').classList.add('show');
  }
  el('modalBg').onclick = (e) => { if (e.target.id === 'modalBg') el('modalBg').classList.remove('show'); };

  function pickQuiz() {
    const list = group === 'all' ? SIGNS : SIGNS.filter(s => s.group === group);
    const correct = list[Math.floor(Math.random() * list.length)];
    const others = list.filter(s => s.id !== correct.id).sort(() => Math.random() - .5).slice(0, 3);
    const choices = [...others, correct].sort(() => Math.random() - .5);
    return { correct, choices };
  }
  function renderQuiz() {
    el('learnGrid').style.display = 'none';
    el('quizArea').style.display = '';
    el('quizStats').style.display = '';
    quiz = pickQuiz();
    el('quizSign').innerHTML = quiz.correct.svg;
    el('quizAnswers').innerHTML = quiz.choices.map(c => `
      <button data-correct="${c.id === quiz.correct.id}">${c.name}</button>
    `).join('');
    el('quizExplain').textContent = '';
    el('nextQuizBtn').style.display = 'none';
    document.querySelectorAll('#quizAnswers button').forEach(b => b.onclick = () => answerQuiz(b));
  }
  function answerQuiz(btn) {
    const right = btn.dataset.correct === 'true';
    document.querySelectorAll('#quizAnswers button').forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === 'true') b.classList.add('right');
      else if (b === btn) b.classList.add('wrong');
    });
    if (right) { rCnt++; strk++; } else { wCnt++; strk = 0; }
    el('rCnt').textContent = rCnt;
    el('wCnt').textContent = wCnt;
    el('strk').textContent = strk;
    el('quizExplain').textContent = (right ? '✅ Đúng. ' : `❌ Đáp án đúng: ${quiz.correct.name}. `) + quiz.correct.meaning;
    el('nextQuizBtn').style.display = '';
  }
  el('nextQuizBtn').onclick = renderQuiz;

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    if (m === 'learn') renderLearn();
    else renderQuiz();
  }
  function setGroup(g) {
    group = g;
    document.querySelectorAll('[data-group-tab]').forEach(b => b.classList.toggle('active', b.dataset.group === g));
    if (mode === 'learn') renderLearn();
    else renderQuiz();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll('[data-group-tab]').forEach(b => b.onclick = () => setGroup(b.dataset.group));

  renderLearn();
</script>
</body>
</html>
