<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🌍 Campus đa người chơi · Tizia</title>
<meta name="description" content="Cùng bạn học vào chung campus ảo, gặp avatar bạn, chat, đi cùng. WebSocket real-time presence." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a; --card-2:#1d2547;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; overflow:hidden;
    font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--text);
    background:#020617;
  }
  a { color:inherit; }
  .top { position:absolute; top:0; left:0; right:0; z-index:10;
    backdrop-filter:blur(12px); background:rgba(11,16,32,.6);
    padding:10px 14px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:6px 12px; border-radius:14px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:12.5px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:15px; }
  .top .ws-status { margin-left:auto; font-size:12px; padding:4px 12px; border-radius:999px;
    background:rgba(34,197,94,.18); color:#86efac; }
  .top .ws-status.off { background:rgba(239,68,68,.18); color:#fda4af; }

  .stage { position:absolute; inset:0; }
  .stage canvas { display:block; width:100%; height:100%; }

  .room-picker {
    position:absolute; top:54px; left:14px; z-index:10;
    display:flex; gap:6px;
  }
  .room-picker .r {
    padding:5px 12px; border-radius:14px;
    background:rgba(15,23,42,.85); border:1px solid var(--border);
    font-size:12px; cursor:pointer; transition:background .12s;
  }
  .room-picker .r:hover { background:rgba(255,255,255,.10); }
  .room-picker .r.cur { background:var(--accent); color:#1e293b; border-color:var(--accent); font-weight:700; }

  .players {
    position:absolute; top:54px; right:14px; z-index:10;
    width:240px; max-height:60vh; overflow-y:auto;
    background:rgba(15,23,42,.88); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:14px;
    padding:10px 12px;
  }
  .players h4 { margin:0 0 8px; font-size:11px; letter-spacing:1px;
    text-transform:uppercase; color:var(--text-soft); }
  .players .p {
    display:flex; gap:8px; align-items:center; padding:6px 0;
    font-size:12.5px; border-top:1px solid rgba(255,255,255,.04);
  }
  .players .p:first-child { border-top:none; }
  .players .p .dot { width:8px; height:8px; border-radius:50%; background:var(--good); }
  .players .p.me .dot { background:var(--accent); }
  .players .p .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .players .p .me-tag { font-size:10px; color:var(--accent); font-weight:700; }

  .chat {
    position:absolute; bottom:14px; left:14px; z-index:10;
    width:min(420px, 60vw);
    background:rgba(15,23,42,.88); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:14px; padding:10px 12px;
  }
  .chat .msgs { max-height:160px; overflow-y:auto; font-size:12.5px; line-height:1.5; }
  .chat .msgs .m { margin-bottom:4px; }
  .chat .msgs .m b { color:var(--accent); }
  .chat .msgs .m.sys { color:var(--text-soft); font-style:italic; }
  .chat input {
    width:100%; margin-top:6px; padding:7px 10px;
    background:rgba(255,255,255,.06); border:1px solid var(--border);
    border-radius:10px; color:#fff; font-family:inherit; font-size:13px;
  }
  .chat input:focus { outline:none; border-color:var(--accent); }

  .controls {
    position:absolute; bottom:14px; right:14px; z-index:10;
    display:grid; grid-template-columns:repeat(3, 44px); grid-template-rows:repeat(3, 44px);
    gap:4px; pointer-events:auto;
  }
  .controls button {
    background:rgba(15,23,42,.85); backdrop-filter:blur(6px);
    border:1px solid var(--border); color:#fff;
    border-radius:10px; cursor:pointer; font-size:18px;
    transition:background .1s;
  }
  .controls button:active { background:var(--accent); color:#1e293b; }
  .controls button:nth-child(1), .controls button:nth-child(3),
  .controls button:nth-child(7), .controls button:nth-child(9) { visibility:hidden; }

  .toast {
    position:absolute; top:90px; left:50%; transform:translateX(-50%);
    z-index:30; padding:8px 16px; border-radius:999px;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    font-weight:700; font-size:13px;
    opacity:0; transition:opacity .25s, transform .25s;
    pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/index.html">←</a>
  <h1>🌍 Campus đa người chơi <span style="opacity:.6;font-weight:400">(beta)</span></h1>
  <span class="ws-status off" id="ws-status">⏸ Chưa kết nối</span>
</div>

<div class="room-picker" id="room-picker">
  <div class="r cur" data-room="lobby">Sảnh chung</div>
  <div class="r" data-room="lop2a">Lớp 2A</div>
  <div class="r" data-room="thu-vien">Thư viện</div>
  <div class="r" data-room="san-truong">Sân trường</div>
</div>

<div class="players" id="players">
  <h4>👥 Đang online (1)</h4>
  <div class="p me"><span class="dot"></span><span class="name">Bạn</span><span class="me-tag">YOU</span></div>
</div>

<div class="stage">
  <canvas id="world"></canvas>
</div>

<div class="chat">
  <div class="msgs" id="msgs"><div class="m sys">Gõ tin nhắn rồi Enter…</div></div>
  <input id="chat-in" type="text" placeholder="Gõ tin nhắn, Enter để gửi" maxlength="200">
</div>

<div class="controls">
  <button></button><button data-mv="N">⬆</button><button></button>
  <button data-mv="W">⬅</button><button></button><button data-mv="E">➡</button>
  <button></button><button data-mv="S">⬇</button><button></button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
let W = 800, H = 600;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize); resize();

const TILE = 48;
const GRID = 16;       // 16x16 logical world
const ORIGIN = () => ({ x: W/2 - (GRID*TILE)/2, y: H/2 - (GRID*TILE)/2 });

const me = { id: null, name: 'Bạn', x: 8, y: 8, dir: 'S', pet: '🦉' };
const others = new Map();   // user_id → {x, y, dir, name, pet}
let ws = null, currentRoom = 'lobby';

function setStatus(text, ok=false) {
  const el = document.getElementById('ws-status');
  el.textContent = text;
  el.classList.toggle('off', !ok);
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws-presence`);
  ws.onopen = () => {
    setStatus('🟢 Online', true);
    sendJoin(currentRoom);
  };
  ws.onclose = () => {
    setStatus('🔴 Mất kết nối', false);
    setTimeout(connect, 3000);
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    handle(msg);
  };
}

function send(payload) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(payload)); }
function sendMove() {
  send({ type:'move', x: me.x, y: me.y, dir: me.dir, pet: me.pet });
}
function sendJoin(room) {
  send({ type:'join_room', room });
  others.clear();
  appendChat('sys', `📍 Đã vào phòng "${room}"`);
}

function handle(msg) {
  if (msg.type === 'hello') {
    me.id = msg.you.user_id; me.name = msg.you.name || 'Bạn';
    appendChat('sys', `👋 Xin chào ${me.name}!`);
    for (const p of msg.players || []) {
      if (p.user_id !== me.id) others.set(p.user_id, p);
    }
    renderPlayers();
    sendMove();
  } else if (msg.type === 'room') {
    others.clear();
    for (const p of msg.players || []) {
      if (p.user_id !== me.id) others.set(p.user_id, p);
    }
    renderPlayers();
    sendMove();
  } else if (msg.type === 'join') {
    if (msg.user_id !== me.id) {
      others.set(msg.user_id, { user_id: msg.user_id, name: msg.name, x: 8, y: 8, dir: 'S' });
      appendChat('sys', `→ ${msg.name} đã vào phòng`);
      toast(`👋 ${msg.name} đã vào`);
      renderPlayers();
    }
  } else if (msg.type === 'leave') {
    const p = others.get(msg.user_id);
    if (p) appendChat('sys', `← ${p.name} đã rời phòng`);
    others.delete(msg.user_id);
    renderPlayers();
  } else if (msg.type === 'move') {
    const p = others.get(msg.user_id);
    if (p) { p.x = msg.x; p.y = msg.y; p.dir = msg.dir; p.pet = msg.pet; }
    else others.set(msg.user_id, { user_id: msg.user_id, x: msg.x, y: msg.y, dir: msg.dir, pet: msg.pet });
  } else if (msg.type === 'chat') {
    appendChat(msg.user_id === me.id ? 'me' : 'other', `${msg.name || '?'}: ${msg.text}`);
  } else if (msg.type === 'error' && msg.error === 'unauthorized') {
    setStatus('❌ Cần đăng nhập', false);
    appendChat('sys', 'Hãy đăng nhập trước. Quay lại trang chủ để đăng nhập.');
  }
}

function appendChat(cls, html) {
  const m = document.createElement('div');
  m.className = 'm ' + cls;
  m.innerHTML = cls === 'me' ? `<b>(em)</b> ${esc(html.replace(/.*?: /, ''))}`
              : cls === 'other' ? `<b>${esc(html.split(': ')[0])}</b>: ${esc(html.split(': ').slice(1).join(': '))}`
              : esc(html);
  document.getElementById('msgs').appendChild(m);
  const msgs = document.getElementById('msgs');
  msgs.scrollTop = msgs.scrollHeight;
}
function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPlayers() {
  const list = document.getElementById('players');
  const all = [{ user_id: me.id, name: me.name, isMe: true }, ...[...others.values()]];
  list.innerHTML = `<h4>👥 Đang online (${all.length})</h4>` + all.map(p => `
    <div class="p ${p.isMe ? 'me' : ''}">
      <span class="dot"></span>
      <span class="name">${esc(p.name || '?')}</span>
      ${p.isMe ? '<span class="me-tag">YOU</span>' : ''}
    </div>
  `).join('');
}

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);
  const o = ORIGIN();
  // Tile grid + bg
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const cx = o.x + x * TILE, cy = o.y + y * TILE;
      ctx.fillStyle = (x + y) % 2 === 0 ? '#1e293b' : '#162033';
      ctx.fillRect(cx, cy, TILE, TILE);
    }
  }
  // Walls border
  ctx.strokeStyle = 'rgba(251,191,36,0.4)';
  ctx.lineWidth = 3;
  ctx.strokeRect(o.x, o.y, GRID * TILE, GRID * TILE);

  // Other players
  for (const p of others.values()) {
    drawPlayer(p.x, p.y, p.name, p.pet || '👤', '#a78bfa');
  }
  // Me
  drawPlayer(me.x, me.y, me.name + ' (em)', me.pet, '#fbbf24');
}

function drawPlayer(x, y, name, pet, ringColor) {
  const o = ORIGIN();
  const cx = o.x + x * TILE + TILE/2;
  const cy = o.y + y * TILE + TILE/2;
  // Ring
  ctx.beginPath();
  ctx.arc(cx, cy + 3, TILE * 0.42, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  // Avatar circle
  ctx.beginPath();
  ctx.arc(cx, cy, TILE * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = ringColor + '33';
  ctx.fill();
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = 2;
  ctx.stroke();
  // Pet emoji
  ctx.font = `${TILE * 0.5}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(pet || '👤', cx, cy);
  // Name tag
  ctx.font = '12px Inter';
  ctx.textBaseline = 'top';
  const tw = ctx.measureText(name).width;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(cx - tw/2 - 6, cy + TILE*0.35 + 2, tw + 12, 18);
  ctx.fillStyle = '#fff';
  ctx.fillText(name, cx, cy + TILE*0.35 + 4);
}

function tick() {
  draw();
  requestAnimationFrame(tick);
}
tick();

// Controls
function move(dir) {
  me.dir = dir;
  if (dir === 'N') me.y = Math.max(0, me.y - 1);
  if (dir === 'S') me.y = Math.min(GRID-1, me.y + 1);
  if (dir === 'W') me.x = Math.max(0, me.x - 1);
  if (dir === 'E') me.x = Math.min(GRID-1, me.x + 1);
  sendMove();
}
window.addEventListener('keydown', (e) => {
  const k = { ArrowUp:'N', ArrowDown:'S', ArrowLeft:'W', ArrowRight:'E',
              w:'N', s:'S', a:'W', d:'E' }[e.key];
  if (k) { e.preventDefault(); move(k); }
});
document.querySelectorAll('.controls button[data-mv]').forEach(b => {
  b.addEventListener('click', () => move(b.dataset.mv));
});
document.getElementById('room-picker').addEventListener('click', (e) => {
  const el = e.target.closest('.r');
  if (!el) return;
  document.querySelectorAll('.room-picker .r').forEach(r => r.classList.remove('cur'));
  el.classList.add('cur');
  currentRoom = el.dataset.room;
  sendJoin(currentRoom);
});
document.getElementById('chat-in').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const text = e.target.value.trim();
    if (text) { send({ type:'chat', text }); e.target.value = ''; }
  }
});

// Bootstrap: lấy pet user → set me.pet, sau đó connect
async function init() {
  try {
    const r = await fetch('/api/pet/me', { credentials: 'same-origin' });
    if (r.ok) { const d = await r.json(); me.pet = d.pet?.sprite || '🦉'; }
  } catch {}
  connect();
}
init();
</script>
</body>
</html>
