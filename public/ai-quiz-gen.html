<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🤖 AI Quiz Generator · Tizia</title>
<meta name="description" content="Sinh quest trắc nghiệm bằng AI — chỉ cần nhập chủ đề + lớp. Xem trước, chỉnh sửa, đăng vào marketplace." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --card:#151c3a;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 20% 0%, rgba(167,139,250,.12), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(34,197,94,.08), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }

  .wrap { max-width:none; margin:24px auto 80px; padding:0 18px; }

  .panel { background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:20px; margin-bottom:16px; }
  .panel h3 { margin:0 0 10px; font-size:14px; color:var(--text-soft);
    letter-spacing:.6px; text-transform:uppercase; }

  label { display:block; font-size:11px; color:var(--text-soft);
    font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin:10px 0 5px; }
  input, textarea, select {
    width:100%; padding:10px 14px; border-radius:10px;
    background:rgba(0,0,0,.3); border:1px solid var(--border); color:#fff;
    font-family:inherit; font-size:14px;
  }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }

  .row3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .gen-btn {
    margin-top:14px; padding:12px 24px; border-radius:12px;
    background:linear-gradient(135deg, var(--purple), #6366f1); color:#fff;
    border:none; cursor:pointer; font:800 14px 'Inter', system-ui, sans-serif;
    box-shadow:0 6px 18px rgba(99,102,241,.3); width:100%;
  }
  .gen-btn:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }

  .preview-q {
    background:rgba(255,255,255,.04); border:1px solid var(--border);
    border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .preview-q .qn { font-size:11px; color:var(--text-soft); margin-bottom:5px; }
  .preview-q .txt { font-weight:700; margin-bottom:8px; }
  .preview-q .opt {
    display:block; padding:7px 10px; border-radius:8px; margin:4px 0;
    background:rgba(255,255,255,.03); font-size:13px;
  }
  .preview-q .opt.correct { background:rgba(34,197,94,.18); color:var(--good); font-weight:700; }

  .publish-btn {
    padding:12px 28px; border-radius:12px;
    background:linear-gradient(135deg, var(--good), #10b981); color:#052e16;
    border:none; cursor:pointer; font:800 14px 'Inter', system-ui, sans-serif;
    box-shadow:0 6px 18px rgba(52,211,153,.3);
  }
  .live-btn {
    padding:12px 28px; border-radius:12px;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    border:none; cursor:pointer; font:800 14px 'Inter', system-ui, sans-serif;
    margin-left:8px;
  }

  .spinner {
    display:inline-block; width:18px; height:18px; border:2.5px solid rgba(255,255,255,.2);
    border-top-color:#fff; border-radius:50%;
    animation:tz-spin 0.7s linear infinite; vertical-align:middle; margin-right:8px;
  }
  @keyframes tz-spin { to { transform:rotate(360deg); } }

  .msg { padding:10px 14px; border-radius:10px; margin-top:14px; font-size:13px; }
  .msg.err { background:rgba(239,68,68,.10); color:#fda4af; border-left:3px solid var(--bad); }
  .msg.ok { background:rgba(34,197,94,.10); color:#86efac; border-left:3px solid var(--good); }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/ugc/index.html">← Marketplace</a>
  <h1>🤖 AI Quiz Generator</h1>
</div>

<div class="wrap">
  <div class="panel">
    <h3>🪄 Sinh quest tự động</h3>
    <label>Chủ đề (rõ ràng càng tốt)</label>
    <input id="topic" maxlength="200" placeholder="VD: Phép cộng 2 chữ số có nhớ trong phạm vi 100">
    <div class="row3">
      <div>
        <label>Lớp</label>
        <select id="grade">
          <option value="">— Tất cả —</option>
          <option value="1">Lớp 1</option><option value="2" selected>Lớp 2</option>
          <option value="3">Lớp 3</option><option value="4">Lớp 4</option>
          <option value="5">Lớp 5</option><option value="6">Lớp 6</option>
          <option value="7">Lớp 7</option><option value="8">Lớp 8</option>
          <option value="9">Lớp 9</option><option value="10">Lớp 10</option>
          <option value="11">Lớp 11</option><option value="12">Lớp 12</option>
        </select>
      </div>
      <div>
        <label>Môn</label>
        <select id="subject">
          <option value="">— Chọn —</option>
          <option value="Toán" selected>📐 Toán</option>
          <option value="Tiếng Việt">📚 Tiếng Việt</option>
          <option value="Tiếng Anh">🇬🇧 Tiếng Anh</option>
          <option value="Khoa học">🔬 Khoa học</option>
          <option value="Sử Địa">🌏 Sử Địa</option>
          <option value="Tin học">💻 Tin học</option>
        </select>
      </div>
      <div>
        <label>Số câu (3-15)</label>
        <input id="count" type="number" min="3" max="15" value="5">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>Độ khó</label>
        <select id="difficulty">
          <option value="easy">Dễ</option>
          <option value="medium" selected>Trung bình</option>
          <option value="hard">Khó</option>
        </select>
      </div>
      <div>
        <label>Ngôn ngữ</label>
        <select id="language">
          <option value="vi" selected>Tiếng Việt</option>
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </div>
    </div>
    <button class="gen-btn" id="gen">🪄 Sinh quest bằng AI</button>
    <div id="msg"></div>
  </div>

  <div class="panel" id="preview-panel" hidden>
    <h3>👀 Xem trước</h3>
    <input id="p-title" maxlength="100" placeholder="Tiêu đề" style="font-size:16px;font-weight:800;margin-bottom:8px">
    <textarea id="p-desc" rows="2" maxlength="500" placeholder="Mô tả"></textarea>
    <div id="preview"></div>
    <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <button class="publish-btn" id="publish">📢 Đăng vào Marketplace</button>
      <button class="live-btn" id="live">🎤 Mở Live Quiz</button>
    </div>
    <div id="pub-msg"></div>
  </div>
</div>

<script type="module">
let generated = null;

// Prefill từ URL — các landing (hoc-thong-minh, trường Lái xe) link tới đây
// dạng /ai-quiz-gen.html?topic=...&grade=...&subject=...
{
  const qs = new URLSearchParams(location.search);
  const TOPIC_PRESETS = { driving: 'Tình huống lái xe an toàn theo luật giao thông VN' };
  const topic = qs.get('topic');
  if (topic) document.getElementById('topic').value = TOPIC_PRESETS[topic] || topic;
  const grade = qs.get('grade');
  if (grade && document.querySelector(`#grade option[value="${CSS.escape(grade)}"]`)) {
    document.getElementById('grade').value = grade;
  }
  const subject = qs.get('subject');
  if (subject && document.querySelector(`#subject option[value="${CSS.escape(subject)}"]`)) {
    document.getElementById('subject').value = subject;
  }
}

document.getElementById('gen').addEventListener('click', async () => {
  const btn = document.getElementById('gen');
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { msg.innerHTML = '<div class="msg err">Hãy nhập chủ đề</div>'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>AI đang suy nghĩ…';
  try {
    const r = await fetch('/api/ai/quiz-generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        topic,
        grade: document.getElementById('grade').value,
        subject: document.getElementById('subject').value,
        count: Number(document.getElementById('count').value),
        difficulty: document.getElementById('difficulty').value,
        language: document.getElementById('language').value,
      }),
      credentials:'same-origin',
    });
    const d = await r.json();
    if (d.error) { msg.innerHTML = `<div class="msg err">AI lỗi: ${esc(d.error)} ${d.detail ? '· ' + esc(d.detail.slice(0,200)) : ''}</div>`; return; }
    if (!d.ok || !d.quest) { msg.innerHTML = '<div class="msg err">Không nhận được kết quả</div>'; return; }
    generated = d.quest;
    showPreview();
    msg.innerHTML = `<div class="msg ok">✓ AI sinh xong ${d.quest.questions.length} câu (raw: ${d.raw_count})</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg err">Lỗi mạng: ${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🪄 Sinh quest bằng AI';
  }
});

function showPreview() {
  document.getElementById('preview-panel').hidden = false;
  document.getElementById('p-title').value = generated.title;
  document.getElementById('p-desc').value = generated.description;
  const wrap = document.getElementById('preview');
  wrap.innerHTML = generated.questions.map((q, i) => `
    <div class="preview-q">
      <div class="qn">Câu ${i+1}</div>
      <div class="txt">${esc(q.text)}</div>
      ${q.options.map((o, j) => `
        <div class="opt ${j === q.correct ? 'correct' : ''}">${String.fromCharCode(65+j)}. ${esc(o)} ${j === q.correct ? '✓' : ''}</div>
      `).join('')}
    </div>
  `).join('');
}

document.getElementById('publish').addEventListener('click', async () => {
  const pubMsg = document.getElementById('pub-msg');
  pubMsg.innerHTML = '';
  const subjectMap = {'Toán':'toan','Tiếng Việt':'van','Tiếng Anh':'anh','Khoa học':'khoa-hoc','Sử Địa':'su-dia','Tin học':'tin-hoc'};
  const payload = {
    title: document.getElementById('p-title').value.trim(),
    description: document.getElementById('p-desc').value.trim(),
    subject_tag: subjectMap[document.getElementById('subject').value] || 'khac',
    grade_tag: document.getElementById('grade').value,
    questions: generated.questions,
  };
  try {
    const r = await fetch('/api/ugc/quests', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload), credentials:'same-origin',
    });
    const d = await r.json();
    if (!r.ok) { pubMsg.innerHTML = `<div class="msg err">${esc(d.error || 'Lỗi')}</div>`; return; }
    pubMsg.innerHTML = `<div class="msg ok">✓ Đăng thành công! <a href="/ugc/index.html" style="color:#fbbf24;text-decoration:underline">Xem trong marketplace →</a></div>`;
  } catch (e) {
    pubMsg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
});

document.getElementById('live').addEventListener('click', async () => {
  const pubMsg = document.getElementById('pub-msg');
  try {
    const r = await fetch('/api/live-quiz/create', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        title: document.getElementById('p-title').value.trim(),
        questions: generated.questions,
      }),
      credentials:'same-origin',
    });
    const d = await r.json();
    if (!r.ok) {
      pubMsg.innerHTML = `<div class="msg err">${esc(d.error || 'Lỗi')}${d.error === 'teacher_only' ? ' (cần role GV/Admin)' : ''}</div>`;
      return;
    }
    location.href = `/live-quiz/host.html?pin=${d.pin}`;
  } catch (e) {
    pubMsg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
});

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-07"></script>
</body>
</html>
