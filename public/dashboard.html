<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#1e3a8a" />
<meta name="robots" content="noindex,nofollow" />
<title>Tizia · Dashboard giảng viên</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, a { touch-action: manipulation; }
  @media (max-width: 720px) {
    body { padding: 20px 12px !important; }
    h1 { font-size: 22px !important; }
    .row { grid-template-columns: 1fr !important; }
    .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .stat .v { font-size: 18px !important; }
    .recent-wrap { overflow-x: auto; }
    table { font-size: 12px; }
    .confusion { font-size: 10px; }
    .histogram { height: 60px !important; }
  }
  body {
    background: linear-gradient(135deg, #1e3a8a 0%, #5b21b6 100%);
    color: white; padding: 28px 20px;
  }
  body > header:not(#auth-header) { max-width: 1200px; margin: 0 auto 24px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 28px; margin: 0; }
  .sub { opacity: 0.75; font-size: 14px; }
  a.back, a.csv {
    color: white; text-decoration: none; font-size: 13px;
    background: rgba(255,255,255,0.15); padding: 6px 12px;
    border-radius: 6px; transition: background 0.15s;
  }
  a.back:hover, a.csv:hover { background: rgba(255,255,255,0.25); }
  a.csv { background: #f59e0b; }
  a.csv:hover { background: #fbbf24; }

  .grid { max-width:none; margin: 0 auto; display: grid; gap: 24px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 24px; }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .card h2 .ver { font-size: 11px; opacity: 0.6; font-weight: normal; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px;
    text-align: center;
  }
  .stat .v { font-size: 22px; font-weight: 700; color: #fbbf24; }
  .stat .l { font-size: 11px; opacity: 0.75; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }

  .histogram { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin: 12px 0 4px; padding: 0 4px; border-bottom: 1px solid rgba(255,255,255,0.2); }
  .bar { flex: 1; background: linear-gradient(180deg, #60a5fa, #2563eb); min-height: 2px; border-radius: 4px 4px 0 0; position: relative; }
  .bar:hover { background: linear-gradient(180deg, #93c5fd, #60a5fa); }
  .bar .lbl { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; opacity: 0.7; white-space: nowrap; }
  .bar .n { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; }
  .hist-wrap { padding: 16px 0 22px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { font-weight: 600; opacity: 0.75; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  td.r, th.r { text-align: right; }
  td.c, th.c { text-align: center; }

  .confusion { font-size: 11px; }
  .confusion td { padding: 4px 6px; }
  .confusion th { font-size: 10px; }
  .confusion .diag { background: rgba(67, 160, 71, 0.35); font-weight: 700; }
  .confusion .err { background: rgba(229, 57, 53, 0.25); }
  .confusion .zero { opacity: 0.3; }
  .confusion .actual { background: rgba(255,255,255,0.06); font-weight: 600; }

  .empty { padding: 24px; text-align: center; opacity: 0.5; font-style: italic; }
  .recent-wrap { max-height: 380px; overflow-y: auto; }
  .badge-v {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px;
    font-weight: 700; letter-spacing: 0.3px;
  }
  .badge-2d { background: #43a047; color: white; }
  .badge-3d { background: #5e35b1; color: white; }
  .badge-mv { background: #0ea5e9; color: white; }
  .badge-qz { background: #0f766e; color: white; }
  .refresh-btn {
    background: rgba(255,255,255,0.18); color: white; border: none; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.28); }
</style>
</head>
<body>
<header>
  <h1>📊 Dashboard giảng viên</h1>
  <span class="sub">Tizia · phân tích lượt chơi của sinh viên</span>
  <span style="flex:1"></span>
  <button class="refresh-btn" id="refresh">🔄 Tải lại</button>
  <a class="csv" href="api/export.csv" download>⬇️ Export CSV</a>
  <a class="back" href="./">← Trang chính</a>
</header>

<div class="grid">
  <div class="row" id="versions-row"></div>

  <!-- 🌟 Trải nghiệm trực quan — surface 5 mini-game lên dashboard để HS/GV thấy ngay -->
  <div class="card" id="exp-card" style="background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(56,189,248,.08))">
    <h2 style="display:flex;align-items:center;gap:10px">
      🎮 Trải nghiệm trực quan
      <span style="font-size:11px;font-weight:600;color:#64748b;background:rgba(100,116,139,.12);padding:3px 10px;border-radius:10px">Bấm vào để chơi ngay</span>
    </h2>
    <div id="exp-grid" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:14px"></div>
  </div>

  <div class="card">
    <h2>🕒 Lượt chơi gần nhất</h2>
    <div class="recent-wrap">
      <table id="recent-table">
        <thead><tr>
          <th>#</th><th>Sinh viên</th><th>Phiên bản</th>
          <th class="r">Điểm</th><th class="r">Đúng/Tổng</th><th class="r">Thời gian</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
const VERSIONS = [
  { id: '2d-arcade',    label: '2D Arcade',         badge: 'badge-2d' },
  { id: '3d-shelf',     label: '3D Realistic',      badge: 'badge-3d' },
  { id: 'metaverse',    label: 'Metaverse',         badge: 'badge-mv' },
  { id: 'quiz',         label: 'Quiz',              badge: 'badge-qz' },
  { id: 'time-attack',  label: 'Time Attack',       badge: 'badge-ta' },
  { id: 'sac-ky-2d',    label: '🧪 Sắc ký 2D',      badge: 'badge-sk2d' },
  { id: 'sac-ky-3d',    label: '🧪 Sắc ký 3D',      badge: 'badge-sk3d' },
  { id: 'sac-ky-vr-web',label: '🧪 Sắc ký VR Web',  badge: 'badge-skvr' },
  { id: 'sac-ky-quiz',  label: '🧪 Sắc ký Quiz',    badge: 'badge-skqz' },
  { id: 'sac-ky-meta',  label: '🧪 Sắc ký Meta',    badge: 'badge-skmt' },
];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
}

function fmtDuration(ms) {
  if (!ms) return '—';
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s/60)}m${(s%60).toString().padStart(2,'0')}`;
}

async function loadVersionCard(v) {
  const [lb, stats, hist, conf] = await Promise.all([
    fetch(`api/leaderboard?version=${v.id}&limit=10`).then(r => r.json()),
    fetch(`api/stats?version=${v.id}`).then(r => r.json()),
    fetch(`api/histogram?version=${v.id}`).then(r => r.json()),
    fetch(`api/confusion?version=${v.id}`).then(r => r.json()),
  ]);
  return { v, lb, stats, hist, conf };
}

function renderHistogram(hist) {
  if (!hist.length) return '<div class="empty" style="padding:8px">Chưa có dữ liệu</div>';
  const max = Math.max(...hist.map(b => b.n), 1);
  return `<div class="hist-wrap"><div class="histogram">${hist.map(b => {
    const pct = (b.n / max) * 100;
    return `<div class="bar" style="height:${pct}%"><span class="n">${b.n}</span><span class="lbl">${b.bucket}-${b.bucket+9}</span></div>`;
  }).join('')}</div></div>`;
}

function renderLeaderboard(lb) {
  if (!lb.length) return '<div class="empty">Chưa có lượt chơi nào</div>';
  return `<table><thead><tr>
    <th>#</th><th>Sinh viên</th><th class="r">Điểm</th><th class="r">Đúng</th><th class="r">Lúc</th>
  </tr></thead><tbody>${lb.map((r, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${escapeHtml(r.player_name)}</td>
      <td class="r" style="color:#fbbf24;font-weight:700">${r.score}</td>
      <td class="r">${r.correct}/${r.total}</td>
      <td class="r" style="opacity:0.65;font-size:11px">${fmtTime(r.created_at)}</td>
    </tr>
  `).join('')}</tbody></table>`;
}

function renderConfusion(conf) {
  const cats = conf.categories;
  if (!cats.length) return '<div class="empty">Chưa đủ dữ liệu</div>';
  const has = cat => conf.matrix[cat] != null;
  const cell = (actual, placed) => (conf.matrix[actual]?.[placed]) ?? 0;
  return `<div style="font-size:12px;opacity:0.7;margin-bottom:6px">Hàng = nhóm thực · Cột = nhóm SV đặt vào (chéo = đúng)</div>
  <table class="confusion"><thead><tr>
    <th></th>${cats.map(c => `<th class="c">${c}</th>`).join('')}
  </tr></thead><tbody>${cats.filter(has).map(actual => `
    <tr>
      <td class="actual">${actual}</td>
      ${cats.map(placed => {
        const n = cell(actual, placed);
        const cls = n === 0 ? 'zero' : actual === placed ? 'diag' : 'err';
        return `<td class="c ${cls}">${n || ''}</td>`;
      }).join('')}
    </tr>
  `).join('')}</tbody></table>`;
}

function renderVersionCard({ v, lb, stats, hist, conf }) {
  const s = stats || {};
  return `<div class="card">
    <h2>${v.label} <span class="ver">/${v.id}</span></h2>
    <div class="stat-grid">
      <div class="stat"><div class="v">${s.total_attempts ?? 0}</div><div class="l">Tổng lượt</div></div>
      <div class="stat"><div class="v">${s.avg_score ?? 0}</div><div class="l">Điểm TB</div></div>
      <div class="stat"><div class="v">${s.best_score ?? 0}</div><div class="l">Điểm cao</div></div>
      <div class="stat"><div class="v">${s.perfect_count ?? 0}</div><div class="l">Perfect 🎯</div></div>
    </div>
    <div style="font-weight:600;font-size:12px;opacity:0.7;margin-top:8px">📈 Phổ điểm (theo bucket 10đ)</div>
    ${renderHistogram(hist)}
    <div style="font-weight:600;font-size:12px;opacity:0.7;margin-top:14px">🏆 Top 10</div>
    ${renderLeaderboard(lb)}
    <div style="font-weight:600;font-size:12px;opacity:0.7;margin-top:14px">🎯 Ma trận nhầm lẫn</div>
    ${renderConfusion(conf)}
  </div>`;
}

async function loadRecent() {
  const rows = await fetch('api/recent?limit=50').then(r => r.json());
  const tbody = document.querySelector('#recent-table tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Chưa có lượt chơi nào</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const v = VERSIONS.find(v => v.id === r.version);
    return `<tr>
      <td style="opacity:0.5">#${r.id}</td>
      <td>${escapeHtml(r.player_name)}</td>
      <td><span class="badge-v ${v?.badge ?? ''}">${v?.label ?? r.version}</span></td>
      <td class="r" style="color:#fbbf24;font-weight:700">${r.score}</td>
      <td class="r">${r.correct}/${r.total}</td>
      <td class="r" style="opacity:0.65;font-size:11px">${fmtTime(r.created_at)}</td>
    </tr>`;
  }).join('');
}

async function loadAll() {
  const row = document.getElementById('versions-row');
  row.innerHTML = '<div class="card empty">Đang tải...</div>';
  const cards = await Promise.all(VERSIONS.map(loadVersionCard));
  row.innerHTML = cards.map(renderVersionCard).join('');
  await loadRecent();
}

document.getElementById('refresh').addEventListener('click', loadAll);
loadAll();

// ── Trải nghiệm trực quan: filter theo role + grade ──
// Sinh viên ĐH không thấy game kid-only (Pet, Bão Số Học, Đố Chữ, Code Quest).
// SV ngành CNTT thấy Code Quest. SV ngành Y/Dược/Hoá thấy Lab Hoá.
const EXPERIENCES = [
  { href: '/nang-luc.html',        ic: '🎯', t: 'Năng lực của em', d: 'Cây phẩm chất + năng lực theo khung GDPT 2018.',          audience: 'all' },
  { href: '/cay-tri-thuc.html',    ic: '🌳', t: 'Cây Tri Thức',    d: 'Mỗi tuần hoàn thành = 1 chiếc lá lên cây.',                audience: 'all' },
  { href: '/bang-phong-than.html', ic: '🏆', t: 'Bảng Phong Thần', d: 'Xem em đứng thứ mấy theo tuần/tháng/all-time.',           audience: 'all' },
  { href: '/ban-do-vn.html',       ic: '🗺️', t: 'Bản đồ VN',       d: '34 tỉnh — 34 câu chuyện + quiz địa lý.',                  audience: 'all' },
  { href: '/pixel-art-studio.html',ic: '🎨', t: 'Pixel Art',       d: 'Vẽ pixel art 16×16, share PNG cho bạn.',                  audience: 'all' },
  { href: '/pet-tri-thuc.html',    ic: '🐉', t: 'Pet Tri Thức',    d: 'Nuôi Tiziamon — sinh vật ảo tiến hoá theo điểm.',          audience: 'k12' },
  { href: '/bao-so-hoc.html',      ic: '⛈️', t: 'Bão Số Học',      d: 'Arcade phép tính rơi, combo sét đánh.',                   audience: 'kid' },
  { href: '/do-chu-ghep-van.html', ic: '🔤', t: 'Đố Chữ Ghép Vần', d: 'Ghép âm/vần thành từ — 60 từ chia 3 cấp.',                audience: 'kid' },
  { href: '/code-quest.html',      ic: '🤖', t: 'Code Quest',      d: 'Lập trình kéo-thả Scratch — 10 level giải puzzle.',       audience: 'cs'  },
  { href: '/lab-hoa-ao.html',      ic: '🧪', t: 'Lab Hoá ảo',      d: 'Kéo thả 10 hoá chất — khám phá 15 phản ứng.',             audience: 'sci' },
];

const CS_MAJORS  = new Set(['it', 'engineering']);
const SCI_MAJORS = new Set(['pharmacy', 'medicine', 'nursing', 'natural-sciences']);
function isExpVisible(audience, user) {
  if (audience === 'all') return true;
  if (!user) return audience === 'kid' || audience === 'k12';
  if (user.role === 'teacher') return true;
  if (user.role === 'pupil') {
    const g = Number(user.grade) || 0;
    if (audience === 'kid')  return g >= 0 && g <= 5;
    if (audience === 'k12')  return g >= 0 && g <= 12;
    if (audience === 'cs')   return g >= 6;
    if (audience === 'sci')  return g >= 8;
  }
  if (user.role === 'student') {
    const m = user.major || '';
    if (audience === 'cs')  return CS_MAJORS.has(m);
    if (audience === 'sci') return SCI_MAJORS.has(m);
    return false;
  }
  return false;
}

(async function renderExperiences() {
  const grid = document.getElementById('exp-grid');
  const card = document.getElementById('exp-card');
  if (!grid) return;
  // Lấy user hiện tại để filter audience.
  let user = null;
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    if (r.ok) user = (await r.json())?.user || null;
  } catch {}
  const visible = EXPERIENCES.filter(e => isExpVisible(e.audience, user));
  if (!visible.length) { if (card) card.style.display = 'none'; return; }
  grid.innerHTML = visible.map(e => `
    <a href="${e.href}" style="display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;text-decoration:none;color:#1f2937;transition:transform .12s, box-shadow .15s">
      <span style="font-size:32px;line-height:1">${e.ic}</span>
      <b style="font-size:14px;color:#1e293b">${e.t}</b>
      <span style="font-size:12px;color:#64748b;line-height:1.45">${e.d}</span>
    </a>
  `).join('');
  // Hover scale via inline JS (CSS would need :hover rule)
  for (const a of grid.querySelectorAll('a')) {
    a.addEventListener('mouseenter', () => { a.style.transform = 'translateY(-3px)'; a.style.boxShadow = '0 10px 24px rgba(0,0,0,.08)'; });
    a.addEventListener('mouseleave', () => { a.style.transform = ''; a.style.boxShadow = ''; });
  }
})();
</script>
