<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Ảnh nháp đã lưu · Tizia</title>
<style>
  :root {
    --bg:#0b1220; --bg2:#111a2e; --accent2:#60a5fa;
    --border:rgba(255,255,255,0.10); --txt:#e2e8f0; --muted:#94a3b8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); color-scheme:dark; }
  a { color:var(--accent2); text-underline-offset:3px; }
  :is(a,button):focus-visible { outline:3px solid var(--accent2); outline-offset:3px; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:24px; margin:12px 0; font-weight:700; }
  h2 { font-size:17px; margin:0 0 4px; font-weight:650; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:13px; margin:0; }
  .back { display:inline-flex; align-items:center; min-height:44px; }
  .req { padding:16px 0; border-top:1px solid var(--border); }
  .shots { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-top:12px; }
  figure { margin:0; background:var(--bg2); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding:6px 8px; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  .pager { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin:12px 0; }
  .pager button { min-height:44px; padding:0 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--txt); font:inherit; cursor:pointer; }
  .pager button:disabled { opacity:.45; cursor:default; }
</style>
</head>
<body data-no-auth-header data-no-suggestion-fab data-no-notifications-bell data-no-gamify>
<nav aria-label="Quản trị AI Board"><a class="back" href="/admin.html">← Quản trị</a></nav>
<main>
  <h1>Ảnh nháp đã lưu</h1>
  <p class="meta">Ảnh chụp do AI Board tạo khi làm việc, gom theo từng yêu cầu. Mới nhất ở trên.</p>
  <div id="app"><p class="meta" role="status">Đang tải ảnh…</p></div>
</main>
<script type="module" src="/js/admin-shots.js"></script>
</body>
</html>
