<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khu giảng viên — Pharmacomm · Tizia</title>
<style>
  :root { --bg:#0b1220; --card:#111827; --card-h:#1e293b; --border:#334155;
          --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --green:#22c55e; --red:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; }
  a { color:var(--accent); }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 18px 60px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .logo { width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;
    background:linear-gradient(135deg,var(--accent),#0d9488); color:#04121a; }
  h1 { margin:0; font-size:24px; font-weight:800; }
  .sub { margin:2px 0 0; color:var(--muted); font-size:12.5px; }

  /* đăng nhập */
  .login { max-width:420px; margin:60px auto 0; background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:26px 24px; }
  .login h2 { margin:0 0 4px; font-size:18px; text-transform:uppercase; letter-spacing:.4px; }
  .login p.hint { margin:0 0 18px; color:var(--muted); font-size:12.5px; line-height:1.55; }
  .f { margin-bottom:14px; }
  .f label { display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; }
  .f input { width:100%; background:var(--card-h); border:1px solid var(--border); color:var(--text);
    border-radius:11px; padding:11px 13px; font:inherit; }
  .f input:focus { outline:none; border-color:var(--accent); }
  .btn { cursor:pointer; font:inherit; font-weight:800; border:none; border-radius:11px;
    padding:11px 18px; background:linear-gradient(135deg,var(--accent),var(--green)); color:#04121a; }
  .btn:hover { filter:brightness(1.06); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); font-weight:700; }
  .btn.ghost:hover { border-color:var(--accent); background:var(--card-h); }
  .btn.sm { padding:7px 13px; font-size:12.5px; }
  .err { color:var(--red); font-size:12.5px; min-height:1.2em; margin:4px 0 10px; }
  .ok  { color:var(--green); font-size:12.5px; min-height:1.2em; margin:4px 0 10px; }

  /* khu quản lý */
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 20px;
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 16px; }
  .top .who { font-weight:700; }
  .top .spacer { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--text);
    background:var(--card); border:1px solid var(--border); border-radius:11px; padding:9px 15px; }
  .tab.on { background:var(--accent); color:#04121a; border-color:var(--accent); }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .filters .f { margin:0; min-width:150px; }
  .filters select, .filters input { width:100%; background:var(--card-h); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:9px 11px; font:inherit; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--card);
    border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--border); }
  th { background:var(--card-h); font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  tr:last-child td { border-bottom:none; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:var(--card-h); }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px;
    background:var(--card-h); border:1px solid var(--border); }
  .pill.done { background:rgba(34,197,94,.16); border-color:rgba(34,197,94,.45); color:#86efac; }
  .pill.run  { background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.45); color:#7dd3fc; }
  .pill.fail { background:rgba(248,113,113,.16); border-color:rgba(248,113,113,.45); color:#fca5a5; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .note { background:rgba(56,189,248,.10); border-left:3px solid var(--accent); border-radius:8px;
    padding:11px 14px; font-size:12.5px; line-height:1.6; margin-bottom:16px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">🧑‍🏫</div>
    <div><h1>Khu giảng viên</h1><p class="sub">Pharmacomm — theo dõi thực hành của sinh viên</p></div>
  </div>

  <!-- ĐĂNG NHẬP -->
  <div class="login" id="login">
    <h2>Đăng nhập giảng viên</h2>
    <p class="hint">Khu vực này chỉ dành cho giảng viên. Tài khoản do quản trị viên cấp — phần mềm không có chức năng tự đăng ký.</p>
    <form id="login-form">
      <div class="f"><label for="u">Tên đăng nhập</label><input id="u" autocomplete="username" /></div>
      <div class="f"><label for="p">Mật khẩu</label><input id="p" type="password" autocomplete="current-password" /></div>
      <div class="err" id="login-err"></div>
      <button class="btn" type="submit" style="width:100%">Đăng nhập</button>
    </form>
    <p class="hint" style="margin-top:16px">Bạn là sinh viên? <a href="/nha-thuoc-3d">Vào thực hành ở đây</a>.</p>
  </div>

  <!-- KHU QUẢN LÝ -->
  <div id="admin" class="hide">
    <div class="top">
      <span class="who">🧑‍🏫 <b id="who-name">—</b></span>
      <span class="spacer">
        <button class="btn ghost sm" id="btn-try">▶️ Chạy thử tình huống</button>
        <button class="btn ghost sm" id="btn-pw">🔑 Đổi mật khẩu</button>
        <button class="btn ghost sm" id="btn-out">Đăng xuất</button>
      </span>
    </div>

    <div id="pw-box" class="login hide" style="margin:0 0 18px; max-width:none">
      <h2>Đổi mật khẩu</h2>
      <div class="f"><label for="pw-old">Mật khẩu hiện tại</label><input id="pw-old" type="password" /></div>
      <div class="f"><label for="pw-new">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="pw-new" type="password" /></div>
      <div class="err" id="pw-msg"></div>
      <button class="btn" id="pw-save">Lưu mật khẩu mới</button>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="classes">🏫 Lớp</button>
      <button class="tab" data-tab="students">🎓 Sinh viên</button>
      <button class="tab" data-tab="sessions">📋 Lượt thực hành</button>
      <button class="tab" data-tab="logs">🗒️ Nhật ký</button>
    </div>
    <div id="panel"></div>
  </div>
</div>
<script src="/js/pharmacy/teacher-ui.js?v=ph0920" type="module"></script>
</body>
</html>
