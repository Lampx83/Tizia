<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>📝 Luyện đề thi · Tizia</title>
<link rel="manifest" href="./manifest.webmanifest" />
<style>
  :root { --bg:#0f172a; --bg2:#1e293b; --border:rgba(255,255,255,.12); --txt:#e2e8f0;
    --mute:#94a3b8; --accent:#fbbf24; --purple:#a78bfa; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(900px 600px at 15% 0%,rgba(167,139,250,.12),transparent 70%),var(--bg);
    color:var(--txt); line-height:1.55; min-height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header a.back { margin-left:auto; color:var(--mute); text-decoration:none; font-size:13px; }
  .wrap { max-width:none; margin:0 auto; padding:20px 18px 70px; }
  .group-title { font-size:14px; font-weight:800; color:var(--accent); margin:22px 0 10px; text-transform:uppercase; letter-spacing:.5px; }
  .exam-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
  .exam-card { background:var(--bg2); border:1px solid var(--border); border-radius:13px; padding:16px;
    cursor:pointer; transition:transform .15s, border-color .15s; }
  .exam-card:hover { transform:translateY(-2px); border-color:var(--purple); }
  .exam-card .t { font-weight:700; font-size:15px; margin-bottom:6px; }
  .exam-card .m { font-size:12.5px; color:var(--mute); display:flex; gap:10px; flex-wrap:wrap; }
  .exam-card .go { margin-top:10px; color:var(--purple); font-size:13px; font-weight:600; }

  .runner { display:none; }
  .runner.on { display:block; }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;
    position:sticky; top:0; background:rgba(15,23,42,.92); padding:10px 0; backdrop-filter:blur(8px); z-index:5; }
  .bar .timer { font-variant-numeric:tabular-nums; font-weight:800; font-size:18px; color:var(--accent); }
  .bar .prog { font-size:13px; color:var(--mute); }
  .bar button { margin-left:auto; }
  button { background:rgba(255,255,255,.08); color:var(--txt); border:1px solid var(--border);
    border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  button.primary { background:var(--accent); color:#1a1205; border-color:var(--accent); }
  button:hover { filter:brightness(1.1); }
  .q { background:var(--bg2); border:1px solid var(--border); border-radius:13px; padding:16px 18px; margin-bottom:12px; }
  .q .stem { font-weight:600; margin-bottom:10px; }
  .q .stem .num { color:var(--accent); }
  .opt { display:block; padding:10px 14px; margin:6px 0; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1); border-radius:10px; cursor:pointer; font-size:14px; transition:.12s; }
  .opt:hover { background:rgba(167,139,250,.1); }
  .opt.sel { background:rgba(167,139,250,.18); border-color:var(--purple); }
  .opt.correct { background:rgba(34,197,94,.18); border-color:var(--ok); }
  .opt.wrong { background:rgba(239,68,68,.16); border-color:var(--bad); }
  .ex { margin-top:8px; font-size:13px; color:var(--mute); border-left:3px solid var(--purple); padding:6px 10px; background:rgba(167,139,250,.07); border-radius:6px; display:none; }
  .ex.show { display:block; }
  .result { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:22px; text-align:center; margin-bottom:16px; }
  .result.pass { border-color:var(--ok); } .result.fail { border-color:var(--bad); }
  .result .score { font-size:42px; font-weight:800; }
  .result .verdict { font-size:18px; font-weight:700; margin-top:4px; }
  .empty,.loading { text-align:center; padding:40px; color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>📝 Luyện đề thi</h1>
  <a class="back" href="/index.html">← Trang chủ</a>
</header>
<div class="wrap">
  <div id="list"><div class="loading">Đang tải đề…</div></div>
  <div id="runner" class="runner"></div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const EXAM_LABEL = { 'tn-thpt': '🎓 Thi tốt nghiệp THPT', 'vao-10': '📘 Thi vào lớp 10' };
const SUBJ = { toan:'Toán', 'ngu-van':'Ngữ văn', van:'Ngữ văn', anh:'Tiếng Anh', 'tieng-anh':'Tiếng Anh', gdktpl:'GD Kinh tế & Pháp luật' };

let EXAMS = [];
try {
  const r = await fetch('/api/content/exam-sets', { credentials: 'same-origin' });
  EXAMS = r.ok ? (await r.json()).items || [] : [];
} catch {}

function renderList() {
  $('#runner').classList.remove('on');
  const host = $('#list'); host.style.display = 'block';
  if (!EXAMS.length) { host.innerHTML = '<div class="empty">Chưa có đề nào.</div>'; return; }
  const groups = {};
  for (const e of EXAMS) (groups[e.exam] = groups[e.exam] || []).push(e);
  host.innerHTML = Object.entries(groups).map(([k, list]) => `
    <div class="group-title">${EXAM_LABEL[k] || k}</div>
    <div class="exam-grid">${list.map(e => `
      <div class="exam-card" data-id="${esc(e.id)}">
        <div class="t">${esc(e.title)}</div>
        <div class="m"><span>${esc(SUBJ[e.subject] || e.subject || '')}</span><span>📝 ${e.questions.length} câu</span><span>⏱ ${e.durationMin}′</span></div>
        <div class="go">Bắt đầu →</div>
      </div>`).join('')}</div>`).join('');
  host.querySelectorAll('.exam-card').forEach(el => el.addEventListener('click', () => startExam(el.dataset.id)));
}

let timerId = null;
function startExam(id) {
  const exam = EXAMS.find(e => e.id === id); if (!exam) return;
  clearInterval(timerId);
  $('#list').style.display = 'none';
  const run = $('#runner'); run.classList.add('on');
  const answers = {};
  let endAt = Date.now() + exam.durationMin * 60000, submitted = false;

  run.innerHTML = `
    <div class="bar">
      <span class="timer" id="timer">--:--</span>
      <span class="prog" id="prog">0/${exam.questions.length}</span>
      <button class="primary" id="submit">Nộp bài</button>
    </div>
    <div id="qs"></div>
    <button id="back2" style="margin-top:10px">← Về danh sách đề</button>`;

  $('#qs').innerHTML = exam.questions.map((q, i) => `
    <div class="q" data-i="${i}">
      <div class="stem"><span class="num">Câu ${i+1}.</span> ${esc(q.q)}</div>
      ${q.o.map((o, j) => `<label class="opt" data-i="${i}" data-j="${j}">${esc(o)}</label>`).join('')}
      <div class="ex" data-ex="${i}">💡 ${esc(q.ex || '')}</div>
    </div>`).join('');

  run.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => {
    if (submitted) return;
    const i = +el.dataset.i, j = +el.dataset.j;
    answers[i] = j;
    run.querySelectorAll(`.opt[data-i="${i}"]`).forEach(o => o.classList.remove('sel'));
    el.classList.add('sel');
    $('#prog').textContent = `${Object.keys(answers).length}/${exam.questions.length}`;
  }));

  function tick() {
    const left = endAt - Date.now();
    if (left <= 0) { submit(); return; }
    const m = String(Math.floor(left/60000)).padStart(2,'0'), s = String(Math.floor(left%60000/1000)).padStart(2,'0');
    $('#timer').textContent = `${m}:${s}`;
  }
  function submit() {
    if (submitted) return; submitted = true; clearInterval(timerId);
    let right = 0;
    exam.questions.forEach((q, i) => {
      const card = run.querySelector(`.q[data-i="${i}"]`);
      card.querySelector(`.ex[data-ex="${i}"]`).classList.add('show');
      const correct = q.a, picked = answers[i];
      if (picked === correct) right++;
      card.querySelectorAll('.opt').forEach(o => {
        const j = +o.dataset.j;
        if (j === correct) o.classList.add('correct');
        else if (j === picked) o.classList.add('wrong');
      });
    });
    const total = exam.questions.length;
    const score10 = Math.round(right / total * 100) / 10;   // /10
    const pass = score10 >= (exam.passScore || 5);
    const res = document.createElement('div');
    res.className = 'result ' + (pass ? 'pass' : 'fail');
    res.innerHTML = `<div class="score" style="color:${pass?'var(--ok)':'var(--bad)'}">${score10}/10</div>
      <div class="verdict">${pass ? '✅ Đạt' : '❌ Chưa đạt'} · đúng ${right}/${total} câu</div>`;
    $('#qs').prepend(res);
    res.scrollIntoView({ behavior:'smooth' });
    $('#submit').style.display = 'none';
  }
  $('#submit').addEventListener('click', () => { if (confirm('Nộp bài và xem kết quả?')) submit(); });
  $('#back2').addEventListener('click', renderList);
  tick(); timerId = setInterval(tick, 1000);
  window.scrollTo(0, 0);
}

renderList();
</script>
<script type="module" src="./js/auth-header.js"></script>
</body>
</html>
