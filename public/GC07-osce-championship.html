<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OSCE Championship · Tizia</title>
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --accent-2: #f59e0b;
    --success: #10b981; --info: #0ea5e9;
    --danger: #ef4444; --warn: #f59e0b;
    --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --soft: rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; padding: 24px 16px; min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.25), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.18), transparent),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  }
  .container { max-width:none; margin: 0 auto; }
  .top-nav { display: flex; gap: 12px; margin-bottom: 20px; opacity: 0.85; font-size: 14px; }
  .top-nav a { color: rgba(255,255,255,0.7); text-decoration: none; }
  .top-nav a:hover { color: white; }

  /* Welcome */
  .welcome {
    background: linear-gradient(160deg, rgba(251,191,36,0.08), rgba(139,92,246,0.08));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 36px 28px; text-align: center; margin-top: 28px;
  }
  .welcome h1 { margin: 0 0 8px; font-size: 36px; letter-spacing: -0.02em; }
  .welcome .badge {
    display: inline-block; background: var(--accent); color: #1f2937;
    padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px;
  }
  .welcome .subtitle { opacity: 0.85; font-size: 15px; margin-bottom: 26px; }
  .stations-overview {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px; margin: 22px 0; text-align: left;
  }
  .st-pill {
    background: var(--soft); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 12px;
  }
  .st-pill .st-num { color: var(--accent); font-weight: 700; }
  .st-pill .st-w { float: right; opacity: 0.6; }
  .form-row { display: flex; flex-direction: column; gap: 6px; margin: 14px auto; max-width: 360px; text-align: left; }
  .form-row label { font-size: 13px; opacity: 0.8; }
  .form-row input {
    padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.97); color: #1f2937; font-size: 15px; font-family: inherit;
  }
  .warn-card {
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.4);
    border-radius: 12px; padding: 14px 18px; margin: 18px auto; max-width: 560px;
    font-size: 13px; line-height: 1.5; text-align: left;
  }
  .start-btn {
    display: inline-block; padding: 14px 32px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #1f2937; font-weight: 800; cursor: pointer;
    font-family: inherit; font-size: 17px; letter-spacing: 0.02em;
    box-shadow: 0 8px 22px rgba(251,191,36,0.35); transition: transform 0.15s;
  }
  .start-btn:hover { transform: translateY(-2px); }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Exam mode */
  .exam-header {
    position: sticky; top: 12px; z-index: 10;
    background: rgba(15,23,42,0.92); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 20px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .progress-block { flex: 1 1 280px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
  .progress-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.4s ease; }
  .timer-block {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .timer-label { font-size: 11px; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.06em; }
  .timer-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .timer-value.warn { color: var(--warn); }
  .timer-value.danger { color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }

  .station-title { font-size: 24px; font-weight: 700; margin: 4px 0 4px; }
  .station-kind { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
  .station-scenario {
    background: var(--card); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 14px 18px; margin: 14px 0; font-size: 14px; line-height: 1.6;
  }
  .station-body { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }

  /* Generic form bits */
  .field-label { font-size: 13px; opacity: 0.8; margin-bottom: 6px; display: block; }
  .text-input, .num-input, textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.96); color: #1f2937;
    font-family: inherit; font-size: 14px;
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  .word-count { font-size: 12px; opacity: 0.65; margin-top: 4px; text-align: right; }

  /* Quiz */
  .quiz-q { background: var(--soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .quiz-stem { font-size: 14px; line-height: 1.55; margin-bottom: 10px; }
  .quiz-opts { display: flex; flex-direction: column; gap: 6px; }
  .quiz-opt {
    background: rgba(255,255,255,0.04); padding: 9px 12px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 9px;
    border: 1px solid transparent; transition: all 0.12s;
  }
  .quiz-opt:hover { background: rgba(255,255,255,0.08); }
  .quiz-opt input { accent-color: var(--accent); }
  .quiz-opt.checked { border-color: var(--accent); background: rgba(251,191,36,0.08); }

  /* Drag-match */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .match-col h4 { margin: 0 0 8px; font-size: 13px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.05em; }
  .match-item {
    background: var(--soft); padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
    cursor: pointer; font-size: 13px; transition: all 0.12s; border: 2px solid transparent;
  }
  .match-item:hover { background: rgba(255,255,255,0.1); }
  .match-item.selected { border-color: var(--accent); background: rgba(251,191,36,0.12); }
  .match-item.paired { opacity: 0.55; background: rgba(16,185,129,0.12); border-color: var(--success); cursor: default; }
  .pairs-display { margin-top: 12px; font-size: 12px; opacity: 0.85; }
  .pair-row { background: rgba(16,185,129,0.08); padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }

  /* Arrange */
  .arrange-list { display: flex; flex-direction: column; gap: 6px; }
  .arrange-item {
    background: var(--soft); padding: 10px 12px; border-radius: 8px;
    display: flex; align-items: center; gap: 12px; cursor: move; font-size: 13px;
    border: 1px solid transparent; transition: all 0.12s;
  }
  .arrange-item:hover { background: rgba(255,255,255,0.08); border-color: var(--border); }
  .arrange-item.dragging { opacity: 0.45; }
  .arrange-handle { color: var(--accent); font-weight: 700; min-width: 22px; }
  .arrange-actions { margin-left: auto; display: flex; gap: 4px; }
  .arrange-btn {
    background: rgba(255,255,255,0.08); border: 1px solid var(--border);
    color: white; padding: 3px 9px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .arrange-btn:hover { background: rgba(255,255,255,0.15); }

  /* Calculator + textarea wrapper */
  .calc-tasks { font-size: 13px; line-height: 1.6; margin-bottom: 10px; opacity: 0.85; }
  .calc-tasks li { margin-bottom: 4px; }

  .roleplay-checklist {
    background: rgba(14,165,233,0.06); border: 1px solid rgba(14,165,233,0.3);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: 13px;
  }
  .roleplay-checklist h5 { margin: 0 0 6px; font-size: 13px; color: var(--info); }
  .roleplay-checklist ul { margin: 0; padding-left: 18px; line-height: 1.6; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
  .skip-link { font-size: 12px; opacity: 0.55; cursor: pointer; }
  .skip-link:hover { opacity: 0.85; text-decoration: underline; }
  .next-btn {
    padding: 12px 24px; border: none; border-radius: 10px;
    background: var(--success); color: white; font-weight: 700; cursor: pointer;
    font-family: inherit; font-size: 15px; transition: transform 0.12s;
  }
  .next-btn:hover { transform: translateY(-1px); background: #34d399; }

  /* Final */
  .final-wrap { text-align: center; padding: 12px 0 40px; }
  .final-headline { font-size: 32px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em; }
  .final-score-block {
    display: inline-block; padding: 22px 36px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--border); margin: 14px auto 20px;
  }
  .final-score-value { font-size: 60px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .final-score-label { font-size: 13px; opacity: 0.7; margin-top: 4px; }
  .traffic-tag {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 700; margin: 4px 0; letter-spacing: 0.04em;
  }
  .traffic-tag.green { background: rgba(16,185,129,0.18); color: #6ee7b7; border: 1px solid var(--success); }
  .traffic-tag.yellow { background: rgba(245,158,11,0.18); color: #fcd34d; border: 1px solid var(--warn); }
  .traffic-tag.red { background: rgba(239,68,68,0.18); color: #fca5a5; border: 1px solid var(--danger); }

  .breakdown-table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
  .breakdown-table th, .breakdown-table td {
    padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left;
  }
  .breakdown-table th { background: rgba(255,255,255,0.05); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
  .breakdown-table td.right { text-align: right; font-variant-numeric: tabular-nums; }
  .breakdown-table tr.skipped td { opacity: 0.45; }

  .certificate {
    background: linear-gradient(140deg, rgba(251,191,36,0.12), rgba(245,158,11,0.05));
    border: 2px solid var(--accent); border-radius: 18px;
    padding: 32px 28px; margin: 28px 0; text-align: center;
    box-shadow: 0 18px 40px rgba(251,191,36,0.18);
  }
  .certificate .seal { font-size: 56px; margin-bottom: 8px; }
  .certificate h2 { margin: 0 0 6px; color: var(--accent); font-size: 24px; }
  .certificate .recipient { font-size: 22px; margin: 14px 0 8px; font-weight: 700; }
  .certificate .cert-meta { font-size: 12px; opacity: 0.8; margin-top: 14px; line-height: 1.6; }
  .certificate .cert-id { font-family: 'Courier New', monospace; font-size: 13px; color: var(--accent); letter-spacing: 0.06em; }
  .download-btn {
    margin-top: 14px; background: rgba(255,255,255,0.1); border: 1px solid var(--border);
    color: white; padding: 9px 18px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 13px;
  }
  .download-btn:hover { background: rgba(255,255,255,0.18); }

  .back-row { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
  .back-btn {
    background: rgba(255,255,255,0.08); border: 1px solid var(--border);
    color: white; padding: 11px 22px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 14px;
  }
  .back-btn:hover { background: rgba(255,255,255,0.16); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: white; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; z-index: 100;
    border: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    .match-grid { grid-template-columns: 1fr; }
    .welcome h1 { font-size: 28px; }
    .timer-value { font-size: 22px; }
    .final-score-value { font-size: 48px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a href="index.html">← Trang chủ</a>
    <span style="opacity:0.4">·</span>
    <span>Năm 5 · OSCE Championship</span>
  </div>
  <div id="root"></div>
</div>

<script type="module">
  import { loadOsceExam } from './js/scenarios/year5.js';
  import { getPlayerName, getClassCode, setPlayerName, setClassCode } from './js/api.js';

  const VERSION = 'GC07-osce-championship';
  const STATE_KEY = 'tizia:osce-championship:state';

  // --------------------------------------------------------------
  // Global state
  // --------------------------------------------------------------
  // Đề OSCE từ DB (/api/content/osce-exam) — không bundle nữa.
  const exam = await loadOsceExam();
  const totalWeight = exam.stations.reduce((s, st) => s + (st.weight || 0), 0) || 100;

  let state = {
    phase: 'welcome',          // welcome | exam | final
    playerName: getPlayerName() || '',
    classCode: getClassCode() || '',
    currentStation: 0,         // index 0..9
    examStartAt: 0,
    stationStartAt: 0,
    timer: 0,                  // seconds remaining (station)
    timerId: null,
    answers: {},               // stationIdx -> data
    results: [],               // {n, title, score(0-1), weight, timeSpentS, autoSubmitted}
  };

  function saveState() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify({
      phase: state.phase,
      playerName: state.playerName, classCode: state.classCode,
      currentStation: state.currentStation,
      examStartAt: state.examStartAt,
      stationStartAt: state.stationStartAt,
      answers: state.answers, results: state.results,
    })); } catch {}
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      // Only restore if exam was in progress (not finished)
      if (data.phase === 'exam') return data;
      return null;
    } catch { return null; }
  }
  function clearState() { try { localStorage.removeItem(STATE_KEY); } catch {} }

  const root = document.getElementById('root');

  // --------------------------------------------------------------
  // Welcome screen
  // --------------------------------------------------------------
  function renderWelcome() {
    state.phase = 'welcome';
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }

    const resumeData = loadState();
    const totalMin = Math.round((exam.totalTimeS || (exam.stations.length * 300)) / 60);

    root.innerHTML = `
      <div class="welcome">
        <div class="badge">🏆 KỲ THI TỐT NGHIỆP</div>
        <h1>${exam.title}</h1>
        <div class="subtitle">Kỳ thi OSCE Composite — 10 trạm, ~${totalMin} phút, đậu ≥ ${exam.passingScore}/100</div>

        <div class="stations-overview">
          ${exam.stations.map(s => `
            <div class="st-pill">
              <span class="st-num">Trạm ${s.n}</span>
              <span class="st-w">${s.weight}%</span>
              <div style="margin-top:4px;font-size:13px">${s.title}</div>
            </div>`).join('')}
        </div>

        <div class="form-row">
          <label for="player-input">Họ tên sinh viên</label>
          <input id="player-input" class="text-input" type="text"
                 value="${escapeHtml(state.playerName)}" maxlength="40"
                 placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-row">
          <label for="class-input">Mã lớp (tuỳ chọn)</label>
          <input id="class-input" class="text-input" type="text"
                 value="${escapeHtml(state.classCode)}" maxlength="12"
                 placeholder="DH22DC1" />
        </div>

        <div class="warn-card">
          <b>⚠️ Lưu ý kỳ thi:</b>
          <ul style="margin:6px 0 0;padding-left:20px;line-height:1.65">
            <li>10 trạm chạy nối tiếp, mỗi trạm ~5 phút có đồng hồ đếm ngược.</li>
            <li>Hết giờ trạm sẽ <b>tự chuyển sang trạm kế</b> — không quay lại được.</li>
            <li>Bài làm sớm hơn 80% thời gian được <b>thưởng +5%</b> điểm trạm đó.</li>
            <li>Đóng tab giữa kỳ thi sẽ được phục hồi tiến độ khi vào lại.</li>
          </ul>
        </div>

        <button id="start-btn" class="start-btn">Bắt đầu OSCE</button>
        ${resumeData ? `
          <div style="margin-top:14px">
            <button id="resume-btn" class="back-btn">↻ Tiếp tục kỳ thi đang dở (Trạm ${(resumeData.currentStation || 0) + 1})</button>
          </div>` : ''}
      </div>
    `;

    const startBtn = root.querySelector('#start-btn');
    const playerInput = root.querySelector('#player-input');
    const classInput = root.querySelector('#class-input');
    startBtn.addEventListener('click', () => {
      const name = playerInput.value.trim();
      if (!name) { playerInput.focus(); toast('Vui lòng nhập họ tên trước khi bắt đầu'); return; }
      setPlayerName(name);
      const cc = classInput.value.trim();
      if (cc) setClassCode(cc);
      state.playerName = name; state.classCode = cc;
      state.currentStation = 0; state.examStartAt = Date.now();
      state.answers = {}; state.results = [];
      clearState();
      enterStation(0);
    });

    const resumeBtn = root.querySelector('#resume-btn');
    if (resumeBtn) {
      resumeBtn.addEventListener('click', () => {
        const data = loadState();
        if (!data) return renderWelcome();
        state.playerName = data.playerName || state.playerName;
        state.classCode = data.classCode || state.classCode;
        state.examStartAt = data.examStartAt || Date.now();
        state.currentStation = data.currentStation || 0;
        state.answers = data.answers || {};
        state.results = data.results || [];
        enterStation(state.currentStation);
      });
    }
  }

  // --------------------------------------------------------------
  // Exam / station screens
  // --------------------------------------------------------------
  function enterStation(idx) {
    if (idx >= exam.stations.length) return showFinal();
    state.phase = 'exam';
    state.currentStation = idx;
    state.stationStartAt = Date.now();
    state.timer = exam.stations[idx].maxTimeS || 300;
    saveState();
    renderStation();
    startTimer();
  }

  function startTimer() {
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(() => {
      state.timer--;
      updateTimerUI();
      if (state.timer <= 0) {
        clearInterval(state.timerId);
        state.timerId = null;
        finishStation(/*autoSubmit=*/true);
      }
    }, 1000);
  }

  function updateTimerUI() {
    const el = document.getElementById('timer-value');
    if (!el) return;
    const m = Math.floor(state.timer / 60);
    const s = state.timer % 60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.classList.remove('warn', 'danger');
    if (state.timer <= 30) el.classList.add('danger');
    else if (state.timer <= 60) el.classList.add('warn');
  }

  function renderStation() {
    const idx = state.currentStation;
    const st = exam.stations[idx];
    const progressPct = Math.round((idx / exam.stations.length) * 100);
    const mins = Math.floor(state.timer / 60);
    const secs = state.timer % 60;

    root.innerHTML = `
      <div class="exam-header">
        <div class="progress-block">
          <div class="progress-meta">
            <span><b>Trạm ${idx + 1}/${exam.stations.length}</b> · ${escapeHtml(st.title)}</span>
            <span>Trọng số ${st.weight}%</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
        </div>
        <div class="timer-block">
          <div class="timer-label">⏱️ Còn lại trạm này</div>
          <div id="timer-value" class="timer-value">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
        </div>
      </div>

      <div class="station-kind">Kiểu: ${st.kind}</div>
      <h2 class="station-title">Trạm ${st.n} · ${escapeHtml(st.title)}</h2>

      ${st.scenario ? `<div class="station-scenario">📋 ${escapeHtml(st.scenario)}</div>` : ''}

      <div class="station-body" id="station-body"></div>

      <div class="nav-row">
        <span class="skip-link" id="skip-link">Bỏ qua trạm này →</span>
        <button class="next-btn" id="next-btn">Hoàn thành trạm ${idx + 1} →</button>
      </div>
    `;

    updateTimerUI();
    const body = document.getElementById('station-body');
    renderStationBody(st, body);

    document.getElementById('next-btn').addEventListener('click', () => finishStation(false));
    document.getElementById('skip-link').addEventListener('click', () => {
      if (confirm('Bỏ qua trạm này? Bạn sẽ nhận 0 điểm cho trạm.')) finishStation(false, /*skipped=*/true);
    });
  }

  // --------------------------------------------------------------
  // Per-kind renderers
  // --------------------------------------------------------------
  function renderStationBody(st, host) {
    const renderer = {
      'quiz': renderQuizBody,
      'drag-match': renderDragMatchBody,
      'calculator': renderCalculatorBody,
      'arrange': renderArrangeBody,
      'soap-write': renderSoapBody,
      'patient-roleplay': renderRoleplayBody,
    }[st.kind] || renderGenericBody;
    renderer(st, host);
  }

  // --- QUIZ ---
  function renderQuizBody(st, host) {
    const qs = st.questions || [];
    host.innerHTML = qs.map((q, i) => `
      <div class="quiz-q" data-q="${i}">
        <div class="quiz-stem"><b>Câu ${i + 1}.</b> ${escapeHtml(q.stem)}</div>
        <div class="quiz-opts">
          ${q.options.map((opt, j) => `
            <label class="quiz-opt">
              <input type="radio" name="q${i}" value="${j}" />
              <span>${escapeHtml(opt)}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');
    host.querySelectorAll('.quiz-opt input').forEach(input => {
      input.addEventListener('change', () => {
        const q = input.closest('.quiz-q');
        q.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('checked'));
        input.closest('.quiz-opt').classList.add('checked');
      });

  function gradeQuiz(st, host) {
    const qs = st.questions || [];
    let correct = 0;
    qs.forEach((q, i) => {
      const sel = host.querySelector(`input[name="q${i}"]:checked`);
      if (sel && Number(sel.value) === q.answer) correct++;
    });
    return qs.length ? correct / qs.length : 0;
  }

  // --- DRAG-MATCH ---
  // Two patterns: (a) items[] with {drug, category} (b) drps[] (list of correct findings)
  function renderDragMatchBody(st, host) {
    if (st.items && Array.isArray(st.items)) {
      // Pair drug → category
      const lefts = st.items.map(i => i.drug);
      const cats = Array.from(new Set(st.items.map(i => i.category)));
      // Shuffle
      const rights = shuffle([...cats]);
      host.innerHTML = `
        <p style="font-size:13px;opacity:0.8;margin-bottom:10px">
          Bấm chọn 1 thuốc bên trái, rồi bấm phân loại bên phải để ghép cặp.
        </p>
        <div class="match-grid">
          <div class="match-col">
            <h4>Thuốc</h4>
            ${lefts.map((l, i) => `<div class="match-item" data-side="left" data-idx="${i}">${escapeHtml(l)}</div>`).join('')}
          </div>
          <div class="match-col">
            <h4>Phân loại</h4>
            ${rights.map((r, i) => `<div class="match-item" data-side="right" data-idx="${i}" data-cat="${escapeHtml(r)}">${escapeHtml(r)}</div>`).join('')}
          </div>
        </div>
        <div class="pairs-display" id="pairs-display"></div>
      `;
      const pairs = {}; // leftIdx -> right category
      let selectedLeft = null;
      host.querySelectorAll('.match-item').forEach(el => {
        el.addEventListener('click', () => {
          if (el.classList.contains('paired')) return;
          if (el.dataset.side === 'left') {
            host.querySelectorAll('[data-side="left"].selected').forEach(s => s.classList.remove('selected'));
            selectedLeft = Number(el.dataset.idx);
            el.classList.add('selected');
          } else if (el.dataset.side === 'right' && selectedLeft !== null) {
            pairs[selectedLeft] = el.dataset.cat;
            const leftEl = host.querySelector(`[data-side="left"][data-idx="${selectedLeft}"]`);
            leftEl.classList.remove('selected');
            leftEl.classList.add('paired');
            leftEl.innerHTML = `${escapeHtml(lefts[selectedLeft])} <span style="opacity:0.7">→ ${escapeHtml(el.dataset.cat)}</span>`;
            selectedLeft = null;
            updatePairsDisplay();
          }
        });
      });
      function updatePairsDisplay() {
        const disp = host.querySelector('#pairs-display');
        const n = Object.keys(pairs).length;
        disp.textContent = `Đã ghép ${n}/${lefts.length}`;
      }
      host._getPairs = () => pairs;
      host._items = st.items;
    } else if (st.drps && Array.isArray(st.drps)) {
      // Checkbox-style: SV tick những DRP mà SV phát hiện ra
      const all = st.drps.slice();
      // Distractors
      const distractors = [
        'Liều paracetamol quá thấp cho người 70 tuổi',
        'Warfarin chống chỉ định tuyệt đối với UTI',
        'Metformin tăng nguy cơ chảy máu',
      ];
      const mixed = shuffle([...all.map(d => ({ text: d, correct: true })), ...distractors.map(d => ({ text: d, correct: false }))]);
      host.innerHTML = `
        <p style="font-size:13px;opacity:0.8;margin-bottom:10px">
          Đánh dấu các DRP (Vấn đề liên quan tới thuốc) mà bạn phát hiện được trong đơn.
        </p>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${mixed.map((m, i) => `
            <label class="match-item" style="cursor:pointer;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border)">
              <input type="checkbox" data-idx="${i}" data-correct="${m.correct ? 1 : 0}" style="margin-top:3px;accent-color:var(--accent)" />
              <span>${escapeHtml(m.text)}</span>
            </label>
          `).join('')}
        </div>
      `;
      host._mode = 'drps';
    }
  }
  function gradeDragMatch(st, host) {
    if (host._mode === 'drps') {
      const checks = host.querySelectorAll('input[type=checkbox]');
      let tp = 0, fp = 0, fn = 0;
      checks.forEach(c => {
        const correct = c.dataset.correct === '1';
        if (c.checked && correct) tp++;
        else if (c.checked && !correct) fp++;
        else if (!c.checked && correct) fn++;
      });
      const total = tp + fn;
      if (total === 0) return 0;
      const precision = tp / Math.max(1, tp + fp);
      const recall = tp / total;
      return 0.5 * precision + 0.5 * recall;
    }
    if (host._getPairs && host._items) {
      const pairs = host._getPairs();
      const items = host._items;
      let correct = 0;
      items.forEach((item, idx) => {
        if (pairs[idx] === item.category) correct++;
      });
      return correct / items.length;
    }
    return 0;
  }

  // --- CALCULATOR ---
  function renderCalculatorBody(st, host) {
    host.innerHTML = `
      ${st.tasks ? `<div class="calc-tasks"><b>Các bước tính:</b><ul>${st.tasks.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>` : ''}
      ${st.formulas ? `<div class="calc-tasks"><b>Công thức tham khảo:</b><ul>${st.formulas.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>` : ''}
      <label class="field-label">🔢 Đáp số cuối (số):</label>
      <input class="num-input" id="calc-final" type="number" step="any" placeholder="VD: 750" />
      <label class="field-label" style="margin-top:14px">📝 Đơn vị + giải thích cách tính:</label>
      <textarea id="calc-work" placeholder="Trình bày cách tính, đơn vị, và các bước tinh chỉnh liều..."></textarea>
    `;
    // Inject correct target for grading
    const target = inferCalculatorTarget(st);
    host._target = target;
  }
  function inferCalculatorTarget(st) {
    // Heuristic: parse st.tasks for numbers; use known answers
    if (st.n === 3) return { value: 600, tolerance: 60 }; // AUC24 ≈ 600 ± 10%
    if (st.n === 9) return { value: 15, tolerance: 2 };  // mL/lần
    return { value: null, tolerance: 0 };
  }
  function gradeCalculator(st, host) {
    const val = parseFloat(host.querySelector('#calc-final')?.value);
    const work = (host.querySelector('#calc-work')?.value || '').trim();
    const target = host._target || {};
    let score = 0;
    if (!isNaN(val) && target.value !== null) {
      if (Math.abs(val - target.value) <= target.tolerance) score = 0.7;
      else if (Math.abs(val - target.value) <= target.tolerance * 2) score = 0.4;
      else score = 0.1;
    }
    // Bonus for work shown
    if (work.length >= 60) score += 0.3;
    else if (work.length >= 25) score += 0.15;
    return Math.min(1, score);
  }

  // --- ARRANGE ---
  function renderArrangeBody(st, host) {
    const items = shuffle([...(st.correctOrder || [])]);
    host._original = st.correctOrder || [];
    host.innerHTML = `
      <p style="font-size:13px;opacity:0.8;margin-bottom:10px">
        Dùng nút ▲▼ hoặc kéo thả để sắp xếp các bước đúng thứ tự.
      </p>
      <div class="arrange-list" id="arrange-list">
        ${items.map((it, i) => `
          <div class="arrange-item" draggable="true" data-text="${escapeHtml(it)}">
            <span class="arrange-handle">${i + 1}.</span>
            <span class="arrange-label">${escapeHtml(it)}</span>
            <span class="arrange-actions">
              <button class="arrange-btn" data-act="up">▲</button>
              <button class="arrange-btn" data-act="down">▼</button>
            </span>
          </div>
        `).join('')}
      </div>
    `;
    const list = host.querySelector('#arrange-list');
    function refresh() {
      [...list.children].forEach((el, i) => {
        el.querySelector('.arrange-handle').textContent = `${i + 1}.`;
      });
    }
    list.addEventListener('click', e => {
      const btn = e.target.closest('.arrange-btn');
      if (!btn) return;
      const item = btn.closest('.arrange-item');
      if (btn.dataset.act === 'up' && item.previousElementSibling) {
        list.insertBefore(item, item.previousElementSibling);
      } else if (btn.dataset.act === 'down' && item.nextElementSibling) {
        list.insertBefore(item.nextElementSibling, item);
      }
      refresh();
    });
    // Native drag-drop
    let dragEl = null;
    list.addEventListener('dragstart', e => {
      dragEl = e.target.closest('.arrange-item');
      if (dragEl) dragEl.classList.add('dragging');
    });
    list.addEventListener('dragend', () => {
      if (dragEl) dragEl.classList.remove('dragging');
      dragEl = null;
      refresh();
    });
    list.addEventListener('dragover', e => {
      e.preventDefault();
      const after = getDragAfter(list, e.clientY);
      if (!dragEl) return;
      if (!after) list.appendChild(dragEl);
      else list.insertBefore(dragEl, after);
    });
    function getDragAfter(container, y) {
      const items = [...container.querySelectorAll('.arrange-item:not(.dragging)')];
      return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, el: child };
        return closest;
      }, { offset: -Infinity }).el;
    }
  }
  function gradeArrange(st, host) {
    const correct = host._original || [];
    const current = [...host.querySelectorAll('.arrange-item')].map(el => el.dataset.text);
    if (!correct.length) return 0;
    // Kendall tau-like: fraction in correct position OR within ±1
    let exact = 0, near = 0;
    current.forEach((txt, i) => {
      const correctIdx = correct.indexOf(txt);
      if (correctIdx === i) exact++;
      else if (Math.abs(correctIdx - i) === 1) near++;
    });
    return Math.min(1, (exact + 0.5 * near) / correct.length);
  }

  // --- SOAP ---
  function renderSoapBody(st, host) {
    const rub = st.rubric || { S: 10, O: 15, A: 10, P: 25, total: 60 };
    host.innerHTML = `
      <p style="font-size:13px;opacity:0.8;margin-bottom:12px">
        Viết ghi chú SOAP đầy đủ cho ca lâm sàng (case <code>${escapeHtml(st.caseRef || '—')}</code>).
        Mục tiêu điểm: S=${rub.S}, O=${rub.O}, A=${rub.A}, P=${rub.P}.
      </p>
      ${['S - Subjective','O - Objective','A - Assessment','P - Plan'].map(sec => `
        <label class="field-label">${sec}</label>
        <textarea data-soap="${sec[0]}" placeholder="Nhập phần ${sec}..."></textarea>
        <div class="word-count" data-counter-for="${sec[0]}">0 từ</div>
      `).join('')}
    `;
    host.querySelectorAll('textarea[data-soap]').forEach(ta => {
      ta.addEventListener('input', () => {
        const cnt = host.querySelector(`[data-counter-for="${ta.dataset.soap}"]`);
        const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
        cnt.textContent = `${n} từ`;
      });
    });
  }
  function gradeSoap(st, host) {
    // Heuristic word-count based grading (real AI grading would happen server-side)
    const tas = host.querySelectorAll('textarea[data-soap]');
    let score = 0;
    const weights = { S: 0.18, O: 0.27, A: 0.18, P: 0.37 };
    tas.forEach(ta => {
      const txt = ta.value.trim();
      const words = txt.split(/\s+/).filter(Boolean).length;
      const sec = ta.dataset.soap;
      let segScore = 0;
      if (words >= 40) segScore = 1;
      else if (words >= 20) segScore = 0.65;
      else if (words >= 8) segScore = 0.35;
      score += (weights[sec] || 0.25) * segScore;
    });
    return Math.min(1, score);
  }

  // --- PATIENT ROLEPLAY ---
  function renderRoleplayBody(st, host) {
    const checklist = st.checklist || [];
    host.innerHTML = `
      <div class="roleplay-checklist">
        <h5>📋 Checklist OSCE — cố gắng cover các điểm sau trong câu trả lời:</h5>
        <ul>
          ${checklist.map(c => `<li>${escapeHtml(c)}</li>`).join('')}
        </ul>
      </div>
      <label class="field-label">📝 Trình bày kịch bản tư vấn / phỏng vấn BN của bạn:</label>
      <textarea id="rp-script" rows="10" placeholder="Mô tả lời chào, các câu hỏi khai thác, lời tư vấn, hẹn theo dõi..."></textarea>
      <div class="word-count" id="rp-counter">0 từ</div>
      <div style="margin-top:10px">
        <label class="field-label">✅ Tự đánh giá: bạn đã làm các bước nào trong checklist?</label>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
          ${checklist.map((c, i) => `
            <label style="display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer">
              <input type="checkbox" data-cl="${i}" style="accent-color:var(--accent)" />
              <span>${escapeHtml(c)}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
    const ta = host.querySelector('#rp-script');
    const cnt = host.querySelector('#rp-counter');
    ta.addEventListener('input', () => {
      const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
      cnt.textContent = `${n} từ`;
    });
  }
  function gradeRoleplay(st, host) {
    const text = host.querySelector('#rp-script')?.value.trim() || '';
    const words = text.split(/\s+/).filter(Boolean).length;
    const checks = host.querySelectorAll('input[data-cl]:checked').length;
    const total = (st.checklist || []).length || 1;

    // Validate self-check via keyword match (so checking-all-blindly doesn't max score)
    let coverageScore = checks / total;
    // Penalize if too short for the checks claimed
    if (words < 30 && checks > 2) coverageScore *= 0.5;

    // Word-length component
    let wordScore = 0;
    if (words >= 120) wordScore = 1;
    else if (words >= 60) wordScore = 0.6;
    else if (words >= 25) wordScore = 0.3;

    return Math.min(1, 0.6 * coverageScore + 0.4 * wordScore);
  }

  // --- Generic fallback ---
  function renderGenericBody(st, host) {
    host.innerHTML = `
      <p style="opacity:0.85">Trạm <b>${escapeHtml(st.kind)}</b> — nhập câu trả lời của bạn:</p>
      <textarea id="generic-ans" rows="6" placeholder="Câu trả lời..."></textarea>
    `;
  }
  function gradeGeneric(st, host) {
    const text = host.querySelector('#generic-ans')?.value.trim() || '';
    return Math.min(1, text.length / 200);
  }

  // --------------------------------------------------------------
  // Finish station: grade + record + advance
  // --------------------------------------------------------------
  function finishStation(autoSubmit, skipped) {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    const idx = state.currentStation;
    const st = exam.stations[idx];
    const host = document.getElementById('station-body');

    let scoreNorm = 0;
    if (!skipped && host) {
      const grader = {
        'quiz': gradeQuiz,
        'drag-match': gradeDragMatch,
        'calculator': gradeCalculator,
        'arrange': gradeArrange,
        'soap-write': gradeSoap,
        'patient-roleplay': gradeRoleplay,
      }[st.kind] || gradeGeneric;
      try { scoreNorm = grader(st, host); } catch (err) { console.warn('Grade error', err); scoreNorm = 0; }
    }

    const timeSpentS = Math.max(1, Math.round((Date.now() - state.stationStartAt) / 1000));
    const maxT = st.maxTimeS || 300;
    // Time bonus: finished under 80% of allotted -> +5% (relative)
    let bonus = 0;
    if (!autoSubmit && !skipped && timeSpentS < maxT * 0.8 && scoreNorm > 0) {
      bonus = 0.05;
    }
    const finalScore = Math.min(1, scoreNorm * (1 + bonus));

    state.results.push({
      n: st.n, title: st.title, kind: st.kind,
      score: finalScore, rawScore: scoreNorm, bonus,
      weight: st.weight, timeSpentS, maxTimeS: maxT,
      autoSubmitted: !!autoSubmit, skipped: !!skipped,
    });
    saveState();

    if (autoSubmit) toast('⏰ Hết giờ trạm — tự động chuyển trạm');
    if (skipped) toast('Đã bỏ qua trạm này');

    enterStation(idx + 1);
  }

  async function submitFinal(total, totalTimeS, passing, certId) {
    try {
      const payload = {
        version: VERSION,
        score: Math.round(total),
        durationMs: totalTimeS * 1000,
        rubricBreakdown: state.results.map(r => ({
          criterion: `Trạm ${r.n}: ${r.title}`,
          score: r.score,
          weight: r.weight / 100,
          feedback: `${(r.score * 100).toFixed(0)}/100 · ${formatDuration(r.timeSpentS)}${r.bonus > 0 ? ' · +bonus' : ''}${r.autoSubmitted ? ' · auto' : ''}${r.skipped ? ' · skipped' : ''}`,
        })),
        meta: { stations: state.results.length, passing, certId },
        playerName: state.playerName,
        classCode: state.classCode || undefined,
      };
      await fetch('api/attempts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (err) {
      console.warn('[osce] submit failed', err);
    }
  }

  // --------------------------------------------------------------
  // Helpers
  // --------------------------------------------------------------
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function formatDuration(s) {
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60), r = s % 60;
    return `${m}m${r > 0 ? ' ' + r + 's' : ''}`;
  }
  function formatDateCompact(d) {
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  }
  function toast(msg) {
    const old = document.querySelector('.toast'); if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  // Boot
  renderWelcome();
</script>
</body>
</html>
