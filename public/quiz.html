<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0f766e" />
<title>Tizia · Quiz nhanh</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, a { touch-action: manipulation; min-height: 44px; }
  @media (max-width: 520px) {
    body { padding: 18px 14px !important; }
    h1 { font-size: 22px; }
    .choices { grid-template-columns: 1fr !important; }
    .choice { padding: 14px 16px !important; }
    .med-card .med-name { font-size: 26px; }
    .hud { flex-wrap: wrap; }
    .hud-item { font-size: 12px; padding: 6px 10px; }
  }
  body {
    background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    color: white; padding: 32px 20px;
  }
  body > header:not(#auth-header) { max-width: 800px; margin: 0 auto 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; }
  .sub { opacity: 0.7; font-size: 14px; }
  a.back { color: white; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; }
  a.back:hover { background: rgba(255,255,255,0.25); }
  .hud { max-width:none; margin: 0 auto 18px; display: flex; gap: 14px; align-items: center; }
  .hud-item { background: rgba(0,0,0,0.25); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  .hud-item b { color: #fbbf24; font-size: 16px; }
  .card-area { max-width:none; margin: 0 auto; }
  .med-card {
    background: white; color: #1f2937; border-radius: 16px; padding: 24px 28px;
    text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .med-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: var(--med-color, #43a047);
  }
  .med-card .med-name { font-size: 32px; font-weight: 800; margin: 4px 0 6px; color: var(--med-color, #43a047); }
  .med-card .med-short { font-size: 13px; opacity: 0.6; letter-spacing: 1px; }
  .med-card .med-q { font-size: 16px; margin-top: 16px; color: #444; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .choice {
    background: rgba(255,255,255,0.92); color: #1f2937; padding: 16px 18px;
    border: 2px solid transparent; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; text-align: left;
  }
  .choice:hover:not(:disabled) { transform: translateY(-2px); background: #fffaf2; border-color: #fbbf24; }
  .choice:disabled { cursor: default; }
  .choice.correct { background: #d1fae5; border-color: #10b981; color: #065f46; }
  .choice.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
  .choice .num { display: inline-block; width: 24px; height: 24px; line-height: 22px; text-align: center; border: 1px solid #ccc; border-radius: 50%; margin-right: 10px; font-size: 12px; font-weight: 800; }

  .progress { height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: #fbbf24; transition: width 0.2s linear; }

  #result-modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: white; color: #1f2937; padding: 28px 32px; border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.4); min-width: 360px; text-align: center;
    z-index: 20; display: none;
  }
  #result-modal h2 { margin: 0 0 8px; }
  #result-modal .score { font-size: 48px; font-weight: 800; color: #0f766e; }
  #result-modal button {
    padding: 12px 24px; font-size: 16px; font-weight: 700; background: #0f766e;
    color: white; border: none; border-radius: 10px; cursor: pointer; margin: 4px;
  }
  #result-modal button.secondary { background: #f3f4f6; color: #374151; }
  .badges { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .badge { background: #fef3c7; color: #92400e; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>🧠 Quiz nhanh</h1>
  <span class="sub">Nhìn tên thuốc → chọn đúng nhóm điều trị · 10 câu / lượt</span>
  <span style="flex:1"></span>
  <a class="back" href="./">← Trang chính</a>
</header>

<div class="hud">
  <div class="hud-item">Câu <b id="q-num">1</b>/<b id="q-total">10</b></div>
  <div class="hud-item">Điểm: <b id="score">0</b></div>
  <div class="hud-item">⏱️ <b id="timer">15</b>s</div>
  <div class="hud-item" id="streak-item" style="display:none">🔥 Streak: <b id="streak">0</b></div>
</div>

<div class="card-area">
  <div class="progress"><div id="prog-bar" style="width:0%"></div></div>
  <div class="med-card" id="med-card">
    <div class="med-short" id="med-short">—</div>
    <div class="med-name" id="med-name">—</div>
    <div class="med-q">Thuộc nhóm điều trị nào?</div>
  </div>
  <div class="choices" id="choices"></div>
</div>

<div id="result-modal"></div>

<script type="module">
import { MEDICINES, shuffle } from './js/medicines.js';
import { submitAttempt, ensurePlayerName } from './js/api.js';
import { sfx } from './js/sfx.js';

const N_QUESTIONS = 10;
const TIME_PER_Q = 15;

const ALL_CATS = [...new Set(MEDICINES.map(m => m.category))];

const state = {
  questions: [],
  idx: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  correctCount: 0,
  details: [],
  timer: null,
  timeLeft: TIME_PER_Q,
  startedAt: 0,
};

function buildQuestions(n) {
  const meds = shuffle(MEDICINES).slice(0, n);
  return meds.map(m => {
    const wrong = shuffle(ALL_CATS.filter(c => c !== m.category)).slice(0, 3);
    const choices = shuffle([m.category, ...wrong]);
    return { med: m, choices, correct: m.category };
  });
}

function show(q) {
  document.getElementById('q-num').textContent = state.idx + 1;
  document.getElementById('med-name').textContent = q.med.name;
  document.getElementById('med-short').textContent = q.med.short;
  document.getElementById('med-card').style.setProperty('--med-color', q.med.color);

  const container = document.getElementById('choices');
  container.innerHTML = q.choices.map((c, i) => `
    <button class="choice" data-cat="${c}">
      <span class="num">${'ABCD'[i]}</span>${c}
    </button>
  `).join('');
  container.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => answer(btn.dataset.cat, btn));
  });
  state.timeLeft = TIME_PER_Q;
  document.getElementById('timer').textContent = TIME_PER_Q;
  document.getElementById('prog-bar').style.width = '100%';
  clearInterval(state.timer);
  state.timer = setInterval(tickTimer, 100);
}

function tickTimer() {
  state.timeLeft = Math.max(0, state.timeLeft - 0.1);
  document.getElementById('timer').textContent = state.timeLeft.toFixed(1);
  document.getElementById('prog-bar').style.width = (state.timeLeft / TIME_PER_Q * 100) + '%';
  if (state.timeLeft <= 0) {
    clearInterval(state.timer);
    answer(null, null);
  }
}

function answer(cat, btn) {
  clearInterval(state.timer);
  const q = state.questions[state.idx];
  const correct = cat === q.correct;
  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.cat === q.correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  if (correct) {
    const bonus = 10 + Math.floor(state.timeLeft);   // up to 25 per question
    state.score += bonus;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.correctCount++;
    sfx.correct();
  } else {
    state.streak = 0;
    sfx.wrong();
  }
  document.getElementById('score').textContent = state.score;
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('streak-item').style.display = state.streak > 1 ? '' : 'none';
  state.details.push({ name: q.med.name, category: q.correct, picked: cat });

  setTimeout(next, correct ? 700 : 1200);
}

function next() {
  state.idx++;
  if (state.idx >= state.questions.length) finish();
  else show(state.questions[state.idx]);
}

async function finish() {
  await ensurePlayerName();
  const durationMs = Date.now() - state.startedAt;
  const res = await submitAttempt({
    version: 'quiz',
    score: state.score,
    correct: state.correctCount,
    total: state.questions.length,
    durationMs,
    details: { bestStreak: state.bestStreak, questions: state.details },
  });

  const newBadges = res?.newBadges ?? [];
  if (state.correctCount === state.questions.length) sfx.perfect();
  if (newBadges.length) sfx.badge();

  const modal = document.getElementById('result-modal');
  modal.innerHTML = `
    <h2>${state.correctCount === state.questions.length ? '🎉 Perfect!' : '🧠 Xong rồi'}</h2>
    <div class="score">${state.score}</div>
    <div style="color:#666;margin:4px 0 12px">Đúng ${state.correctCount}/${state.questions.length} · streak cao nhất ${state.bestStreak} · ${(durationMs/1000).toFixed(1)}s</div>
    ${newBadges.length ? `<div style="font-size:13px;color:#374151">🎁 Mở khóa huy hiệu mới:</div><div class="badges">${newBadges.map(b => `<span class="badge">${b.icon} ${b.label}</span>`).join('')}</div>` : ''}
    <!-- Đóng vòng feedback: link đến 2 trang trải nghiệm liên quan ngay sau khi xong quiz -->
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <a href="/bang-phong-than.html" style="padding:8px 14px;background:linear-gradient(135deg,#fbbf24,#f97316);color:#3e2723;border-radius:18px;text-decoration:none;font-weight:700;font-size:13px">🏆 Bảng Phong Thần</a>
      <a href="/cay-tri-thuc.html" style="padding:8px 14px;background:rgba(34,197,94,.15);color:#15803d;border:1px solid rgba(34,197,94,.4);border-radius:18px;text-decoration:none;font-weight:700;font-size:13px">🌳 Cây Tri Thức</a>
    </div>
    <div style="margin-top:14px">
      <button id="again">🔄 Chơi lại</button>
      <button class="secondary" onclick="location.href='./'">← Về trang chính</button>
    </div>
  `;
  modal.style.display = 'block';
  document.getElementById('again').onclick = () => { modal.style.display = 'none'; start(); };
}

function start() {
  state.questions = buildQuestions(N_QUESTIONS);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.correctCount = 0;
  state.details = [];
  state.startedAt = Date.now();
  document.getElementById('score').textContent = 0;
  document.getElementById('q-total').textContent = N_QUESTIONS;
  document.getElementById('streak-item').style.display = 'none';
  show(state.questions[0]);
}

start();
</script>
<script src="./js/pwa-register.js" defer></script>
<script src="./js/tutor-floating.js" data-domain="general" defer></script>
<script src="./js/orchestrate-bridge.js" defer></script>
</body>
</html>
