<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🔤 Đố Chữ Ghép Vần · Tizia</title>
<meta name="description" content="Trò chơi ghép âm tiết Tiếng Việt — kéo các chữ cái vào ô để tạo từ theo nghĩa được gợi ý. Dành cho lớp 1-3." />
<style>
  :root {
    --bg-1:#fef3c7; --bg-2:#fce7f3; --bg-3:#fef9ff;
    --ink:#3f2418; --muted:#7c5a4b;
    --accent:#ec4899; --accent-2:#f59e0b;
    --good:#10b981; --bad:#ef4444;
    --tile:#fff; --tile-edge:#fcd34d;
    --slot-empty:#fff7ed; --slot-edge:#fdba74;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: 'Inter','Be Vietnam Pro',system-ui,sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
    overflow-x: hidden;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(120,80,50,.12);
  }
  .back {
    background: rgba(236,72,153,.12); color: var(--accent);
    padding: 7px 14px; border-radius: 18px;
    text-decoration: none; font-size: 13px; font-weight: 700;
    border: 1px solid rgba(236,72,153,.3);
    transition: background .15s, transform .12s;
  }
  .back:hover { background: rgba(236,72,153,.22); transform: translateX(-2px); }
  .title { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
  .title .em { font-size: 22px; margin-right: 6px; }
  .stat { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    background: #fff; border: 1px solid rgba(120,80,50,.18);
    padding: 6px 13px; border-radius: 14px;
    font-size: 13px; font-weight: 700; color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .pill b { color: var(--accent); }
  .pill.lv b { color: var(--accent-2); }

  .game {
    max-width:none;
    margin: 0 auto;
    padding: 28px 22px 40px;
    display: flex; flex-direction: column; gap: 22px;
    align-items: center;
  }

  .hint-card {
    background: rgba(255,255,255,.85);
    border: 2px dashed rgba(236,72,153,.35);
    border-radius: 20px;
    padding: 18px 24px;
    text-align: center;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 4px 18px rgba(120,80,50,.08);
  }
  .hint-card .lbl {
    font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--accent); font-weight: 800;
  }
  .hint-card .meaning {
    font-size: 17px; margin-top: 6px; font-weight: 600; color: var(--ink); line-height: 1.45;
  }

  /* Slots — ô trống cần điền */
  .slots {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 6px;
  }
  .slot {
    width: 56px; height: 64px;
    border-radius: 12px;
    border: 3px dashed var(--slot-edge);
    background: var(--slot-empty);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: var(--ink);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .slot.over { background: #fff7ed; border-color: var(--accent); transform: scale(1.05); }
  .slot.filled {
    background: linear-gradient(180deg, #fff, #fef3c7);
    border-style: solid; border-color: var(--tile-edge);
    cursor: pointer;
  }
  .slot.correct {
    background: linear-gradient(180deg, #d1fae5, #6ee7b7);
    border-color: var(--good); animation: pop .35s;
  }
  .slot.wrong {
    background: linear-gradient(180deg, #fee2e2, #fca5a5);
    border-color: var(--bad); animation: shake .35s;
  }
  @keyframes pop {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Bank của chữ cái kéo thả */
  .bank-wrap {
    background: rgba(255,255,255,.7);
    border-radius: 18px;
    padding: 18px;
    width: 100%; max-width: 600px;
    border: 1px solid rgba(120,80,50,.15);
    box-shadow: 0 4px 18px rgba(120,80,50,.06);
  }
  .bank-wrap .lbl {
    font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); font-weight: 800; margin-bottom: 10px; text-align: center;
  }
  .bank {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .tile {
    width: 52px; height: 56px;
    border-radius: 11px;
    background: linear-gradient(180deg, #fff, #fef9c3);
    border: 2.5px solid var(--tile-edge);
    box-shadow: 0 3px 0 rgba(217,119,6,.4), 0 6px 12px rgba(217,119,6,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: var(--ink);
    cursor: grab; user-select: none;
    transition: transform .12s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 5px 0 rgba(217,119,6,.4), 0 9px 16px rgba(217,119,6,.25); }
  .tile:active { cursor: grabbing; transform: scale(.92); }
  .tile.dragging { opacity: .4; }
  .tile.used { opacity: .2; pointer-events: none; transform: scale(.85); }

  .actions {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: 11px 22px; border-radius: 14px;
    font-weight: 800; font-size: 14px; font-family: inherit;
    border: none; cursor: pointer;
    transition: transform .12s, filter .15s;
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 14px rgba(236,72,153,.35);
  }
  .btn.primary:hover { transform: translateY(-1px); filter: brightness(1.07); }
  .btn.ghost {
    background: #fff; color: var(--ink);
    border: 1.5px solid rgba(120,80,50,.2);
  }
  .btn.ghost:hover:not(:disabled) { background: #fff7ed; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(63,36,24,.95); color: #fff;
    padding: 11px 22px; border-radius: 14px;
    font-size: 13.5px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.good { background: rgba(16,185,129,.96); }
  .toast.bad { background: rgba(239,68,68,.96); }

  /* Confetti */
  .conf {
    position: fixed; pointer-events: none;
    font-size: 22px;
    animation: rain 1.6s ease-in forwards;
    z-index: 90;
  }
  @keyframes rain {
    0%   { opacity: 1; transform: translateY(-10px) rotate(0); }
    100% { opacity: 0; transform: translateY(380px) rotate(540deg); }
  }

  /* Level badge animation when leveling up */
  .level-up {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.5);
    background: linear-gradient(135deg, var(--accent-2), #fbbf24);
    color: #fff;
    padding: 24px 44px; border-radius: 22px;
    font-size: 28px; font-weight: 900;
    box-shadow: 0 20px 50px rgba(245,158,11,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 200;
  }
  .level-up.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .footer-note {
    font-size: 12.5px; color: var(--muted);
    text-align: center;
    max-width: 540px; line-height: 1.55;
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/">← Tizia</a>
  <div class="title"><span class="em">🔤</span>Đố Chữ Ghép Vần</div>
  <div class="stat">
    <span class="pill">⭐ Điểm: <b id="st-score">0</b></span>
    <span class="pill lv">🎯 Cấp: <b id="st-level">1</b></span>
    <span class="pill">✅ Đúng: <b id="st-done">0</b></span>
    <span class="pill">🏆 Best: <b id="st-best">0</b></span>
  </div>
</div>

<div class="game">
  <div class="hint-card">
    <div class="lbl">Gợi ý nghĩa</div>
    <div class="meaning" id="meaning">…</div>
  </div>

  <div class="slots" id="slots"></div>

  <div class="bank-wrap">
    <div class="lbl">Kéo chữ vào ô trống</div>
    <div class="bank" id="bank"></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="btn-check">✓ Kiểm tra</button>
    <button class="btn ghost" id="btn-skip">⏭ Bỏ qua (<span id="sk-left">3</span>)</button>
    <button class="btn ghost" id="btn-clear">🧹 Xoá hết</button>
  </div>

  <div class="footer-note">
    Mỗi từ đúng <b>+10 điểm</b>. Đủ điểm sẽ lên cấp khó hơn. Kéo nhầm cũng không sao — cứ thử lại nhé!
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="level-up" id="lvup">🎉 Lên cấp!</div>

<script>
// Mầm non: game ghép vần quá khó (cần biết đọc + đánh vần). Redirect sang
// Ghép Chữ Cái (nhận diện chữ A-Á-Â) — phù hợp 3-5 tuổi.
(function gateForPreschool() {
  try {
    const dom = new URLSearchParams(location.search).get('domain');
    if (dom === 'preschool') { location.replace('/ghep-chu-cai.html'); return; }
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        const g = d?.user?.grade;
        if (g === 'N' || g === 0) location.replace('/ghep-chu-cai.html');
      }).catch(()=>{});
  } catch {}
})();

// ============================================================
// Đố Chữ Ghép Vần — ghép âm tiết Tiếng Việt.
// 3 cấp: easy (3-5 ký tự), medium (5-7), hard (7-10).
// ============================================================

const $ = (s) => document.querySelector(s);

// Bank từ — 60 từ chia 3 cấp. Mỗi từ là chuỗi không dấu cách (1 âm tiết hoặc 2 âm tiết viết liền cho game đơn giản hơn — xử lý cả " ").
// Để phù hợp game ghép chữ cái, ta tách riêng từng âm/chữ cái Latin có dấu.
const WORDS = {
  easy: [
    { w: 'mẹ',     m: 'Người sinh ra em, yêu em nhất nhà.' },
    { w: 'cha',    m: 'Người đàn ông trong gia đình, vai vế ngang mẹ.' },
    { w: 'bà',     m: 'Mẹ của bố hoặc mẹ em.' },
    { w: 'ông',    m: 'Bố của bố hoặc mẹ em.' },
    { w: 'cô',     m: 'Người dạy em ở trường, là phụ nữ.' },
    { w: 'thầy',   m: 'Người dạy em ở trường, là đàn ông.' },
    { w: 'nhà',    m: 'Nơi em sống cùng gia đình.' },
    { w: 'sách',   m: 'Vật để đọc, có nhiều trang giấy.' },
    { w: 'bút',    m: 'Vật dùng để viết chữ.' },
    { w: 'vở',     m: 'Quyển giấy trắng để em ghi bài.' },
    { w: 'cá',     m: 'Loài vật bơi dưới nước.' },
    { w: 'gà',     m: 'Con vật biết gáy ò ó o.' },
    { w: 'hoa',    m: 'Bông đẹp nở trong vườn.' },
    { w: 'lá',     m: 'Phần xanh trên cây.' },
    { w: 'mưa',    m: 'Nước rơi từ trên trời xuống.' },
    { w: 'nắng',   m: 'Ánh sáng từ mặt trời chiếu xuống.' },
    { w: 'gió',    m: 'Thứ làm cờ bay phấp phới.' },
    { w: 'sao',    m: 'Vì lấp lánh trên trời đêm.' },
    { w: 'cây',    m: 'Vật to cao có lá xanh, mọc trong vườn.' },
    { w: 'núi',    m: 'Khối đất đá rất cao, có đỉnh.' },
  ],
  medium: [
    { w: 'trường', m: 'Nơi em học bài mỗi ngày.' },
    { w: 'lớp',    m: 'Phòng học của em ở trường.' },
    { w: 'bàn',    m: 'Đồ dùng để em ngồi viết.' },
    { w: 'ghế',    m: 'Đồ để em ngồi, có 4 chân.' },
    { w: 'biển',   m: 'Vùng nước mặn rất rộng có sóng.' },
    { w: 'sông',   m: 'Dòng nước chảy dài, có thuyền đi.' },
    { w: 'rừng',   m: 'Nơi có rất nhiều cây mọc dày.' },
    { w: 'ruộng',  m: 'Nơi nông dân trồng lúa.' },
    { w: 'vườn',   m: 'Khu đất trồng rau và hoa quanh nhà.' },
    { w: 'chim',   m: 'Con vật có cánh, biết hót và bay.' },
    { w: 'cánh',   m: 'Bộ phận giúp chim bay.' },
    { w: 'trống',  m: 'Nhạc cụ tròn, dùng dùi để đánh.' },
    { w: 'đường',  m: 'Lối em đi từ nhà tới trường.' },
    { w: 'sạch',   m: 'Trái nghĩa với bẩn.' },
    { w: 'xanh',   m: 'Màu của lá và bầu trời.' },
    { w: 'thắng',  m: 'Trái nghĩa với thua.' },
    { w: 'nước',   m: 'Thứ em uống mỗi ngày.' },
    { w: 'mặt',    m: 'Phần trước của đầu, có mắt mũi.' },
    { w: 'trời',   m: 'Bầu khí quyển xanh trên cao.' },
    { w: 'đèn',    m: 'Vật phát sáng khi tối.' },
  ],
  hard: [
    { w: 'cộng đồng',  m: 'Tập thể nhiều người cùng sống chung.' },
    { w: 'di sản',     m: 'Tài sản tổ tiên để lại, có giá trị lâu dài.' },
    { w: 'kháng chiến', m: 'Cuộc chiến đấu bảo vệ Tổ quốc.' },
    { w: 'biển đảo',   m: 'Phần lãnh thổ ngoài khơi của đất nước.' },
    { w: 'thiên nhiên', m: 'Cây cối, núi sông, biển trời quanh ta.' },
    { w: 'tổ quốc',    m: 'Đất nước nơi em sinh ra và lớn lên.' },
    { w: 'lịch sử',    m: 'Câu chuyện về quá khứ của dân tộc.' },
    { w: 'truyền thống', m: 'Phong tục, tập quán cha ông để lại.' },
    { w: 'môi trường', m: 'Không khí, nước, đất xung quanh chúng ta.' },
    { w: 'gia đình',   m: 'Tập hợp những người thân yêu sống chung nhà.' },
    { w: 'bác sĩ',     m: 'Người chữa bệnh trong bệnh viện.' },
    { w: 'kỹ sư',      m: 'Người thiết kế máy móc, cầu đường.' },
    { w: 'thư viện',   m: 'Nơi mượn sách để đọc.' },
    { w: 'bệnh viện',  m: 'Nơi chữa bệnh cho mọi người.' },
    { w: 'công viên',  m: 'Nơi có cây xanh, ghế đá để dạo chơi.' },
    { w: 'âm nhạc',    m: 'Tiếng đàn, tiếng hát hay làm em vui.' },
    { w: 'thể thao',   m: 'Hoạt động vận động giúp khoẻ mạnh.' },
    { w: 'học sinh',   m: 'Em ngồi học trong lớp gọi là gì?' },
    { w: 'giáo viên',  m: 'Người đứng lớp giảng bài.' },
    { w: 'tự hào',     m: 'Cảm xúc khi đạt được điều tốt đẹp.' },
  ],
};

// ----------- State ----------
const SK_KEY = 'do-chu-ghep-van';
let level = 1;        // 1 = easy, 2 = medium, 3 = hard
let score = 0;
let done = 0;
let skips = 3;
let current = null;   // { w, m, chars[] }
let slotChars = [];   // Array length = số ô slot
let bank = [];        // { ch, used }
let best = 0;
try { best = Number(localStorage.getItem(SK_KEY + '.best') || 0); } catch {}

const LEVEL_NAMES = { 1: 'easy', 2: 'medium', 3: 'hard' };
const NEXT_LEVEL_AT = { 1: 50, 2: 120 };  // score để lên cấp

function rand(n) { return Math.floor(Math.random() * n); }
function pick(arr) { return arr[rand(arr.length)]; }

// Tách từ thành mảng "chữ cần điền" — giữ khoảng trắng giữa âm tiết như một ô riêng (hiển thị " ").
function splitWord(w) {
  return Array.from(w);
}

// ----------- Render ----------
function pickNewWord() {
  const pool = WORDS[LEVEL_NAMES[level]];
  // Random + tránh lặp ngay từ cũ
  let next = null;
  for (let i = 0; i < 5; i++) {
    next = pick(pool);
    if (!current || next.w !== current.w) break;
  }
  current = { ...next, chars: splitWord(next.w) };
  slotChars = new Array(current.chars.length).fill(null);

  // Bank: lấy đúng chữ trong từ + thêm chữ nhiễu (3-6 chữ).
  // Bỏ qua khoảng trắng — vì nếu từ có " ", chúng ta render slot đặc biệt cho khoảng trắng.
  const needed = current.chars.filter(c => c !== ' ');
  const noiseCount = Math.min(6, Math.max(3, Math.floor(needed.length / 2) + 1));
  const VN_LETTERS = 'aăâbcdđeêghiklmnoôơpqrstuưvxyêôươăáàảãạắằẳẵặấầẩẫậéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵ'.split('');
  const noise = [];
  while (noise.length < noiseCount) {
    const c = pick(VN_LETTERS);
    if (!needed.includes(c) && !noise.includes(c)) noise.push(c);
  }
  bank = [...needed, ...noise]
    .map(ch => ({ ch, used: false }))
    .sort(() => Math.random() - .5);

  renderHint();
  renderSlots();
  renderBank();
}

function renderHint() {
  $('#meaning').textContent = current.m;
}

function renderSlots() {
  const wrap = $('#slots');
  wrap.innerHTML = '';
  current.chars.forEach((c, idx) => {
    const div = document.createElement('div');
    if (c === ' ') {
      // Khoảng trắng giữa âm tiết — chỉ là spacer, không kéo thả vào.
      div.style.width = '16px';
      div.style.height = '64px';
      slotChars[idx] = ' ';
    } else {
      div.className = 'slot';
      div.dataset.idx = idx;
      div.textContent = slotChars[idx] || '';
      if (slotChars[idx]) div.classList.add('filled');
      div.addEventListener('dragover', (e) => { e.preventDefault(); div.classList.add('over'); });
      div.addEventListener('dragleave', () => div.classList.remove('over'));
      div.addEventListener('drop', (e) => {
        e.preventDefault();
        div.classList.remove('over');
        const idxBank = e.dataTransfer.getData('text/idx');
        if (idxBank === '') return;
        placeChar(idx, Number(idxBank));
      });
      div.addEventListener('click', () => {
        if (slotChars[idx]) returnChar(idx);
      });
    }
    wrap.appendChild(div);
  });
}

function renderBank() {
  const wrap = $('#bank');
  wrap.innerHTML = '';
  bank.forEach((b, i) => {
    const t = document.createElement('div');
    t.className = 'tile' + (b.used ? ' used' : '');
    t.draggable = !b.used;
    t.textContent = b.ch === ' ' ? '␣' : b.ch;
    t.dataset.idx = i;
    t.addEventListener('dragstart', (e) => {
      if (b.used) { e.preventDefault(); return; }
      e.dataTransfer.setData('text/idx', String(i));
      t.classList.add('dragging');
    });
    t.addEventListener('dragend', () => t.classList.remove('dragging'));
    // Click để auto-place vào ô trống đầu tiên
    t.addEventListener('click', () => {
      if (b.used) return;
      const empty = slotChars.findIndex((v, k) => v == null && current.chars[k] !== ' ');
      if (empty >= 0) placeChar(empty, i);
    });
    wrap.appendChild(t);
  });
}

function placeChar(slotIdx, bankIdx) {
  if (slotChars[slotIdx]) {
    // Đã có chữ — đẩy chữ cũ về bank trước.
    returnChar(slotIdx);
  }
  const b = bank[bankIdx];
  if (!b || b.used) return;
  slotChars[slotIdx] = b.ch;
  b.used = true;
  renderSlots();
  renderBank();
}

function returnChar(slotIdx) {
  const ch = slotChars[slotIdx];
  if (!ch || ch === ' ') return;
  // Tìm bank tile chứa ký tự này đã used → "trả" về (un-use).
  const t = bank.find(b => b.ch === ch && b.used);
  if (t) t.used = false;
  slotChars[slotIdx] = null;
  renderSlots();
  renderBank();
}

function clearAll() {
  slotChars = slotChars.map((c, i) => current.chars[i] === ' ' ? ' ' : null);
  bank.forEach(b => b.used = false);
  renderSlots();
  renderBank();
}

function check() {
  const guess = slotChars.map((c, i) => c == null ? '?' : c).join('');
  if (guess.includes('?')) {
    toast('Hãy điền hết các ô trống đã nhé!', 'bad');
    return;
  }
  if (guess === current.w) {
    // Đúng!
    score += 10;
    done++;
    document.querySelectorAll('.slot').forEach(s => s.classList.add('correct'));
    toast('🎉 Đúng rồi! +10 điểm', 'good');
    confetti();
    updateHud();
    maybeLevelUp();
    saveBest();
    syncWalletXp(10);
    setTimeout(() => nextWord(), 1200);
  } else {
    // Sai
    document.querySelectorAll('.slot').forEach(s => s.classList.add('wrong'));
    toast('Chưa đúng — thử lại nhé!', 'bad');
    setTimeout(() => {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('wrong'));
    }, 500);
  }
}

function skip() {
  if (skips <= 0) { toast('Hết lượt bỏ qua trong phiên này rồi.', 'bad'); return; }
  skips--;
  toast('Đã bỏ qua từ này: ' + current.w, 'bad');
  $('#sk-left').textContent = skips;
  $('#btn-skip').disabled = skips <= 0;
  nextWord();
}

function nextWord() {
  pickNewWord();
}

function maybeLevelUp() {
  const need = NEXT_LEVEL_AT[level];
  if (need && score >= need && level < 3) {
    level++;
    showLevelUp();
  }
}

function showLevelUp() {
  const el = $('#lvup');
  el.textContent = '🎉 Lên cấp ' + level + ' (' + (level === 2 ? 'Trung bình' : 'Khó') + ')!';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
  updateHud();
}

function updateHud() {
  $('#st-score').textContent = score;
  $('#st-level').textContent = level;
  $('#st-done').textContent = done;
  $('#st-best').textContent = best;
}

function saveBest() {
  if (score > best) {
    best = score;
    try { localStorage.setItem(SK_KEY + '.best', String(best)); } catch {}
    updateHud();
  }
}

function confetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','🥳','💖'];
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    c.textContent = pick(emojis);
    c.style.left = (Math.random() * window.innerWidth) + 'px';
    c.style.top = '-20px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1700);
  }
}

function syncWalletXp(gain) {
  if (!gain || !window.fetch) return;
  try {
    fetch('/api/wallet', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(w => {
        if (!w) return;
        fetch('/api/wallet', {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...w, xp: (w.xp || 0) + gain }),
        });
      })
      .catch(() => {});
  } catch {}
}

function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ----------- Init ----------
$('#btn-check').addEventListener('click', check);
$('#btn-skip').addEventListener('click', skip);
$('#btn-clear').addEventListener('click', clearAll);

updateHud();
pickNewWord();
</script>
<!-- Sync best-score local ↔ server -->
<script src="./js/engine/state-sync.js" type="module"></script>
</body>
</html>
