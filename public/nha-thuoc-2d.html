<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>An Tâm Pharma · Nhà thuốc Thực hành 2D</title>
<meta name="description" content="Nhà thuốc thực hành 2D An Tâm Pharma — mô phỏng trực quan mặt tiền và nội thất chuẩn GPP: quầy chữ L, hệ tủ Rx/OTC/sản phẩm không phải thuốc, bấm để xem danh mục.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A5%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --teal:#2F6B5F; --teal-dk:#225C4E; --teal-lt:#3d8476; --white:#ffffff;
    --cream:#FBF7E9; --khaki:#DAC9A6; --ink:#123; --led:#fff6d6;
    --rx:#e05d5d; --otc:#3fae6a; --other:#c79a3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0c1614;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0}
  svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}
  /* HUD */
  .hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:20;
    background:linear-gradient(180deg,rgba(8,20,18,.55),rgba(8,20,18,0));pointer-events:none}
  .hud .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .hud .brand small{font-weight:500;opacity:.8;font-size:12px;display:block;letter-spacing:.5px}
  .hud .spacer{flex:1}
  .hud .btn{pointer-events:auto}
  .btn{cursor:pointer;border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;color:#fff;
    background:var(--teal);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .btn.light{background:#fff;color:var(--teal-dk)}
  .btn.ghost{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25)}
  /* Enter button (storefront) */
  .enter-wrap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:20;text-align:center}
  .enter-wrap .hint{color:#eafff8;font-size:13px;margin-top:10px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .enter-btn{cursor:pointer;border:none;border-radius:999px;padding:15px 30px;font-size:17px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--teal-lt),var(--teal-dk));box-shadow:0 10px 30px rgba(0,0,0,.4);
    letter-spacing:.4px;transition:.18s;animation:pulse 2.6s ease-in-out infinite}
  .enter-btn:hover{transform:scale(1.05)}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.4)}50%{box-shadow:0 10px 40px rgba(78,180,164,.6)}}
  /* interactive cabinet parts */
  .shelf-hit{cursor:pointer}
  .shelf-hit:hover .shelf-hl{opacity:.9}
  .zone-tab{cursor:pointer}
  /* info panel */
  .panel{position:absolute;top:0;right:0;height:100%;width:min(380px,86vw);z-index:30;
    background:linear-gradient(180deg,#12332c,#0e2621);color:#eafff8;box-shadow:-12px 0 40px rgba(0,0,0,.45);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .panel.open{transform:none}
  .panel .ph{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
  .panel .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
  .panel h3{margin:2px 0 4px;font-size:19px}
  .panel .zone{font-size:12.5px;opacity:.8}
  .panel .pb{padding:14px 20px;overflow:auto;flex:1}
  .panel .pb .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;opacity:.65;margin:6px 0}
  .panel ul{margin:6px 0 16px;padding-left:18px}
  .panel li{margin:4px 0;font-size:14px}
  .panel .note{font-size:13px;background:rgba(255,255,255,.06);border-left:3px solid var(--teal-lt);border-radius:8px;padding:10px 12px;margin:8px 0}
  .panel .pf{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:8px}
  .panel .x{position:absolute;top:12px;right:14px;cursor:pointer;color:#eafff8;background:rgba(255,255,255,.1);
    border:none;border-radius:8px;width:32px;height:32px;font-size:18px}
  .panel .x:hover{background:rgba(255,255,255,.2)}
  .toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:25;background:rgba(8,20,18,.9);
    color:#eafff8;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  @media (max-width:640px){ .hud .brand small{display:none} .enter-btn{font-size:15px;padding:13px 24px} }
</style>
</head>

<script>
// ====================== DỮ LIỆU TỦ (bám spec docx) ======================
const RX = ['Thuốc kháng sinh','Thuốc tim mạch','Thuốc nội tiết','Thuốc điều trị đái tháo đường','Thuốc hô hấp','Thuốc thần kinh','Thuốc tiêu hóa','Thuốc kê đơn chuyên khoa khác'];
const OTC = ['Thuốc giảm đau, hạ sốt','Thuốc cảm cúm','Thuốc ho','Thuốc dị ứng','Thuốc tiêu hóa thông thường','Vitamin','Thuốc dùng ngoài','Dung dịch sát khuẩn'];
const TPCN = ['Vitamin và khoáng chất','Men vi sinh','Omega-3','Hỗ trợ xương khớp','Hỗ trợ gan','Hỗ trợ tim mạch','Hỗ trợ tiêu hóa'];
const MYPHAM = ['Sữa rửa mặt','Kem chống nắng','Kem dưỡng da','Dược mỹ phẩm','Sản phẩm chăm sóc tóc','Chăm sóc cơ thể'];
const VATTU = ['Khẩu trang','Băng gạc','Băng cá nhân','Găng tay y tế','Nhiệt kế','Máy đo huyết áp','Máy đo đường huyết','Que thử','Dung dịch sát khuẩn','Dụng cụ sơ cứu'];

// 3 hệ tủ: mỗi hệ có nhiều ngăn (shelf). detail: mô tả khi bấm.
const CABS = [
  { id:'rx', title:'Tủ thuốc kê đơn', tag:'Rx', color:'var(--rx)', hex:'#e05d5d',
    zone:'Phía sau quầy chính — khu dược sĩ đứng cấp phát', shelves: RX.map(n=>({name:n})) },
  { id:'otc', title:'Tủ thuốc không kê đơn (OTC)', tag:'OTC', color:'var(--otc)', hex:'#3fae6a',
    zone:'Dãy tủ thẳng cửa ra vào — khách thấy ngay khi bước vào', shelves: OTC.map(n=>({name:n})) },
  { id:'other', title:'Tủ sản phẩm không phải là thuốc', tag:'Khác', color:'var(--other)', hex:'#c79a3a',
    zone:'Dãy tủ sát tường đối diện quầy chính', shelves:[
      {name:'Vitamin & khoáng chất', sub:['Vitamin và khoáng chất','Men vi sinh','Omega-3']},
      {name:'Thực phẩm chức năng', sub:TPCN},
      {name:'Hỗ trợ xương khớp / gan', sub:['Hỗ trợ xương khớp','Hỗ trợ gan']},
      {name:'Hỗ trợ tim mạch / tiêu hóa', sub:['Hỗ trợ tim mạch','Hỗ trợ tiêu hóa']},
      {name:'Mỹ phẩm & dược mỹ phẩm', sub:MYPHAM},
      {name:'Chăm sóc da / tóc / cơ thể', sub:['Kem dưỡng da','Sản phẩm chăm sóc tóc','Chăm sóc cơ thể']},
      {name:'Vật tư y tế', sub:['Khẩu trang','Băng gạc','Băng cá nhân','Găng tay y tế','Dụng cụ sơ cứu']},
      {name:'Thiết bị đo & que thử', sub:['Nhiệt kế','Máy đo huyết áp','Máy đo đường huyết','Que thử','Dung dịch sát khuẩn']},
    ] },
];
const BOX_COLORS = ['#e6675f','#4aa3d6','#f0b64a','#5ac08a','#b07fd0','#e88fb0','#7fc6c0','#f2a46a'];

// ====================== DỰNG SVG TỦ ======================
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){ const n=document.createElementNS(SVGNS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }

function buildCabinets(){
  const g = document.getElementById('cabinets');
  const total = 1600, margin = 40, gap = 30, n = CABS.length;
  const w = (total - margin*2 - gap*(n-1)) / n;         // bề rộng 1 hệ tủ
  const top = 130, bottom = 596, H = bottom - top;
  const moldH = 22, baseH = 24;
  CABS.forEach((cab, ci) => {
    const x = margin + ci*(w+gap);
    // khung tủ teal
    g.appendChild(el('rect',{x, y:top, width:w, height:H, rx:6, fill:'url(#cabTeal)', stroke:'#1f4a40','stroke-width':2}));
    // hậu tủ sáng
    const innerX=x+12, innerW=w-24, innerTop=top+moldH, innerBot=bottom-baseH;
    g.appendChild(el('rect',{x:innerX, y:innerTop, width:innerW, height:innerBot-innerTop, fill:'url(#cabInner)'}));
    // zone tab (nhãn hệ tủ) — bấm để xem tổng quan
    const tab = el('g',{class:'zone-tab','data-cab':ci});
    tab.appendChild(el('rect',{x:x+w/2-140, y:top-34, width:280, height:28, rx:14, fill:cab.hex}));
    const tt = el('text',{x:x+w/2, y:top-14, 'text-anchor':'middle', 'font-size':16, 'font-weight':800, fill:'#fff', 'font-family':'Arial'}); tt.textContent = cab.title.toUpperCase();
    tab.appendChild(tt); g.appendChild(tab);
    // các ngăn (8)
    const shelves = cab.shelves, sh = (innerBot-innerTop)/shelves.length;
    shelves.forEach((s, si) => {
      const sy = innerTop + si*sh;
      // LED hắt sáng đỉnh ngăn
      g.appendChild(el('rect',{x:innerX, y:sy, width:innerW, height:sh*0.5, fill:'url(#led)', opacity:.5}));
      // hộp thuốc
      const nBox = 5, bw = (innerW-20)/nBox;
      for(let b=0;b<nBox;b++){
        const bh = sh*0.42, bx = innerX+10+b*bw;
        g.appendChild(el('rect',{x:bx, y:sy+sh-bh-9, width:bw-6, height:bh, rx:2, fill:BOX_COLORS[(si+b)%BOX_COLORS.length], opacity:.92}));
        g.appendChild(el('rect',{x:bx, y:sy+sh-bh-9, width:bw-6, height:4, fill:'#ffffff', opacity:.5}));
      }
      // nhãn ngăn
      const lbl = el('text',{x:innerX+8, y:sy+15, 'font-size':12.5, 'font-weight':700, fill:'#1d3b34','font-family':'Arial'}); lbl.textContent = s.name;
      g.appendChild(lbl);
      // đợt kính
      g.appendChild(el('line',{x1:innerX, y1:sy+sh-2, x2:innerX+innerW, y2:sy+sh-2, stroke:'#bfe0d8','stroke-width':2}));
      // vùng bấm + highlight
      const hit = el('g',{class:'shelf-hit','data-cab':ci,'data-shelf':si});
      const hl = el('rect',{x:innerX, y:sy, width:innerW, height:sh, fill:cab.hex, opacity:0, class:'shelf-hl'});
      hit.appendChild(hl);
      hit.appendChild(el('rect',{x:innerX, y:sy, width:innerW, height:sh, fill:'transparent'}));
      g.appendChild(hit);
    });
    // phào chỉ đỉnh (molding trắng) + gờ
    g.appendChild(el('rect',{x:x-4, y:top-6, width:w+8, height:moldH+6, fill:'#ffffff'}));
    g.appendChild(el('rect',{x:x-4, y:top+moldH-2, width:w+8, height:4, fill:'#dfe8e5'}));
    // chân tủ trắng
    g.appendChild(el('rect',{x:x-2, y:bottom-baseH, width:w+4, height:baseH, fill:'#ffffff'}));
    g.appendChild(el('rect',{x:x-2, y:bottom-baseH, width:w+4, height:4, fill:'#e3ece9'}));
  });

  // gắn sự kiện (event delegation)
  g.addEventListener('click', (e)=>{
    const shelf = e.target.closest('.shelf-hit'); const tab = e.target.closest('.zone-tab');
    if(shelf) openShelf(+shelf.dataset.cab, +shelf.dataset.shelf);
    else if(tab) openCabinet(+tab.dataset.cab);
  });
}

// ====================== PANEL ======================
const panel = document.getElementById('panel');
function fill(cab, headTitle, zone, bodyHTML){
  document.getElementById('pTag').textContent = cab.tag;
  document.getElementById('pTag').style.background = cab.hex;
  document.getElementById('pTitle').textContent = headTitle;
  document.getElementById('pZone').textContent = zone;
  document.getElementById('pBody').innerHTML = bodyHTML;
  panel.classList.add('open');
}
function openCabinet(ci){
  const c = CABS[ci];
  const items = c.shelves.map(s=> s.sub ? `<li><b>${s.name}</b><ul>${s.sub.map(x=>`<li>${x}</li>`).join('')}</ul></li>` : `<li>${s.name}</li>`).join('');
  fill(c, c.title, c.zone, `<div class="note">Hệ tủ module 3 tầng, cao sát trần — 8 ngăn/khoang, đợt kính trong suốt có đèn LED hắt sáng.</div><div class="lbl">Các thẻ ngăn</div><ul>${items}</ul>`);
}
function openShelf(ci, si){
  const c = CABS[ci], s = c.shelves[si];
  let body = `<div class="note">Ngăn số ${si+1} · ${c.title}</div>`;
  if(s.sub){ body += `<div class="lbl">Nhóm sản phẩm</div><ul>${s.sub.map(x=>`<li>${x}</li>`).join('')}</ul>`; }
  else { body += `<div class="lbl">Thông tin</div><p style="font-size:14px;line-height:1.5">Ngăn trưng bày <b>${s.name.toLowerCase()}</b>, sắp xếp theo nhóm tác dụng, có nhãn thẻ dán mặt ngăn theo chuẩn GPP.</p>`; }
  fill(c, s.name, c.zone, body);
  currentTag = c.tag;
}
let currentTag = '';
document.getElementById('panelX').onclick = ()=> panel.classList.remove('open');
document.getElementById('pPractice').onclick = ()=> location.href = '/gpp.html';

// ====================== STOREFRONT DECOR (pavement + bushes) ======================
(function decor(){
  const pav = document.getElementById('pavement');
  const cols=['#BDBDBD','#D2B48C','#FFFDD0'];
  for(let r=0;r<4;r++) for(let cx=0;cx<28;cx++){
    const off=(r%2)*30, x=cx*60+off, y=678+r*54;
    pav.appendChild(el('rect',{x, y, width:56, height:50, rx:2, fill:cols[(r+cx)%3], stroke:'#b3b3b3','stroke-width':1}));
  }
  const bushes=document.getElementById('bushes');
  for(let i=0;i<44;i++){ const x=140+i*30;
    bushes.appendChild(el('circle',{cx:x, cy:640, r:14, fill:'#228B22'}));
    bushes.appendChild(el('circle',{cx:x-6+((i*7)%12), cy:634, r:3, fill:'#fff'}));
  }
})();

// ====================== SCENE TOGGLE ======================
const sf = document.getElementById('storefront'), inr = document.getElementById('interior');
const enterWrap = document.getElementById('enterWrap'), doors = document.getElementById('doors');
function showInterior(){
  // hiệu ứng cửa lùa mở
  doors.animate([{opacity:1},{opacity:.15}],{duration:450,fill:'forwards'});
  enterWrap.style.transition='opacity .3s'; enterWrap.style.opacity='0';
  setTimeout(()=>{ sf.classList.add('hidden'); inr.classList.remove('hidden'); enterWrap.classList.add('hidden'); toast('Chào mừng đến khu vực khách hàng — bấm vào các tủ để xem danh mục'); }, 460);
}
function showStorefront(){ inr.classList.add('hidden'); sf.classList.remove('hidden'); enterWrap.classList.remove('hidden'); enterWrap.style.opacity='1'; doors.animate([{opacity:.15},{opacity:1}],{duration:400,fill:'forwards'}); panel.classList.remove('open'); }
document.getElementById('enterBtn').onclick = showInterior;
document.getElementById('btnOutside').onclick = showStorefront;
document.getElementById('btnPractice').onclick = ()=> location.href='/gpp.html';

// toast
let toastT; const toastEl=document.getElementById('toast');
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),3200); }

// build
buildCabinets();
</script>
</body>
</html>
