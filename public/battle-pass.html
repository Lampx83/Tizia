<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎖 Battle Pass · Tizia</title>
<meta name="description" content="Battle Pass mùa 2 tháng — 30 tier reward. Học để leo tier, mở khoá skin pet, frame avatar, emoji pack." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 10% 0%, rgba(167,139,250,.15), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(251,191,36,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }

  .wrap { max-width:none; margin:0 auto; padding:18px; }

  .season-card {
    background:linear-gradient(135deg, rgba(167,139,250,.25), rgba(251,191,36,.12));
    border:1px solid rgba(167,139,250,.45); border-radius:18px;
    padding:20px 24px; margin-bottom:20px;
    display:flex; gap:20px; align-items:center; flex-wrap:wrap;
  }
  .season-card .badge {
    width:84px; height:84px; border-radius:18px;
    background:radial-gradient(circle, rgba(251,191,36,.8), rgba(99,102,241,.4));
    display:flex; align-items:center; justify-content:center; font-size:42px;
    box-shadow:0 8px 24px rgba(99,102,241,.4); flex-shrink:0;
  }
  .season-card .info { flex:1; min-width:200px; }
  .season-card .lbl { font-size:11px; letter-spacing:1.2px; color:var(--text-soft); font-weight:700; text-transform:uppercase; }
  .season-card .nm { font-size:22px; font-weight:800; margin:3px 0;
    background:linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .season-card .meta { font-size:13px; color:var(--text-soft); margin-bottom:6px; }
  .xp-bar { height:10px; background:rgba(0,0,0,.4); border-radius:8px; overflow:hidden; }
  .xp-bar > i { display:block; height:100%;
    background:linear-gradient(90deg, var(--accent), var(--purple)); transition:width .4s; }
  .xp-meta { display:flex; justify-content:space-between; font-size:12px; margin-top:4px; color:var(--text-soft); }
  .xp-meta b { color:var(--accent); }
  .premium-btn {
    padding:9px 18px; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    border:none; font:800 13px 'Inter', system-ui, sans-serif; flex-shrink:0;
    box-shadow:0 6px 18px rgba(251,146,60,.3);
  }
  .premium-btn.have { background:rgba(34,197,94,.18); color:var(--good); border:1px solid var(--good); }

  .tier-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:10px;
  }
  .tier {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:12px; text-align:center;
    transition:transform .15s, border-color .15s;
  }
  .tier.unlocked { border-color:var(--purple); box-shadow:0 4px 14px rgba(167,139,250,.15); }
  .tier:hover { transform:translateY(-2px); }
  .tier .t-num {
    width:32px; height:32px; border-radius:50%; margin:0 auto 6px;
    background:rgba(167,139,250,.15); color:var(--purple);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px;
  }
  .tier.unlocked .t-num { background:var(--purple); color:#fff; }
  .tier .rewards { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .tier .rw {
    padding:6px 8px; border-radius:8px; font-size:11.5px;
    border:1px solid rgba(255,255,255,.05); position:relative;
  }
  .tier .rw.free { background:rgba(34,197,94,.06); border-color:rgba(34,197,94,.18); }
  .tier .rw.premium { background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.25); }
  .tier .rw .lbl { font-size:9.5px; letter-spacing:.6px; text-transform:uppercase;
    opacity:.7; margin-bottom:2px; }
  .tier .rw .item { font-size:12px; font-weight:700; }
  .tier .rw button {
    margin-top:4px; padding:4px 8px; border-radius:6px;
    background:linear-gradient(135deg, var(--good), #10b981); color:#052e16;
    border:none; cursor:pointer; font:700 10.5px 'Inter', system-ui, sans-serif;
  }
  .tier .rw button:disabled { background:rgba(255,255,255,.05); color:rgba(255,255,255,.35); cursor:not-allowed; }
  .tier .rw button.claimed { background:rgba(255,255,255,.08); color:var(--good); cursor:default; }

  .empty, .loading { text-align:center; padding:40px; color:var(--text-soft); }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🎖 Battle Pass</h1>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Đang tải…</div>
</div>

<script type="module">
async function load() {
  const wrap = document.getElementById('wrap');
  try {
    const r = await fetch('/api/bp/me', { credentials:'same-origin' });
    if (r.status === 401) {
      wrap.innerHTML = `<div class="empty"><p>Hãy đăng nhập.</p><a class="back" href="/login.html">Đăng nhập →</a></div>`;
      return;
    }
    const data = await r.json();
    if (!data.ok) { wrap.innerHTML = `<div class="empty">${data.error || 'Không có mùa hiện tại.'}</div>`; return; }
    render(data);
  } catch (e) {
    wrap.innerHTML = `<p style="color:var(--bad)">Lỗi: ${e.message}</p>`;
  }
}

function render(d) {
  const wrap = document.getElementById('wrap');
  const xpPct = Math.min(100, Math.round((d.progress.season_xp / (30 * 500)) * 100));
  wrap.innerHTML = `
    <div class="season-card">
      <div class="badge">🌌</div>
      <div class="info">
        <div class="lbl">Mùa giải hiện tại</div>
        <div class="nm">${esc(d.season.name)}</div>
        <div class="meta">Còn ${d.season.days_left} ngày · Tier ${d.progress.tier}/${d.progress.max_tier} · Season XP <b>${d.progress.season_xp}</b></div>
        <div class="xp-bar"><i style="width:${xpPct}%"></i></div>
        <div class="xp-meta"><span>Tổng tiến độ</span><span><b>${d.progress.season_xp}</b> / ${d.progress.max_tier * 500} XP</span></div>
      </div>
      <button class="premium-btn ${d.progress.has_premium ? 'have' : ''}" id="prem">
        ${d.progress.has_premium ? '✓ Đã có Premium' : '⭐ Mở Premium (5000 🪙)'}
      </button>
    </div>

    <div class="tier-grid">
      ${d.tiers.map(t => renderTier(t, d.progress.has_premium)).join('')}
    </div>
  `;
  document.getElementById('prem').addEventListener('click', async () => {
    if (d.progress.has_premium) return;
    if (!confirm('Mở Premium track tốn 5000 🪙 — chắc chắn?')) return;
    const r = await fetch('/api/bp/buy-premium', { method:'POST', credentials:'same-origin' });
    const data = await r.json();
    if (!data.ok) { alert(data.error || 'Lỗi'); return; }
    load();
  });
  wrap.querySelectorAll('[data-claim]').forEach(b => {
    b.addEventListener('click', async () => {
      const tier = Number(b.dataset.tier);
      const track = b.dataset.track;
      const r = await fetch('/api/bp/claim', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tier, track }), credentials:'same-origin',
      });
      const data = await r.json();
      if (!data.ok) { alert(data.error || 'Lỗi'); return; }
      load();
      try { window.__tziaEngagementHud?.refresh(); } catch {}
    });
  });
}

function renderTier(t, hasPremium) {
  return `
    <div class="tier ${t.unlocked ? 'unlocked' : ''}">
      <div class="t-num">${t.tier}</div>
      <div class="rewards">
        <div class="rw free">
          <div class="lbl">FREE</div>
          <div class="item">+${t.free.coin}🪙 +${t.free.xp}✨${t.free.item ? ' · 🎁' : ''}</div>
          ${t.unlocked
            ? (t.free.claimed
              ? '<button class="claimed">✓ Đã nhận</button>'
              : `<button data-claim data-tier="${t.tier}" data-track="free">Nhận</button>`)
            : '<button disabled>🔒</button>'}
        </div>
        <div class="rw premium">
          <div class="lbl">PREMIUM</div>
          <div class="item">+${t.premium.coin}🪙 +${t.premium.xp}✨${t.premium.item ? ' · 🏆' : ''}</div>
          ${t.unlocked
            ? (!hasPremium
              ? '<button disabled>⭐ cần Premium</button>'
              : (t.premium.claimed
                ? '<button class="claimed">✓ Đã nhận</button>'
                : `<button data-claim data-tier="${t.tier}" data-track="premium">Nhận</button>`))
            : '<button disabled>🔒</button>'}
        </div>
      </div>
    </div>
  `;
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
load();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-07"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
