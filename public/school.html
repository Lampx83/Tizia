<!-- ============ KHUÔN VIÊN TRƯỜNG — CAMPUS MAP ============ -->
<div class="section" id="campus-hero">
  <div class="section-title">
    <h1 id="campus-title">🏫 Trường</h1>
  </div>
  <div id="campus-frame-wrap" style="position:relative;width:100%;height:82vh;min-height:520px;border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 8px 26px rgba(0,0,0,.28)">
    <iframe id="campus-frame" style="width:100%;height:100%;border:0;display:block" title="Khuôn viên trường" loading="lazy"></iframe>
  </div>
</div>
<script>
(function(){
  const dom = new URLSearchParams(location.search).get('domain') || 'pharmacy';
  // Map domain → tên trường + icon (mirror nhẹ của DOMAIN_META cho 8 trường đang mở,
  // tránh phải import module riêng ở inline script — chỉ cần text + icon ngắn gọn).
  const NAMES = {
    pharmacy:   { name: 'Trường Dược',                 icon: '💊' },
    it:         { name: 'Trường Công nghệ thông tin',  icon: '💻' },
    preschool:  { name: 'Trường Mầm non',              icon: '🧸' },
    primary:    { name: 'Trường Tiểu học',             icon: '🎒' },
    secondary:  { name: 'Trường Trung học cơ sở',      icon: '📐' },
    highschool: { name: 'Trường Trung học phổ thông',  icon: '🏫' },
    language:   { name: 'Trường Ngoại ngữ',            icon: '🗣️' },
    driving:    { name: 'Trường Lái xe',               icon: '🚗' },
  };
  const meta = NAMES[dom] || { name: 'Trường ảo', icon: '🏫' };
  // Breadcrumb (auth-header.js đọc body.dataset.pageTitle)
  document.body.dataset.pageTitle = meta.name;
  // H1 trên trang
  const h1 = document.getElementById('campus-title');
  if (h1) h1.textContent = meta.icon + ' ' + meta.name;
  // <title>
  document.title = meta.icon + ' ' + meta.name + ' · Tizia';
  document.getElementById('campus-frame').src = 'campus-proto/b-iso-canvas.html?embed=1&domain=' + encodeURIComponent(dom);
  // GA4: vào trang trường (chọn domain từ trang chủ). school_enter là 1 bước trong
  // funnel mặc định (welcome_view → register → school_enter → module_start → …).
  try { window.tiziaTrack?.('school_enter', { domain: dom }); } catch {}
  window.addEventListener('message', function(e){
    const d = e.data; if(!d || d.type !== 'campus-enter') return;
    // Bấm vào toà nhà trong khuôn viên — chỉ log GA. Toà có trải nghiệm tự điều
    // hướng trong iframe (b-iso-canvas.html: location.href=/space.html?b=…);
    // toà chưa có nội dung → noop (không còn danh sách "Khám phá" để cuộn tới).
    try { window.tiziaTrack?.('campus_building_click', { domain: dom, building: String(d.building || d.id || '').slice(0,40) }); } catch {}
  });
})();
</script>

<!-- Khu "Khám phá thêm" đã bỏ (2026-07-09): mọi hoạt động trong trường vào qua
     việc BẤM toà nhà trên campus map ở trên. Không còn danh sách song song bên dưới.
     Ban điều hành AI, thư viện, lab… đều nằm trong các toà nhà tương ứng. -->

<!-- Load domain + render path (curriculum + các cụm thực hành/kỹ năng/…) -->
<script type="module">
  import { CATEGORIES } from './js/engine/learning-path.js';
  import { loadActiveDomain, getActiveDomainId, isDomainOpen, isGamifiedDomain, isGuestDomain, canEnterDomain, getRequiredPlan } from './js/engine/domain.js';
  import { renderPath, showAchievementToast } from './js/engine/path-renderer.js';
  import { onLogin, getProgress, checkAchievements } from './js/engine/wallet.js';
  import { primeModulesCache, ALL_SCENARIOS } from './js/scenarios/index.js';
  import { fetchMe } from './js/auth.js';
  import { autoPromptEnrollIfNeeded, canInteract } from './js/enrollment.js';

  // Trường đang khoá / không tồn tại → quay về trang chọn trường
  const requested = new URLSearchParams(location.search).get('domain');
  if (requested && !isDomainOpen(requested)) location.replace('index.html');

  // Gate truy cập theo gói cước:
  //   - chưa login + trường ≠ Mầm non → redirect login (giữ return URL)
  //   - đã login nhưng gói chưa đủ (vd Free vào trường yêu cầu Plus) → redirect /pricing
  // Cả 2 trường hợp đều giữ ngữ cảnh để user quay lại đúng trường sau khi đăng nhập/mua.
  // User đã login + chưa chọn trường → bật modal Chọn trường ngay (block UI).
  // Admin/guest bỏ qua. Hàm trả `me` đã reload sau khi user chọn xong.
  const me = (await autoPromptEnrollIfNeeded()) ?? (await fetchMe());
  const activeId = requested || getActiveDomainId();
  if (!canEnterDomain(activeId, me)) {
    const ret = encodeURIComponent(location.pathname + location.search);
    if (!me) {
      location.replace('login.html?return=' + ret);
    } else {
      const required = getRequiredPlan(activeId);
      location.replace(`pricing.html?want=${encodeURIComponent(required)}&domain=${encodeURIComponent(activeId)}&return=${ret}`);
    }
  }

  // Nhãn "Đang học" — chỉ hiện khi đang ở trường của mình.
  // Đặt CẠNH tiêu đề trường (không floating top-right) để không đè avatar/tên
  // tài khoản trong #auth-header. (Banner "Tham quan" đã bỏ theo yêu cầu.)
  if (me && me.role !== 'admin' && me.enrolled_domain && me.enrolled_domain === activeId) {
    const badge = document.createElement('span');
    badge.style.cssText = `display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:800; background:#16a34a; color:#fff; box-shadow:0 4px 12px rgba(22,163,74,.35); white-space:nowrap`;
    badge.textContent = '🎓 Trường bạn đang học';
    const titleRow = document.querySelector('#campus-hero .section-title');
    (titleRow || document.body).appendChild(badge);
  }

  // Admin → nút "✏️ Sửa campus" đặt góc trên-phải BÊN TRONG khung campus (không đè auth-header).
  if (me && me.role === 'admin') {
    const btn = document.createElement('a');
    btn.href = `/admin/campus-editor.html?domain=${encodeURIComponent(activeId)}`;
    btn.textContent = '✏️ Sửa campus';
    btn.style.cssText = `position:absolute; top:12px; right:12px; z-index:50; padding:8px 16px; border-radius:22px; font-size:13px; font-weight:800; background:#0f172a; color:#fff; text-decoration:none; box-shadow:0 6px 18px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.15);`;
    btn.title = `Mở Campus Editor cho trường "${activeId}"`;
    const host = document.getElementById('campus-frame-wrap');
    (host || document.body).appendChild(btn);
  }

  const dom = await loadActiveDomain();
  const { MODULES, SUBJECTS, ACHIEVEMENTS, DOMAIN } = dom;

  document.title = `${DOMAIN.icon} ${DOMAIN.name} · Tizia`;

  primeModulesCache(MODULES);

  const progress = getProgress();

  // Game hoá (XP/level/journey/quest) CHỈ cho Tiểu học + THCS.
  const GAMIFIED = isGamifiedDomain(getActiveDomainId());

  // Lộ trình học giờ nằm TRONG các toà nhà của campus (xem space.html),
  // nên trang trường không còn dựng subway map phẳng "bên ngoài" nữa.

  // Ví XP/coin + nhiệm vụ ngày giờ hiển thị trong header (HUD) — trang trường
  // không còn khối "Tiến độ" riêng nữa. Vẫn chạy onLogin() để tính streak/thành tựu.
  const loginEvent = onLogin();

  const newly = checkAchievements(progress, loginEvent.wallet, ACHIEVEMENTS);
  let delay = 600;
  for (const a of newly) { setTimeout(() => showAchievementToast(a), delay); delay += 1200; }
  if (loginEvent.milestone) {
    setTimeout(() => showAchievementToast({
      icon: '🔥', title: `Chuỗi ${loginEvent.milestone.streak} ngày!`,
      desc: `+${loginEvent.milestone.coin} coin · +${loginEvent.milestone.xp} XP${loginEvent.milestone.shield ? ' · 🛡️ +1 khiên streak' : ''}`,
    }), delay);
  }
</script>
