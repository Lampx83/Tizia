<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Khám phá Tizia — Toàn cảnh tính năng vũ trụ giáo dục ảo (3D · VR · AI)</title>
<meta name="description" content="Khám phá tất cả tính năng Tizia — trường ảo, AI tutor, mô phỏng 3D/VR, gamification, multiplayer, Battle Pass… hé lộ dần theo hành trình học của em." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --card:#151c3a;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 10% 0%, rgba(251,191,36,.10), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(167,139,250,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; text-decoration:none; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; }
  .top h1 { margin:0; font-size:18px; }

  .wrap { max-width:none; margin:24px auto 80px; padding:0 18px; }

  /* Progress hero — show user tier + next unlock */
  .hero {
    background:linear-gradient(135deg, rgba(251,191,36,.15), rgba(167,139,250,.12));
    border:1px solid rgba(251,191,36,.35); border-radius:20px;
    padding:24px; margin-bottom:24px;
    display:flex; gap:20px; align-items:center; flex-wrap:wrap;
  }
  .hero .badge {
    width:80px; height:80px; border-radius:50%;
    background:radial-gradient(circle, rgba(251,191,36,.6), rgba(167,139,250,.3));
    display:flex; align-items:center; justify-content:center;
    font-size:36px; font-weight:800; color:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    flex-shrink:0;
  }
  .hero .info { flex:1; min-width:240px; }
  .hero .lbl { font-size:11px; letter-spacing:1.4px; color:var(--text-soft); font-weight:700; text-transform:uppercase; }
  .hero .level { font-size:24px; font-weight:800; margin:4px 0;
    background:linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .stats { font-size:13.5px; color:var(--text-soft); }
  .hero .stats b { color:var(--accent); }
  .hero .next {
    margin-top:10px; padding:8px 14px; border-radius:10px;
    background:rgba(34,197,94,.15); color:#86efac; font-size:13px;
    border:1px solid rgba(34,197,94,.3);
  }

  /* Tier groups */
  .tier-group { margin-bottom:30px; }
  .tier-header {
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
    padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .tier-header .ic {
    width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800;
  }
  .tier-header.t0 .ic { background:rgba(34,197,94,.2); color:var(--good); }
  .tier-header.t1 .ic { background:rgba(251,191,36,.2); color:var(--accent); }
  .tier-header.t2 .ic { background:rgba(96,165,250,.2); color:#60a5fa; }
  .tier-header.t3 .ic { background:rgba(167,139,250,.2); color:var(--purple); }
  .tier-header.t4 .ic { background:rgba(236,72,153,.2); color:#ec4899; }
  .tier-header.t5 .ic { background:rgba(220,38,38,.2); color:#ef4444; }
  .tier-header.t6 .ic { background:rgba(245,158,11,.2); color:#f59e0b; }
  .tier-header h2 { margin:0; font-size:17px; font-weight:800; flex:1; }
  .tier-header .badge-cnt {
    padding:3px 10px; border-radius:14px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    font-size:11px; font-weight:700; color:var(--text-soft);
  }
  .tier-header.unlocked .badge-cnt { background:rgba(34,197,94,.18); color:var(--good); border-color:var(--good); }

  .feat-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px;
  }
  .feat {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; transition:transform .15s, border-color .15s;
    position:relative; min-height:140px; display:flex; flex-direction:column;
  }
  .feat:not(.locked):hover { transform:translateY(-2px); border-color:var(--accent); }
  .feat.locked {
    opacity:0.55; cursor:not-allowed; background:rgba(15,23,42,.5);
    border-style:dashed;
  }
  .feat.locked::after {
    content:'🔒'; position:absolute; top:10px; right:10px;
    width:28px; height:28px; border-radius:50%;
    background:rgba(15,23,42,0.85); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
  }
  .feat .ic { font-size:30px; line-height:1; margin-bottom:8px; }
  .feat .nm { font-weight:800; font-size:14px; margin-bottom:4px; }
  .feat .desc { font-size:12px; color:var(--text-soft); line-height:1.45; flex:1; margin-bottom:8px; }
  .feat .open {
    display:inline-block; padding:6px 12px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    font-size:11.5px; font-weight:800; text-decoration:none;
    align-self:flex-start;
  }
  .feat .unlock-hint {
    font-size:11px; color:#fbbf24; font-weight:700; align-self:flex-start;
  }

  .empty-tier { color:var(--text-soft); padding:20px; text-align:center; font-size:13px; }

  /* Hidden when role mismatch */
  .hidden { display:none; }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🌌 Tính năng toàn vũ trụ Tizia</h1>
</div>

<div class="wrap" id="wrap">
  <div style="text-align:center;padding:40px;color:var(--text-soft)">Đang tải…</div>
</div>

<script type="module">
const TIER_META = [
  { i:0, ic:'🌱', name:'Mở sẵn — Bắt đầu nào' },
  { i:1, ic:'🔥', name:'Lv 1 — Sau câu quiz đầu tiên' },
  { i:2, ic:'⭐', name:'Lv 2 — Kiên trì 3 ngày' },
  { i:3, ic:'⚡', name:'Lv 3 — Chăm chỉ (30 câu đúng)' },
  { i:4, ic:'🧠', name:'Lv 4 — Học sâu (10 kỹ năng)' },
  { i:5, ic:'🏆', name:'Lv 5 — Học dài hạn (30 ngày)' },
  { i:6, ic:'💎', name:'Lv 6 — Sáng tạo (Pro/GV)' },
];

async function load() {
  const wrap = document.getElementById('wrap');
  try {
    // Trang toàn cảnh: chỉ features cross-school (global) — League, Pet, BP,
    // Shop, Parent, Admin. Features riêng trường (Skills, Combat…) đã trong
    // school.html của từng trường.
    const r = await fetch('/api/features/me?scope=global', { credentials:'same-origin' });
    if (r.status === 401) {
      wrap.innerHTML = `<div style="text-align:center;padding:40px"><p>Hãy đăng nhập để xem hành trình của em.</p><a href="/login.html" class="back">Đăng nhập →</a></div>`;
      return;
    }
    const data = await r.json();
    render(data);
  } catch (e) {
    wrap.innerHTML = `<p style="color:var(--bad)">Lỗi: ${e.message}</p>`;
  }
}

function render(d) {
  const groups = {};
  for (const [key, f] of Object.entries(d.features)) {
    if (!groups[f.tier]) groups[f.tier] = [];
    groups[f.tier].push({ ...f, key });
  }

  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <div class="hero">
      <div class="badge">Lv ${d.user_tier}</div>
      <div class="info">
        <div class="lbl">Tier hiện tại của em</div>
        <div class="level">${TIER_META[d.user_tier]?.name || 'Cấp ' + d.user_tier}</div>
        <div class="stats">
          🔥 <b>${d.progress.streak}</b> streak ·
          ✓ <b>${d.progress.quiz_correct}</b> câu đúng ·
          🎯 <b>${d.progress.skills_earned}</b> kỹ năng ·
          📅 <b>${d.progress.active_days}</b> ngày
        </div>
        ${d.next_unlock ? `
          <div class="next">🔓 Sắp mở: <b>${esc(d.next_unlock.name)}</b> — ${esc(d.next_unlock.hint || 'tiếp tục học')}</div>
        ` : ''}
      </div>
    </div>

    ${TIER_META.map(meta => renderTier(meta, groups[meta.i] || [], d.user_tier)).join('')}
  `;
}

function renderTier(meta, items, userTier) {
  if (items.length === 0) return '';
  const unlocked = userTier >= meta.i;
  const unlockedCount = items.filter(f => f.unlocked).length;
  return `
    <div class="tier-group">
      <div class="tier-header t${meta.i} ${unlocked ? 'unlocked' : ''}">
        <div class="ic">${meta.ic}</div>
        <h2>${esc(meta.name)}</h2>
        <span class="badge-cnt">${unlockedCount}/${items.length}</span>
      </div>
      <div class="feat-grid">
        ${items.map(f => `
          <div class="feat ${f.unlocked ? '' : 'locked'}">
            <div class="ic">${(f.name||'').match(/[\p{Emoji}]+/u)?.[0] || '✨'}</div>
            <div class="nm">${esc(f.name.replace(/[\p{Emoji}]+/gu, '').trim())}</div>
            ${f.desc ? `<div class="desc">${esc(f.desc)}</div>` : '<div class="desc"></div>'}
            ${f.unlocked
              ? (f.url ? `<a href="${esc(f.url)}" class="open">Mở →</a>` : '<span class="open" style="opacity:.5">— sẵn sàng</span>')
              : `<span class="unlock-hint">${esc(f.unlock_text || 'Sắp mở')}</span>`}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
load();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-07"></script>
</body>
</html>
