<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đường cong Dược động học · PK/TDM | Tizia</title>
<style>
  :root { --bg-1:#0f172a; --bg-2:#1e293b; --accent:#ec4899; --ok:#10b981; --err:#ef4444; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Inter',system-ui,sans-serif; color:#fff; overflow:hidden; }
  body { background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(236,72,153,.16), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2)); }
  .topbar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; gap:14px; align-items:center; padding:10px 16px;
    background:rgba(0,0,0,.4); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.08); font-size:13px; }
  .topbar a { color:#fff; opacity:.75; text-decoration:none; } .topbar a:hover { opacity:1; }
  .topbar .title { font-weight:700; } .topbar .spacer { flex:1; }
  .verdict { padding:5px 12px; border-radius:14px; font-weight:700; font-size:12.5px; background:#334155; }
  .verdict.ok { background:var(--ok); color:#04241a; } .verdict.bad { background:#7f1d1d; color:#fecaca; }
  canvas { display:block; position:absolute; top:0; left:0; touch-action:none; }
  .controls { position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(2,6,23,.82); backdrop-filter:blur(12px);
    border-top:1px solid rgba(255,255,255,.1); padding:12px 18px 16px; display:flex; gap:22px; align-items:flex-end; flex-wrap:wrap; justify-content:center; }
  .ctrl { display:flex; flex-direction:column; gap:4px; min-width:170px; }
  .ctrl label { font-size:12px; opacity:.85; display:flex; justify-content:space-between; }
  .ctrl label b { color:var(--accent); }
  .ctrl input[type=range] { width:100%; accent-color:var(--accent); }
  .readout { display:flex; gap:16px; align-items:center; padding:8px 14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:12px; }
  .readout .r { text-align:center; } .readout .r .v { font-size:18px; font-weight:800; } .readout .r .k { font-size:10.5px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; }
  .readout .r.cmax .v { color:#f87171; } .readout .r.cmin .v { color:#fbbf24; } .readout .r.ss .v { color:#a5b4fc; }
  .hint { position:fixed; left:50%; top:54px; transform:translateX(-50%); font-size:13px; opacity:.85; z-index:9; text-align:center; max-width:90vw; }
  .toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:10px 18px;
    border-radius:10px; font-size:14px; z-index:20; border-left:3px solid var(--accent); }
  @media (max-width:720px){ .topbar{font-size:11px;} .ctrl{min-width:130px;} .readout{gap:10px;padding:6px 10px;} .readout .r .v{font-size:15px;} }
</style>
</head>
<body>

<div class="topbar">
  <a href="space.html?b=clinpharm&domain=pharmacy">← Dược lý – Lâm sàng</a>
  <span class="title">📈 Đường cong Dược động học (PK/TDM)</span>
  <span class="spacer"></span>
  <span class="verdict" id="verdict">…</span>
</div>

<div class="hint" id="hint">🎯 Mục tiêu: chỉnh để nồng độ ĐÁY ổn định nằm trong cửa sổ điều trị (10–20 mg/L) mà ĐỈNH không vượt ngưỡng độc (30).</div>

<canvas id="canvas"></canvas>

<div class="controls">
  <div class="ctrl">
    <label>Liều mỗi lần <b><span id="v-dose">300</span> mg</b></label>
    <input type="range" id="s-dose" min="100" max="800" step="50" value="300">
  </div>
  <div class="ctrl">
    <label>Khoảng cách liều <b><span id="v-int">12</span> h</b></label>
    <input type="range" id="s-int" min="4" max="24" step="2" value="12">
  </div>
  <div class="ctrl">
    <label>Thời gian bán thải t½ <b><span id="v-th">8</span> h</b></label>
    <input type="range" id="s-th" min="2" max="24" step="1" value="8">
  </div>
  <div class="readout">
    <div class="r cmax"><div class="v" id="r-cmax">–</div><div class="k">Cmax đỉnh</div></div>
    <div class="r cmin"><div class="v" id="r-cmin">–</div><div class="k">Cmin đáy</div></div>
    <div class="r ss"><div class="v" id="r-ss">–</div><div class="k">Đạt ổn định</div></div>
  </div>
</div>

<div id="toast" style="display:none"></div>

<script type="module">
let submitAttempt = async () => {};
try { ({ submitAttempt } = await import('./js/api.js')); } catch (e) {}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize(); window.addEventListener('resize', resize);

// === PK model (1-compartment, IV bolus, multiple dosing) ===
const Vd = 40;               // L (fixed)
const WIN_LO = 10, WIN_HI = 20, TOXIC = 30;   // therapeutic window & toxic threshold (mg/L)
let dose = 300, interval = 12, thalf = 8;
let reveal = 0, revealStart = performance.now();
let solved = false;

function k() { return Math.LN2 / thalf; }
function perDose() { return dose / Vd; }
function tmax() { return Math.min(120, Math.max(5 * thalf, 4 * interval, 36)); }
function conc(t) {
  const kk = k(), c0 = perDose(); let c = 0;
  for (let td = 0; td <= t + 1e-9; td += interval) c += c0 * Math.exp(-kk * (t - td));
  return c;
}
function cmaxSS() { return perDose() / (1 - Math.exp(-k() * interval)); }
function cminSS() { return cmaxSS() * Math.exp(-k() * interval); }
function tSS() { return 5 * thalf; }

// === draw ===
const M = { l: 58, r: 26, t: 70 };
function plotBox() { return { x0: M.l, y0: M.t, x1: W - M.r, y1: H - 188 }; }
function yMax() { return Math.max(TOXIC + 8, cmaxSS() * 1.12); }
function X(t, b) { return b.x0 + (t / tmax()) * (b.x1 - b.x0); }
function Y(c, b) { return b.y1 - (c / yMax()) * (b.y1 - b.y0); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, W, H);
  const b = plotBox(); const ym = yMax(); const tm = tmax();

  // therapeutic window band
  ctx.fillStyle = 'rgba(16,185,129,0.13)';
  ctx.fillRect(b.x0, Y(WIN_HI, b), b.x1 - b.x0, Y(WIN_LO, b) - Y(WIN_HI, b));
  ctx.fillStyle = 'rgba(16,185,129,0.85)'; ctx.font = '11px Inter'; ctx.textAlign = 'left';
  ctx.fillText('Cửa sổ điều trị', b.x0 + 8, Y(WIN_HI, b) + 14);

  // toxic line
  ctx.strokeStyle = 'rgba(239,68,68,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(b.x0, Y(TOXIC, b)); ctx.lineTo(b.x1, Y(TOXIC, b)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#f87171'; ctx.fillText('Ngưỡng độc (' + TOXIC + ')', b.x0 + 8, Y(TOXIC, b) - 5);

  // axes
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(b.x0, b.y0); ctx.lineTo(b.x0, b.y1); ctx.lineTo(b.x1, b.y1); ctx.stroke();
  // y ticks
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '10px Inter'; ctx.textAlign = 'right';
  for (let c = 0; c <= ym; c += 10) { const y = Y(c, b); ctx.fillText(c, b.x0 - 6, y + 3);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(b.x0, y); ctx.lineTo(b.x1, y); ctx.stroke(); }
  ctx.save(); ctx.translate(16, (b.y0 + b.y1) / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '12px Inter';
  ctx.fillText('Nồng độ thuốc (mg/L)', 0, 0); ctx.restore();
  // x ticks
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '10px Inter';
  const xStep = tm <= 48 ? 12 : 24;
  for (let t = 0; t <= tm; t += xStep) ctx.fillText(t + 'h', X(t, b), b.y1 + 16);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '12px Inter';
  ctx.fillText('Thời gian (giờ)', (b.x0 + b.x1) / 2, b.y1 + 34);

  // dose markers
  for (let td = 0; td <= tm; td += interval) {
    ctx.strokeStyle = 'rgba(236,72,153,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(td, b), b.y1); ctx.lineTo(X(td, b), b.y1 - 8); ctx.stroke();
    ctx.fillStyle = 'rgba(236,72,153,0.8)'; ctx.font = '12px Inter';
    ctx.fillText('💊', X(td, b), b.y1 - 12);
  }

  // concentration curve (animated reveal)
  const N = 360, tEnd = tm * reveal;
  ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * tEnd; const c = conc(t);
    const px = X(t, b), py = Y(c, b);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  // fill under curve
  ctx.lineTo(X(tEnd, b), b.y1); ctx.lineTo(b.x0, b.y1); ctx.closePath();
  ctx.fillStyle = 'rgba(236,72,153,0.10)'; ctx.fill();

  // steady-state guide lines (right third)
  if (reveal >= 0.99) {
    const cMx = cmaxSS(), cMn = cminSS();
    ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(248,113,113,0.6)'; ctx.beginPath(); ctx.moveTo(b.x1 - 120, Y(cMx, b)); ctx.lineTo(b.x1, Y(cMx, b)); ctx.stroke();
    ctx.strokeStyle = 'rgba(251,191,36,0.6)'; ctx.beginPath(); ctx.moveTo(b.x1 - 120, Y(cMn, b)); ctx.lineTo(b.x1, Y(cMn, b)); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// === update / verdict ===
function update() {
  document.getElementById('v-dose').textContent = dose;
  document.getElementById('v-int').textContent = interval;
  document.getElementById('v-th').textContent = thalf;
  const cMx = cmaxSS(), cMn = cminSS();
  document.getElementById('r-cmax').textContent = cMx.toFixed(1);
  document.getElementById('r-cmin').textContent = cMn.toFixed(1);
  document.getElementById('r-ss').textContent = Math.round(tSS()) + 'h';
  const v = document.getElementById('verdict');
  const inWin = cMn >= WIN_LO && cMn <= WIN_HI && cMx <= TOXIC;
  if (inWin) { v.textContent = '✓ Phác đồ hợp lý'; v.className = 'verdict ok';
    if (!solved) { solved = true; toast('🎯 Tuyệt! Đáy trong cửa sổ điều trị, đỉnh dưới ngưỡng độc.');
      try { submitAttempt({ version: 'pk-curve', score: 100, correct: 1, total: 1, durationMs: 0, details: { dose, interval, thalf, cMx, cMn } }); } catch (e) {} } }
  else {
    solved = false;
    let msg = '⚠️ ';
    if (cMx > TOXIC) msg += 'Đỉnh vượt ngưỡng độc, giảm liều';
    else if (cMn < WIN_LO) msg += 'Đáy dưới ngưỡng: tăng liều / rút ngắn khoảng cách';
    else if (cMn > WIN_HI) msg += 'Đáy quá cao: giảm liều / giãn khoảng cách';
    else msg += 'Chưa tối ưu';
    v.textContent = msg; v.className = 'verdict bad';
  }
}

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3500); }

function onChange() {
  dose = +document.getElementById('s-dose').value;
  interval = +document.getElementById('s-int').value;
  thalf = +document.getElementById('s-th').value;
  reveal = 0; revealStart = performance.now();
  update();
}
['s-dose', 's-int', 's-th'].forEach(id => document.getElementById(id).addEventListener('input', onChange));

// hover readout
canvas.addEventListener('mousemove', (e) => {
  const b = plotBox(); const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  if (mx < b.x0 || mx > b.x1) { hoverT = null; return; }
  hoverT = ((mx - b.x0) / (b.x1 - b.x0)) * tmax();
});
canvas.addEventListener('mouseleave', () => hoverT = null);
let hoverT = null;

function tick() {
  if (reveal < 1) reveal = Math.min(1, (performance.now() - revealStart) / 900);
  draw();
  if (hoverT != null) {
    const b = plotBox(); const c = conc(hoverT);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(X(hoverT, b), b.y0); ctx.lineTo(X(hoverT, b), b.y1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(hoverT, b), Y(c, b), 4, 0, 7); ctx.fill();
    ctx.font = 'bold 12px Inter'; ctx.textAlign = 'left';
    ctx.fillText(`t=${hoverT.toFixed(1)}h · C=${c.toFixed(1)} mg/L`, X(hoverT, b) + 8, Y(c, b) - 8);
  }
  requestAnimationFrame(tick);
}
update(); tick();
</script>
</body>
</html>
