<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🤝 Đúng hay Sai? Đạo đức Lớp 2 · Tizia</title>
<style>
  :root { --bg-1:#fef3c7; --bg-2:#fde68a; --accent:#d97706; --ok:#22c55e; --bad:#ef4444;
    --border:rgba(0,0,0,.08); --ink:#1f2937; --muted:#6b7280; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:'Inter','Quicksand',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse 90% 50% at 50% 0%, #fde68a, transparent),linear-gradient(180deg,var(--bg-1),#fef9c3)}
  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.75);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
  .back{color:var(--ink);text-decoration:none;opacity:.85;font-size:14px;background:rgba(0,0,0,.06);padding:8px 14px;border-radius:10px;font-weight:600}
  .back:hover{background:rgba(0,0,0,.12)}
  .top h1{margin:0;font-size:18px;font-weight:800}
  .top .sub{font-size:12.5px;opacity:.6;font-weight:500}
  .top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .stat{background:white;border:1px solid var(--border);border-radius:14px;padding:7px 13px;font-weight:700}
  .stat .v{color:var(--accent);font-size:16px}
  .wrap{max-width:520px;margin:0 auto;padding:24px 18px 60px}
  .intro{text-align:center;margin:6px 0 18px;opacity:.85;font-size:14px}
  .deck{position:relative;height:340px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
  .card{position:absolute;width:100%;background:#fff;border-radius:22px;border:1px solid var(--border);
    box-shadow:0 12px 36px rgba(0,0,0,.12);padding:26px 22px;transition:transform .35s, opacity .35s}
  .card .emo{font-size:60px;text-align:center;margin-bottom:8px}
  .card .text{font-size:17px;font-weight:700;text-align:center;line-height:1.4;color:var(--ink)}
  .card.swipeR{transform:translateX(140%) rotate(20deg);opacity:0}
  .card.swipeL{transform:translateX(-140%) rotate(-20deg);opacity:0}
  .badge{position:absolute;top:14px;font-size:32px;font-weight:900;padding:6px 12px;border-radius:10px;border:3px solid;opacity:0;transition:opacity .2s}
  .badge.yes{right:18px;color:var(--ok);border-color:var(--ok);transform:rotate(8deg)}
  .badge.no{left:18px;color:var(--bad);border-color:var(--bad);transform:rotate(-8deg)}
  .card.showYes .badge.yes{opacity:1}
  .card.showNo .badge.no{opacity:1}
  .buttons{display:flex;justify-content:center;gap:24px;margin-bottom:12px}
  .pill{width:78px;height:78px;border-radius:50%;border:none;font-size:38px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .12s}
  .pill:active{transform:scale(.92)}
  .pill.no{background:linear-gradient(180deg,#fca5a5,#ef4444);color:#fff}
  .pill.yes{background:linear-gradient(180deg,#86efac,#22c55e);color:#fff}
  .progress{height:8px;background:rgba(0,0,0,.08);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .progress > div{height:100%;background:linear-gradient(90deg,#fbbf24,#d97706);width:0%;transition:width .3s}
  .feedback{text-align:center;font-weight:700;min-height:22px;font-size:13.5px;margin-top:10px}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.hide{display:none}
  .panel{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:28px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .panel .ic{font-size:64px}
  .panel h2{margin:6px 0 8px;font-size:22px}
  .panel p{margin:4px 0;color:var(--muted);font-size:14px}
  .panel .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
  .btn.ghost{background:rgba(0,0,0,.06);color:var(--ink)}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<script type="module">import { applyViewOnlyGate } from "/js/enrollment.js"; applyViewOnlyGate("primary");</script>
<div class="top">
  <a class="back" href="/space.html?b=g2&domain=primary">← Lớp 2</a>
  <div><h1>🤝 Đúng hay Sai?</h1><div class="sub">Đạo đức Lớp 2, chọn ✅ đúng hoặc ❌ sai cho từng tình huống</div></div>
  <div class="right">
    <div class="stat">✅ <span class="v" id="right">0</span></div>
    <div class="stat">❌ <span class="v" id="wrong">0</span></div>
    <div class="stat">📜 <span class="v" id="cur">0/0</span></div>
  </div>
</div>

<div class="wrap">
  <p class="intro">Đọc tình huống, nếu hành vi đúng → bấm ✅, sai → bấm ❌. Bạn cũng có thể vuốt thẻ sang phải/trái.</p>
  <div class="progress"><div id="bar"></div></div>
  <div class="deck" id="deck"></div>
  <div class="buttons">
    <button class="pill no" id="btn-no" title="Sai">❌</button>
    <button class="pill yes" id="btn-yes" title="Đúng">✅</button>
  </div>
  <div class="feedback" id="fb">&nbsp;</div>
</div>

<div class="modal hide" id="modal-over">
  <div class="panel">
    <div class="ic">🌟</div>
    <h2 id="ov-title">Hoàn thành!</h2>
    <p id="ov-msg">Em đã học được nhiều bài học hay.</p>
    <p>Đúng: <b id="ov-right">0</b>/<b id="ov-total">0</b> · Điểm: <b id="ov-score">0</b></p>
    <p>Best: <b id="ov-best">-</b></p>
    <div class="row">
      <button class="btn" id="btn-restart">🔁 Chơi lại</button>
      <a class="btn ghost" href="/space.html?b=g2&domain=primary">← Về Lớp 2</a>
    </div>
  </div>
</div>

<script>
const POOL=[
  {e:'🧓',t:'Em nhường ghế xe buýt cho cụ già.',ok:true,f:'Kính trọng người lớn tuổi.'},
  {e:'🗑️',t:'Em vứt vỏ bánh xuống sân trường.',ok:false,f:'Phải bỏ rác đúng nơi quy định.'},
  {e:'📚',t:'Em mượn sách bạn và trả đúng hẹn.',ok:true,f:'Giữ chữ tín với bạn bè.'},
  {e:'😡',t:'Em giận bạn và đánh bạn.',ok:false,f:'Bạo lực là sai, hãy bình tĩnh nói chuyện.'},
  {e:'🙏',t:'Em chào hỏi thầy cô khi gặp.',ok:true,f:'Lễ phép với thầy cô.'},
  {e:'🍱',t:'Em chê cơm mẹ nấu trước mặt mẹ.',ok:false,f:'Cần biết ơn người lớn nấu cho em.'},
  {e:'🧹',t:'Em giúp mẹ quét nhà sau khi học bài.',ok:true,f:'Yêu lao động, giúp đỡ gia đình.'},
  {e:'📵',t:'Em chơi game của bạn khi bạn không cho phép.',ok:false,f:'Phải xin phép trước khi dùng đồ của người khác.'},
  {e:'🤝',t:'Em rủ bạn mới vào chơi cùng nhóm.',ok:true,f:'Đoàn kết và thân thiện với bạn.'},
  {e:'🏃',t:'Em chạy xô ngã bạn nhỏ lớp 1 mà không xin lỗi.',ok:false,f:'Phải biết xin lỗi và đỡ bạn dậy.'},
  {e:'💧',t:'Em khoá vòi nước sau khi rửa tay xong.',ok:true,f:'Tiết kiệm nước, bảo vệ môi trường.'},
  {e:'🚦',t:'Em chạy qua đường khi đèn còn đỏ.',ok:false,f:'Phải đợi đèn xanh và đi đúng vạch.'},
  {e:'📞',t:'Em báo bố mẹ khi có người lạ rủ đi theo.',ok:true,f:'Tự bảo vệ và tin cậy người thân.'},
  {e:'😶',t:'Em thấy bạn quên cặp mà không nhắc.',ok:false,f:'Nên nhắc bạn để bạn không bị quên.'},
  {e:'🎁',t:'Em chia kẹo cho bạn ngồi cạnh.',ok:true,f:'Biết chia sẻ và quan tâm bạn bè.'},
];
const $=s=>document.querySelector(s);
const deck=$('#deck');
let queue=[], idx=0, right=0, wrong=0, total=10, currentEl=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderCard(){
  deck.innerHTML='';
  if(idx>=queue.length){ end(); return; }
  const q=queue[idx];
  const el=document.createElement('div');
  el.className='card';
  el.innerHTML=`<div class="emo">${q.e}</div><div class="text">${q.t}</div>
    <div class="badge yes">ĐÚNG</div><div class="badge no">SAI</div>`;
  deck.appendChild(el);
  currentEl=el;
  $('#cur').textContent=(idx+1)+'/'+total;
  $('#bar').style.width = ((idx)/total*100)+'%';
}

function answer(picked){
  if(!currentEl) return;
  const q=queue[idx];
  const correct = (picked===q.ok);
  if(correct){ right++; $('#right').textContent=right; $('#fb').textContent='✅ '+q.f; $('#fb').className='feedback ok'; }
  else { wrong++; $('#wrong').textContent=wrong; $('#fb').textContent='❌ '+q.f; $('#fb').className='feedback bad'; }
  currentEl.classList.add(picked?'swipeR':'swipeL');
  // Show badge feedback briefly
  currentEl.classList.add(picked?'showYes':'showNo');
  const el=currentEl; currentEl=null;
  setTimeout(()=>{
    idx++;
    renderCard();
  }, 380);
}

// Swipe / drag
let dragX0=null, curDX=0;
function bindSwipe(){
  deck.addEventListener('pointerdown', e=>{
    if(!currentEl) return;
    dragX0=e.clientX; curDX=0;
    currentEl.style.transition='none';
  });
  deck.addEventListener('pointermove', e=>{
    if(dragX0==null||!currentEl) return;
    curDX = e.clientX - dragX0;
    currentEl.style.transform=`translateX(${curDX}px) rotate(${curDX*0.05}deg)`;
    currentEl.classList.toggle('showYes', curDX>40);
    currentEl.classList.toggle('showNo', curDX<-40);
  });
  deck.addEventListener('pointerup', e=>{
    if(dragX0==null||!currentEl){ dragX0=null; return; }
    currentEl.style.transition='';
    if(curDX>80) answer(true);
    else if(curDX<-80) answer(false);
    else { currentEl.style.transform=''; currentEl.classList.remove('showYes','showNo'); }
    dragX0=null; curDX=0;
  });
}

function start(){
  queue = shuffle([...POOL]).slice(0,total);
  idx=0;right=0;wrong=0;
  $('#right').textContent=0; $('#wrong').textContent=0;
  $('#fb').textContent=' '; $('#fb').className='feedback';
  renderCard();
}

function end(){
  $('#bar').style.width='100%';
  const score = right*15 - wrong*4;
  const safe=Math.max(0,score);
  const key='lop2-dao-duc.best';
  const prev=Number(localStorage.getItem(key)||0);
  const best=Math.max(prev,safe);
  if(safe>prev) localStorage.setItem(key,safe);
  $('#ov-right').textContent=right; $('#ov-total').textContent=total;
  $('#ov-score').textContent=safe; $('#ov-best').textContent=best;
  $('#ov-title').textContent = right>=9?'🏆 Học sinh gương mẫu!':right>=7?'🌟 Tốt lắm!':'👍 Cố gắng nhé!';
  $('#ov-msg').textContent = right>=9?'Em rất hiểu và sống đẹp!':'Đọc kĩ tình huống lần sau nhé.';
  $('#modal-over').classList.remove('hide');
  try{
    const xp=Math.floor(safe/10);
    if(xp>0 && window.fetch){
      fetch('/api/wallet',{credentials:'include'}).then(r=>r.ok?r.json():null).then(w=>{
        if(!w) return;
        fetch('/api/wallet',{method:'PUT',credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({...w, xp:(w.xp||0)+xp})});
      });
    }
  }catch{}
}

$('#btn-yes').addEventListener('click',()=>answer(true));
$('#btn-no').addEventListener('click',()=>answer(false));
$('#btn-restart').addEventListener('click',()=>{ $('#modal-over').classList.add('hide'); start(); });
bindSwipe();
start();
</script>
</body>
</html>
