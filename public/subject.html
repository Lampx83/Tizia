<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lộ trình môn học · Tizia</title>
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; padding: 24px 16px 60px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.22), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.16), transparent),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  }
  .wrap { max-width:none; margin: 0 auto; }
  .top-nav { display: flex; gap: 12px; margin-bottom: 18px; font-size: 14px; opacity: 0.85; }
  .top-nav a { color: rgba(255,255,255,0.75); text-decoration: none; }
  .top-nav a:hover { color: #fff; }
  .subj-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .subj-hero .sh-ic { font-size: 44px; }
  .subj-hero h1 { margin: 0; font-size: 26px; }
  .subj-hero p { margin: 4px 0 0; font-size: 13.5px; opacity: 0.8; }

  .subj-overall { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
  .so-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .so-bar { height: 12px; border-radius: 8px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .so-bar > i { display: block; height: 100%; background: linear-gradient(90deg,#8b5cf6,#22d3ee); border-radius: 8px; transition: width .8s; }

  /* Chapter */
  .chapter { background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
  .chapter.locked { opacity: 0.6; }
  .ch-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .ch-ic { font-size: 26px; }
  .ch-title { font-size: 18px; font-weight: 800; }
  .ch-prog { margin-left: auto; font-size: 12px; font-weight: 700; opacity: 0.85;
    background: rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 999px; }
  .ch-desc { font-size: 12.5px; opacity: 0.7; margin: 0 0 14px; }
  .ch-locknote { font-size: 12.5px; color: #cbd5e1; opacity: 0.85; }

  /* Lesson path */
  .lp-path { display: flex; flex-wrap: wrap; gap: 14px 10px; align-items: stretch; }
  .lp-node {
    position: relative; width: 150px; min-height: 116px;
    background: rgba(0,0,0,0.28); border: 2px solid rgba(255,255,255,0.16);
    border-radius: 14px; padding: 12px; text-decoration: none; color: #fff;
    display: flex; flex-direction: column; gap: 6px; transition: all .16s;
  }
  .lp-node .lp-num { position: absolute; top: -10px; left: -10px; width: 26px; height: 26px;
    border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; border: 2px solid rgba(255,255,255,0.2); }
  .lp-ic { font-size: 24px; }
  .lp-title { font-size: 13px; font-weight: 700; line-height: 1.3; flex: 1; }
  .lp-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .lp-stars { color: #fbbf24; letter-spacing: 1px; }
  .lp-tag { font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }

  .lp-node.completed { border-color: #22c55e; background: rgba(34,197,94,0.16); }
  .lp-node.completed .lp-num { background: #22c55e; color: #06281a; }
  .lp-node.active { border-color: #f97316; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(249,115,22,.5), 0 10px 26px rgba(249,115,22,.25);
    animation: lpPulse 1.8s infinite; }
  .lp-node.active .lp-num { background: #f97316; color: #1f1147; }
  .lp-node.unlocked { cursor: pointer; }
  .lp-node.unlocked:hover, .lp-node.active:hover, .lp-node.completed:hover { transform: translateY(-3px); border-color: #fbbf24; }
  .lp-node.locked { opacity: 0.5; filter: grayscale(0.4); cursor: not-allowed; }
  .lp-node.boss { background: linear-gradient(160deg, rgba(251,191,36,0.18), rgba(0,0,0,0.3)); border-color: #fbbf24; }
  .lp-node.boss.completed { background: linear-gradient(160deg, rgba(251,191,36,0.22), rgba(34,197,94,0.18)); }
  .lp-tag.t-active { background: #f97316; color: #1f1147; }
  .lp-tag.t-done { background: rgba(34,197,94,0.25); color: #6ee7b7; }
  .lp-tag.t-locked { background: rgba(148,163,184,0.22); color: #cbd5e1; }
  .lp-tag.t-boss { background: #fbbf24; color: #1f1147; }
  @keyframes lpPulse { 0%{box-shadow:0 0 0 0 rgba(249,115,22,.5)} 70%{box-shadow:0 0 0 9px rgba(249,115,22,0)} 100%{box-shadow:0 0 0 0 rgba(249,115,22,0)} }

  .subj-msg { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <a href="index.html">← Trang chủ</a>
    <span style="opacity:0.4">·</span>
    <a id="back-school" href="school.html?domain=secondary">🗺️ Lộ trình trường</a>
  </div>

  <div id="identity-host"></div>
  <div id="quests-host" style="margin:12px 0"></div>

  <div id="content"></div>
</div>

<script type="module">
  import { migrateAllKnown } from './js/engine/storage.js';
  migrateAllKnown();
  import { onLogin, getProgress, getDailyQuests, streakAtRisk } from './js/engine/wallet.js';
  // Chương Toán 6 từ DB (/api/content/math6-chapters) — không bundle nữa.
  const MATH6_CHAPTERS = await fetch('/api/content/math6-chapters', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : { items: [] }).then(j => j.items || []).catch(() => []);
  import { renderWalletPills, renderDailyQuests, showAchievementToast } from './js/engine/path-renderer.js';

  const params = new URLSearchParams(location.search);
  const subject = params.get('subject') || 'toan';
  const grade = params.get('grade') || '6';
  const content = document.getElementById('content');

  const loginEvent = onLogin();
  const progress = getProgress();
  renderWalletPills(document.getElementById('identity-host'), {
    wallet: loginEvent.wallet, progress, atRisk: streakAtRisk(),
  });
  renderDailyQuests(document.getElementById('quests-host'), getDailyQuests());
  if (loginEvent.milestone) {
    setTimeout(() => showAchievementToast({
      icon: '🔥', title: `Chuỗi ${loginEvent.milestone.streak} ngày!`,
      desc: `+${loginEvent.milestone.coin} coin · +${loginEvent.milestone.xp} XP`,
    }), 700);
  }

  // Hiện tại chỉ có lộ trình Toán 6
  if (!(subject === 'toan' && grade === '6')) {
    content.innerHTML = `<div class="subj-msg">
      <h2>⏳ Lộ trình đang được xây dựng</h2>
      <p>Môn này sẽ sớm có hệ thống chương → bài như Toán lớp 6.</p>
      <p><a href="school.html?domain=secondary" style="color:var(--accent)">← Quay lại lộ trình trường</a></p>
    </div>`;
  } else {
    renderMath6();
  }

  function starsOf(id) { return Math.max(0, Math.min(3, progress[id]?.stars || 0)); }
  function isDone(id) { return starsOf(id) >= 1; }

  function renderMath6() {
    // ── Tính trạng thái mở khoá tuần tự ──
    let prevChapterCleared = true; // chương 1 luôn mở
    let activeLessonId = null;
    const chaptersState = MATH6_CHAPTERS.map(ch => {
      const chapterUnlocked = prevChapterCleared;
      let prevLessonDone = true; // bài 1 mở nếu chương mở
      const lessons = ch.lessons.map(l => {
        const done = isDone(l.id);
        const unlocked = chapterUnlocked && prevLessonDone;
        let state = 'locked';
        if (done) state = 'completed';
        else if (unlocked) state = 'unlocked';
        if (unlocked && !done && !activeLessonId) { state = 'active'; activeLessonId = l.id; }
        prevLessonDone = done;
        return { ...l, done, state };
      });
      // chương coi như "đã qua" nếu bài cuối (boss) hoàn thành
      prevChapterCleared = isDone(ch.lessons[ch.lessons.length - 1].id);
      const completedCount = lessons.filter(x => x.done).length;
      return { ...ch, unlocked: chapterUnlocked, lessons, completedCount };
    });

    const totalLessons = chaptersState.reduce((s, c) => s + c.lessons.length, 0);
    const doneLessons = chaptersState.reduce((s, c) => s + c.completedCount, 0);
    const pct = totalLessons ? Math.round((doneLessons / totalLessons) * 100) : 0;
    const backUrl = encodeURIComponent(location.pathname + location.search);

    const continueCta = activeLessonId
      ? `<a class="jh-cta" href="module.html?module=${activeLessonId}&back=${backUrl}">
           <span class="jh-cta-ic">▶</span>
           <span class="jh-cta-txt"><b>Tiếp tục học</b>
           <small>${findLesson(activeLessonId)?.title || ''}</small></span>
           <span class="jh-cta-go">Học ngay →</span></a>`
      : `<div class="jh-cta done"><span class="jh-cta-ic">🎉</span>
           <span class="jh-cta-txt"><b>Hoàn thành toàn bộ Toán 6!</b>
           <small>Quay lại đạt 3 sao mọi bài nhé</small></span></div>`;

    const chaptersHtml = chaptersState.map((ch, ci) => {
      const nodes = ch.lessons.map((l, li) => renderLessonNode(l, li, backUrl)).join('');
      const lockNote = !ch.unlocked
        ? `<div class="ch-locknote">🔒 Mở khoá khi hoàn thành chương trước</div>` : '';
      return `
        <section class="chapter ${ch.unlocked ? '' : 'locked'}">
          <div class="ch-head">
            <span class="ch-ic">${ch.icon}</span>
            <span class="ch-title">Chương ${ci + 1}: ${ch.title}</span>
            <span class="ch-prog">${ch.completedCount}/${ch.lessons.length} bài</span>
          </div>
          <p class="ch-desc">${ch.desc}</p>
          ${lockNote}
          <div class="lp-path">${nodes}</div>
        </section>`;
    }).join('');

    content.innerHTML = `
      <div class="subj-hero">
        <span class="sh-ic">📐</span>
        <div><h1>Toán lớp 6 · Lộ trình</h1>
        <p>5 chương · ${totalLessons} bài học · mỗi bài là một nhiệm vụ nhỏ → đánh Boss cuối chương</p></div>
      </div>
      <div class="subj-overall">
        <div class="so-head"><span>Tiến độ Toán 6</span><span>${doneLessons}/${totalLessons} bài · ${pct}%</span></div>
        <div class="so-bar"><i style="width:${pct}%"></i></div>
      </div>
      ${continueCta}
      <div style="height:14px"></div>
      ${chaptersHtml}`;
  }

  function findLesson(id) {
    for (const ch of MATH6_CHAPTERS) { const f = ch.lessons.find(l => l.id === id); if (f) return f; }
    return null;
  }

  function renderLessonNode(l, idx, backUrl) {
    const stars = starsOf(l.id);
    const starsHtml = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    const icon = l.boss ? '👑' : (l.state === 'completed' ? '✓' : '📘');
    const cls = ['lp-node', l.state]; if (l.boss) cls.push('boss');
    let tag = '';
    if (l.state === 'active') tag = `<span class="lp-tag t-active">🔥 Học ngay</span>`;
    else if (l.state === 'completed') tag = `<span class="lp-tag t-done">✓ Xong</span>`;
    else if (l.state === 'locked') tag = `<span class="lp-tag t-locked">🔒 Khoá</span>`;
    else if (l.boss) tag = `<span class="lp-tag t-boss">👑 Boss</span>`;
    const inner = `
      <span class="lp-num">${idx + 1}</span>
      <span class="lp-ic">${icon}</span>
      <span class="lp-title">${l.title}</span>
      <span class="lp-meta"><span class="lp-stars">${starsHtml}</span><span>${l.count} câu</span></span>
      ${tag}`;
    if (l.state === 'locked') return `<div class="${cls.join(' ')}">${inner}</div>`;
    return `<a class="${cls.join(' ')}" href="module.html?module=${l.id}&back=${backUrl}">${inner}</a>`;
  }
</script>
</body>
</html>
