<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đăng nhập · Tizia</title>
<meta name="description" content="Tizia — The Intelligent Zone for Interactive Academy. Đăng nhập để vào không gian học tập của bạn." />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#fbbf24" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.30), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.20), transparent),
      radial-gradient(ellipse 80% 50% at 0% 80%, rgba(236,72,153,0.18), transparent),
      linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #312e81 100%);
  }
  .card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px; padding: 32px 26px;
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.35);
  }
  .logo {
    font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px;
    filter: drop-shadow(0 6px 16px rgba(251,191,36,0.4));
  }
  h1 {
    margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 50%, #f97316 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { text-align: center; opacity: 0.75; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; opacity: 0.85; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px; font-family: inherit;
  }
  input:focus { outline: 2px solid #fbbf24; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 34px; height: 34px; border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #6b7280; border-radius: 8px; padding: 0;
  }
  .pw-toggle:hover { color: #1f2937; background: rgba(0,0,0,0.05); }
  .pw-toggle:focus { outline: 2px solid #fbbf24; outline-offset: 0; }
  .pw-toggle svg { width: 20px; height: 20px; display: block; }
  .pw-toggle .icon-off { display: none; }
  .pw-toggle.shown .icon-on { display: none; }
  .pw-toggle.shown .icon-off { display: block; }
  button.primary {
    width: 100%; margin-top: 20px; padding: 12px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    font-weight: 700; font-size: 15px; font-family: inherit;
    transition: transform 0.12s, box-shadow 0.15s;
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(251,191,36,0.3); }
  button.primary[disabled] { opacity: 0.6; cursor: progress; }
  button.guest {
    width: 100%; margin-top: 10px; padding: 11px;
    border: 1px dashed rgba(255,255,255,0.35); border-radius: 10px; cursor: pointer;
    background: transparent; color: rgba(255,255,255,0.9);
    font-weight: 600; font-size: 13.5px; font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  button.guest:hover { background: rgba(255,255,255,0.08); border-color: rgba(251,191,36,0.5); }
  button.guest[disabled] { opacity: 0.6; cursor: progress; }
  .err {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: rgba(244,63,94,0.18); border: 1px solid rgba(244,63,94,0.4);
    color: #fecaca; font-size: 13px; display: none;
  }
  .err.show { display: block; }
  .switch {
    margin-top: 18px; text-align: center; font-size: 13px; opacity: 0.85;
  }
  .switch a { color: #fbbf24; font-weight: 600; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }

  /* ── SSO ─────────────────────────────────────────────────── */
  .sso-block { margin-top: 18px; }
  .sso-block:empty { display: none; }
  .sso-divider {
    display: flex; align-items: center; gap: 10px; margin: 18px 0 12px;
    font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px;
  }
  .sso-divider::before, .sso-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.15);
  }
  .sso-btn {
    width: 100%; margin-top: 8px; padding: 11px 13px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937;
    font-weight: 600; font-size: 14px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.12s, box-shadow 0.15s;
    text-decoration: none;
  }
  .sso-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .sso-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sso-btn.github { background: #24292f; color: #fff; border-color: #24292f; }
  .sso-btn.microsoft { background: #fff; color: #2f6fb8; }
</style>
</head>
<body data-no-auth-header data-no-notifications-bell data-no-suggestion-fab>
<form class="card" id="form-login" autocomplete="on">
  <div class="logo">🌌</div>
  <h1>Tizia</h1>
  <p class="tag">Đăng nhập để vào vũ trụ giáo dục ảo</p>

  <label for="username">Tài khoản</label>
  <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32"
         placeholder="ví dụ: lampx83" />

  <label for="password">Mật khẩu</label>
  <div class="pw-wrap">
    <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"
           placeholder="≥ 6 ký tự" />
    <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Hiện mật khẩu" aria-pressed="false">
      <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.77 19.77 0 0 1 4.22-5.11"/>
        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.17 4.19"/>
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
  </div>

  <button class="primary" type="submit" id="submit-btn">Đăng nhập</button>
  <button class="guest" type="button" id="guest-btn">👤 Tiếp tục với tài khoản khách</button>
  <div class="err" id="err"></div>

  <!-- SSO providers — rỗng nếu chưa cấu hình env CLIENT_ID/SECRET. -->
  <div class="sso-block" id="sso-block"></div>

  <div class="switch">
    Chưa có tài khoản? <a id="register-link" href="register.html">Đăng ký</a>
  </div>
</form>

<script type="module">
  import { login } from './js/auth.js';
  import { renderSso } from './js/sso.js';

  const form = document.getElementById('form-login');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('submit-btn');
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('return') || './';
  const rq = params.get('return') ? ('?return=' + encodeURIComponent(params.get('return'))) : '';
  // Giữ ?return= qua trang register để sau khi đăng ký vẫn quay lại đúng chỗ.
  if (params.get('return')) {
    document.getElementById('register-link').href = 'register.html' + rq;
  }
  renderSso({ returnQuery: rq });

  // Chế độ khách: không tạo user, không cookie. Trang chủ + trường Mầm non là public
  // (xem PUBLIC_PATH trong server/contexts/identity/auth.js + isGuestDomain).
  const guestBtn = document.getElementById('guest-btn');
  guestBtn.addEventListener('click', () => {
    location.replace('./');
  });

  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('pw-toggle');
  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.classList.toggle('shown', show);
    pwToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    pwToggle.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Đang đăng nhập…';
    try {
      const res = await login(form.username.value.trim(), form.password.value);
      if (res?.ok) {
        // Ưu tiên ?return= (user click vào lesson rồi mới login → trả về lesson).
        // Không có ?return= → dùng redirectTo do server tính theo role+grade+major
        // (Trục 1: HS → trường phổ thông phù hợp, SV → trường ngành phù hợp).
        // Chỉ nhận đường dẫn nội bộ: chặn link đăng nhập độc hại dạng ?return=https://... hoặc javascript:...
        const ret = params.get('return');
        const safeRet = ret && /^\/(?![\/\\])/.test(ret) ? ret : null;
        const target = safeRet || res.redirectTo || returnTo;
        location.replace(target);
      } else {
        errEl.textContent = res?.error || 'Đăng nhập thất bại';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
      }
    } catch (err) {
      errEl.textContent = 'Lỗi mạng. Thử lại.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
    }
  });
</script>
</body>
</html>
