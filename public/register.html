<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đăng ký · Tizia</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#fbbf24" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.30), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.20), transparent),
      radial-gradient(ellipse 80% 50% at 0% 80%, rgba(236,72,153,0.18), transparent),
      linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #312e81 100%);
  }
  .card {
    width: 100%; max-width: 460px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px; padding: 30px 26px;
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.35);
  }
  .logo {
    font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px;
    filter: drop-shadow(0 6px 16px rgba(251,191,36,0.4));
  }
  h1 {
    margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 50%, #f97316 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { text-align: center; opacity: 0.75; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; opacity: 0.85; margin: 12px 0 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px; font-family: inherit;
  }
  input:focus { outline: 2px solid #fbbf24; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 34px; height: 34px; border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #6b7280; border-radius: 8px; padding: 0;
  }
  .pw-toggle:hover { color: #1f2937; background: rgba(0,0,0,0.05); }
  .pw-toggle:focus { outline: 2px solid #fbbf24; outline-offset: 0; }
  .pw-toggle svg { width: 18px; height: 18px; display: block; }
  .pw-toggle .icon-off { display: none; }
  .pw-toggle.shown .icon-on { display: none; }
  .pw-toggle.shown .icon-off { display: block; }
  .role-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  @media (max-width: 480px) { .role-row { grid-template-columns: 1fr; } }
  .role-row label {
    margin: 0; padding: 10px 8px; border-radius: 10px; cursor: pointer; text-align: center;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.15s;
  }
  .role-row label:has(input:checked) {
    background: rgba(251,191,36,0.18); border-color: #fbbf24; color: #fde68a;
  }
  .role-row input { display: none; }
  .role-row .ico { font-size: 22px; display: block; margin-bottom: 4px; }
  .role-row b { font-size: 13px; }
  .role-row small { display: block; opacity: 0.7; font-size: 11px; margin-top: 2px; line-height: 1.3; }
  /* Khối field hiện theo role — JS toggle class .show */
  .role-fields { display: none; padding: 12px; margin-top: 10px;
    background: rgba(251,191,36,0.06); border: 1px dashed rgba(251,191,36,0.25);
    border-radius: 10px;
  }
  .role-fields.show { display: block; }
  select {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px; font-family: inherit;
  }
  select:focus { outline: 2px solid #fbbf24; }
  .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .row-2 { grid-template-columns: 1fr; } }
  button.primary {
    width: 100%; margin-top: 18px; padding: 12px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    font-weight: 700; font-size: 15px; font-family: inherit;
    transition: transform 0.12s, box-shadow 0.15s;
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(251,191,36,0.3); }
  button.primary[disabled] { opacity: 0.6; cursor: progress; }
  .err {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: rgba(244,63,94,0.18); border: 1px solid rgba(244,63,94,0.4);
    color: #fecaca; font-size: 13px; display: none;
  }
  .err.show { display: block; }
  .switch { margin-top: 18px; text-align: center; font-size: 13px; opacity: 0.85; }
  .switch a { color: #fbbf24; font-weight: 600; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
  .hint { font-size: 11px; opacity: 0.6; margin-top: 4px; }

  /* ── SSO ─────────────────────────────────────────────────── */
  .sso-block { margin-top: 18px; }
  .sso-block:empty { display: none; }
  .sso-divider {
    display: flex; align-items: center; gap: 10px; margin: 18px 0 12px;
    font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px;
  }
  .sso-divider::before, .sso-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.15);
  }
  .sso-btn {
    width: 100%; margin-top: 8px; padding: 11px 13px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937;
    font-weight: 600; font-size: 14px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.12s, box-shadow 0.15s; text-decoration: none;
  }
  .sso-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .sso-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sso-btn.github { background: #24292f; color: #fff; border-color: #24292f; }
  .sso-btn.microsoft { background: #fff; color: #2f6fb8; }
</style>
</head>
<body data-no-auth-header data-no-notifications-bell data-no-suggestion-fab>
<form class="card" id="form-reg" autocomplete="on">
  <div class="logo">🌌</div>
  <h1>Tạo tài khoản</h1>
  <p class="tag">Để ghi nhận thành tích & lưu tiến độ học</p>

  <label for="username">Tài khoản đăng nhập</label>
  <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32"
         pattern="[A-Za-z0-9_.\-]{3,32}" placeholder="ví dụ: lampx83" />
  <div class="hint">3–32 ký tự, chỉ chữ/số/_/./-, không phân biệt hoa thường</div>

  <label for="displayName">Tên hiển thị</label>
  <input id="displayName" name="displayName" required maxlength="60" placeholder="Ví dụ: Phạm Xuân Lâm" />
  <div class="hint">Hiển thị trên bảng xếp hạng & huy hiệu</div>

  <div class="row-2">
    <div>
      <label for="password">Mật khẩu</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6"
               placeholder="≥ 6 ký tự" />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Hiện mật khẩu" aria-pressed="false">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.77 19.77 0 0 1 4.22-5.11"/>
            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.17 4.19"/>
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>
    <div>
      <label for="age">Tuổi</label>
      <input id="age" name="age" type="number" required min="3" max="100" inputmode="numeric"
             placeholder="ví dụ: 20" />
    </div>
  </div>

  <label>Vai trò</label>
  <div class="role-row">
    <label>
      <input type="radio" name="role" value="pupil" />
      <span class="ico">🎒</span><b>Học sinh</b>
      <small>Mầm non · Tiểu học · THCS · THPT</small>
    </label>
    <label>
      <input type="radio" name="role" value="student" checked />
      <span class="ico">🎓</span><b>Sinh viên</b>
      <small>Cao đẳng · Đại học · Sau ĐH</small>
    </label>
    <label>
      <input type="radio" name="role" value="teacher" />
      <span class="ico">👨‍🏫</span><b>Giảng viên</b>
      <small>Quản lý lớp, chấm bài, dashboard</small>
    </label>
  </div>

  <!-- Khối thông tin Học sinh — hiện khi chọn role=pupil -->
  <div class="role-fields" id="fields-pupil" data-role-fields="pupil">
    <label for="grade">Đang học lớp mấy?</label>
    <select id="grade" name="grade">
      <option value="0">Mầm non (3–5 tuổi)</option>
      <option value="1">Lớp 1</option><option value="2" selected>Lớp 2</option>
      <option value="3">Lớp 3</option><option value="4">Lớp 4</option><option value="5">Lớp 5</option>
      <option value="6">Lớp 6</option><option value="7">Lớp 7</option>
      <option value="8">Lớp 8</option><option value="9">Lớp 9</option>
      <option value="10">Lớp 10</option><option value="11">Lớp 11</option><option value="12">Lớp 12</option>
    </select>
    <label for="school-pupil">Trường đang học <span style="opacity:0.6">(không bắt buộc)</span></label>
    <input id="school-pupil" name="schoolName-pupil" maxlength="120" placeholder="VD: Tiểu học Kim Liên" />
  </div>

  <!-- Khối thông tin Sinh viên — hiện khi chọn role=student -->
  <div class="role-fields" id="fields-student" data-role-fields="student">
    <label for="major">Ngành học</label>
    <select id="major" name="major">
      <option value="">Chọn ngành</option>
      <option value="pharmacy">💊 Dược</option>
      <option value="it">💻 Công nghệ thông tin</option>
      <option value="economics">📉 Kinh tế</option>
      <option value="business">📈 Kinh doanh</option>
      <option value="finance">🏦 Tài chính – Ngân hàng</option>
      <option value="medicine">⚕️ Y</option>
      <option value="nursing">🩺 Điều dưỡng</option>
      <option value="law">⚖️ Luật</option>
      <option value="education">🎓 Sư phạm</option>
      <option value="engineering">⚙️ Kỹ thuật – Công nghệ</option>
      <option value="architecture">🏛️ Kiến trúc – Xây dựng</option>
      <option value="languages">🗣️ Ngoại ngữ</option>
      <option value="agriculture">🌾 Nông nghiệp</option>
      <option value="tourism">🏖️ Du lịch – Khách sạn</option>
      <option value="arts">🎨 Mỹ thuật – Thiết kế</option>
      <option value="media">📰 Báo chí – Truyền thông</option>
      <option value="social-sciences">📚 KHXH &amp; Nhân văn</option>
      <option value="natural-sciences">🔬 Khoa học tự nhiên</option>
      <option value="logistics">🚚 Logistics</option>
      <option value="public-admin">🏢 Quản trị Nhà nước</option>
      <option value="driving">🚗 Lái xe (B1/B2/C/D)</option>
    </select>
    <div class="row-2" style="margin-top:8px">
      <div>
        <label for="cohort">Khoá <span style="opacity:0.6">(VD: K65)</span></label>
        <input id="cohort" name="cohort" maxlength="20" placeholder="K65" />
      </div>
      <div>
        <label for="school-student">Trường ĐH</label>
        <input id="school-student" name="schoolName-student" maxlength="120" placeholder="VD: NEU" />
      </div>
    </div>
  </div>

  <!-- Khối Giảng viên — chỉ school_name optional -->
  <div class="role-fields" id="fields-teacher" data-role-fields="teacher">
    <label for="school-teacher">Trường đang công tác <span style="opacity:0.6">(không bắt buộc)</span></label>
    <input id="school-teacher" name="schoolName-teacher" maxlength="120" placeholder="VD: ĐH Kinh tế Quốc dân" />
  </div>

  <button class="primary" type="submit" id="submit-btn">Đăng ký &amp; vào Tizia</button>
  <div class="err" id="err"></div>

  <!-- SSO providers — rỗng nếu chưa cấu hình env. -->
  <div class="sso-block" id="sso-block"></div>

  <div class="switch">
    Đã có tài khoản? <a id="login-link" href="login.html">Đăng nhập</a>
  </div>
</form>

<script type="module">
  import { register } from './js/auth.js';
  import { renderSso } from './js/sso.js';

  const form = document.getElementById('form-reg');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('submit-btn');
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('return') || './';
  const rq = params.get('return') ? ('?return=' + encodeURIComponent(params.get('return'))) : '';
  if (params.get('return')) {
    document.getElementById('login-link').href = 'login.html' + rq;
  }
  renderSso({ returnQuery: rq });

  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('pw-toggle');
  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.classList.toggle('shown', show);
    pwToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    pwToggle.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  // Toggle khối field theo role được chọn (radio name="role").
  const roleFieldsAll = document.querySelectorAll('[data-role-fields]');
  function syncRoleFields() {
    const cur = (form.querySelector('input[name="role"]:checked') || {}).value || 'student';
    roleFieldsAll.forEach(el => el.classList.toggle('show', el.dataset.roleFields === cur));
  }
  form.querySelectorAll('input[name="role"]').forEach(r => r.addEventListener('change', syncRoleFields));
  syncRoleFields();

  // Lấy school_name theo role (3 input tách riêng để form remember đúng).
  function getSchoolName(role) {
    if (role === 'pupil')   return form['schoolName-pupil']?.value || '';
    if (role === 'student') return form['schoolName-student']?.value || '';
    if (role === 'teacher') return form['schoolName-teacher']?.value || '';
    return '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Đang tạo tài khoản…';
    try {
      const role = form.role.value;
      const payload = {
        username: form.username.value.trim(),
        displayName: form.displayName.value.trim(),
        password: form.password.value,
        age: Number(form.age.value),
        role,
        schoolName: getSchoolName(role).trim() || undefined,
      };
      if (role === 'pupil') {
        payload.grade = Number(form.grade.value) || null;
      } else if (role === 'student') {
        payload.major = form.major.value || undefined;
        payload.cohort = (form.cohort.value || '').trim() || undefined;
        if (!payload.major) {
          throw new Error('Vui lòng chọn ngành học');
        }
      }
      const res = await register(payload);
      if (res?.ok) {
        // Server gợi ý redirect (đã tính theo grade/major). Nếu URL có ?return= thì
        // ưu tiên — vd flow "vào lesson cần login" nên trả về đúng lesson đó.
        const target = params.get('return') || res.redirectTo || returnTo;
        location.replace(target);
      } else {
        errEl.textContent = res?.error || 'Đăng ký thất bại';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Đăng ký & vào Tizia';
      }
    } catch (err) {
      errEl.textContent = err?.message || 'Lỗi mạng. Thử lại.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Đăng ký & vào Tizia';
    }
  });
</script>
</body>
</html>
