<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tizia · Cast trình chiếu</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100vh; overflow: hidden; background: #0f172a; color: white; font-family: 'Inter', system-ui, sans-serif; }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .head {
    flex: 0 0 auto; padding: 16px 28px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    display: flex; gap: 18px; align-items: center;
    z-index: 100;
  }
  .head .logo { font-size: 32px; }
  .head .title { font-size: 22px; font-weight: 800; letter-spacing: 0.3px;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 60%, #f97316 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head .room { font-size: 14px; opacity: 0.85; }
  .head .code {
    margin-left: auto; padding: 6px 14px; border-radius: 999px;
    background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.5);
    font-weight: 700; color: #fbbf24; font-variant-numeric: tabular-nums;
  }
  .frame {
    flex: 1 1 auto; position: relative; overflow: hidden; background: #000;
  }
  .frame iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #000;
  }
  .picker {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 70%);
    padding: 32px;
  }
  .picker .card {
    max-width: 760px; width: 100%; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
    padding: 32px; backdrop-filter: blur(10px);
  }
  .picker h1 { margin: 0 0 6px; font-size: 28px; }
  .picker p { margin: 0 0 20px; opacity: 0.85; font-size: 14px; line-height: 1.6; }
  .picker label { display: block; font-size: 13px; opacity: 0.85; margin: 12px 0 6px; }
  .picker input, .picker select {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.95);
    color: #1f2937; font-size: 15px; font-family: inherit;
  }
  .picker button {
    margin-top: 20px; width: 100%; padding: 14px 18px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    font-weight: 700; font-size: 16px;
  }
  .picker button:hover { filter: brightness(1.08); }
  .picker .hints {
    margin-top: 20px; padding: 12px 16px; border-radius: 10px;
    background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.3);
    font-size: 13px; line-height: 1.6; opacity: 0.9;
  }
  .toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 200;
    background: rgba(15,23,42,0.92); color: #fbbf24;
    padding: 10px 16px; border-radius: 999px; font-size: 12px;
    border: 1px solid rgba(251,191,36,0.4);
  }
  .clock {
    position: fixed; left: 18px; bottom: 18px; z-index: 200;
    background: rgba(15,23,42,0.7); color: white;
    padding: 8px 16px; border-radius: 999px; font-size: 14px;
    font-variant-numeric: tabular-nums; backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  @media (max-width: 720px) {
    .head { padding: 10px 16px; }
    .head .title { font-size: 18px; }
    .head .room { display: none; }
  }
  /* HIDE UI when ?bare=1 — dùng cho khi đã chiếu xong, chỉ muốn nội dung */
  body[data-bare="1"] .head, body[data-bare="1"] .clock, body[data-bare="1"] .toast { display: none; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head">
    <div class="logo">📺</div>
    <div>
      <div class="title">Tizia · Cast trình chiếu</div>
      <div class="room" id="room-label">Đang khởi tạo…</div>
    </div>
    <div class="code" id="code-label">-</div>
  </div>
  <div class="frame" id="frame"></div>
</div>
<div class="clock" id="clock"></div>

<script>
/* GAP 12 — Cast to Screen route
 *
 * Mục đích: GV dán URL `/cast.html?target=space&room=X` lên máy chiếu lớp.
 * Trang chỉ hiển thị nội dung (iframe target) + 1 timer góc + room code,
 * KHÔNG có nút điều khiển → tránh HS đi qua bấm linh tinh.
 *
 * Query params:
 *   target=<file html không kèm .html>  vd: space, school, dashboard, herb-garden-3d
 *   room=<code 6 ký tự>                  optional — gán xuống iframe qua hash
 *   bare=1                                ẩn cả header + clock
 *   autoreload=<số giây>                  refresh iframe (mặc định 0 = tắt)
 *
 * Allowlist target để tránh open redirect / XSS.
 */

const ALLOWED = new Set([
  'space', 'school', 'dashboard', 'teacher',
  'metaverse', 'herb-garden-3d', '3d-shelf', '2d-arcade',
  'sac-ky-3d', 'sac-ky-meta', 'sac-ky-vr-web', 'compounding-lab',
  'PS15-gmp-factory', 'GC07-osce-championship', 'L3-3-tuong-tac',
  'L2-1-titration', 'PS01-er', 'antibiogram-2d', 'bp-measure',
  'calibration-curve', 'pk-curve', 'pediatric-dose', 'dilution',
  'dispense', 'iv-infusion', 'grapher', 'quiz', 'time-attack',
  'apps', 'assets', 'subject', 'module',
  'it-algo-viz', 'it-cipher-ctf', 'it-code-lab', 'it-sql-playground', 'it-web-playground',
  'bao-che-hub', 'sap-xep-hub',
]);

const params = new URLSearchParams(location.search);
const target = (params.get('target') || '').trim();
const room = (params.get('room') || '').trim().toUpperCase().slice(0, 12);
const bare = params.get('bare') === '1';
const autoreload = Number(params.get('autoreload')) || 0;

if (bare) document.body.setAttribute('data-bare', '1');

if (!target || !ALLOWED.has(target)) {
  // Hiện picker để GV chọn target nếu URL thiếu
  showPicker();
} else {
  mountIframe();
}

document.getElementById('code-label').textContent = room || '-';

function mountIframe() {
  const url = './' + encodeURIComponent(target) + '.html' + (room ? '#room=' + encodeURIComponent(room) : '');
  const frame = document.getElementById('frame');
  const f = document.createElement('iframe');
  f.src = url;
  f.allow = 'camera; microphone; xr-spatial-tracking; fullscreen';
  f.setAttribute('allowfullscreen', '');
  f.referrerPolicy = 'same-origin';
  frame.appendChild(f);

  document.getElementById('room-label').textContent =
    'Đang chiếu: ' + target + (room ? '  ·  phòng ' + room : '');

  if (autoreload >= 30) {
    setInterval(() => { f.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(); }, autoreload * 1000);
  }
}

function showPicker() {
  const frame = document.getElementById('frame');
  const targets = [...ALLOWED].sort();
  const html = `
    <div class="picker">
      <div class="card">
        <h1>📺 Cast trình chiếu</h1>
        <p>Dán URL này lên máy chiếu lớp, học sinh sẽ thấy view sạch, không có nút điều khiển.</p>
        <label>Chọn nội dung cần chiếu</label>
        <select id="sel">
          ${targets.map(t => `<option value="${t}" ${t==='space'?'selected':''}>${t}</option>`).join('')}
        </select>
        <label>Mã phòng (tuỳ chọn): đồng bộ HS qua hash</label>
        <input id="room" placeholder="VD: A3X9KL" maxlength="12" />
        <button id="go">Bắt đầu chiếu</button>
        <div class="hints">
          💡 <b>Mẹo</b>: gắn <code>?bare=1</code> để ẩn cả header, vd
          <code>/cast.html?target=space&room=A3X9&bare=1</code>.
          Gắn <code>&autoreload=60</code> để tự refresh mỗi 60 giây.
        </div>
      </div>
    </div>`;
  frame.innerHTML = html;
  document.getElementById('go').addEventListener('click', () => {
    const t = document.getElementById('sel').value;
    const r = document.getElementById('room').value.trim().toUpperCase();
    const q = new URLSearchParams({ target: t });
    if (r) q.set('room', r);
    location.search = '?' + q.toString();
  });
}

// Clock góc trái — GV biết bài đã chiếu bao lâu
const startedAt = Date.now();
const clock = document.getElementById('clock');
function tick() {
  const s = Math.floor((Date.now() - startedAt) / 1000);
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  clock.textContent = '⏱ ' + h + ':' + m + ':' + sec + (room ? '  ·  ' + room : '');
}
setInterval(tick, 1000); tick();

// Ngăn quay video/audio bằng phím tắt thông dụng
document.addEventListener('keydown', (e) => {
  if (e.key === 'F11') return; // cho phép fullscreen
  if (e.key === 'Escape') return; // cho phép thoát
}, true);
</script>
</body>
</html>
