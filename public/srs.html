<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🃏 Flashcards SRS · Tizia</title>
<meta name="description" content="Ôn từ vựng, công thức, ngày tháng theo phương pháp Spaced Repetition — học hiệu quả như Anki." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --card:#151c3a;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 20% 0%, rgba(34,197,94,.10), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(167,139,250,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }

  .wrap { max-width:none; margin:0 auto; padding:28px 18px 80px; }

  /* Deck picker */
  .stats-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:20px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px; text-align:center; }
  .stat-card .v { font-size:24px; font-weight:800; color:var(--accent); }
  .stat-card .l { font-size:10.5px; color:var(--text-soft); letter-spacing:.5px; text-transform:uppercase; }

  .deck-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .deck { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px; cursor:pointer; transition:transform .15s, border-color .15s; }
  .deck:hover { transform:translateY(-2px); border-color:var(--purple); }
  .deck .nm { font-weight:800; font-size:14.5px; margin-bottom:4px; }
  .deck .meta { font-size:12px; color:var(--text-soft); }

  /* Card review */
  .card-host { perspective:1200px; height:340px; margin:30px 0; }
  .flip-card {
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
  }
  .flip-card.flipped { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0;
    backface-visibility:hidden;
    background:linear-gradient(135deg, var(--card) 0%, rgba(167,139,250,.10) 100%);
    border:2px solid var(--border); border-radius:24px;
    padding:30px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    box-shadow:0 18px 60px rgba(0,0,0,.4);
    text-align:center;
  }
  .face .lbl { position:absolute; top:14px; left:18px;
    font-size:10.5px; letter-spacing:1.2px; color:var(--text-soft);
    text-transform:uppercase; font-weight:800; }
  .face .content { font-size:28px; font-weight:700; line-height:1.4; max-width:100%; }
  .face .hint { margin-top:14px; font-size:13px; color:var(--text-soft); font-style:italic; }
  .face.back {
    transform:rotateY(180deg);
    background:linear-gradient(135deg, rgba(34,197,94,.15), var(--card));
    border-color:rgba(34,197,94,.35);
  }
  .face.back .content { color:var(--good); }

  .grade-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
    opacity:0; pointer-events:none; transition:opacity .25s; }
  .grade-row.show { opacity:1; pointer-events:auto; }
  .grade-row button {
    padding:14px 8px; border-radius:14px; border:none; cursor:pointer;
    font:800 13px 'Inter', system-ui, sans-serif; transition:transform .12s;
  }
  .grade-row button:hover { transform:translateY(-2px); }
  .grade-row .again { background:var(--bad); color:#fff; }
  .grade-row .hard  { background:#fb923c; color:#1e293b; }
  .grade-row .good  { background:var(--good); color:#052e16; }
  .grade-row .easy  { background:#06b6d4; color:#fff; }
  .grade-row .desc { font-size:10px; opacity:.7; font-weight:600; display:block; margin-top:2px; }

  .show-btn {
    display:block; margin:0 auto; padding:12px 28px;
    background:linear-gradient(135deg, var(--accent), #f97316); color:#1e293b;
    border:none; border-radius:14px; cursor:pointer; font:800 14px 'Inter', system-ui, sans-serif;
    box-shadow:0 6px 18px rgba(251,146,60,.3);
  }

  .progress-bar { height:6px; background:rgba(255,255,255,.06); border-radius:4px;
    overflow:hidden; margin-bottom:14px; }
  .progress-bar > i { display:block; height:100%;
    background:linear-gradient(90deg, var(--accent), var(--good)); transition:width .4s; }

  .done {
    text-align:center; padding:40px 20px; background:var(--card);
    border:1px solid var(--border); border-radius:18px;
  }
  .done .big { font-size:60px; }
  .done h2 { color:var(--good); margin:14px 0 6px; }

  .empty { text-align:center; padding:40px; color:var(--text-soft); }

  /* Quick create deck */
  .quick {
    background:rgba(167,139,250,.08); border:1px dashed rgba(167,139,250,.4);
    border-radius:14px; padding:14px; color:var(--purple);
    text-align:center; cursor:pointer; font-weight:700; margin-bottom:18px;
  }
  .quick:hover { background:rgba(167,139,250,.16); }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🃏 Flashcards SRS</h1>
</div>

<div class="wrap" id="wrap">
  <div class="empty">Đang tải…</div>
</div>

<script type="module">
const state = {
  decks: [], stats: null,
  queue: [], cur: 0, showing: 'front',
  finished: false,
};

async function loadHome() {
  const wrap = document.getElementById('wrap');
  try {
    const [statsRes, decksRes] = await Promise.all([
      fetch('/api/srs/stats', { credentials:'same-origin' }),
      fetch('/api/srs/decks'),
    ]);
    if (statsRes.status === 401) {
      wrap.innerHTML = `<div class="empty"><p>Hãy đăng nhập.</p><a href="/login.html" class="back">Đăng nhập →</a></div>`;
      return;
    }
    state.stats = await statsRes.json();
    state.decks = (await decksRes.json()).items || [];
    renderHome();
  } catch (e) {
    wrap.innerHTML = `<p style="color:var(--bad)">Lỗi: ${e.message}</p>`;
  }
}

function renderHome() {
  const s = state.stats;
  document.getElementById('wrap').innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="v">${s.total || 0}</div><div class="l">Tổng card</div></div>
      <div class="stat-card"><div class="v" style="color:var(--bad)">${s.due_now || 0}</div><div class="l">Đến hạn ôn</div></div>
      <div class="stat-card"><div class="v">${s.reviews || 0}</div><div class="l">Lần ôn</div></div>
      <div class="stat-card"><div class="v">${(s.avg_ease || 0).toFixed(2)}</div><div class="l">EF TB</div></div>
    </div>

    ${s.due_now > 0 ? `
      <button class="show-btn" id="start-review" style="margin-bottom:20px;width:100%;padding:18px;font-size:16px">
        🔁 Ôn ${s.due_now} card đến hạn
      </button>
    ` : ''}

    <div class="quick" id="create-deck">+ Tạo deck nhanh</div>

    <h3 style="font-size:13px;color:var(--text-soft);letter-spacing:.6px;text-transform:uppercase;margin:24px 0 12px">📚 Decks công khai</h3>
    <div class="deck-grid">
      ${state.decks.length === 0
        ? '<div class="empty" style="grid-column:1/-1">Chưa có deck nào — tự tạo đầu tiên!</div>'
        : state.decks.map(d => `
          <div class="deck" data-id="${d.id}">
            <div class="nm">${esc(d.name)}</div>
            <div class="meta">${d.card_count} card · ${esc(d.subject_tag || '')} ${d.grade_tag ? '· Lớp ' + esc(d.grade_tag) : ''}<br>by ${esc(d.creator_name || '?')}</div>
          </div>
        `).join('')}
    </div>
  `;
  document.getElementById('start-review')?.addEventListener('click', () => startReview(null));
  document.querySelectorAll('.deck[data-id]').forEach(el => {
    el.addEventListener('click', () => startReview(Number(el.dataset.id)));
  });
  document.getElementById('create-deck')?.addEventListener('click', createDeck);
}

async function startReview(deckId) {
  try {
    const url = '/api/srs/queue?limit=20' + (deckId ? '&deck_id=' + deckId : '');
    const r = await fetch(url, { credentials:'same-origin' });
    const d = await r.json();
    state.queue = d.queue || [];
    state.cur = 0; state.showing = 'front'; state.finished = false;
    if (state.queue.length === 0) {
      alert('Không có card nào đến hạn ôn — quay lại sau!');
      return;
    }
    renderCard();
  } catch (e) { alert('Lỗi: ' + e.message); }
}

function renderCard() {
  if (state.cur >= state.queue.length) {
    document.getElementById('wrap').innerHTML = `
      <div class="done">
        <div class="big">🎉</div>
        <h2>Hoàn thành phiên ôn!</h2>
        <p style="color:var(--text-soft)">Bạn vừa ôn ${state.queue.length} card. Quay lại sau để giữ độ ghi nhớ.</p>
        <button class="show-btn" onclick="location.reload()">↻ Về trang chủ</button>
      </div>
    `;
    return;
  }
  const c = state.queue[state.cur];
  const pct = Math.round(((state.cur) / state.queue.length) * 100);
  document.getElementById('wrap').innerHTML = `
    <div class="progress-bar"><i style="width:${pct}%"></i></div>
    <div style="text-align:center;color:var(--text-soft);font-size:12px;margin-bottom:8px">Card ${state.cur+1} / ${state.queue.length}</div>
    <div class="card-host">
      <div class="flip-card" id="flip">
        <div class="face">
          <div class="lbl">${c.isNew ? '🌱 MỚI' : '🔁 ÔN LẠI'}</div>
          <div class="content">${esc(c.front || c.card_key)}</div>
          ${c.hint ? `<div class="hint">${esc(c.hint)}</div>` : ''}
        </div>
        <div class="face back">
          <div class="lbl">ĐÁP ÁN</div>
          <div class="content">${esc(c.back || '(no back)')}</div>
        </div>
      </div>
    </div>
    <button class="show-btn" id="show-back">🔍 Hiện đáp án</button>
    <div class="grade-row" id="grades">
      <button class="again" data-q="0">Lại<small class="desc">< 1 phút</small></button>
      <button class="hard"  data-q="1">Khó<small class="desc">1-2 ngày</small></button>
      <button class="good"  data-q="2">Tốt<small class="desc">3-7 ngày</small></button>
      <button class="easy"  data-q="3">Dễ<small class="desc">2 tuần+</small></button>
    </div>
  `;
  document.getElementById('show-back').addEventListener('click', () => {
    document.getElementById('flip').classList.add('flipped');
    document.getElementById('grades').classList.add('show');
    document.getElementById('show-back').style.display = 'none';
  });
  document.querySelectorAll('#grades button').forEach(b => {
    b.addEventListener('click', () => review(Number(b.dataset.q)));
  });
  document.getElementById('flip').addEventListener('click', () => {
    document.getElementById('show-back').click();
  });
}

async function review(quality) {
  const c = state.queue[state.cur];
  try {
    await fetch('/api/srs/review', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ card_key: c.card_key, quality }),
      credentials:'same-origin',
    });
  } catch {}
  state.cur++;
  renderCard();
}

async function createDeck() {
  const name = prompt('Tên deck (vd: "100 từ vựng Anh lớp 5")');
  if (!name) return;
  // Cho user nhập nhanh các card theo format "front | back"
  const raw = prompt('Nhập các card, mỗi dòng "front | back":\n\nVD:\nhello | xin chào\ngoodbye | tạm biệt');
  if (!raw) return;
  const cards = raw.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [front, back] = l.split('|').map(s => s?.trim());
    return { front, back };
  }).filter(c => c.front && c.back);
  if (cards.length === 0) return alert('Không có card hợp lệ');
  try {
    const r = await fetch('/api/srs/decks', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, cards }), credentials:'same-origin',
    });
    const d = await r.json();
    if (!d.ok) { alert(d.error || 'Lỗi'); return; }
    alert(`✓ Tạo deck với ${cards.length} card`);
    loadHome();
  } catch (e) { alert(e.message); }
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
loadHome();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-07"></script>
</body>
</html>
