<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🤖 Code Quest · Tizia</title>
<meta name="description" content="Học lập trình kéo thả: giải puzzle bằng các khối lệnh, dành cho học sinh lớp 3 đến lớp 9." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg-1:#1e3a8a; --bg-2:#1d4ed8; --bg-3:#3b82f6;
    --ink:#0f172a; --ink-soft:#475569;
    --card:#ffffff; --card-soft:#f1f5f9;
    --accent:#facc15; --accent-2:#10b981;
    --border:rgba(15,23,42,.12);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment: fixed;
  }
  /* Banner */
  .top { position:sticky; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 18px; background:rgba(15,23,42,.65); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.1); color:#fff; }
  .back { background:rgba(255,255,255,.18); color:#fff; text-decoration:none; padding:7px 14px; border-radius:18px; font-size:13px; font-weight:600; }
  .back:hover { background:rgba(255,255,255,.3); }
  .title { font-size:16px; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; }
  .stats { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.5); padding:6px 13px; border-radius:18px; font-size:12.5px; font-weight:700; color:var(--ink); display:flex; gap:6px; align-items:center; box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .pill b { color:#1d4ed8; }

  /* Level selector */
  .level-row { display:flex; gap:6px; padding:10px 18px; flex-wrap:wrap; max-width:none; margin:0 auto; }
  .level-btn { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.25); padding:6px 12px; border-radius:14px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:700; transition:background .12s, transform .12s; }
  .level-btn:hover { background:rgba(255,255,255,.28); }
  .level-btn.active { background:var(--accent); color:#0f172a; border-color:transparent; transform:scale(1.05); }
  .level-btn.solved::after { content:' ⭐'; }

  .layout { display:grid; grid-template-columns: 230px 1fr 320px; gap:14px; padding:0 18px 18px; max-width:none; margin:0 auto; }
  @media (max-width:1100px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel { background:rgba(255,255,255,.95); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .panel h3 { margin:0 0 10px; font-size:13px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:6px; }

  /* Block palette */
  .blocks { display:flex; flex-direction:column; gap:6px; max-height:62vh; overflow-y:auto; }
  .block-item {
    display:flex; align-items:center; gap:7px;
    padding:8px 11px; border-radius:8px; cursor:grab; user-select:none;
    color:#fff; font-size:12.5px; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.18); transition:transform .12s;
  }
  .block-item:hover { transform:translateX(4px); }
  .block-item:active { cursor:grabbing; transform:scale(0.97); }
  .block-item .ic { font-size:14px; }

  /* Color by category */
  .b-move    { background:linear-gradient(135deg,#06b6d4,#0891b2); }
  .b-turn    { background:linear-gradient(135deg,#a855f7,#7e22ce); }
  .b-loop    { background:linear-gradient(135deg,#f97316,#c2410c); }
  .b-cond    { background:linear-gradient(135deg,#22c55e,#15803d); }
  .b-action  { background:linear-gradient(135deg,#facc15,#a16207); color:#0f172a !important; text-shadow:none; }
  .b-end     { background:linear-gradient(135deg,#64748b,#334155); }
  .b-wait    { background:linear-gradient(135deg,#ec4899,#be185d); }

  /* Workspace */
  .workspace { min-height:440px; background:var(--card-soft); border:2px dashed var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:62vh; }
  .workspace.drag-over { border-color:var(--accent); background:#fef9c3; }
  .ws-block {
    display:flex; align-items:center; gap:7px;
    padding:8px 11px; border-radius:8px; user-select:none;
    color:#fff; font-size:12.5px; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
    position:relative;
    cursor:grab;
  }
  .ws-block.indent { margin-left:24px; }
  .ws-block.indent::before { content:'└'; position:absolute; left:-16px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:14px; }
  .ws-block .num-input { width:36px; padding:2px 4px; border-radius:5px; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.95); color:#0f172a; font-size:12px; font-weight:700; font-family:inherit; text-align:center; margin-left:auto; }
  .ws-block .rm { background:rgba(0,0,0,.25); color:#fff; border:none; border-radius:5px; width:18px; height:18px; cursor:pointer; font-size:11px; font-weight:700; margin-left:6px; }
  .ws-block .rm:hover { background:rgba(220,38,38,.85); }
  .ws-block.running { box-shadow:0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.18); }
  .ws-empty { color:var(--ink-soft); font-size:12.5px; text-align:center; padding:30px; font-style:italic; }

  /* World preview */
  .world-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #world-canvas { background:#fff; border-radius:10px; box-shadow:inset 0 0 0 1px var(--border); }
  .level-info { width:100%; background:var(--card-soft); padding:10px 12px; border-radius:9px; font-size:12.5px; line-height:1.5; color:var(--ink); }
  .level-info b { color:#1d4ed8; }

  .run-row { display:flex; gap:7px; width:100%; }
  .btn { padding:10px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; border:none; flex:1; transition:transform .12s, box-shadow .15s; }
  .btn-run { background:linear-gradient(135deg,#22c55e,#15803d); color:#fff; box-shadow:0 4px 12px rgba(34,197,94,.4); }
  .btn-run:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(34,197,94,.5); }
  .btn-reset { background:rgba(15,23,42,.08); color:var(--ink); }
  .btn-reset:hover { background:rgba(15,23,42,.16); }
  .btn-hint { background:linear-gradient(135deg,#facc15,#ca8a04); color:#0f172a; box-shadow:0 4px 12px rgba(250,204,21,.4); }
  .btn-clear { background:#fee2e2; color:#991b1b; }

  /* Toast */
  #toast { position:fixed; left:50%; top:80px; transform:translateX(-50%) translateY(-30px); z-index:80; background:#16a34a; color:#fff; padding:11px 22px; border-radius:14px; font-weight:700; font-size:14px; opacity:0; transition: opacity .2s, transform .2s; box-shadow:0 8px 24px rgba(22,163,74,.5); pointer-events:none; max-width:380px; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err { background:#dc2626; box-shadow:0 8px 24px rgba(220,38,38,.5); }
  #toast.win { background:linear-gradient(135deg,#facc15,#16a34a); color:#0f172a; font-size:15px; padding:14px 26px; }

  /* Confetti */
  .burst { position:fixed; pointer-events:none; font-size:22px; z-index:75; animation: burst-up 1.6s ease-out forwards; }
  @keyframes burst-up { from { transform: translateY(0) scale(.6); opacity:1; } to { transform: translateY(-220px) scale(1.4) rotate(180deg); opacity:0; } }

  .help-text { font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
</style>
</head>
<body>

<header class="top">
  <a class="back" href="./">← Tizia</a>
  <span class="title">🤖 Code Quest</span>
  <div class="stats">
    <span class="pill">Level: <b id="stat-level">1</b>/10</span>
    <span class="pill">Khối: <b id="stat-blocks">0</b></span>
    <span class="pill">Tốt nhất: <b id="stat-best">—</b></span>
  </div>
</header>

<div class="level-row" id="level-row"></div>

<div class="layout">
  <!-- LEFT: Block Library -->
  <aside class="panel">
    <h3>🧩 Thư viện khối</h3>
    <div class="blocks" id="block-library"></div>
    <div class="help-text">Kéo khối thả vào khu làm việc bên phải, hoặc bấm để thêm.</div>
  </aside>

  <!-- CENTER: Workspace -->
  <main class="panel">
    <h3>🧪 Khu làm việc</h3>
    <div class="workspace" id="workspace">
      <div class="ws-empty">Kéo khối vào đây để xếp chương trình.<br>Robot 🤖 sẽ chạy theo thứ tự từ trên xuống.</div>
    </div>
    <div class="run-row" style="margin-top:10px;">
      <button class="btn btn-run" id="btn-run">▶️ Chạy</button>
      <button class="btn btn-reset" id="btn-reset">⏮️ Đặt lại</button>
      <button class="btn btn-clear" id="btn-clear-ws">🗑️</button>
    </div>
  </main>

  <!-- RIGHT: World -->
  <aside class="panel world-wrap">
    <h3>🌍 Thế giới</h3>
    <canvas id="world-canvas" width="288" height="288"></canvas>
    <div class="level-info" id="level-info"></div>
    <div class="run-row">
      <button class="btn btn-hint" id="btn-hint">💡 Gợi ý</button>
      <button class="btn btn-reset" id="btn-prev">◀ Trước</button>
      <button class="btn btn-reset" id="btn-next">Tiếp ▶</button>
    </div>
  </aside>
</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ── BLOCK DEFINITIONS ──
  // Each block has: id, label, icon, cssClass, hasNum (true for repeat/wait), isContainer
  const BLOCKS = {
    move:        { label:'Đi tiến 1 ô',          ic:'⬆️', cls:'b-move',   cat:'move' },
    turn_left:   { label:'Xoay trái 90°',         ic:'⟲',  cls:'b-turn',   cat:'turn' },
    turn_right:  { label:'Xoay phải 90°',         ic:'⟳',  cls:'b-turn',   cat:'turn' },
    repeat:      { label:'Lặp N lần',             ic:'🔁', cls:'b-loop',   cat:'loop', hasNum:true, defNum:3, isContainer:true },
    if_gold:     { label:'Nếu trước mặt có ⭐',    ic:'❓', cls:'b-cond',   cat:'cond', isContainer:true },
    if_clear:    { label:'Nếu trước mặt trống',   ic:'🟢', cls:'b-cond',   cat:'cond', isContainer:true },
    pick:        { label:'Nhặt vật phẩm',         ic:'🤏', cls:'b-action', cat:'action' },
    at_goal:     { label:'Nếu đứng trên 🚩',      ic:'🎯', cls:'b-cond',   cat:'cond', isContainer:true },
    end:         { label:'Kết thúc',              ic:'🛑', cls:'b-end',    cat:'end' },
    wait:        { label:'Chờ 1 giây',            ic:'⏱',  cls:'b-wait',   cat:'wait' },
  };

  // ── LEVELS ── grid 8x8, characters: . = empty, # = wall, G = goal, S = star, R/U/L/D = robot facing
  const LEVELS = [
    {
      id:1, name:'Đi 3 ô tới đích',
      grid: [
        '........',
        '........',
        '........',
        'R..G....',
        '........',
        '........',
        '........',
        '........',
      ],
      desc:'Robot đang nhìn sang phải. Hãy đi tới ô có cờ 🚩.',
      hint:['move','move','move'],
    },
    {
      id:2, name:'Đi và quay phải',
      grid: [
        '........',
        '........',
        '........',
        'R...,...',
        '....,...',
        '....G...',
        '........',
        '........',
      ],
      desc:'Đi sang phải rồi quay xuống đến đích.',
      hint:['move','move','move','move','turn_right','move','move'],
    },
    {
      id:3, name:'Lặp đi 4 lần',
      grid: [
        '........',
        '........',
        '........',
        'R......G',
        '........',
        '........',
        '........',
        '........',
      ],
      desc:'Thay vì gõ move 7 lần, hãy dùng khối "Lặp N lần".',
      hint:['repeat:7','move'],
    },
    {
      id:4, name:'Nhặt 3 ⭐ rồi tới đích',
      grid: [
        '........',
        '........',
        '........',
        'RS.S.S.G',
        '........',
        '........',
        '........',
        '........',
      ],
      desc:'Đi và nhặt 3 ngôi sao ⭐ trên đường tới đích.',
      hint:['repeat:7','if_gold','pick','move'],
    },
    {
      id:5, name:'Né tường',
      grid: [
        '........',
        '........',
        'R.#.....',
        '..#.....',
        '..#.....',
        '..#.G...',
        '........',
        '........',
      ],
      desc:'Có tường 🟫 chặn đường. Hãy đi vòng qua.',
      hint:['move','turn_right','move','move','move','turn_left','move','move','move'],
    },
    {
      id:6, name:'Mê cung if-else',
      grid: [
        '........',
        '.######.',
        '.R...S#.',
        '.####.#.',
        '....#.#.',
        '###.#.#.',
        'G...#.#.',
        '....#.#.',
      ],
      desc:'Dùng "Nếu trước mặt trống" để đi tự động.',
      hint:['repeat:12','if_clear','move','if_gold','pick','turn_right'],
    },
    {
      id:7, name:'Vòng quanh hình vuông',
      grid: [
        '........',
        '.RSSSS..',
        '.S...S..',
        '.S...S..',
        '.S...S..',
        '.SSSSG..',
        '........',
        '........',
      ],
      desc:'Đi vòng theo cạnh hình vuông, nhặt sạch ⭐.',
      hint:['repeat:4','repeat:4','if_gold','pick','move','turn_right'],
    },
    {
      id:8, name:'Mê cung tự động',
      grid: [
        'R.######',
        '.#.....#',
        '.#.###.#',
        '.#.#.#.#',
        '.#.#S#.#',
        '.#.#.#.#',
        '.#...#.#',
        '.####.G#',
      ],
      desc:'Đi theo lối hẹp, dùng if/loop để tự động hoá.',
      hint:['repeat:20','if_clear','move','if_gold','pick'],
    },
    {
      id:9, name:'Thu thập kho báu',
      grid: [
        'R.S.S.S.',
        '........',
        'S.S.S.S.',
        '........',
        'S.S.S.S.',
        '........',
        'S.S.S.G.',
        '........',
      ],
      desc:'Có rất nhiều ⭐ trên bàn cờ. Nhặt càng nhiều càng tốt rồi tới đích.',
      hint:['repeat:20','if_gold','pick','move'],
    },
    {
      id:10, name:'Robot thông minh',
      grid: [
        '###.....',
        'R...S...',
        '###.#...',
        '....#...',
        '.####...',
        '.S......',
        '.#####..',
        '.....G..',
      ],
      desc:'Đường đi phức tạp. Hãy kết hợp lặp + if để giải.',
      hint:['repeat:30','if_clear','move','if_gold','pick','turn_right'],
    },
  ];

  // ── STATE ──
  const state = {
    levelIdx: 0,
    program: [], // [{id, num?, indent (0 or 1)}]
    running: false,
    cancelled: false,
    world: null,
  };

  // ── LocalStorage ──
  const LS_KEY = 'code-quest.best'; // { [levelId]: blockCount }
  function loadBest() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch { return {}; } }
  function saveBest(levelId, count) {
    const b = loadBest();
    if (!b[levelId] || count < b[levelId]) {
      b[levelId] = count;
      try { localStorage.setItem(LS_KEY, JSON.stringify(b)); } catch {}
    }
  }

  // ── Build world from grid string ──
  function parseGrid(rows) {
    const w = rows[0].length, h = rows.length;
    const cells = [];
    let robot = null, goal = null;
    const stars = new Set();
    const walls = new Set();
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (ch === '#') walls.add(`${x},${y}`);
        else if (ch === 'G') goal = { x, y };
        else if (ch === 'S') stars.add(`${x},${y}`);
        else if (ch === 'R') robot = { x, y, dir: 0 }; // 0=right, 1=down, 2=left, 3=up
        else if (ch === 'U') robot = { x, y, dir: 3 };
        else if (ch === 'L') robot = { x, y, dir: 2 };
        else if (ch === 'D') robot = { x, y, dir: 1 };
      }
    }
    return { w, h, robot, goal, stars, walls, collected: 0 };
  }

  function resetWorld() {
    const lvl = LEVELS[state.levelIdx];
    state.world = parseGrid(lvl.grid);
    drawWorld();
  }

  // ── Draw world ──
  function drawWorld() {
    const c = $('world-canvas');
    const ctx = c.getContext('2d');
    const w = state.world.w, h = state.world.h;
    const cell = c.width / w;
    ctx.clearRect(0, 0, c.width, c.height);
    // checker bg
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        ctx.fillStyle = ((x + y) % 2 === 0) ? '#f0fdf4' : '#dcfce7';
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    // walls
    ctx.font = `${Math.floor(cell * 0.78)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    state.world.walls.forEach(k => {
      const [x, y] = k.split(',').map(Number);
      ctx.fillText('🟫', x * cell + cell / 2, y * cell + cell / 2 + 2);
    });
    // stars
    state.world.stars.forEach(k => {
      const [x, y] = k.split(',').map(Number);
      ctx.fillText('⭐', x * cell + cell / 2, y * cell + cell / 2 + 2);
    });
    // goal
    if (state.world.goal) {
      const { x, y } = state.world.goal;
      ctx.fillText('🚩', x * cell + cell / 2, y * cell + cell / 2 + 2);
    }
    // robot
    if (state.world.robot) {
      const { x, y, dir } = state.world.robot;
      ctx.save();
      ctx.translate(x * cell + cell / 2, y * cell + cell / 2 + 2);
      ctx.rotate(dir * Math.PI / 2);
      ctx.fillText('🤖', 0, 0);
      ctx.restore();
    }
  }

  // ── Block library UI ──
  function buildBlockLibrary() {
    const host = $('block-library');
    host.innerHTML = '';
    Object.entries(BLOCKS).forEach(([id, def]) => {
      const el = document.createElement('div');
      el.className = `block-item ${def.cls}`;
      el.draggable = true;
      el.dataset.blockId = id;
      el.innerHTML = `<span class="ic">${def.ic}</span><span>${def.label}</span>`;
      el.addEventListener('dragstart', (ev) => {
        ev.dataTransfer.setData('text/block', id);
        ev.dataTransfer.effectAllowed = 'copy';
      });
      el.addEventListener('click', () => addBlock(id));
      host.appendChild(el);
    });
  }

  // ── Add / remove blocks ──
  function addBlock(blockId, opts = {}) {
    const def = BLOCKS[blockId];
    if (!def) return;
    const item = { id: blockId, num: def.hasNum ? def.defNum : undefined };
    // Determine indent: if previous block in program is a container, this block goes inside it.
    // Simpler model: when user adds via library, the new block is appended at end.
    // To support nesting: if a container exists, allow user to indent manually via button (we keep auto: if last non-end block at indent=0 is a container without an indented child yet, set indent=1).
    state.program.push({ ...item, indent: opts.indent || 0 });
    renderWorkspace();
  }

  function renderWorkspace() {
    const host = $('workspace');
    if (!state.program.length) {
      host.innerHTML = `<div class="ws-empty">Kéo khối vào đây để xếp chương trình.<br>Robot 🤖 sẽ chạy theo thứ tự từ trên xuống.</div>`;
      $('stat-blocks').textContent = '0';
      return;
    }
    host.innerHTML = '';
    state.program.forEach((b, i) => {
      const def = BLOCKS[b.id];
      const el = document.createElement('div');
      el.className = `ws-block ${def.cls}` + (b.indent ? ' indent' : '');
      el.dataset.idx = i;
      const numHtml = def.hasNum ? `<input class="num-input" type="number" min="1" max="50" value="${b.num}" />` : '';
      el.innerHTML = `
        <span class="ic">${def.ic}</span>
        <span>${def.label}</span>
        ${numHtml}
        <button class="rm" title="Xoá khối">×</button>
      `;
      // Allow nested: drag block can be drag-reordered (we keep minimal: only remove)
      el.querySelector('.rm').addEventListener('click', (e) => {
        e.stopPropagation();
        state.program.splice(i, 1);
        renderWorkspace();
      });
      const numInp = el.querySelector('.num-input');
      if (numInp) {
        numInp.addEventListener('input', () => {
          const v = Math.max(1, Math.min(50, Number(numInp.value) || 1));
          state.program[i].num = v;
        });
      }
      // Container indent toggle on dblclick to set/unset indent for the block
      el.addEventListener('dblclick', () => {
        // Toggle indent: only allowed if previous block (somewhere above) is a container
        let hasContainerAbove = false;
        for (let k = i - 1; k >= 0; k--) {
          if (BLOCKS[state.program[k].id]?.isContainer && state.program[k].indent === 0) { hasContainerAbove = true; break; }
        }
        if (b.indent === 0 && hasContainerAbove) state.program[i].indent = 1;
        else if (b.indent === 1) state.program[i].indent = 0;
        renderWorkspace();
      });
      host.appendChild(el);
    });
    $('stat-blocks').textContent = state.program.length;
  }

  // Workspace drag/drop
  const ws = $('workspace');
  ws.addEventListener('dragover', (ev) => { ev.preventDefault(); ws.classList.add('drag-over'); });
  ws.addEventListener('dragleave', () => ws.classList.remove('drag-over'));
  ws.addEventListener('drop', (ev) => {
    ev.preventDefault();
    ws.classList.remove('drag-over');
    const id = ev.dataTransfer.getData('text/block');
    if (!id) return;
    // Auto-indent if drop position is below a container
    let indent = 0;
    if (state.program.length) {
      const last = state.program[state.program.length - 1];
      if (BLOCKS[last.id]?.isContainer) indent = 1;
    }
    addBlock(id, { indent });
  });

  // ── EXECUTE PROGRAM ──
  // We compile state.program into a tree: top-level sequence; container blocks own following indented blocks until indent drops.
  function compile() {
    const out = [];
    let i = 0;
    while (i < state.program.length) {
      const b = state.program[i];
      if (b.indent !== 0) { i++; continue; } // shouldn't happen at top
      if (BLOCKS[b.id]?.isContainer) {
        const children = [];
        let j = i + 1;
        while (j < state.program.length && state.program[j].indent === 1) {
          children.push({ ...state.program[j] });
          j++;
        }
        out.push({ ...b, children });
        i = j;
      } else {
        out.push({ ...b });
        i++;
      }
    }
    return out;
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function dirToDelta(dir) {
    // 0=right,1=down,2=left,3=up
    return [[1,0],[0,1],[-1,0],[0,-1]][dir];
  }

  function frontCell() {
    const [dx, dy] = dirToDelta(state.world.robot.dir);
    return { x: state.world.robot.x + dx, y: state.world.robot.y + dy };
  }

  function isWall(x, y) {
    if (x < 0 || y < 0 || x >= state.world.w || y >= state.world.h) return true;
    return state.world.walls.has(`${x},${y}`);
  }

  function hasStarAtFront() {
    const { x, y } = frontCell();
    return state.world.stars.has(`${x},${y}`);
  }

  function frontIsClear() {
    const { x, y } = frontCell();
    return !isWall(x, y);
  }

  function atGoal() {
    return state.world.goal && state.world.robot.x === state.world.goal.x && state.world.robot.y === state.world.goal.y;
  }

  async function exec(tree, ctx) {
    for (const node of tree) {
      if (state.cancelled) return;
      highlightBlock(node);
      await sleep(ctx.speed);
      const id = node.id;
      if (id === 'move') {
        const { x, y } = frontCell();
        if (isWall(x, y)) {
          ctx.crashed = true;
          return;
        }
        state.world.robot.x = x;
        state.world.robot.y = y;
        // Auto pick on entry? No — separate pick block. But also check goal.
        drawWorld();
      } else if (id === 'turn_left') {
        state.world.robot.dir = (state.world.robot.dir + 3) % 4;
        drawWorld();
      } else if (id === 'turn_right') {
        state.world.robot.dir = (state.world.robot.dir + 1) % 4;
        drawWorld();
      } else if (id === 'pick') {
        const k = `${state.world.robot.x},${state.world.robot.y}`;
        const front = frontCell();
        const fk = `${front.x},${front.y}`;
        // Pick adjacent star (front) OR star at current cell
        let took = null;
        if (state.world.stars.has(k)) took = k;
        else if (state.world.stars.has(fk)) took = fk;
        if (took) {
          state.world.stars.delete(took);
          state.world.collected++;
          drawWorld();
        }
      } else if (id === 'wait') {
        await sleep(900);
      } else if (id === 'end') {
        return;
      } else if (id === 'repeat') {
        const n = Math.max(1, Math.min(50, node.num || 1));
        for (let i = 0; i < n; i++) {
          if (state.cancelled || ctx.crashed) return;
          await exec(node.children || [], ctx);
        }
      } else if (id === 'if_gold') {
        if (hasStarAtFront()) await exec(node.children || [], ctx);
      } else if (id === 'if_clear') {
        if (frontIsClear()) await exec(node.children || [], ctx);
      } else if (id === 'at_goal') {
        if (atGoal()) await exec(node.children || [], ctx);
      }
      unhighlightBlock();
    }
  }

  let highlightedEl = null;
  function highlightBlock(node) {
    unhighlightBlock();
    // Find DOM element by matching index — but tree elements lose index. Use a lookup map.
    const idx = state.program.findIndex(p => p === node._src);
    if (idx >= 0) {
      const el = ws.querySelector(`.ws-block[data-idx="${idx}"]`);
      if (el) { el.classList.add('running'); highlightedEl = el; }
    }
  }
  function unhighlightBlock() {
    if (highlightedEl) { highlightedEl.classList.remove('running'); highlightedEl = null; }
  }

  // Recompile with _src refs for highlight
  function compileWithRefs() {
    const out = [];
    let i = 0;
    while (i < state.program.length) {
      const b = state.program[i];
      if (b.indent !== 0) { i++; continue; }
      const node = { ...b, _src: state.program[i] };
      if (BLOCKS[b.id]?.isContainer) {
        const children = [];
        let j = i + 1;
        while (j < state.program.length && state.program[j].indent === 1) {
          children.push({ ...state.program[j], _src: state.program[j] });
          j++;
        }
        node.children = children;
        out.push(node);
        i = j;
      } else {
        out.push(node);
        i++;
      }
    }
    return out;
  }

  async function runProgram() {
    if (state.running) return;
    if (!state.program.length) { toast('Hãy thêm vài khối lệnh trước!', 'err'); return; }
    state.running = true;
    state.cancelled = false;
    resetWorld();
    const tree = compileWithRefs();
    const ctx = { speed: 320, crashed: false };
    await exec(tree, ctx);
    unhighlightBlock();
    state.running = false;
    if (ctx.crashed) {
      toast('💥 Robot va vào tường! Thử lại nhé.', 'err');
      return;
    }
    // Win condition: at goal, AND all stars picked up if level had stars (but if puzzle requires only goal, still pass)
    const lvl = LEVELS[state.levelIdx];
    const initial = parseGrid(lvl.grid);
    const requireStars = initial.stars.size > 0 && [4,7,9].includes(lvl.id); // levels that explicitly require pick
    if (atGoal() && (!requireStars || state.world.stars.size === 0)) {
      saveBest(lvl.id, state.program.length);
      celebrate();
      $('stat-best').textContent = loadBest()[lvl.id] || '—';
      buildLevelRow();
      toast(`🎉 Bạn đã thắng level ${lvl.id}! (${state.program.length} khối)`, 'win');
    } else if (atGoal()) {
      toast('🚩 Tới đích rồi nhưng còn sót ⭐. Thử nhặt hết nhé!', 'err');
    } else {
      toast('❌ Robot chưa đến đích. Kiểm tra lại chương trình.', 'err');
    }
  }

  function celebrate() {
    const emojis = ['🎉','⭐','✨','🌟','🎊','💫'];
    for (let i = 0; i < 16; i++) {
      const e = document.createElement('div');
      e.className = 'burst';
      e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      e.style.left = `${30 + Math.random() * 40}%`;
      e.style.top = `${40 + Math.random() * 20}%`;
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 1700);
    }
  }

  // ── Toast ──
  let toastTimer = null;
  function toast(msg, kind) {
    const t = $('toast');
    t.textContent = msg;
    t.className = '';
    if (kind === 'err') t.classList.add('err');
    if (kind === 'win') t.classList.add('win');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── Levels ──
  function buildLevelRow() {
    const host = $('level-row');
    const best = loadBest();
    host.innerHTML = LEVELS.map((l, i) =>
      `<button class="level-btn ${i === state.levelIdx ? 'active' : ''} ${best[l.id] ? 'solved' : ''}" data-idx="${i}">Level ${l.id}</button>`
    ).join('');
    host.querySelectorAll('.level-btn').forEach(b => {
      b.addEventListener('click', () => loadLevel(Number(b.dataset.idx)));
    });
  }

  function loadLevel(idx) {
    if (idx < 0 || idx >= LEVELS.length) return;
    state.levelIdx = idx;
    state.program = [];
    state.cancelled = true;
    state.running = false;
    resetWorld();
    renderWorkspace();
    const lvl = LEVELS[idx];
    $('stat-level').textContent = lvl.id;
    $('stat-best').textContent = loadBest()[lvl.id] || '—';
    $('level-info').innerHTML = `<b>Level ${lvl.id}: ${lvl.name}</b><br>${lvl.desc}`;
    buildLevelRow();
  }

  // ── Hint ──
  function showHint() {
    const lvl = LEVELS[state.levelIdx];
    const tokens = lvl.hint;
    const used = new Set();
    tokens.forEach(t => {
      const id = t.split(':')[0];
      if (BLOCKS[id]) used.add(id);
    });
    const list = Array.from(used).map(id => `${BLOCKS[id].ic} ${BLOCKS[id].label}`).join(', ');
    toast(`💡 Thử dùng: ${list}`);
  }

  // ── Wire ──
  $('btn-run').addEventListener('click', runProgram);
  $('btn-reset').addEventListener('click', () => {
    state.cancelled = true;
    state.running = false;
    resetWorld();
  });
  $('btn-clear-ws').addEventListener('click', () => {
    if (!state.program.length) return;
    if (!confirm('Xoá toàn bộ chương trình?')) return;
    state.program = [];
    renderWorkspace();
  });
  $('btn-hint').addEventListener('click', showHint);
  $('btn-prev').addEventListener('click', () => loadLevel(state.levelIdx - 1));
  $('btn-next').addEventListener('click', () => loadLevel(state.levelIdx + 1));

  // ── Init ──
  buildBlockLibrary();
  loadLevel(0);
})();
</script>

</body>
</html>
