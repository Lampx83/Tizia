<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>📈 Đồ thị hàm số · Tizia</title>
<style>
  :root { --bg-1:#0b1220; --bg-2:#0f1830; --accent:#f59e0b; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.12); --ok:#22c55e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Inter',system-ui,sans-serif; color:#e5edf7;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(245,158,11,.13), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2)); }
  .top { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.2); position:sticky; top:0; z-index:5; }
  .back { color:#fff; text-decoration:none; opacity:.85; font-size:13.5px; background:rgba(255,255,255,.08); padding:7px 12px; border-radius:9px; }
  .back:hover { opacity:1; background:rgba(255,255,255,.16); }
  .top h1 { margin:0; font-size:17px; font-weight:800; }
  .top .sub { font-size:12.5px; opacity:.6; font-weight:500; }
  .top .prog { margin-left:auto; font-size:13px; font-weight:700; background:rgba(245,158,11,.16); border:1px solid rgba(245,158,11,.45); color:#fcd34d; padding:6px 12px; border-radius:20px; }
  .wrap { max-width:none; margin:0 auto; padding:16px 18px 40px; display:grid; grid-template-columns:1fr 320px; gap:16px; }
  @media (max-width:880px){ .wrap{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  canvas { width:100%; height:auto; display:block; background:#070b16; border-radius:11px; border:1px solid var(--border); }
  .types { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .types button { background:rgba(255,255,255,.06); border:1px solid var(--border); color:#cbd5e1; font-size:13px; font-weight:600; padding:8px 13px; border-radius:10px; cursor:pointer; font-family:inherit; }
  .types button:hover { background:rgba(255,255,255,.12); }
  .types button.active { background:rgba(245,158,11,.16); border-color:rgba(245,158,11,.5); color:#fde68a; }
  .eq { font-family:ui-monospace,monospace; font-size:18px; font-weight:700; color:#fde68a; margin:2px 0 14px; }
  .sliders .row { display:grid; grid-template-columns:30px 1fr 56px; align-items:center; gap:10px; margin:9px 0; }
  .sliders .row label { font-weight:800; font-family:ui-monospace,monospace; }
  .sliders input[type=range]{ width:100%; accent-color:var(--accent); }
  .sliders .val { font-family:ui-monospace,monospace; font-size:13px; text-align:right; opacity:.9; }
  .sliders .row.hide { display:none; }
  .info { font-size:13px; line-height:1.6; }
  .info h3 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; opacity:.55; margin:0 0 6px; }
  .info .k { color:#fcd34d; font-family:ui-monospace,monospace; }
  .reinforce { margin-top:4px; }
  .q { border-top:1px solid var(--border); padding:11px 0 4px; }
  .q .qt { font-size:13px; font-weight:700; margin-bottom:7px; }
  .q .opt { display:block; width:100%; text-align:left; background:rgba(255,255,255,.04); border:1px solid var(--border); color:#e5edf7; padding:7px 10px; border-radius:9px; margin:4px 0; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .q .opt:hover { background:rgba(255,255,255,.09); }
  .q .opt.ok { background:rgba(34,197,94,.2); border-color:#22c55e; } .q .opt.no { background:rgba(239,68,68,.18); border-color:#ef4444; }
  .q .fb { font-size:12px; margin-top:5px; opacity:0; transition:.2s; color:#bbf7d0; } .q .fb.show{ opacity:.95; }
  .reset { margin-top:10px; background:rgba(255,255,255,.08); color:#fff; border:none; border-radius:9px; padding:8px 13px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ok); color:#04210f; font-weight:800; padding:12px 22px; border-radius:13px; box-shadow:0 12px 30px rgba(0,0,0,.4); opacity:0; transition:.3s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="top">
  <a class="back" id="back" href="/school.html#campus-hero">← Khuôn viên trường</a>
  <div><h1>📈 Đồ thị hàm số <span class="sub">— kéo hệ số, xem đồ thị đổi ngay</span></h1></div>
  <div class="prog" id="prog">0/3 củng cố</div>
</div>
<div class="wrap">
  <div class="panel">
    <div class="types" id="types"></div>
    <canvas id="c" width="700" height="520"></canvas>
  </div>
  <div class="panel">
    <div class="eq" id="eq">y =</div>
    <div class="sliders" id="sliders">
      <div class="row" id="row-a"><label>a</label><input type="range" id="a" min="-5" max="5" step="0.1" value="1"><span class="val" id="va">1.0</span></div>
      <div class="row" id="row-b"><label>b</label><input type="range" id="b" min="-5" max="5" step="0.1" value="0"><span class="val" id="vb">0.0</span></div>
      <div class="row" id="row-c"><label>c</label><input type="range" id="c" min="-5" max="5" step="0.1" value="0"><span class="val" id="vc">0.0</span></div>
    </div>
    <button class="reset" id="resetBtn">↺ Đặt lại hệ số</button>
    <div class="info" id="info" style="margin-top:14px"></div>
    <div class="reinforce" id="reinforce"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const domain = new URLSearchParams(location.search).get('domain');
$('back').href = '/school.html' + (domain ? '?domain=' + encodeURIComponent(domain) : '') + '#campus-hero';

const cv = $('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, SCALE = 26;            // px mỗi đơn vị
const cx = W/2, cy = H/2;
const toX = wx => cx + wx*SCALE, toY = wy => cy - wy*SCALE;

let type = 'quad';
const fmt = v => (v>=0?'+':'−') + Math.abs(v).toFixed(1);
function coef(){ return { a:parseFloat($('a').value), b:parseFloat($('b').value), c:parseFloat($('c').value) }; }
function f(x){ const {a,b,c}=coef(); if(type==='linear') return a*x+b; if(type==='quad') return a*x*x+b*x+c; return a*Math.sin(b*x+c); }

const TYPES = {
  linear: { label:'Bậc nhất', uses:['a','b'] },
  quad:   { label:'Bậc hai',  uses:['a','b','c'] },
  sin:    { label:'Lượng giác (sin)', uses:['a','b','c'] },
};

function drawGrid(){
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=1;
  const ux=Math.floor(W/2/SCALE), uy=Math.floor(H/2/SCALE);
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='10px ui-monospace,monospace';
  for(let i=-ux;i<=ux;i++){ const x=toX(i); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); if(i!==0&&i%2===0) ctx.fillText(i, x+2, cy+12); }
  for(let j=-uy;j<=uy;j++){ const y=toY(j); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); if(j!==0&&j%2===0) ctx.fillText(j, cx+4, y-2); }
  // trục
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillText('x', W-12, cy-6); ctx.fillText('y', cx+6, 12); ctx.fillText('O', cx+4, cy+13);
}
function drawCurve(){
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2.4; ctx.beginPath();
  let started=false;
  for(let px=0;px<=W;px++){ const wx=(px-cx)/SCALE; const wy=f(wx); const py=toY(wy);
    if(py<-200||py>H+200){ started=false; continue; }
    if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py); }
  ctx.stroke();
  // điểm đặc biệt cho parabol: đỉnh
  if(type==='quad'){ const {a,b}=coef(); if(a!==0){ const vx=-b/(2*a), vy=f(vx); ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(toX(vx),toY(vy),4,0,7); ctx.fill(); } }
}
function draw(){ drawGrid(); drawCurve(); updateEq(); updateInfo(); }

function updateEq(){
  const {a,b,c}=coef();
  let s;
  if(type==='linear') s=`y = ${a.toFixed(1)}·x ${fmt(b)}`;
  else if(type==='quad') s=`y = ${a.toFixed(1)}·x² ${fmt(b)}·x ${fmt(c)}`;
  else s=`y = ${a.toFixed(1)}·sin( ${b.toFixed(1)}·x ${fmt(c)} )`;
  $('eq').textContent=s;
  $('va').textContent=a.toFixed(1); $('vb').textContent=b.toFixed(1); $('vc').textContent=c.toFixed(1);
}
function updateInfo(){
  const {a,b,c}=coef(); let h='';
  if(type==='linear'){
    const trend = a>0?'đồng biến (đi lên)':a<0?'nghịch biến (đi xuống)':'hàm hằng (đường ngang)';
    h=`<h3>Đường thẳng</h3>Hệ số góc <span class="k">a=${a.toFixed(1)}</span> ⇒ ${trend}.<br>Cắt trục Oy tại <span class="k">(0; ${b.toFixed(1)})</span>.`;
    if(a!==0) h+=`<br>Nghiệm (cắt Ox): <span class="k">x = ${(-b/a).toFixed(2)}</span>.`;
  } else if(type==='quad'){
    if(a===0){ h=`<h3>Lưu ý</h3>Khi <span class="k">a=0</span> thì không còn là hàm bậc hai (thành đường thẳng).`; }
    else { const vx=-b/(2*a), vy=a*vx*vx+b*vx+c, D=b*b-4*a*c;
      const lom=a>0?'lên trên (có giá trị nhỏ nhất)':'xuống dưới (có giá trị lớn nhất)';
      h=`<h3>Parabol</h3>Bề lõm hướng ${lom}.<br>Đỉnh <span class="k">I(${vx.toFixed(2)}; ${vy.toFixed(2)})</span>.<br>Biệt thức <span class="k">Δ = ${D.toFixed(2)}</span> ⇒ `;
      if(D>0){ const r1=(-b-Math.sqrt(D))/(2*a), r2=(-b+Math.sqrt(D))/(2*a); h+=`hai nghiệm <span class="k">x₁=${Math.min(r1,r2).toFixed(2)}, x₂=${Math.max(r1,r2).toFixed(2)}</span>.`; }
      else if(Math.abs(D)<1e-9){ h+=`nghiệm kép <span class="k">x = ${(-b/(2*a)).toFixed(2)}</span>.`; }
      else h+=`vô nghiệm (không cắt Ox).`;
    }
  } else {
    const T = b!==0 ? (2*Math.PI/Math.abs(b)) : Infinity;
    h=`<h3>Hàm sin</h3>Biên độ <span class="k">|a| = ${Math.abs(a).toFixed(1)}</span>.<br>Chu kì <span class="k">T = 2π/|b| = ${isFinite(T)?T.toFixed(2):'∞'}</span>.<br>Dịch pha theo <span class="k">c = ${c.toFixed(1)}</span>.`;
  }
  $('info').innerHTML=h;
}

function renderTypes(){
  $('types').innerHTML=Object.keys(TYPES).map(k=>`<button data-k="${k}" class="${k===type?'active':''}">${TYPES[k].label}</button>`).join('');
  $('types').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.k)));
}
function setType(k){
  type=k; const uses=TYPES[k].uses;
  $('row-c').classList.toggle('hide', !uses.includes('c'));
  // hệ số mặc định gợi ý cho từng loại
  if(k==='quad'){ $('a').value=1; $('b').value=0; $('c').value=0; }
  else if(k==='linear'){ $('a').value=1; $('b').value=0; }
  else { $('a').value=2; $('b').value=1; $('c').value=0; }
  renderTypes(); draw();
}

['a','b','c'].forEach(id=>$(id).addEventListener('input',draw));
$('resetBtn').addEventListener('click',()=>setType(type));

// ── củng cố ──
const QUIZ=[
  { q:'Đồ thị hàm số bậc hai y = ax² + bx + c (a≠0) là đường gì?', o:['Parabol','Đường thẳng','Đường tròn','Hình sin'], a:0, fb:'Hàm bậc hai luôn cho đồ thị là một parabol.' },
  { q:'Parabol y = ax² + bx + c có a > 0 thì bề lõm hướng?', o:['Lên trên (có điểm thấp nhất)','Xuống dưới','Sang phải','Sang trái'], a:0, fb:'a>0 ⇒ bề lõm lên trên, đỉnh là điểm thấp nhất (giá trị nhỏ nhất).' },
  { q:'Hàm bậc nhất y = ax + b với a < 0 thì hàm số?', o:['Nghịch biến (đồ thị đi xuống)','Đồng biến','Không đổi','Tuần hoàn'], a:0, fb:'a<0 ⇒ x tăng thì y giảm ⇒ nghịch biến, đường thẳng dốc xuống.' },
];
let answered=new Set();
function renderQuiz(){
  $('reinforce').innerHTML='<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.55;margin:14px 0 2px">💡 Củng cố</h3>'+
    QUIZ.map((it,qi)=>`<div class="q" data-qi="${qi}"><div class="qt">${qi+1}. ${it.q}</div>
      ${it.o.map((o,oi)=>`<button class="opt" data-qi="${qi}" data-oi="${oi}">${o}</button>`).join('')}
      <div class="fb"></div></div>`).join('');
  $('reinforce').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.qi,+b.dataset.oi,b)));
}
function answer(qi,oi,btn){
  if(answered.has(qi)) return;
  const it=QUIZ[qi], correct=oi===it.a, box=btn.closest('.q');
  box.querySelectorAll('.opt').forEach((b,i)=>{ if(i===it.a) b.classList.add('ok'); });
  if(!correct) btn.classList.add('no');
  const fb=box.querySelector('.fb'); fb.textContent=(correct?'✓ Đúng! ':'✗ Chưa đúng. ')+it.fb; fb.classList.add('show');
  answered.add(qi); $('prog').textContent=`${answered.size}/3 củng cố`;
  if(correct) showToast('✓ Củng cố: +1');
  if(answered.size===QUIZ.length){ try{ const k='tizia:space:done'; const d=JSON.parse(localStorage.getItem(k)||'{}'); d.grapher=Math.max(d.grapher||0,QUIZ.length); localStorage.setItem(k,JSON.stringify(d)); }catch(e){} showToast('🏆 Hoàn thành phần củng cố đồ thị!'); }
}
let toastT; function showToast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

// init
renderTypes(); renderQuiz();
const qType = new URLSearchParams(location.search).get('type');
setType(['linear','quad','sin'].includes(qType)?qType:'quad');
if(new URLSearchParams(location.search).get('auto')==='1'){ $('a').value=0.5; $('b').value=-1; $('c').value=-2; draw(); }
</script>
</body>
</html>
