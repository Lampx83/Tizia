<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎤 Luyện phát âm Tiếng Anh · Tizia</title>
<meta name="description" content="Đọc câu mẫu, AI chấm phát âm bằng Web Speech Recognition. So sánh với giọng chuẩn, đo độ chính xác." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<meta name="theme-color" content="#a855f7" />
<style>
  :root { --bg:#0f172a; --card:rgba(255,255,255,.06); --accent:#a855f7; --green:#10b981;
    --red:#ef4444; --text:#e5edf7; --muted:#94a3b8; --border:rgba(255,255,255,.12); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Inter',system-ui,sans-serif;
    background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(168,85,247,.18), transparent),
      linear-gradient(180deg,var(--bg),#2e1065); color: var(--text); padding: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 18px; }
  h1 { margin: 0; font-size: 22px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .toolbar select { font-family:inherit; background:var(--card); color:var(--text);
    border:1px solid var(--border); padding:8px 14px; border-radius:9px; font-size:13px; }
  .target { background: var(--card); border:1px solid var(--border); border-radius:14px;
    padding: 28px; width: 100%; max-width: 620px; text-align: center; }
  .target .label { color:var(--muted); font-size:12px; letter-spacing:.6px; text-transform:uppercase; }
  .target .sentence { font-size: 26px; line-height: 1.4; font-weight: 700; margin: 12px 0; }
  .target .phonetic { color: var(--accent); font-size: 16px; font-family: 'Times New Roman', serif; margin: 4px 0; }
  .target .translation { color: var(--muted); font-size: 14px; }
  .listen-btn { background: rgba(168,85,247,.18); border:1px solid var(--accent); color:var(--accent);
    padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 14px; font-family: inherit; }
  .listen-btn:hover { background: var(--accent); color: white; }

  .record-area { background: var(--card); border:1px solid var(--border); border-radius:14px;
    padding: 24px; width: 100%; max-width: 620px; }
  .mic-btn { width: 88px; height: 88px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6366f1); color: white;
    font-size: 36px; display: block; margin: 0 auto 16px;
    box-shadow: 0 8px 28px rgba(168,85,247,.4); transition: transform .15s; }
  .mic-btn:hover { transform: scale(1.05); }
  .mic-btn.recording { background: linear-gradient(135deg, var(--red), #f97316);
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 28px rgba(239,68,68,.4); transform: scale(1); }
    50% { box-shadow: 0 8px 40px rgba(239,68,68,.6); transform: scale(1.08); }
  }
  .status { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; }

  .result { background: rgba(0,0,0,.25); border-radius:11px; padding: 16px; margin-top: 14px; }
  .result.hidden { display: none; }
  .result .label { color: var(--muted); font-size: 11px; letter-spacing: .5px; text-transform: uppercase; }
  .result .heard { font-size: 18px; margin: 6px 0 14px; }
  .score-box { display: flex; align-items: center; gap: 14px; }
  .score-circle { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
    flex: none; font-size: 24px; font-weight: 800; border: 3px solid; }
  .score-circle.high { color: var(--green); border-color: var(--green); background: rgba(16,185,129,.1); }
  .score-circle.mid { color: #fbbf24; border-color: #fbbf24; background: rgba(251,191,36,.1); }
  .score-circle.low { color: var(--red); border-color: var(--red); background: rgba(239,68,68,.1); }
  .diff { flex: 1; font-size: 14px; line-height: 1.5; }
  .diff .ok { color: var(--green); }
  .diff .miss { color: var(--red); text-decoration: line-through; }
  .diff .extra { color: #fbbf24; font-style: italic; }

  .nav { display: flex; gap: 10px; justify-content: center; }
  .nav button { font-family: inherit; padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .nav button.primary { background: var(--accent); border: 0; color: white; }

  .warning { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<h1>🎤 Luyện phát âm Tiếng Anh</h1>
<div class="toolbar">
  <select id="level">
    <option value="easy">🟢 Dễ: câu ngắn</option>
    <option value="med">🟡 Vừa: câu thông dụng</option>
    <option value="hard">🔴 Khó: câu phức</option>
  </select>
</div>

<div id="micWarning" class="warning hidden">
  ⚠️ Trình duyệt không hỗ trợ Speech Recognition. Hãy dùng Chrome hoặc Edge.
</div>

<div class="target">
  <div class="label">Câu mục tiêu</div>
  <div class="sentence" id="sentence">…</div>
  <div class="translation" id="translation">…</div>
  <button class="listen-btn" id="listenBtn">🔊 Nghe mẫu</button>
</div>

<div class="record-area">
  <button class="mic-btn" id="micBtn" title="Bấm để bắt đầu/dừng">🎤</button>
  <div class="status" id="status">Bấm 🎤 và đọc to câu trên</div>
  <div class="result hidden" id="resultBox">
    <div class="label">Bạn vừa nói:</div>
    <div class="heard" id="heard"></div>
    <div class="score-box">
      <div class="score-circle" id="scoreCircle">-</div>
      <div class="diff" id="diff"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button id="prevBtn">← Câu trước</button>
  <button class="primary" id="nextBtn">Câu tiếp →</button>
</div>

<script type="module">
  const SENTENCES = await fetch('/api/content/pronunciation', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : { items: [] }).then(j => (j.items || [])[0] || {}).catch(() => ({}));

  const el = id => document.getElementById(id);
  let level = 'easy', idx = 0, recognizing = false, recognition = null;

  function render() {
    const list = SENTENCES[level];
    idx = ((idx % list.length) + list.length) % list.length;
    const s = list[idx];
    el('sentence').textContent = s.en;
    el('translation').textContent = s.vi;
    el('resultBox').classList.add('hidden');
    el('status').textContent = 'Bấm 🎤 và đọc to câu trên';
  }

  function speakSentence() {
    if (!('speechSynthesis' in window)) { alert('Trình duyệt không hỗ trợ phát âm.'); return; }
    const u = new SpeechSynthesisUtterance(el('sentence').textContent);
    u.lang = 'en-US'; u.rate = 0.92;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // Normalize text: lowercase, strip punctuation
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[.,!?;:()'"]/g, '').replace(/\s+/g, ' ').trim();
  }
  // Token-level diff: 1 cho match, 0 cho miss/extra. Trả {ok, miss, extra, scorePct}
  function compareWords(target, heard) {
    const tw = norm(target).split(' ');
    const hw = norm(heard).split(' ');
    const used = new Array(hw.length).fill(false);
    let okCount = 0;
    const tokens = tw.map(t => {
      const hi = hw.findIndex((h, i) => !used[i] && h === t);
      if (hi >= 0) { used[hi] = true; okCount++; return { type: 'ok', word: t }; }
      return { type: 'miss', word: t };
    });
    const extras = hw.filter((_, i) => !used[i]).map(w => ({ type: 'extra', word: w }));
    const scorePct = Math.round((okCount / Math.max(1, tw.length)) * 100);
    return { tokens, extras, scorePct };
  }

  function startRecord() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      el('micWarning').classList.remove('hidden');
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;
    recognition.continuous = false;

    recognition.onstart = () => {
      recognizing = true;
      el('micBtn').classList.add('recording');
      el('status').textContent = '🔴 Đang nghe… hãy đọc câu trên';
    };
    recognition.onerror = (e) => {
      el('status').textContent = '❌ Lỗi: ' + e.error;
    };
    recognition.onend = () => {
      recognizing = false;
      el('micBtn').classList.remove('recording');
    };
    recognition.onresult = (e) => {
      const heard = e.results[0][0].transcript;
      el('heard').textContent = heard;
      const target = el('sentence').textContent;
      const { tokens, extras, scorePct } = compareWords(target, heard);
      const allTokens = [...tokens, ...extras];
      el('diff').innerHTML = allTokens.map(t =>
        `<span class="${t.type}">${t.word}</span>`).join(' ');
      const circle = el('scoreCircle');
      circle.textContent = scorePct + '%';
      circle.className = 'score-circle ' + (scorePct >= 80 ? 'high' : scorePct >= 50 ? 'mid' : 'low');
      el('status').textContent = scorePct >= 80 ? '🎉 Tuyệt vời!' :
        scorePct >= 50 ? '👍 Khá ổn: luyện thêm chút nữa' : '💪 Cần luyện thêm, bấm 🔊 nghe lại';
      el('resultBox').classList.remove('hidden');
    };
    try { recognition.start(); } catch (err) { el('status').textContent = '❌ ' + err.message; }
  }
  function stopRecord() {
    if (recognition && recognizing) { recognition.stop(); }
  }

  el('micBtn').onclick = () => recognizing ? stopRecord() : startRecord();
  el('listenBtn').onclick = speakSentence;
  el('nextBtn').onclick = () => { idx++; render(); };
  el('prevBtn').onclick = () => { idx--; render(); };
  el('level').onchange = (e) => { level = e.target.value; idx = 0; render(); };

  // Probe support
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    el('micWarning').classList.remove('hidden');
  }
  render();
</script>
</body>
</html>
