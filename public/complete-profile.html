<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Khai bổ sung · Tizia</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#fbbf24" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.30), transparent),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(14,165,233,0.20), transparent),
      radial-gradient(ellipse 80% 50% at 0% 80%, rgba(236,72,153,0.18), transparent),
      linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #312e81 100%);
  }
  .card {
    width: 100%; max-width: 460px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px; padding: 30px 26px;
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.35);
  }
  .logo { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
  h1 {
    margin: 0 0 4px; font-size: 24px; font-weight: 800; text-align: center;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 50%, #f97316 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { text-align: center; opacity: 0.8; font-size: 13px; margin-bottom: 18px; line-height: 1.4; }
  label { display: block; font-size: 13px; opacity: 0.85; margin: 12px 0 6px; }
  input, select {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid #fbbf24; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.primary {
    width: 100%; margin-top: 18px; padding: 12px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #fbbf24, #f97316); color: #3e2723;
    font-weight: 700; font-size: 15px; font-family: inherit;
  }
  button.primary[disabled] { opacity: 0.6; cursor: progress; }
  .err {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: rgba(244,63,94,0.18); border: 1px solid rgba(244,63,94,0.4);
    color: #fecaca; font-size: 13px; display: none;
  }
  .err.show { display: block; }
  .role-badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: rgba(251,191,36,0.18); border: 1px solid rgba(251,191,36,0.35);
    color: #fde68a; font-size: 12px; font-weight: 600;
  }
  .skip {
    margin-top: 12px; text-align: center; font-size: 12px; opacity: 0.7;
  }
  .skip a { color: #fbbf24; text-decoration: none; }
</style>
</head>
<body data-no-auth-header data-no-notifications-bell data-no-suggestion-fab>
<form class="card" id="form-cp" autocomplete="on">
  <div class="logo">📋</div>
  <h1>Khai bổ sung thông tin</h1>
  <p class="tag">
    Để Tizia dẫn bạn vào đúng <b>trường &amp; lộ trình học</b>, vui lòng cho biết
    bạn là <span class="role-badge" id="role-badge">…</span> và đang ở đâu.
  </p>

  <div id="block-pupil" style="display:none">
    <label for="grade">Đang học lớp mấy?</label>
    <select id="grade" name="grade">
      <option value="0">Mầm non (3–5 tuổi)</option>
      <option value="1">Lớp 1</option><option value="2">Lớp 2</option>
      <option value="3">Lớp 3</option><option value="4">Lớp 4</option><option value="5">Lớp 5</option>
      <option value="6">Lớp 6</option><option value="7">Lớp 7</option>
      <option value="8">Lớp 8</option><option value="9">Lớp 9</option>
      <option value="10">Lớp 10</option><option value="11">Lớp 11</option><option value="12">Lớp 12</option>
    </select>
    <label for="school-pupil">Trường đang học <span style="opacity:0.6">(không bắt buộc)</span></label>
    <input id="school-pupil" name="school-pupil" maxlength="120" placeholder="VD: Tiểu học Kim Liên" />
  </div>

  <div id="block-student" style="display:none">
    <label for="major">Ngành học</label>
    <select id="major" name="major">
      <option value="">Chọn ngành</option>
      <option value="pharmacy">💊 Dược</option>
      <option value="it">💻 Công nghệ thông tin</option>
      <option value="economics">📉 Kinh tế</option>
      <option value="business">📈 Kinh doanh</option>
      <option value="finance">🏦 Tài chính – Ngân hàng</option>
      <option value="medicine">⚕️ Y</option>
      <option value="nursing">🩺 Điều dưỡng</option>
      <option value="law">⚖️ Luật</option>
      <option value="education">🎓 Sư phạm</option>
      <option value="engineering">⚙️ Kỹ thuật – Công nghệ</option>
      <option value="architecture">🏛️ Kiến trúc – Xây dựng</option>
      <option value="languages">🗣️ Ngoại ngữ</option>
      <option value="agriculture">🌾 Nông nghiệp</option>
      <option value="tourism">🏖️ Du lịch – Khách sạn</option>
      <option value="arts">🎨 Mỹ thuật – Thiết kế</option>
      <option value="media">📰 Báo chí – Truyền thông</option>
      <option value="social-sciences">📚 KHXH &amp; Nhân văn</option>
      <option value="natural-sciences">🔬 Khoa học tự nhiên</option>
      <option value="logistics">🚚 Logistics</option>
      <option value="public-admin">🏢 Quản trị Nhà nước</option>
      <option value="driving">🚗 Lái xe (B1/B2/C/D)</option>
    </select>
    <div class="row-2" style="margin-top:8px">
      <div>
        <label for="cohort">Khoá</label>
        <input id="cohort" name="cohort" maxlength="20" placeholder="K65" />
      </div>
      <div>
        <label for="school-student">Trường ĐH</label>
        <input id="school-student" name="school-student" maxlength="120" placeholder="VD: NEU" />
      </div>
    </div>
  </div>

  <div id="block-teacher" style="display:none">
    <label for="school-teacher">Trường đang công tác <span style="opacity:0.6">(không bắt buộc)</span></label>
    <input id="school-teacher" name="school-teacher" maxlength="120" placeholder="VD: ĐH Kinh tế Quốc dân" />
  </div>

  <button class="primary" type="submit" id="submit-btn">Lưu &amp; vào Tizia</button>
  <div class="err" id="err"></div>
  <p class="skip"><a href="javascript:void(0)" id="logout-link">Đăng xuất</a></p>
</form>

<script type="module">
  import { fetchMe, completeProfile, logout } from './js/auth.js';

  const form = document.getElementById('form-cp');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('submit-btn');
  const roleBadge = document.getElementById('role-badge');
  const blocks = {
    pupil:   document.getElementById('block-pupil'),
    student: document.getElementById('block-student'),
    teacher: document.getElementById('block-teacher'),
  };
  const ROLE_LABEL = { pupil: '🎒 Học sinh', student: '🎓 Sinh viên', teacher: '👨‍🏫 Giảng viên' };

  document.getElementById('logout-link').addEventListener('click', () => logout());

  let me = null;
  try {
    me = await fetchMe();
  } catch {}
  if (!me) { location.replace('login.html'); }
  // Profile đã đủ → quay về trang mặc định (server đã tính sẵn).
  if (me.profile_complete) { location.replace(me.default_route || './'); }

  const role = me.role || 'student';
  roleBadge.textContent = ROLE_LABEL[role] || role;
  blocks[role] && (blocks[role].style.display = 'block');

  // Prefill nếu user đã có một phần thông tin.
  if (me.grade != null) document.getElementById('grade').value = String(me.grade);
  if (me.major) document.getElementById('major').value = me.major;
  if (me.cohort) document.getElementById('cohort').value = me.cohort;
  if (me.school_name) {
    if (role === 'pupil')   document.getElementById('school-pupil').value = me.school_name;
    if (role === 'student') document.getElementById('school-student').value = me.school_name;
    if (role === 'teacher') document.getElementById('school-teacher').value = me.school_name;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const payload = {};
      if (role === 'pupil') {
        payload.grade = Number(document.getElementById('grade').value) || 0;
        payload.schoolName = document.getElementById('school-pupil').value.trim() || undefined;
      } else if (role === 'student') {
        payload.major = document.getElementById('major').value;
        payload.cohort = document.getElementById('cohort').value.trim() || undefined;
        payload.schoolName = document.getElementById('school-student').value.trim() || undefined;
        if (!payload.major) throw new Error('Vui lòng chọn ngành học');
      } else {
        payload.schoolName = document.getElementById('school-teacher').value.trim() || undefined;
      }
      const res = await completeProfile(payload);
      if (res?.ok) {
        location.replace(res.redirectTo || './');
      } else {
        throw new Error(res?.error || 'Lưu thất bại');
      }
    } catch (err) {
      errEl.textContent = err?.message || 'Lỗi mạng. Thử lại.';
      errEl.classList.add('show');
      btn.disabled = false; btn.textContent = 'Lưu & vào Tizia';
    }
  });
</script>
</body>
</html>
