<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🌳 Cây Tri Thức · Tizia</title>
<meta name="description" content="Mỗi tuần em hoàn thành = 1 chiếc lá lên Cây Tri Thức. Cùng nuôi cây xanh tốt nhé!" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --sky-1:#a3d2ff; --sky-2:#d8eeff; --sky-3:#fff5d8;
    --trunk:#6b3a1a; --trunk-dark:#4a2710;
    --grass-1:#7bc36f; --grass-2:#5fa757;
    --ink:#1f2937; --ink-soft:#475569;
    --accent:#f59e0b;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--ink);
    background: linear-gradient(180deg,var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
    overflow-x:hidden;
  }
  .top { position:fixed; top:14px; left:14px; right:14px; z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .back { background:rgba(15,23,42,.75); color:#fff; text-decoration:none; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; backdrop-filter:blur(6px); }
  .back:hover { background:rgba(15,23,42,.9); }
  .stats { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.6); padding:7px 13px; border-radius:18px; font-size:13px; font-weight:700; color:var(--ink); display:flex; gap:6px; align-items:center; box-shadow:0 4px 12px rgba(31,41,55,.08); }
  .pill b { color:var(--accent); }

  #scene { position:relative; width:100%; height:100vh; min-height:680px; display:flex; align-items:flex-end; justify-content:center; }
  /* Mây */
  .cloud { position:absolute; opacity:.78; pointer-events:none; animation: drift 80s linear infinite; }
  .cloud.c2 { animation-duration: 120s; animation-delay:-40s; }
  .cloud.c3 { animation-duration: 100s; animation-delay:-15s; }
  @keyframes drift { from{ transform:translateX(-15vw); } to { transform:translateX(110vw); } }

  /* Mặt đất */
  .ground { position:absolute; bottom:0; left:0; right:0; height:120px;
    background: linear-gradient(180deg, var(--grass-1), var(--grass-2));
    border-radius:50% 50% 0 0 / 24% 24% 0 0;
    box-shadow: inset 0 16px 30px rgba(0,0,0,.08);
  }
  .ground::before { content:''; position:absolute; top:-6px; left:0; right:0; height:14px;
    background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(255,255,255,.25) 8px 12px); border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }

  /* Cây SVG */
  #tree { position:relative; z-index:2; width:min(96vw,1100px); height:auto; margin-bottom:60px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.18)); }
  .trunk { fill: var(--trunk); }
  .trunk-dark { fill: var(--trunk-dark); }
  .branch { stroke: var(--trunk); fill:none; stroke-linecap:round; }
  /* KHÔNG dùng transform:scale ở hover — sẽ ghi đè inline transform="translate(...) rotate(...)"
     của leaf → leaf bay về (0,0) lúc hover, gây flicker. Dùng filter highlight thay thế. */
  .leaf { transition: filter .18s ease; cursor:pointer; }
  .leaf:hover { filter: brightness(1.25) drop-shadow(0 3px 8px rgba(0,0,0,.45)); }
  .leaf.empty { opacity:.25; filter: grayscale(.6); }
  .leaf-label { font-size:11px; font-weight:700; fill:#fff; text-anchor:middle; pointer-events:none; }
  .fruit { transition: transform .4s cubic-bezier(.34,1.56,.64,1); transform-origin:center; }

  /* Tooltip */
  #tip { position:fixed; z-index:30; background:rgba(15,23,42,.94); color:#fff; padding:8px 13px; border-radius:10px; font-size:12.5px; pointer-events:none; opacity:0; transition:opacity .15s; transform:translate(-50%,-130%); max-width:240px; line-height:1.45; box-shadow:0 8px 20px rgba(0,0,0,.3); }
  #tip.show { opacity:1; }
  #tip b { display:block; margin-bottom:2px; font-size:13px; color:#fde68a; }

  /* Legend chú giải các nhánh môn */
  #legend { position:fixed; right:14px; bottom:14px; z-index:20; background:rgba(255,255,255,.92); border-radius:14px; padding:11px 14px 12px; box-shadow:0 8px 24px rgba(0,0,0,.15); max-width:260px; backdrop-filter:blur(8px); }
  #legend h4 { margin:0 0 8px; font-size:12.5px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:6px; }
  #legend .row { display:flex; align-items:center; gap:8px; font-size:12px; padding:3px 0; cursor:pointer; border-radius:6px; padding:3px 6px; transition: background .12s; }
  #legend .row:hover { background:rgba(245,158,11,.12); }
  #legend .row .dot { width:14px; height:14px; border-radius:4px; flex-shrink:0; }
  #legend .row .ct { color:var(--ink-soft); margin-left:auto; font-weight:700; font-size:11.5px; }

  /* Filter bar */
  #filter { position:fixed; left:14px; bottom:14px; z-index:20; background:rgba(255,255,255,.92); border-radius:14px; padding:10px 12px; box-shadow:0 8px 24px rgba(0,0,0,.15); display:flex; gap:6px; flex-wrap:wrap; max-width:340px; }
  #filter button { background:rgba(15,23,42,.06); border:1px solid rgba(15,23,42,.1); color:var(--ink); font-size:12px; font-weight:700; padding:6px 11px; border-radius:14px; cursor:pointer; transition: background .12s; font-family:inherit; }
  #filter button:hover { background:rgba(15,23,42,.14); }
  #filter button.on { background:var(--accent); color:#fff; border-color:transparent; }

  /* Empty hint */
  #empty { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5; background:rgba(255,255,255,.95); padding:22px 30px; border-radius:18px; max-width:380px; text-align:center; box-shadow:0 16px 40px rgba(0,0,0,.18); display:none; }
  #empty.show { display:block; }
  #empty .ic { font-size:48px; }
  #empty h3 { margin:8px 0 6px; font-size:18px; }
  #empty p { margin:0 0 14px; color:var(--ink-soft); font-size:13.5px; line-height:1.5; }
  #empty a { background:var(--accent); color:#fff; text-decoration:none; padding:9px 18px; border-radius:18px; font-weight:700; font-size:13px; display:inline-block; }

  /* Toast */
  #toast { position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-20px); z-index:40; background:#16a34a; color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; opacity:0; transition: opacity .2s, transform .2s; box-shadow:0 8px 24px rgba(22,163,74,.5); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Burst confetti khi reach milestone */
  .burst { position:fixed; pointer-events:none; font-size:22px; z-index:35; animation: burst-up 1.4s ease-out forwards; }
  @keyframes burst-up { from { transform: translateY(0) scale(.6); opacity:1; } to { transform: translateY(-180px) scale(1.3) rotate(120deg); opacity:0; } }

  @media (max-width:600px) {
    .top .stats { width:100%; margin-left:0; }
    #legend, #filter { max-width:46vw; }
    #legend { right:8px; bottom:8px; padding:8px 10px; font-size:11px; }
    #filter { left:8px; bottom:8px; padding:8px; gap:4px; }
    #filter button { padding:5px 9px; font-size:11px; }
  }
</style>
</head>
<body>

<div class="top">
  <a class="back" href="/">← Tizia</a>
  <a class="back" href="/space.html">Không gian học</a>
  <div class="stats">
    <span class="pill">🍃 Lá: <b id="st-leaves">0</b></span>
    <span class="pill">🍎 Quả chín: <b id="st-fruits">0</b></span>
    <span class="pill">✨ XP: <b id="st-xp">0</b></span>
    <span class="pill">🔥 Streak: <b id="st-streak">0</b></span>
  </div>
</div>

<div id="scene">
  <!-- Mặt trời (req #116: lấp khoảng trời trống) -->
  <svg class="sun" style="position:absolute; top:5%; right:6vw; pointer-events:none;" width="110" height="110" viewBox="0 0 110 110">
    <circle cx="55" cy="55" r="42" fill="#ffe08a" opacity=".35"/>
    <circle cx="55" cy="55" r="30" fill="#ffd24a"/>
    <circle cx="55" cy="55" r="24" fill="#ffe37a"/>
  </svg>
  <!-- Mây -->
  <svg class="cloud c1" style="top:8%; left:5vw;" width="120" height="50" viewBox="0 0 120 50">
    <ellipse cx="30" cy="30" rx="22" ry="16" fill="#fff"/>
    <ellipse cx="55" cy="22" rx="26" ry="20" fill="#fff"/>
    <ellipse cx="85" cy="32" rx="22" ry="16" fill="#fff"/>
  </svg>
  <svg class="cloud c2" style="top:18%; left:35vw;" width="160" height="60" viewBox="0 0 160 60">
    <ellipse cx="40" cy="36" rx="28" ry="20" fill="#fff"/>
    <ellipse cx="80" cy="26" rx="34" ry="24" fill="#fff"/>
    <ellipse cx="120" cy="38" rx="28" ry="20" fill="#fff"/>
  </svg>
  <svg class="cloud c3" style="top:6%; left:60vw;" width="100" height="44" viewBox="0 0 100 44">
    <ellipse cx="26" cy="26" rx="18" ry="14" fill="#fff"/>
    <ellipse cx="50" cy="20" rx="22" ry="17" fill="#fff"/>
    <ellipse cx="74" cy="28" rx="18" ry="14" fill="#fff"/>
  </svg>

  <div class="ground"></div>

  <!-- Cây vẽ động -->
  <svg id="tree" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMax meet"></svg>
</div>

<div id="empty">
  <div class="ic">🌱</div>
  <h3>Cây em chưa có lá nào!</h3>
  <p>Hãy hoàn thành các tuần học trong "Không gian học" để gieo những chiếc lá đầu tiên lên Cây Tri Thức nhé.</p>
  <a href="/space.html">🌳 Đến không gian học</a>
</div>

<div id="legend">
  <h4>🍃 Các nhánh môn học</h4>
  <div id="legend-rows"></div>
</div>

<div id="filter">
  <button class="on" data-grade="">Tất cả</button>
  <button data-grade="N">Mầm</button>
  <button data-grade="P1">Lớp 1</button>
  <button data-grade="P2">Lớp 2</button>
  <button data-grade="P3">Lớp 3</button>
  <button data-grade="P4">Lớp 4</button>
  <button data-grade="P5">Lớp 5</button>
  <button data-grade="P6">Lớp 6</button>
</div>

<div id="tip"></div>
<div id="toast"></div>

<script type="module">
// ============================================================
// Cây Tri Thức — visualize completed scenario weeks as a tree.
// Mỗi tuần hoàn thành = 1 chiếc lá. Hoàn thành 3 sao = 1 quả chín.
// Dữ liệu lấy từ /api/scenario-runs và /api/wallet.
// Nếu chưa đăng nhập → đọc localStorage backup (offline-friendly).
// ============================================================

// ── Bản đồ subject prefix → màu lá + nhãn ──────────────────────
const BRANCHES = [
  { key:'toan',       label:'Toán',         color:'#3b82f6', emoji:'➕', prefixes:['P1-w','P2-w','P3-w','P4-w','P5-w','P6-w'] },
  { key:'tieng-viet', label:'Tiếng Việt',   color:'#10b981', emoji:'📖', prefixes:['P1TV','P2TV','P3TV','P4TV','P5TV','P6NV'] },
  { key:'tieng-anh',  label:'Tiếng Anh',    color:'#f59e0b', emoji:'🌍', prefixes:['P1TA','P2TA','P3TA','P4TA','P5TA','P6TA'] },
  { key:'tnxh',       label:'TN-XH / KHTN', color:'#06b6d4', emoji:'🔬', prefixes:['P1TNXH','P2TNXH','P3TNXH','P4TNXH','P5TNXH','P6KHTN','P6LSDL','P6GDDP'] },
  { key:'dao-duc',    label:'Đạo đức/GDCD', color:'#ec4899', emoji:'💝', prefixes:['P1DD','P2DD','P3DD','P4DD','P5DD','P6GDCD'] },
  { key:'am-nhac',    label:'Âm nhạc',      color:'#a855f7', emoji:'🎵', prefixes:['P1AN','P2AN','P3AN','P4AN','P5AN','P6AN'] },
  { key:'my-thuat',   label:'Mỹ thuật',     color:'#ef4444', emoji:'🎨', prefixes:['P1MT','P2MT','P3MT','P4MT','P5MT','P6MT'] },
  { key:'gdtc',       label:'Thể chất',     color:'#84cc16', emoji:'🏃', prefixes:['P1GDTC','P2GDTC','P3GDTC','P4GDTC','P5GDTC','P6GDTC'] },
  { key:'hdtn',       label:'HĐ Trải nghiệm',color:'#fb923c',emoji:'🌟', prefixes:['P1HDTN','P2HDTN','P3HDTN','P4HDTN','P5HDTN','P6HDTN'] },
  { key:'mam-non',    label:'Mầm non',      color:'#fbbf24', emoji:'🧸', prefixes:['N1','N2','N3'] },
];

const detectBranch = (familyId) => {
  for (const b of BRANCHES) {
    if (b.prefixes.some(p => familyId.startsWith(p))) return b;
  }
  return BRANCHES.find(b => b.key === 'tieng-anh'); // fallback
};

const detectGrade = (familyId) => {
  if (familyId.startsWith('N')) return 'N';
  const m = familyId.match(/^P(\d)/);
  return m ? 'P' + m[1] : '';
};

// ── State ──────────────────────────────────────────────────────
let runs = {};        // { familyId: { runs, bestStars, bestScore, lastTs } }
let wallet = { xp:0, coin:0, streak:0 };
let activeGrade = '';

// ── Load data ──────────────────────────────────────────────────
async function loadAll() {
  // Wallet
  try {
    const r = await fetch('/api/wallet', { credentials:'include' });
    if (r.ok) wallet = (await r.json()) || wallet;
  } catch {}
  if (!wallet?.xp) {
    try { wallet = JSON.parse(localStorage.getItem('tizia.wallet') || '{}'); } catch {}
  }

  // Scenario runs
  try {
    const r = await fetch('/api/scenario-runs', { credentials:'include' });
    if (r.ok) runs = (await r.json()) || {};
  } catch {}
  if (!runs || !Object.keys(runs).length) {
    try { runs = JSON.parse(localStorage.getItem('tizia.scenarioRuns') || '{}'); } catch {}
  }
}

// ── Render cây ────────────────────────────────────────────────
function render() {
  const svg = document.getElementById('tree');
  const filtered = Object.entries(runs).filter(([fid]) => !activeGrade || detectGrade(fid) === activeGrade);

  // Group by branch
  const byBranch = new Map(BRANCHES.map(b => [b.key, []]));
  for (const [fid, info] of filtered) {
    const b = detectBranch(fid);
    byBranch.get(b.key).push({ fid, info, branch:b });
  }

  // Stats
  let totalLeaves = 0, totalFruits = 0;
  for (const arr of byBranch.values()) {
    for (const it of arr) {
      totalLeaves++;
      if ((it.info.bestStars|0) >= 3) totalFruits++;
    }
  }
  document.getElementById('st-leaves').textContent = totalLeaves;
  document.getElementById('st-fruits').textContent = totalFruits;
  document.getElementById('st-xp').textContent = (wallet.xp|0).toLocaleString('vi-VN');
  document.getElementById('st-streak').textContent = (wallet.streak|0);

  // Empty state
  document.getElementById('empty').classList.toggle('show', totalLeaves === 0);

  // Vẽ trunk + nhánh
  const W = 1000, H = 720;
  const cx = W/2, baseY = H - 30;
  let s = '';

  // Trunk (cong nhẹ)
  s += `<path class="trunk" d="M ${cx-28} ${baseY} Q ${cx-22} ${baseY-180} ${cx-20} ${baseY-340} L ${cx+20} ${baseY-340} Q ${cx+22} ${baseY-180} ${cx+28} ${baseY} Z" />`;
  s += `<path class="trunk-dark" d="M ${cx-20} ${baseY-340} Q ${cx-10} ${baseY-360} ${cx} ${baseY-365} Q ${cx+10} ${baseY-360} ${cx+20} ${baseY-340}" opacity=".45" />`;
  // Vân thân
  for (let i = 0; i < 5; i++) {
    const y = baseY - 60 - i * 50;
    s += `<path d="M ${cx-22 + i*2} ${y} Q ${cx} ${y - 8} ${cx + 22 - i*2} ${y}" stroke="${'#4a2710'}" stroke-width="1.5" fill="none" opacity=".35"/>`;
  }

  // Tán lá xanh rậm rạp (req #116 Enderboy): khối lá lớn thống nhất phía SAU các nhánh
  // để cây trông giống cây thật, thay vì thân trơ + chùm chấm rời. Lá/quả (tiến độ môn)
  // vẽ ĐÈ LÊN tán này nên vẫn hiện rõ như quả trên cây.
  const crownCx = cx, crownCy = (baseY - 350) - 55;
  const canopyBlobs = [
    // lớp sau (xanh đậm, tạo khối)
    {x:0,y:24,r:158,c:'#3d8a41',o:.95},{x:-176,y:64,r:116,c:'#3d8a41',o:.95},{x:176,y:64,r:116,c:'#3d8a41',o:.95},
    {x:-96,y:-74,r:110,c:'#43944a',o:.95},{x:96,y:-74,r:110,c:'#43944a',o:.95},{x:0,y:-116,r:100,c:'#43944a',o:.95},
    {x:-238,y:-4,r:84,c:'#3d8a41',o:.92},{x:238,y:-4,r:84,c:'#3d8a41',o:.92},
    // lớp trước (xanh sáng + highlight nắng)
    {x:-64,y:12,r:98,c:'#5fb85a',o:.96},{x:74,y:2,r:104,c:'#5fb85a',o:.96},{x:0,y:-44,r:94,c:'#6cc665',o:.96},
    {x:-156,y:22,r:74,c:'#5fb85a',o:.94},{x:156,y:22,r:74,c:'#5fb85a',o:.94},{x:-34,y:-96,r:68,c:'#6cc665',o:.92},
    {x:120,y:-56,r:66,c:'#6cc665',o:.9},{x:-120,y:-52,r:62,c:'#6cc665',o:.9},
  ];
  s += '<g class="canopy">' + canopyBlobs.map(b =>
    `<circle cx="${crownCx+b.x}" cy="${crownCy+b.y}" r="${b.r}" fill="${b.c}" opacity="${b.o}"/>`).join('') +
    // vài mảng sáng lốm đốm cho chiều sâu
    `<circle cx="${crownCx-50}" cy="${crownCy-30}" r="30" fill="#7fd177" opacity=".5"/>` +
    `<circle cx="${crownCx+90}" cy="${crownCy+30}" r="26" fill="#7fd177" opacity=".45"/>` +
    '</g>';

  // Nhánh — phân bố 10 nhánh tỏa hình quạt từ đỉnh thân
  const branchAngles = [
    {ang:-72, len:200, key:'mam-non'},
    {ang:-55, len:230, key:'toan'},
    {ang:-38, len:255, key:'tieng-viet'},
    {ang:-22, len:240, key:'tieng-anh'},
    {ang:-8,  len:225, key:'tnxh'},
    {ang:8,   len:225, key:'dao-duc'},
    {ang:22,  len:240, key:'am-nhac'},
    {ang:38,  len:255, key:'my-thuat'},
    {ang:55,  len:230, key:'gdtc'},
    {ang:72,  len:200, key:'hdtn'},
  ];

  const branchEnds = new Map();
  const topX = cx, topY = baseY - 350;
  for (const br of branchAngles) {
    const rad = br.ang * Math.PI / 180;
    const ex = topX + Math.sin(rad) * br.len;
    const ey = topY - Math.cos(rad) * br.len * 0.85;
    const midX = topX + Math.sin(rad) * br.len * 0.5;
    const midY = topY - Math.cos(rad) * br.len * 0.6;
    const w = 14 - Math.min(8, Math.abs(br.ang)/12);
    s += `<path class="branch" stroke-width="${w}" d="M ${topX} ${topY} Q ${midX} ${midY} ${ex} ${ey}" />`;
    branchEnds.set(br.key, { ex, ey, ang: br.ang, len: br.len });

    // Vẽ "vầng lá" pastel mờ nền sau lá thật (làm cây xanh hơn)
    const br_info = BRANCHES.find(b => b.key === br.key);
    if (br_info) {
      s += `<ellipse cx="${ex}" cy="${ey}" rx="74" ry="64" fill="${br_info.color}" opacity=".18"/>`;
    }
  }

  // Vẽ lá cho từng nhánh
  for (const br of branchAngles) {
    const arr = byBranch.get(br.key) || [];
    const branch = BRANCHES.find(b => b.key === br.key);
    const { ex, ey } = branchEnds.get(br.key);

    // Tối đa 24 lá / nhánh; xếp xoắn ốc quanh điểm cuối nhánh
    const count = Math.min(arr.length, 24);
    for (let i = 0; i < count; i++) {
      const item = arr[i];
      // Spiral layout
      const golden = Math.PI * (3 - Math.sqrt(5));
      const r = 12 + Math.sqrt(i) * 13;
      const t = i * golden;
      const lx = ex + Math.cos(t) * r;
      const ly = ey + Math.sin(t) * r * 0.85;
      const stars = item.info.bestStars | 0;
      const isFruit = stars >= 3;

      if (isFruit) {
        // Quả tròn
        s += `<g class="fruit leaf" data-fid="${item.fid}" data-info='${JSON.stringify({
          subject: branch.label, stars, score: item.info.bestScore|0, runs: item.info.runs|0
        })}'>
          <circle cx="${lx}" cy="${ly}" r="11" fill="${branch.color}" stroke="#fff" stroke-width="2"/>
          <circle cx="${lx-3}" cy="${ly-3}" r="3" fill="#fff" opacity=".55"/>
        </g>`;
      } else {
        // Lá hình giọt
        const ang = (t * 180 / Math.PI) % 360;
        s += `<g class="leaf" data-fid="${item.fid}" data-info='${JSON.stringify({
          subject: branch.label, stars, score: item.info.bestScore|0, runs: item.info.runs|0
        })}' transform="translate(${lx},${ly}) rotate(${ang})">
          <ellipse cx="0" cy="0" rx="6.5" ry="11" fill="${branch.color}" stroke="#fff" stroke-width="1.5"/>
          <path d="M 0 -10 Q 2 0 0 10" stroke="${branch.color}" stroke-width="1" fill="none" opacity=".5"/>
        </g>`;
      }
    }

    // Số lá còn lại (badge khi >24)
    if (arr.length > 24) {
      s += `<g transform="translate(${ex},${ey + 60})">
        <rect x="-22" y="-12" width="44" height="22" rx="11" fill="${branch.color}"/>
        <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">+${arr.length - 24}</text>
      </g>`;
    }
  }

  // Bụi cây + hoa quanh gốc (req #116: "xung quanh đỡ trống vắng hơn"). Vẽ CUỐI để
  // nằm trước thân, tạo lớp tiền cảnh cho đỡ trống.
  const bush = (bx, scale, c1, c2) => {
    const y = baseY - 6;
    return `<g transform="translate(${bx},${y}) scale(${scale})">
      <ellipse cx="0" cy="0" rx="70" ry="34" fill="${c1}"/>
      <circle cx="-40" cy="-14" r="30" fill="${c1}"/><circle cx="40" cy="-14" r="30" fill="${c1}"/>
      <circle cx="0" cy="-30" r="34" fill="${c2}"/><circle cx="-18" cy="-16" r="24" fill="${c2}"/><circle cx="22" cy="-14" r="22" fill="${c2}"/>
    </g>`;
  };
  const flower = (fx, fy, col) => `<g transform="translate(${fx},${fy})">
    ${[0,72,144,216,288].map(a=>`<ellipse cx="${Math.cos(a*Math.PI/180)*7}" cy="${Math.sin(a*Math.PI/180)*7}" rx="5" ry="3.4" fill="${col}" transform="rotate(${a})"/>`).join('')}
    <circle cx="0" cy="0" r="4" fill="#ffd54a"/></g>`;
  let ground = '<g class="ground-decor">';
  ground += bush(cx-250, 1.15, '#4e9048', '#6cc665');
  ground += bush(cx+265, 1.3, '#478a42', '#63bd5c');
  ground += bush(cx-95, 0.8, '#4e9048', '#6cc665');
  ground += bush(cx+120, 0.9, '#478a42', '#63bd5c');
  // hoa rải trên cỏ
  const flowerCols = ['#ff6b9d','#ffd54a','#c77dff','#ff8f5a','#6ec6ff'];
  for (let i = 0; i < 9; i++) {
    const fx = 70 + i * 105 + (i % 2 ? 30 : 0);
    const fy = baseY + 6 + (i % 3) * 8;
    ground += flower(fx, fy, flowerCols[i % flowerCols.length]);
  }
  ground += '</g>';
  s += ground;

  svg.innerHTML = s;

  // Render legend
  const lg = document.getElementById('legend-rows');
  lg.innerHTML = BRANCHES.map(b => {
    const cnt = (byBranch.get(b.key) || []).length;
    return `<div class="row" data-branch="${b.key}">
      <span class="dot" style="background:${b.color}"></span>
      <span>${b.emoji} ${b.label}</span>
      <span class="ct">${cnt}</span>
    </div>`;
  }).join('');

  // Hover lá / quả
  for (const el of svg.querySelectorAll('.leaf')) {
    el.addEventListener('mouseenter', e => showTip(e, el));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', () => {
      const fid = el.dataset.fid;
      // module.html đọc param tên `module=` (không phải `id=`); thêm domain= để load
      // đúng catalog (N* = preschool, P* = primary, S* = secondary, H* = highschool).
      const dom = fid.startsWith('N') ? 'preschool'
                : fid.startsWith('P') ? 'primary'
                : fid.startsWith('S') ? 'secondary'
                : fid.startsWith('H') ? 'highschool'
                : '';
      const qs = `module=${encodeURIComponent(fid)}${dom ? '&domain=' + dom : ''}`;
      window.location.href = `/module.html?${qs}`;
    });
  }
}

// ── Tooltip ──────────────────────────────────────────────────
const tip = document.getElementById('tip');
function showTip(ev, el) {
  let info;
  try { info = JSON.parse(el.dataset.info); } catch { info = {}; }
  const fid = el.dataset.fid;
  const stars = '⭐'.repeat(info.stars||0) + '☆'.repeat(3 - (info.stars||0));
  tip.innerHTML = `<b>${info.subject || ''}</b>${fid}<br>${stars} · ${info.score||0} điểm · ${info.runs||0} lượt`;
  const r = el.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2) + 'px';
  tip.style.top  = r.top + 'px';
  tip.classList.add('show');
}
function hideTip() { tip.classList.remove('show'); }

// ── Filter grade ─────────────────────────────────────────────
for (const btn of document.querySelectorAll('#filter button')) {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#filter button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    activeGrade = btn.dataset.grade || '';
    render();
  });
}

// ── Toast khi đạt mốc ─────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Boot ─────────────────────────────────────────────────────
(async () => {
  await loadAll();
  render();
  const total = Object.keys(runs).length;
  if (total >= 100) toast(`🎉 Tuyệt vời! Cây em đã có ${total} chiếc lá!`);
  else if (total >= 50) toast(`🌳 ${total} lá rồi — cây xum xuê quá!`);
  else if (total >= 10) toast(`🌱 ${total} lá — cây đang lớn dần!`);
})();
</script>
