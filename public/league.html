<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🏆 League tuần · Tizia</title>
<meta name="description" content="Bảng xếp hạng tuần Tizia — Đồng → Kim cương. Top 5 lên hạng, bottom 5 xuống hạng vào Chủ nhật 23:59 hằng tuần." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a; --card-2:#1d2547;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--text);
    background: radial-gradient(1000px 600px at 20% 0%, rgba(251,191,36,.10), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(167,139,250,.10), transparent 70%),
                var(--bg);
  }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }
  .wrap { max-width:none; margin:0 auto; padding:24px 18px 80px; }

  .hero { background:linear-gradient(135deg, rgba(251,191,36,.18), rgba(167,139,250,.10));
    border:1px solid rgba(251,191,36,.35); border-radius:18px;
    padding:24px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .hero .badge { width:96px; height:96px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:48px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .hero .info { flex:1; min-width:200px; }
  .hero .tier-label { font-size:13px; color:var(--text-soft); font-weight:700; letter-spacing:1.2px; text-transform:uppercase; }
  .hero .tier-name { font-size:26px; font-weight:800; margin:4px 0; }
  .hero .meta { font-size:13.5px; color:var(--text-soft); }
  .hero .meta b { color:var(--accent); }

  .tier-strip { display:flex; gap:6px; margin:20px 0 8px; overflow-x:auto; }
  .tier-strip .t { flex:0 0 auto; padding:8px 12px; border-radius:12px;
    background:rgba(255,255,255,.04); border:1px solid var(--border);
    font-size:12px; opacity:.55; transition:opacity .15s; }
  .tier-strip .t.cur { opacity:1; border-color:var(--accent);
    background:rgba(251,191,36,.12); font-weight:700; }
  .tier-strip .t span.ic { font-size:16px; margin-right:6px; }

  .legend { font-size:12.5px; color:var(--text-soft); margin:14px 0 18px; }
  .legend b { color:var(--good); }
  .legend .danger { color:var(--bad); }

  .board { background:var(--card); border:1px solid var(--border); border-radius:14px;
    overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-top:1px solid rgba(255,255,255,.04); font-size:14px; }
  .row:first-child { border-top:none; }
  .row.me { background:linear-gradient(90deg, rgba(251,191,36,.18), transparent);
    border-left:3px solid var(--accent); padding-left:13px; }
  .row.promote { background:rgba(34,197,94,.06); }
  .row.relegate { background:rgba(239,68,68,.06); }
  .rank { width:34px; font-weight:800; font-size:16px; color:var(--text-soft); }
  .rank.top1 { color:#fbbf24; }
  .rank.top2 { color:#c0c0c0; }
  .rank.top3 { color:#cd7f32; }
  .name { flex:1; }
  .name b { font-weight:700; }
  .name .role { font-size:11px; color:var(--text-soft); margin-left:6px; }
  .xp { font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .xp .sfx { font-size:11px; opacity:.6; font-weight:500; margin-left:3px; }

  .zone-divider { display:flex; align-items:center; gap:10px; padding:8px 16px;
    background:rgba(255,255,255,.02); font-size:12px; color:var(--text-soft);
    border-top:1px dashed var(--border); border-bottom:1px dashed var(--border); }
  .zone-divider .ic { font-size:14px; }
  .zone-divider.promote { color:var(--good); }
  .zone-divider.relegate { color:var(--bad); }

  .loading { text-align:center; padding:60px 20px; color:var(--text-soft); }

  @media (max-width:520px) {
    .hero .badge { width:72px; height:72px; font-size:36px; }
    .hero .tier-name { font-size:22px; }
  }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>🏆 League tuần</h1>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Đang tải bảng xếp hạng…</div>
</div>

<script type="module">
const TIER_ORDER = ['bronze', 'silver', 'gold', 'sapphire', 'ruby', 'diamond'];

async function load() {
  const wrap = document.getElementById('wrap');
  try {
    const res = await fetch('/api/league/me', { credentials: 'same-origin' });
    if (res.status === 401) {
      wrap.innerHTML = `<div style="text-align:center;padding:40px"><p>Hãy đăng nhập để xem league.</p><a class="back" href="/login.html">Đăng nhập →</a></div>`;
      return;
    }
    if (!res.ok) throw new Error('http_' + res.status);
    const data = await res.json();
    render(data);
  } catch (e) {
    wrap.innerHTML = `<p style="color:var(--bad)">Lỗi tải bảng xếp hạng: ${e.message}</p>`;
  }
}

function render(d) {
  const meta = d.tier_meta;
  const tierIdx = TIER_ORDER.indexOf(d.tier);
  const tierStrip = TIER_ORDER.map((t, i) => `
    <div class="t ${t === d.tier ? 'cur' : ''}">
      <span class="ic">${({bronze:'🥉',silver:'🥈',gold:'🥇',sapphire:'💎',ruby:'🔴',diamond:'💠'})[t]}</span>
      ${({bronze:'Đồng',silver:'Bạc',gold:'Vàng',sapphire:'Lam',ruby:'Hồng',diamond:'KC'})[t]}
    </div>
  `).join('');

  // Render board với zone-divider sau rank 5 và trước rank N-4
  const board = d.board;
  let rows = '';
  board.forEach((r, i) => {
    const rank = r.rank;
    const isMe = r.is_me ? 'me' : '';
    const zone = rank <= 5 ? 'promote' : (board.length >= 20 && rank > board.length - 5 ? 'relegate' : '');
    const rankIco = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    rows += `
      <div class="row ${isMe} ${zone}">
        <span class="rank ${rankIco}">${rank}</span>
        <span class="name"><b>${esc(r.display_name || 'Vô danh')}</b><span class="role">${roleLabel(r.role)}</span></span>
        <span class="xp">${r.week_xp}<span class="sfx">XP</span></span>
      </div>
    `;
    // Insert dividers
    if (rank === 5 && board.length > 5) {
      rows += `<div class="zone-divider promote"><span class="ic">⬆️</span> Vùng thăng hạng — Top 5 → ${TIER_ORDER[Math.min(5, tierIdx+1)] ? capit(meta.label) + ' kế cao hơn' : 'giữ hạng cao nhất'}</div>`;
    }
    if (board.length >= 20 && rank === board.length - 5) {
      rows += `<div class="zone-divider relegate"><span class="ic">⬇️</span> Vùng xuống hạng — 5 cuối tụt 1 tier</div>`;
    }
  });

  document.getElementById('wrap').innerHTML = `
    <div class="hero">
      <div class="badge" style="background: radial-gradient(circle at 30% 30%, ${meta.color}aa, ${meta.color}33)">${meta.icon}</div>
      <div class="info">
        <div class="tier-label">Tier hiện tại</div>
        <div class="tier-name" style="color:${meta.color}">${meta.label}</div>
        <div class="meta">Tuần ${esc(d.season.week_start)} · XP tuần: <b>${d.week_xp}</b> · Hạng <b>${d.my_rank ?? '-'}/${board.length}</b></div>
      </div>
    </div>
    <div class="tier-strip">${tierStrip}</div>
    <div class="legend">
      <b>Top 5</b> cuối Chủ nhật → lên tier kế tiếp. <span class="danger">Bottom 5</span> (nếu nhóm ≥20 người) tụt 1 tier.
      Mỗi câu quiz đúng = 5 XP. Mỗi bài Codelab accepted = 5–20 XP. Claim quest = XP của quest.
    </div>
    <div class="board">${rows || '<div class="loading">Nhóm chưa có ai khác — quay lại sau.</div>'}</div>
  `;
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function roleLabel(r) { return ({pupil:'🎒HS', student:'🎓SV', teacher:'👨‍🏫GV', admin:'👑Admin'}[r] || ''); }
function capit(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

load();
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/onboarding-60s.js?v=2026-06-08-r8"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-10-tl1"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
