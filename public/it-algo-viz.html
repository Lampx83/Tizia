<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🌳 Trực quan giải thuật · Trường CNTT · Tizia</title>
<style>
  :root { --bg-1:#0b1220; --bg-2:#0f1830; --accent:#4ade80; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.12);
    --base:#64748b; --cmp:#fbbf24; --swap:#ef4444; --write:#22d3ee; --pivot:#a78bfa; --sorted:#4ade80; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Inter',system-ui,sans-serif; color:#e5edf7;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(74,222,128,.14), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2)); }
  .top { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.2); position:sticky; top:0; z-index:5; }
  .back { color:#fff; text-decoration:none; opacity:.85; font-size:13.5px; background:rgba(255,255,255,.08); padding:7px 12px; border-radius:9px; }
  .back:hover { opacity:1; background:rgba(255,255,255,.16); }
  .top h1 { margin:0; font-size:17px; font-weight:800; }
  .top .sub { font-size:12.5px; opacity:.6; font-weight:500; }
  .top .prog { margin-left:auto; font-size:13px; font-weight:700; background:rgba(74,222,128,.15); border:1px solid rgba(74,222,128,.4); color:#86efac; padding:6px 12px; border-radius:20px; }
  .wrap { max-width:none; margin:0 auto; padding:16px 18px 40px; }
  .algos { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .algos button { background:rgba(255,255,255,.06); border:1px solid var(--border); color:#cbd5e1; font-size:13px; font-weight:600;
    padding:8px 13px; border-radius:10px; cursor:pointer; font-family:inherit; }
  .algos button:hover { background:rgba(255,255,255,.12); }
  .algos button.active { background:rgba(74,222,128,.16); border-color:rgba(74,222,128,.5); color:#bbf7d0; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .meta { display:flex; flex-wrap:wrap; gap:18px; align-items:baseline; margin-bottom:6px; }
  .meta .nm { font-size:16px; font-weight:800; }
  .meta .big { font-size:12.5px; color:#fcd34d; font-family:ui-monospace,monospace; }
  .meta .stable { font-size:11px; padding:2px 8px; border-radius:7px; }
  .meta .stable.y { background:rgba(34,197,94,.18); color:#86efac; } .meta .stable.n { background:rgba(239,68,68,.16); color:#fca5a5; }
  .note { font-size:13px; opacity:.82; line-height:1.5; margin:2px 0 10px; }
  canvas { width:100%; height:300px; display:block; background:#070b16; border-radius:11px; border:1px solid var(--border); }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin:10px 2px 0; font-size:12px; opacity:.85; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:13px; }
  .btn { border:none; border-radius:10px; font-weight:800; font-size:13.5px; padding:10px 16px; cursor:pointer; font-family:inherit; }
  .btn.play { background:var(--accent); color:#04210f; } .btn.play:hover{ filter:brightness(1.08); }
  .btn.ghost { background:rgba(255,255,255,.08); color:#fff; } .btn.ghost:hover{ background:rgba(255,255,255,.16); }
  .ctl-grp { display:flex; align-items:center; gap:8px; font-size:12.5px; opacity:.85; }
  .ctl-grp input[type=range]{ width:120px; accent-color:var(--accent); }
  .stats { display:flex; gap:20px; margin-top:12px; font-size:13px; }
  .stats b { font-size:18px; color:#fff; display:block; font-variant-numeric:tabular-nums; }
  .stats span { opacity:.6; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; }
  .reinforce { margin-top:18px; }
  .reinforce h2 { font-size:14px; margin:0 0 10px; }
  .q { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .q .qt { font-size:13.5px; font-weight:700; margin-bottom:8px; }
  .q .opt { display:block; width:100%; text-align:left; background:rgba(255,255,255,.04); border:1px solid var(--border); color:#e5edf7;
    padding:8px 11px; border-radius:9px; margin:5px 0; font-size:13px; cursor:pointer; font-family:inherit; }
  .q .opt:hover { background:rgba(255,255,255,.09); }
  .q .opt.ok { background:rgba(34,197,94,.2); border-color:#22c55e; } .q .opt.no { background:rgba(239,68,68,.18); border-color:#ef4444; }
  .q .fb { font-size:12.5px; margin-top:7px; opacity:0; transition:.25s; color:#bbf7d0; }
  .q .fb.show { opacity:.95; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#22c55e; color:#04210f; font-weight:800;
    padding:12px 22px; border-radius:13px; box-shadow:0 12px 30px rgba(0,0,0,.4); opacity:0; transition:.3s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="top">
  <a class="back" id="back" href="/school.html?domain=it#campus-hero">← Khuôn viên trường</a>
  <div><h1>🌳 Trực quan giải thuật <span class="sub">— xem từng bước so sánh &amp; hoán đổi</span></h1></div>
  <div class="prog" id="prog">0/3 củng cố</div>
</div>
<div class="wrap">
  <div class="algos" id="algos"></div>
  <div class="panel">
    <div class="meta">
      <span class="nm" id="algoName">—</span>
      <span class="big" id="algoBig">—</span>
      <span class="stable" id="algoStable">—</span>
    </div>
    <div class="note" id="algoNote">—</div>
    <canvas id="c" width="1040" height="300"></canvas>
    <div class="legend">
      <span><i style="background:var(--base)"></i>chưa xét</span>
      <span><i style="background:var(--cmp)"></i>đang so sánh</span>
      <span><i style="background:var(--swap)"></i>hoán đổi</span>
      <span><i style="background:var(--write)"></i>ghi đè (merge)</span>
      <span><i style="background:var(--pivot)"></i>chốt (pivot)</span>
      <span><i style="background:var(--sorted)"></i>đã đúng vị trí</span>
    </div>
    <div class="controls">
      <button class="btn play" id="playBtn">▶ Chạy</button>
      <button class="btn ghost" id="stepBtn">⏭ Bước</button>
      <button class="btn ghost" id="shuffleBtn">🔀 Trộn lại</button>
      <span class="ctl-grp">Tốc độ <input type="range" id="speed" min="1" max="100" value="45"></span>
      <span class="ctl-grp">Số phần tử <input type="range" id="size" min="8" max="60" value="32"></span>
    </div>
    <div class="stats">
      <div><b id="cmpN">0</b><span>so sánh</span></div>
      <div><b id="moveN">0</b><span>hoán đổi / ghi</span></div>
      <div><b id="statusT">Sẵn sàng</b><span>trạng thái</span></div>
    </div>
  </div>

  <div class="reinforce">
    <h2>💡 Củng cố kiến thức</h2>
    <div id="quizHost"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const domain = new URLSearchParams(location.search).get('domain') || 'it';
$('back').href = '/school.html?domain=' + encodeURIComponent(domain) + '#campus-hero';

const ALGOS = {
  bubble:    { name:'Sắp xếp nổi bọt (Bubble sort)',  big:'Tốt nhất O(n) · TB/Xấu O(n²)', stable:true,
    note:'So sánh từng cặp kề nhau và đẩy phần tử lớn "nổi" dần về cuối sau mỗi vòng.' },
  selection: { name:'Sắp xếp chọn (Selection sort)',  big:'O(n²) mọi trường hợp', stable:false,
    note:'Mỗi vòng tìm phần tử nhỏ nhất trong phần còn lại rồi đưa về đầu — ít hoán đổi nhưng luôn O(n²) so sánh.' },
  insertion: { name:'Sắp xếp chèn (Insertion sort)',  big:'Tốt nhất O(n) · TB/Xấu O(n²)', stable:true,
    note:'Chèn dần từng phần tử vào đúng chỗ trong đoạn đã sắp xếp bên trái — rất nhanh với dữ liệu gần như đã sắp.' },
  merge:     { name:'Sắp xếp trộn (Merge sort)',      big:'O(n log n) mọi trường hợp · tốn O(n) bộ nhớ', stable:true,
    note:'Chia đôi đệ quy đến đoạn 1 phần tử rồi trộn (merge) hai nửa đã sắp xếp lại với nhau.' },
  quick:     { name:'Sắp xếp nhanh (Quick sort)',     big:'TB O(n log n) · Xấu nhất O(n²)', stable:false,
    note:'Chọn một phần tử làm chốt (pivot), phân hoạch nhỏ–lớn quanh chốt rồi đệ quy hai bên.' },
};

// ── sinh "vết" thao tác để phát lại từng bước ──
function genTrace(algo, src){
  const a = src.slice(), ops = [];
  const cmp  = (i,j) => ops.push(['cmp', i, j]);
  const swap = (i,j) => { const t=a[i]; a[i]=a[j]; a[j]=t; ops.push(['swap', i, j]); };
  const set  = (i,v) => { a[i]=v; ops.push(['set', i, v]); };
  const sortd= i => ops.push(['sorted', i]);
  const n = a.length;
  if (algo === 'bubble') {
    for (let i=0;i<n;i++){ for(let j=0;j<n-1-i;j++){ cmp(j,j+1); if(a[j]>a[j+1]) swap(j,j+1); } sortd(n-1-i); }
  } else if (algo === 'selection') {
    for (let i=0;i<n;i++){ let m=i; for(let j=i+1;j<n;j++){ cmp(m,j); if(a[j]<a[m]) m=j; } if(m!==i) swap(i,m); sortd(i); }
  } else if (algo === 'insertion') {
    sortd(0);
    for (let i=1;i<n;i++){ let j=i; while(j>0){ cmp(j-1,j); if(a[j-1]>a[j]){ swap(j-1,j); j--; } else break; } }
    for (let k=0;k<n;k++) sortd(k);
  } else if (algo === 'merge') {
    const ms = (lo,hi) => {
      if (hi-lo <= 1) return;
      const mid=(lo+hi)>>1; ms(lo,mid); ms(mid,hi);
      const L=a.slice(lo,mid), R=a.slice(mid,hi); let i=0,j=0,k=lo;
      while (i<L.length && j<R.length){ cmp(lo+i, mid+j); if(L[i]<=R[j]){ set(k,L[i]); i++; } else { set(k,R[j]); j++; } k++; }
      while (i<L.length){ set(k,L[i]); i++; k++; }
      while (j<R.length){ set(k,R[j]); j++; k++; }
    };
    ms(0,n); for (let k=0;k<n;k++) sortd(k);
  } else if (algo === 'quick') {
    const qs = (lo,hi) => {
      if (lo>=hi){ if(lo===hi) sortd(lo); return; }
      const pivot=a[hi]; ops.push(['pivot',hi]); let i=lo;
      for (let j=lo;j<hi;j++){ cmp(j,hi); if(a[j]<pivot){ if(i!==j) swap(i,j); i++; } }
      if (i!==hi) swap(i,hi); sortd(i);
      qs(lo,i-1); qs(i+1,hi);
    };
    qs(0,n-1);
  }
  return ops;
}

// ── trạng thái ──
let arr=[], trace=[], ptr=0, playing=false, raf=0, acc=0, last=0;
let cmpCount=0, moveCount=0, sortedSet=new Set(), pivotIdx=-1, hi={}, curAlgo='bubble';
const cv=$('c'), ctx=cv.getContext('2d');

function rng(n){ const a=[]; for(let i=0;i<n;i++) a.push(8+Math.floor(Math.random()*100)); return a; }

function rebuild(newArr){
  stop();
  const n = +$('size').value;
  arr = newArr || rng(n);
  trace = genTrace(curAlgo, arr);
  ptr=0; cmpCount=0; moveCount=0; sortedSet=new Set(); pivotIdx=-1; hi={};
  $('cmpN').textContent=0; $('moveN').textContent=0; $('statusT').textContent='Sẵn sàng';
  draw();
}

function applyOp(op){
  hi={}; const t=op[0];
  if (t==='cmp'){ cmpCount++; hi={cmp:[op[1],op[2]]}; }
  else if (t==='swap'){ moveCount++; const x=op[1],y=op[2],tmp=arr[x]; arr[x]=arr[y]; arr[y]=tmp; hi={swap:[x,y]}; }
  else if (t==='set'){ moveCount++; arr[op[1]]=op[2]; hi={write:[op[1]]}; }
  else if (t==='sorted'){ sortedSet.add(op[1]); }
  else if (t==='pivot'){ pivotIdx=op[1]; hi={pivot:[op[1]]}; }
  $('cmpN').textContent=cmpCount; $('moveN').textContent=moveCount;
}

function step(){
  if (ptr>=trace.length){ finish(); return false; }
  applyOp(trace[ptr++]); draw();
  if (ptr>=trace.length) finish();
  return true;
}

function finish(){
  if (playing) stop();
  pivotIdx=-1; for(let i=0;i<arr.length;i++) sortedSet.add(i); hi={};
  $('statusT').textContent='Hoàn tất ✓'; draw();
}

function draw(){
  const W=cv.width, H=cv.height, n=arr.length, gap=n>40?1:2;
  const bw=(W-gap*(n+1))/n, maxV=Math.max(...arr,1);
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){
    const h=(arr[i]/maxV)*(H-20), x=gap+i*(bw+gap), y=H-h;
    let col=getComputedStyle(document.documentElement).getPropertyValue('--base');
    if (sortedSet.has(i)) col=getComputedStyle(document.documentElement).getPropertyValue('--sorted');
    if (pivotIdx===i) col=getComputedStyle(document.documentElement).getPropertyValue('--pivot');
    if (hi.cmp && hi.cmp.includes(i)) col=getComputedStyle(document.documentElement).getPropertyValue('--cmp');
    if (hi.write && hi.write.includes(i)) col=getComputedStyle(document.documentElement).getPropertyValue('--write');
    if (hi.swap && hi.swap.includes(i)) col=getComputedStyle(document.documentElement).getPropertyValue('--swap');
    ctx.fillStyle=col.trim(); ctx.fillRect(x,y,Math.max(bw,1),h);
  }
}

function loop(ts){
  if (!playing) return;
  if (!last) last=ts;
  const dt=ts-last; last=ts;
  const opsPerSec=Math.pow(+$('speed').value/100,1.6)*180+2;
  acc += dt/1000*opsPerSec;
  while (acc>=1 && playing){ acc-=1; if(!step()) break; }
  raf=requestAnimationFrame(loop);
}
function play(){ if(ptr>=trace.length) rebuild(arr.slice()); playing=true; last=0; acc=0; $('playBtn').textContent='⏸ Tạm dừng'; $('statusT').textContent='Đang chạy…'; raf=requestAnimationFrame(loop); }
function stop(){ playing=false; cancelAnimationFrame(raf); $('playBtn').textContent='▶ Chạy'; }

// ── nút ──
function renderAlgos(){
  $('algos').innerHTML = Object.keys(ALGOS).map(k=>`<button data-k="${k}" class="${k===curAlgo?'active':''}">${ALGOS[k].name.split('(')[0].trim()}</button>`).join('');
  $('algos').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectAlgo(b.dataset.k)));
}
function selectAlgo(k){
  curAlgo=k; const A=ALGOS[k];
  $('algoName').textContent=A.name; $('algoBig').textContent=A.big;
  $('algoStable').textContent=A.stable?'ổn định':'không ổn định';
  $('algoStable').className='stable '+(A.stable?'y':'n');
  $('algoNote').textContent=A.note;
  renderAlgos(); rebuild(arr.length?arr.slice():null);
}

$('playBtn').addEventListener('click',()=>{ playing?stop():play(); });
$('stepBtn').addEventListener('click',()=>{ stop(); step(); });
$('shuffleBtn').addEventListener('click',()=>rebuild(null));
$('size').addEventListener('input',()=>rebuild(null));

// ── củng cố (MCQ) ──
const QUIZ=[
  { q:'Thuật toán nào luôn đạt O(n log n) kể cả trường hợp xấu nhất?', o:['Merge sort','Quick sort','Bubble sort','Selection sort'], a:0,
    fb:'Merge sort luôn O(n log n) nhờ chia đôi đều, đổi lại tốn O(n) bộ nhớ phụ.' },
  { q:'Với mảng GẦN NHƯ đã sắp xếp, thuật toán nào nhanh nhất (tiến tới O(n))?', o:['Insertion sort','Selection sort','Quick sort','Merge sort'], a:0,
    fb:'Insertion sort chỉ cần vài phép so sánh khi dữ liệu gần đúng thứ tự ⇒ tiệm cận O(n).' },
  { q:'Vì sao nên TRÁNH Bubble/Selection sort khi n rất lớn?', o:['Vì độ phức tạp O(n²) tăng rất nhanh theo n','Vì chúng tốn nhiều bộ nhớ','Vì không sắp xếp đúng','Vì cần phần cứng đặc biệt'], a:0,
    fb:'O(n²): n gấp 10 thì thời gian gấp ~100 lần. Với n lớn hãy dùng O(n log n).' },
];
let answered=new Set();
function renderQuiz(){
  $('quizHost').innerHTML = QUIZ.map((it,qi)=>`<div class="q" data-qi="${qi}">
    <div class="qt">${qi+1}. ${it.q}</div>
    ${it.o.map((o,oi)=>`<button class="opt" data-qi="${qi}" data-oi="${oi}">${o}</button>`).join('')}
    <div class="fb" data-fb="${qi}"></div></div>`).join('');
  $('quizHost').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.qi,+b.dataset.oi,b)));
}
function answer(qi,oi,btn){
  if(answered.has(qi)) return;
  const it=QUIZ[qi], correct=oi===it.a;
  const box=btn.closest('.q');
  box.querySelectorAll('.opt').forEach((b,i)=>{ if(i===it.a) b.classList.add('ok'); });
  if(!correct) btn.classList.add('no');
  const fb=box.querySelector('.fb'); fb.textContent=(correct?'✓ Đúng! ':'✗ Chưa đúng. ')+it.fb; fb.classList.add('show');
  answered.add(qi);
  $('prog').textContent=`${answered.size}/3 củng cố`;
  if(correct) showToast('✓ Củng cố: +1');
  if(answered.size===QUIZ.length){
    try{ const k='tizia:space:done'; const d=JSON.parse(localStorage.getItem(k)||'{}');
      d.algolab=Math.max(d.algolab||0, QUIZ.length); localStorage.setItem(k,JSON.stringify(d)); }catch(e){}
    showToast('🏆 Hoàn thành phần củng cố giải thuật!');
  }
}

let toastT;
function showToast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

// init
renderQuiz();
selectAlgo('bubble');
if (new URLSearchParams(location.search).get('auto')==='1'){ selectAlgo('quick'); $('speed').value=70; play(); }
</script>
</body>
</html>
