<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tizia · Thư viện Asset 3D</title>
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #312e81;
    --accent: #fbbf24; --accent-2: #f59e0b;
    --card: rgba(255,255,255,0.06); --card-h: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
  body {
    color: white; min-height: 100vh; padding: 24px 18px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139,92,246,0.25), transparent),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  }
  .wrap { max-width:none; margin: 0 auto; }
  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
  .head a.back {
    display: inline-flex; gap: 6px; align-items: center;
    padding: 8px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; color: white; text-decoration: none; font-size: 13px;
  }
  .head .logo { font-size: 36px; }
  .head h1 {
    margin: 0; font-size: 28px; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 60%, #f97316 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head .stats { margin-left: auto; font-size: 13px; opacity: 0.85; }
  .tagline { opacity: 0.85; font-size: 14px; max-width: 740px; line-height: 1.6; margin: 0 0 22px; }
  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px;
    background: var(--card); border: 1px solid var(--border); padding: 14px 18px; border-radius: 14px;
  }
  .filters input[type=search] {
    flex: 1; min-width: 200px;
    padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.95); color: #1f2937; font-size: 14px; font-family: inherit;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    transition: background 0.15s, border-color 0.15s;
  }
  .chip:hover { background: rgba(255,255,255,0.12); }
  .chip.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #3e2723; border-color: transparent; font-weight: 700;
  }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: grab; user-select: none;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
  }
  .card:hover { background: var(--card-h); transform: translateY(-2px); border-color: rgba(251,191,36,0.4); }
  .card .thumb {
    aspect-ratio: 1 / 1; background: linear-gradient(135deg, #1e293b, #312e81);
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; opacity: 0.85; position: relative;
  }
  .card .thumb canvas { width: 100% !important; height: 100% !important; display: block; }
  .card .info { padding: 10px 12px; }
  .card .info .name {
    font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .info .meta { font-size: 11px; opacity: 0.6; margin-top: 3px; }
  .card .info .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .card .info .tags span {
    font-size: 9px; padding: 2px 6px; border-radius: 999px;
    background: rgba(251,191,36,0.15); color: var(--accent); font-weight: 600;
  }
  .empty {
    text-align: center; padding: 60px 20px; opacity: 0.7; font-size: 14px;
  }
  .preview-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .preview-modal.show { display: flex; }
  .preview-modal .box {
    width: 100%; max-width: 720px; aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #1e293b, #312e81);
    border-radius: 14px; position: relative;
    border: 1px solid rgba(251,191,36,0.5);
  }
  .preview-modal .box canvas { width: 100% !important; height: 100% !important; border-radius: 14px; }
  .preview-modal .close {
    position: absolute; top: -40px; right: 0; cursor: pointer; color: white;
    font-size: 24px; background: none; border: none;
  }
  .preview-modal .meta {
    color: white; font-size: 13px; margin-top: 14px; max-width: 720px;
  }
  .preview-modal .meta code { background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 6px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a href="./index.html" class="back">← Trang chủ</a>
    <div class="logo">🧱</div>
    <h1>Thư viện Asset 3D</h1>
    <div class="stats" id="stats">Đang quét…</div>
  </div>
  <p class="tagline">
    Catalogue toàn bộ model 3D (.glb/.gltf) dùng được trong Tizia — phân loại theo gói, tag, kích thước.
    Bấm vào card để xem trước. Có thể copy URL để dùng trong <a href="/lesson-builder.html" style="color:inherit">Lesson Builder</a>.
  </p>

  <div class="filters">
    <input type="search" id="q" placeholder="Tìm theo tên file, tag, gói…" />
    <div class="chips" id="cat-chips"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Không tìm thấy asset phù hợp.</div>
</div>

<div class="preview-modal" id="modal">
  <div>
    <div class="box" id="box">
      <button class="close" id="close">✕</button>
    </div>
    <div class="meta" id="modal-meta"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const emptyEl = document.getElementById('empty');
const qEl = document.getElementById('q');
const chipsEl = document.getElementById('cat-chips');
const modal = document.getElementById('modal');
const box = document.getElementById('box');
const modalMeta = document.getElementById('modal-meta');
document.getElementById('close').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

const CAT_ICON = {
  building: '🏢', urban: '🏙', campus: '🏫', education: '🎓',
  nature: '🌳', plant: '🌱', street: '🛣', park: '🌲',
  vehicle: '🚗', character: '🧑', food: '🍞', classroom: '📚',
  lab: '🧪', science: '🔬', sport: '⚽', outdoor: '☂',
  misc: '🧱', other: '❓',
};

let ASSETS = [];
let activeCat = 'all';

(async function init() {
  try {
    const res = await fetch('./api/assets', { cache: 'no-store' });
    const data = await res.json();
    ASSETS = data.items || [];
    statsEl.textContent = `${data.count} model · ${Object.keys(data.packs || {}).length} gói · cập nhật ${new Date(data.scannedAt).toLocaleTimeString('vi-VN')}`;
    renderChips(data.tags || {});
    render();
  } catch (e) {
    statsEl.textContent = '⚠ Không tải được catalogue.';
    console.error(e);
  }
})();

function renderChips(tagCount) {
  const allCats = new Set(['all']);
  for (const a of ASSETS) allCats.add(a.category);
  chipsEl.innerHTML = [...allCats].map(c => `
    <div class="chip ${c==='all'?'active':''}" data-cat="${c}">
      ${c === 'all' ? '🌐 Tất cả' : (CAT_ICON[c] || '🧱') + ' ' + c} (${c==='all' ? ASSETS.length : ASSETS.filter(a => a.category === c).length})
    </div>
  `).join('');
  chipsEl.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      activeCat = el.dataset.cat;
      render();
    });
  });
}

qEl.addEventListener('input', render);

function render() {
  const q = qEl.value.trim().toLowerCase();
  const items = ASSETS.filter(a => {
    if (activeCat !== 'all' && a.category !== activeCat) return false;
    if (!q) return true;
    return a.name.toLowerCase().includes(q)
      || a.file.toLowerCase().includes(q)
      || a.tags.some(t => t.toLowerCase().includes(q));
  });

  emptyEl.style.display = items.length ? 'none' : 'block';
  grid.innerHTML = items.map((a, i) => `
    <div class="card" data-idx="${i}" draggable="true" data-url="${a.url}">
      <div class="thumb" data-url="${a.url}">${CAT_ICON[a.category] || '🧱'}</div>
      <div class="info">
        <div class="name" title="${a.file}">${escape(a.name)}</div>
        <div class="meta">${a.format.toUpperCase()} · ${a.sizeHuman}</div>
        <div class="tags">${a.tags.slice(0, 4).map(t => `<span>${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.card').forEach((el) => {
    el.addEventListener('click', () => openPreview(items[+el.dataset.idx]));
    el.addEventListener('dragstart', (e) => {
      // Cho phép kéo URL vào input field hoặc Lesson Builder (sau này)
      e.dataTransfer.setData('text/plain', new URL(el.dataset.url, location.href).toString());
      e.dataTransfer.setData('application/x-tizia-asset', el.dataset.url);
    });
  });
}

function escape(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

// === 3D preview với GLTFLoader + OrbitControls ===
let renderer, scene, camera, controls, rafId;
function openPreview(a) {
  modal.classList.add('show');
  modalMeta.innerHTML = `
    <b>${escape(a.name)}</b> · ${a.format.toUpperCase()} · ${a.sizeHuman}<br>
    URL: <code>${escape(a.url)}</code><br>
    Tags: ${a.tags.map(t => `<span style="display:inline-block;padding:2px 8px;background:rgba(251,191,36,0.15);border-radius:999px;font-size:11px;color:#fbbf24;margin:2px;">${t}</span>`).join('')}
  `;
  // Wipe + rebuild
  box.querySelectorAll('canvas').forEach(c => c.remove());
  if (rafId) cancelAnimationFrame(rafId);

  const w = box.clientWidth, h = box.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.set(4, 3, 5);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xfbbf24, 1.2);
  dl.position.set(5, 8, 4); scene.add(dl);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.5;

  if (a.format === 'glb' || a.format === 'gltf') {
    new GLTFLoader().load(a.url, (gltf) => {
      const root = gltf.scene;
      const bbox = new THREE.Box3().setFromObject(root);
      const size = bbox.getSize(new THREE.Vector3()).length() || 1;
      const center = bbox.getCenter(new THREE.Vector3());
      root.position.sub(center);
      const scale = 3 / size;
      root.scale.setScalar(scale);
      scene.add(root);
      controls.target.set(0, 0, 0);
    }, undefined, (err) => {
      box.innerHTML = '<div style="color:#f87171;padding:20px;">Lỗi tải model: ' + (err.message || 'không rõ') + '</div>';
    });
  } else {
    box.innerHTML = '<div style="color:white;padding:20px;">Preview chỉ hỗ trợ GLB/GLTF lúc này. Format ' + a.format + ' chưa có viewer.</div>';
  }

  (function loop() {
    rafId = requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function closeModal() {
  modal.classList.remove('show');
  if (rafId) cancelAnimationFrame(rafId);
  if (renderer) { renderer.dispose(); }
  box.querySelectorAll('canvas').forEach(c => c.remove());
}
</script>
</body>
</html>
