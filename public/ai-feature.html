<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Chức năng AI · Tizia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
  body { color: #e2e8f0; background: linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #0f172a 100%); padding: 24px 16px; }
  .ou-root { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 20px; font-weight: 700; text-wrap: balance; }
  h2 { font-size: 18px; margin: 0 0 10px; font-weight: 700; }
  p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin: 0 0 12px; max-width: 70ch; }
  .ou-block { margin: 0 0 32px; }
  .ou-row, .ou-form { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 14px 16px; margin: 0 0 10px; }
  .ou-row dl { margin: 0 0 10px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
  dt { color: #94a3b8; } dd { margin: 0; overflow-wrap: anywhere; }
  .ou-form { display: grid; gap: 8px; }
  label { font-size: 14px; color: #cbd5e1; }
  input[type=text], input[type=number] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,23,42,0.7); color: #e2e8f0; font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #fbbf24; justify-self: start; }
  .ou-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #fbbf24; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; transition: background .2s, border-color .2s; }
  .ou-btn:hover { background: rgba(251,191,36,0.18); border-color: rgba(251,191,36,0.4); }
  .ou-btn:disabled { opacity: .5; cursor: progress; }
  .ou-primary { background: #fbbf24; color: #0f172a; border-color: #fbbf24; justify-self: start; }
  .ou-primary:hover { background: #f59e0b; }
  :focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
  ::selection { background: rgba(251,191,36,0.35); }
  .ou-status { min-height: 1.4em; margin: 6px 0; }
</style>
</head>
<body>
<div id="app"><p class="ou-status" role="status">Đang tải…</p></div>
<script type="module">
  import { mount } from '/js/online-ui.js';
  const feature = new URLSearchParams(location.search).get('feature');
  mount(document.getElementById('app'), feature || '');
</script>
</body>
</html>
