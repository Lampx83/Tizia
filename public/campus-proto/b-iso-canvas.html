// ====== TRAFFIC: ô tô CHẠY trên đường lớn NGOÀI trường ======
// Yêu cầu UX: xe phải ở ngoài khuôn viên và DI CHUYỂN trên đường (kind:'main'),
// không đỗ chết trên cỏ trong sân. Mỗi đường lớn sinh vài xe 2 chiều, chạy dọc
// trục đường rồi vòng lại. Tính toán THUẦN xác định (không Math.random — bị cấm).
let TRAFFIC = [];
const TRAFFIC_FPS = 22;                       // giới hạn nhịp vẽ lại canvas
const CAR_ROT = { yP:0, yN:180, xP:90, xN:270 };  // hướng xe theo trục/chiều (tinh chỉnh sau khi xem)
function updateCarXform(c){
  if(c.along==='y'){ c.gx=c.center+c.laneOff; c.gy=c.pos; c.rot = c.way>0?CAR_ROT.yP:CAR_ROT.yN; }
  else            { c.gy=c.center+c.laneOff; c.gx=c.pos; c.rot = c.way>0?CAR_ROT.xP:CAR_ROT.xN; }
}
function buildTraffic(){
  TRAFFIC = [];
  if(IS_EDIT) return;                          // editor: giữ xe tĩnh, không mô phỏng
  const mains = (ROADS||[]).filter(r => r && r.kind==='main');
  for(const r of mains){
    const center = (r.a + r.b) / 2;
    // Kẹp tầm chạy quanh vùng nhìn thấy (đường thật kéo dài tới N+24 / -24)
    const lo = Math.max(r.lo, -8), hi = Math.min(r.hi, N + 8);
    const span = hi - lo;
    if(span < 2.5) continue;
    const per = Math.max(1, Math.min(3, Math.round(span / 10)));   // số xe mỗi chiều
    for(const way of [1, -1]){
      for(let i=0;i<per;i++){
        const laneOff = way>0 ? 0.32 : -0.32;                       // 2 làn, lệch tâm đường
        const phase = (i + (way>0 ? 0 : 0.5)) / per;                // rải đều + so le 2 chiều
        const c = { along:r.along, center, laneOff, lo, hi, way,
          speed: 1.25 + 0.45 * (((i*7 + (way>0?1:3)) % 5) / 5),     // 1.25–1.7 u/s, xác định
          pos: lo + span * phase, gx:0, gy:0, rot:0 };
        updateCarXform(c); TRAFFIC.push(c);
      }
    }
  }
}
function advanceCar(c, dt){
  c.pos += c.way * c.speed * dt;
  if(c.pos > c.hi) c.pos = c.lo + (c.pos - c.hi);
  else if(c.pos < c.lo) c.pos = c.hi - (c.lo - c.pos);
  updateCarXform(c);
}
let _trafficRaf = 0, _lastT = 0, _drawAccum = 0;
function tickTraffic(t){

  if(document.hidden){ _lastT = t; return; }
  const dt = Math.min(0.05, (t - (_lastT || t)) / 1000); _lastT = t;
  for(const c of TRAFFIC) advanceCar(c, dt);
  _drawAccum += dt;
  if(_drawAccum >= 1 / TRAFFIC_FPS){ _drawAccum = 0; draw(); }
}
function startTraffic(){

}

const SPR=380;
const rt=new THREE.WebGLRenderer({alpha:true, antialias:true, preserveDrawingBuffer:true});
rt.setSize(SPR,SPR); rt.setPixelRatio(2); rt.outputColorSpace=THREE.SRGBColorSpace;

const rscene=new THREE.Scene();
rscene.add(new THREE.HemisphereLight(0xffffff,0xbeccc0,1.3));

const rcam=new THREE.OrthographicCamera(-1,1,1,-1,0.01,200);
const EL=Math.atan(0.5), AZ=Math.PI/4, RAD=60;
rcam.position.set(RAD*Math.cos(EL)*Math.cos(AZ), RAD*Math.sin(EL), RAD*Math.cos(EL)*Math.sin(AZ));
let ANCHOR={x:SPR,y:SPR};

const loader=new GLTFLoader();
const load=u=>new Promise((res,rej)=>loader.load(u,g=>res(g.scene),undefined,e=>{console.error('FAIL',u,e);rej(e);}));
function prep(obj,scale){ obj.scale.setScalar(scale); const b=new THREE.Box3().setFromObject(obj); const c=b.getCenter(new THREE.Vector3());
  obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=b.min.y; return new THREE.Box3().setFromObject(obj); }
const footOf=o=>{ const b=new THREE.Box3().setFromObject(o); const v=b.getSize(new THREE.Vector3()); return Math.max(v.x,v.z); };
// tô màu toà nhà theo tints — clone material để mỗi toà 1 màu riêng dù dùng chung model
function recolor(obj,hex){ obj.traverse(o=>{ if(o.isMesh&&o.material){
  const tm=m=>{ const c=m.clone(); if(c.color) c.color.setHex(hex); c.needsUpdate=true; return c; };
  o.material = Array.isArray(o.material) ? o.material.map(tm) : tm(o.material); } }); }
function renderSprite(obj){ rscene.add(obj); rt.render(rscene,rcam); rscene.remove(obj);
  const cv=document.createElement('canvas'); cv.width=rt.domElement.width; cv.height=rt.domElement.height;
  cv.getContext('2d').drawImage(rt.domElement,0,0); return cv; }
function tint(spr,color){ const cv=document.createElement('canvas'); cv.width=spr.width; cv.height=spr.height; const x=cv.getContext('2d');
  x.drawImage(spr,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=color; x.fillRect(0,0,cv.width,cv.height); return cv; }

let DS=0.215;
const bsprite={}, esprite={}, modelCache={};
// esprite cache key = "k:rot" (vd "fenceLowH:90") để mỗi góc xoay 1 sprite riêng
const espriteCacheKey=(k,rot)=>`${k}:${(rot||0)%360}`;
async function getDecorSprite(k, rot=0){
  const cacheKey=espriteCacheKey(k,rot);
  if(esprite[cacheKey]) return esprite[cacheKey];
  // Lấy URL từ EXTRAS hoặc tìm theo tên file
  const url = EXTRAS[k] || PACK.sub(k);
  const m = await load(url); prep(m, __GS*(PREP[k]||1.0));
  m.rotation.y = (rot||0)*Math.PI/180;
  esprite[cacheKey]=renderSprite(m);
  return esprite[cacheKey];
}
let __GS = 1;   // global scale của model, dùng cho re-render sprite (rotate/recolor)

// Re-render sprite của 1 building (gọi khi đổi rot/tint trong edit mode). idx = index trong BUILDINGS.
window.__rerenderBuilding = function(idx){
  const b = BUILDINGS[idx]; if(!b || !modelCache[b.url]) return false;
  const sc = modelCache[b.url].clone(true);
  prep(sc, __GS);
  if(TINTS[b.id]!=null) recolor(sc, TINTS[b.id]);
  sc.rotation.y = ((b.rot||0)*Math.PI/180);
  const spr = renderSprite(sc);
  const prev = bsprite[b.id] || { idx };
  bsprite[b.id] = { spr, tint: tint(spr, idCol(prev.idx)), idx: prev.idx };
  return true;
};

(async function build(){
  const items=[];
  for(const b of BUILDINGS){ try{ if(!modelCache[b.url]) modelCache[b.url]=await load(b.url); items.push({b, sc:modelCache[b.url].clone(true)}); }catch(e){} }
  let maxFoot=0; for(const it of items) maxFoot=Math.max(maxFoot, footOf(it.sc));
  const GS = maxFoot? 4/maxFoot : 1;
  __GS = GS;
  let maxDim=0; for(const it of items){ const bb=prep(it.sc,GS); if(TINTS[it.b.id]!=null) recolor(it.sc, TINTS[it.b.id]); const v=bb.getSize(new THREE.Vector3()); maxDim=Math.max(maxDim,v.x,v.y,v.z); }
  const FH=maxDim*0.62;
  rcam.left=-FH; rcam.right=FH; rcam.top=FH; rcam.bottom=-FH; rcam.lookAt(0, maxDim*0.34, 0); rcam.updateProjectionMatrix(); rcam.updateMatrixWorld(true);
  const o=new THREE.Vector3(0,0,0).project(rcam); ANCHOR={x:(o.x*0.5+0.5)*rt.domElement.width, y:(-o.y*0.5+0.5)*rt.domElement.height};
  let i=0; for(const it of items){ it.sc.rotation.y=(it.b.rot||0)*Math.PI/180; const spr=renderSprite(it.sc); bsprite[it.b.id]={spr, tint:tint(spr,idCol(i)), idx:i}; i++; }
  for(const [k,url] of Object.entries(EXTRAS)){ try{ const m=await load(url); prep(m,GS*(PREP[k]||1.0)); m.rotation.y=(ROT[k]||0)*Math.PI/180; esprite[k]=renderSprite(m); }catch(e){} }
  // Pre-render sprite ô tô ở 4 hướng để TRAFFIC chọn theo chiều chạy
  if(!IS_EDIT){ for(const rot of [0,90,180,270]){ try{ await getDecorSprite('car', rot); }catch(e){} } }
  buildLegend();
  document.getElementById('loading').style.display='none';
  draw();
  startTraffic();
})();

// Build wall segment from A → B với auto axis-align
function _buildWallSegment(a, b) {
  const dx = Math.abs(b.gx - a.gx), dy = Math.abs(b.gy - a.gy);
  // Nếu rất ngắn → bỏ qua
  if (dx < 0.3 && dy < 0.3) return null;
  // Auto axis-align: chiếu B lên trục có magnitude lớn hơn
  let bx = b.gx, by = b.gy;
  if (dx > dy) by = a.gy; else bx = a.gx;
  const gx = Math.min(a.gx, bx), gx1 = Math.max(a.gx, bx);
  const gy = Math.min(a.gy, by), gy1 = Math.max(a.gy, by);

function _buildRoadSegment(a, b, kind) {
  const dx = Math.abs(b.gx - a.gx), dy = Math.abs(b.gy - a.gy);
  if (dx < 0.5 && dy < 0.5) return null;
  const W = ROAD_W[kind] || ROAD_W.internal;
  if (dx >= dy) {
    // Horizontal road (along='x')
    return { along:'x', a: a.gy - W/2, b: a.gy + W/2,
             lo: Math.min(a.gx, b.gx), hi: Math.max(a.gx, b.gx), kind };

    return { along:'y', a: a.gx - W/2, b: a.gx + W/2,
             lo: Math.min(a.gy, b.gy), hi: Math.max(a.gy, b.gy), kind };
  }
}

// Dùng cho schoolGate, drawWall, và bất kỳ box-like primitive nào sau này.
function isoBox(gx0, gy0, gx1, gy1, hBot, hTop, cTop, cRight, cFront) {
  const A = P(gx0, gy0), B = P(gx1, gy0), C = P(gx1, gy1), D = P(gx0, gy1);
  const At = { x: A.x, y: A.y - hTop }, Bt = { x: B.x, y: B.y - hTop },
        Ct = { x: C.x, y: C.y - hTop }, Dt = { x: D.x, y: D.y - hTop };
  const Db = { x: D.x, y: D.y - hBot }, Cb = { x: C.x, y: C.y - hBot },
        Bb = { x: B.x, y: B.y - hBot };
  poly([Db, Cb, Ct, Dt], cFront, 'rgba(0,0,0,.22)', 1);  // south
  poly([Bb, Cb, Ct, Bt], cRight, 'rgba(0,0,0,.15)', 1);  // east
  poly([At, Bt, Ct, Dt], cTop,   'rgba(0,0,0,.10)', 1);  // top
}

// Tường bao — hộp 3D mỏng, thấp. Mỗi entry { gx, gy, w, d } trong layout
// .walls — w là chiều dài theo X, d theo Y; thường 1 trong 2 ~0.15 (mỏng)

// stroke — tránh seam line khi 2 chunk liền kề chồng mép. Shading 3 màu đã
// đủ tạo độ nổi 3D.
function drawWallPiece(gx, gy, W, D){
  const A=P(gx,gy), B=P(gx+W,gy), C=P(gx+W,gy+D), Dp=P(gx,gy+D);
  const At={x:A.x,y:A.y-WALL_H}, Bt={x:B.x,y:B.y-WALL_H},
        Ct={x:C.x,y:C.y-WALL_H}, Dt={x:Dp.x,y:Dp.y-WALL_H};
  poly([Dp,C,Ct,Dt], '#8e887a', null);   // south
  poly([B,C,Ct,Bt],  '#b6afa1', null);   // east
  poly([At,Bt,Ct,Dt],'#d8d3c8', null);   // top

function drawWall(w) {

  const W = Math.max(0.1, Number(w.w) || 0.15);

function ellipsePts(cx,cy,rx,ry,seg=44){ const a=[]; for(let i=0;i<seg;i++){ const t=i/seg*Math.PI*2; a.push(P(cx+rx*Math.cos(t), cy+ry*Math.sin(t))); } return a; }

function strip(s){

    : [P(s.lo,s.a),P(s.hi,s.a),P(s.hi,s.b),P(s.lo,s.b)];

  // sáng hơn, không vạch (lối đi nội bộ cho xe đạp / người).

  const p0=s.along==='y'?P(c,s.lo):P(s.lo,c), p1=s.along==='y'?P(c,s.hi):P(s.hi,c);
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke(); ctx.setLineDash([]);

function playmat(gx,gy,w,d){ const cols=['#ffc7df','#bfe7fb','#cdf0b8','#ffe39a'];
  const pts=[P(gx+0.7,gy),P(gx+w-0.7,gy),P(gx+w,gy+0.7),P(gx+w,gy+d-0.7),P(gx+w-0.7,gy+d),P(gx+0.7,gy+d),P(gx,gy+d-0.7),P(gx,gy+0.7)];
  poly(pts,'#ffeccb','rgba(0,0,0,.05)',1.5);
  for(let i=0;i<w;i++)for(let j=0;j<d;j++){ if((i+j)&1) poly(tileRect(gx+i+0.14,gy+j+0.14,0.72,0.72),cols[(i+j*2)%4],null); } }
// hố cát — viền gỗ + cát vàng + gò nhỏ
function sandbox(gx,gy,w,d){ poly(tileRect(gx,gy,w,d),'#c89b5b','rgba(90,60,20,.3)',2.5);
  poly(tileRect(gx+0.18,gy+0.18,w-0.36,d-0.36),'#f1d99c',null);
  poly(ellipsePts(gx+w*0.52,gy+d*0.56,0.5,0.32),'#e6c882',null); }
// hồ bơi nông / nghịch nước — xanh nhạt, lõi sáng + đốm phản chiếu
function pool(cx,cy,rx,ry){ poly(ellipsePts(cx,cy,rx,ry),'#7fcdee','rgba(0,0,0,.12)',2);
  poly(ellipsePts(cx,cy,rx-0.18,ry-0.14),'#aee3f6',null);
  poly(ellipsePts(cx,cy,rx*0.55,ry*0.55),'#79c7ec',null);
  poly(ellipsePts(cx-rx*0.32,cy-ry*0.26,rx*0.22,ry*0.14),'rgba(255,255,255,.55)',null); }
function drawField(f){ switch(f.type){
  case 'football': return football(f.gx,f.gy,f.w,f.d);
  case 'baseball': return baseball(f.gx,f.gy,f.sz);
  case 'track': return track(f.cx,f.cy,f.rx,f.ry);
  case 'parking': return parking(f.gx,f.gy,f.w,f.d);
  case 'court': return court(f.gx,f.gy,f.w,f.d);
  case 'plaza': return plaza(f.gx,f.gy,f.w,f.d);
  case 'garden': return garden(f.gx,f.gy,f.w,f.d);
  case 'pond': return pond(f.cx,f.cy,f.rx,f.ry,f.tech);
  case 'playmat': return playmat(f.gx,f.gy,f.w,f.d);
  case 'sandbox': return sandbox(f.gx,f.gy,f.w,f.d);
  case 'pool': return pool(f.cx,f.cy,f.rx,f.ry);
} }
// ── thiết bị vui chơi ĐỨNG (screen-space tại điểm chạm đất p, vẽ hướng lên) ──
function softShadow(px,py,rx,ry){ ctx.fillStyle='rgba(0,0,0,.13)'; ctx.beginPath(); ctx.ellipse(px,py,rx,ry,0,0,7); ctx.fill(); }
// CẦU TRƯỢT — thang đỏ + sàn xanh + máng vàng cong + mái đỏ
function slide(px,py){ softShadow(px,py,36,9); const H=60;
  ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#e9a90c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(px+15,py-H+4); ctx.quadraticCurveTo(px-20,py-H+12,px-38,py-3);
  ctx.lineTo(px-30,py-2); ctx.quadraticCurveTo(px-12,py-H+24,px+20,py-H+10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#ff7a59'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(px+17,py-H+2); ctx.quadraticCurveTo(px-20,py-H+8,px-40,py-7); ctx.stroke();
  ctx.fillStyle='#5cc6ff'; rr(px+9,py-H-1,18,6,2); ctx.fill();
  ctx.strokeStyle='#3aa0e0'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(px+13,py-H+2); ctx.lineTo(px+13,py-2); ctx.moveTo(px+26,py-H+2); ctx.lineTo(px+26,py-2); ctx.stroke();
  ctx.strokeStyle='#ff5d7a'; ctx.lineWidth=2.4;
  for(let i=0;i<4;i++){ const yy=py-9-i*12; ctx.beginPath(); ctx.moveTo(px+13,yy); ctx.lineTo(px+26,yy); ctx.stroke(); }
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(px+5,py-H-1); ctx.lineTo(px+31,py-H-1); ctx.lineTo(px+18,py-H-16); ctx.closePath(); ctx.fill();
  ctx.lineCap='butt'; }
// XÍCH ĐU — 2 khung chữ A + thanh ngang + 2 ghế treo
function swing(px,py){ softShadow(px,py,40,9); const H=54;
  ctx.strokeStyle='#16a34a'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(px-30,py-2); ctx.lineTo(px-6,py-H); ctx.moveTo(px-16,py-2); ctx.lineTo(px-2,py-H);
  ctx.moveTo(px+30,py-2); ctx.lineTo(px+6,py-H); ctx.moveTo(px+16,py-2); ctx.lineTo(px+2,py-H); ctx.stroke();
  ctx.strokeStyle='#0e7a36'; ctx.beginPath(); ctx.moveTo(px-9,py-H); ctx.lineTo(px+9,py-H); ctx.stroke();
  ctx.lineCap='butt';
  for(const sx of [-8,8]){ ctx.strokeStyle='#9aa0a6'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(px+sx-3,py-H+1); ctx.lineTo(px+sx-3,py-17); ctx.moveTo(px+sx+3,py-H+1); ctx.lineTo(px+sx+3,py-17); ctx.stroke();
    ctx.fillStyle=sx<0?'#f59e0b':'#ef4444'; rr(px+sx-6,py-17,12,4,2); ctx.fill(); } }
// BẬP BÊNH — trụ đỏ + ván nghiêng xanh + 2 ghế tròn vàng + tay nắm
function seesaw(px,py){ softShadow(px,py,40,8);
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(px,py-24); ctx.lineTo(px-9,py-2); ctx.lineTo(px+9,py-2); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(px,py-22); ctx.rotate(-0.17);
  ctx.fillStyle='#3b82f6'; rr(-40,-4,80,7,3.5); ctx.fill();
  ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.arc(-36,-5,5.5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(36,-5,5.5,0,7); ctx.fill();
  ctx.strokeStyle='#16a34a'; ctx.lineWidth=2.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-31,-5); ctx.lineTo(-31,-16); ctx.moveTo(31,-5); ctx.lineTo(31,-16); ctx.stroke(); ctx.lineCap='butt'; ctx.restore(); }
// ĐU QUAY NGỰA — bệ tròn + cột + mái dù sọc + 2 thú cưỡi
function carousel(px,py){ softShadow(px,py,44,13);
  ctx.fillStyle='#bfe3c6'; ctx.strokeStyle='#7cc18a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(px,py-2,41,13,0,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#aab0b6'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(px,py-8); ctx.lineTo(px,py-56); ctx.stroke();
  const cols=['#ef4444','#ffffff','#3b82f6','#ffffff','#22c55e','#ffffff','#f59e0b','#ffffff']; const R=36, topY=py-56, baseY=py-34;
  for(let i=0;i<8;i++){ const a0=i/8*Math.PI*2,a1=(i+1)/8*Math.PI*2; ctx.fillStyle=cols[i];
    ctx.beginPath(); ctx.moveTo(px,topY); ctx.lineTo(px+R*Math.cos(a0),baseY+8*Math.sin(a0)); ctx.lineTo(px+R*Math.cos(a1),baseY+8*Math.sin(a1)); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle='#7cc18a'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(px,baseY+4,R,9,0,0,Math.PI); ctx.stroke();
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(px,topY-1,3.5,0,7); ctx.fill();
  ctx.font='17px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🐴',px-23,py-13); ctx.fillText('🦄',px+23,py-13); }
// NHÀ CỔ TÍCH — nhà chơi nhỏ: thân vàng + mái hồng + cửa vòm
function playhouse(px,py){ softShadow(px,py,26,7);
  ctx.fillStyle='#fff1bf'; ctx.strokeStyle='#e6c46a'; ctx.lineWidth=1.5; rr(px-18,py-30,36,28,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#f9a8d4'; ctx.beginPath(); ctx.moveTo(px-23,py-30); ctx.lineTo(px+23,py-30); ctx.lineTo(px,py-50); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fce7f3'; ctx.beginPath(); ctx.arc(px,py-39,3.4,0,7); ctx.fill();
  ctx.fillStyle='#8b5e34'; ctx.beginPath(); ctx.moveTo(px-8,py-2); ctx.lineTo(px-8,py-16); ctx.arc(px,py-16,8,Math.PI,0,true); ctx.lineTo(px+8,py-2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fcd34d'; ctx.beginPath(); ctx.arc(px+4,py-12,1.6,0,7); ctx.fill(); }
function drawPlay(o){ const p=P(o.gx,o.gy); switch(o.k){
  case 'slide': return slide(p.x,p.y); case 'swing': return swing(p.x,p.y);
  case 'seesaw': return seesaw(p.x,p.y); case 'carousel': return carousel(p.x,p.y);
  case 'playhouse': return playhouse(p.x,p.y); } }
// con vật / hoa / đồ chơi nhỏ = emoji đứng trên bóng đổ (sort theo độ sâu)
function critter(px,py,e,scale){ scale=scale||1; softShadow(px,py,8*scale,3*scale);
  ctx.font=`${Math.round(23*scale)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText(e,px,py-1); }
function flagpole(cx,cy){ const p=P(cx,cy); ctx.strokeStyle='#8a8f96'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y-46); ctx.stroke();
  ctx.fillStyle='#da251d'; ctx.beginPath(); ctx.moveTo(p.x,p.y-46); ctx.lineTo(p.x+22,p.y-40); ctx.lineTo(p.x,p.y-32); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffe017'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('★',p.x+8,p.y-39); }
// Cổng trường — THUẦN ISOMETRIC, không billboard 2D, không chữ. Chỉ có
// kiến trúc khối: 2 cột vuông + 1 xà ngang slab mỏng nằm trên đỉnh. Tên
// trường đã có ở pin marker facility nên không cần in lên cổng.
// `label` arg giữ để không vỡ call-site nhưng không dùng.
function schoolGate(gx, gy, _label, rot = 0) {
  const SPAN=1.7, POST_W=0.30, POST_D=0.30, POST_H=58, LINTEL_H=14, LINTEL_D=0.18;
  // rot: 0   = cổng mở Nam-Bắc (cột Đông-Tây) — mặc định cho cổng ở cạnh ngang
  // rot: 90  = cổng mở Đông-Tây (cột Nam-Bắc) — dùng cho cổng ở cạnh dọc (trái/phải)
  const swap = (rot % 180) !== 0;   // 90 / 270 thì hoán vị trục
  // Bóng nền (ellipse theo trục dài của xà ngang)
  const gp = P(gx, gy);
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  const shW = (swap ? POST_D : SPAN*0.5 + POST_W) * TW;
  const shH = (swap ? SPAN*0.5 + POST_W : POST_D) * TH;
  ctx.beginPath(); ctx.ellipse(gp.x, gp.y + 6, Math.max(shW, shH) + 12, TH*0.5, 0, 0, 7); ctx.fill();
  // 2 cột — đặt theo trục đã hoán vị
  for (const dir of [-1, +1]) {
    const cx = swap ? gx          : gx + dir*SPAN/2;
    const cy = swap ? gy + dir*SPAN/2 : gy;
    isoBox(cx-POST_W, cy-POST_D, cx+POST_W, cy+POST_D, 0, POST_H,
      GATE_C.post[0], GATE_C.post[1], GATE_C.post[2]);
  }
  // Xà ngang — span chạy giữa 2 cột
  if (swap) {
    isoBox(gx-LINTEL_D, gy-SPAN/2-POST_W, gx+LINTEL_D, gy+SPAN/2+POST_W,
      POST_H, POST_H+LINTEL_H, GATE_C.lintel[0], GATE_C.lintel[1], GATE_C.lintel[2]);
  } else {
    isoBox(gx-SPAN/2-POST_W, gy-LINTEL_D, gx+SPAN/2+POST_W, gy+LINTEL_D,
      POST_H, POST_H+LINTEL_H, GATE_C.lintel[0], GATE_C.lintel[1], GATE_C.lintel[2]);
  }
  // Cổng "firewall" CNTT (req #20): đèn cảm biến neon nhấp nháy trên đỉnh xà.
  if (TECH_PATHS) { ctx.save(); ctx.shadowColor='#67e8f9'; ctx.shadowBlur=8;
    ctx.fillStyle='#d6fbff'; ctx.beginPath(); ctx.arc(gp.x, gp.y - POST_H - LINTEL_H - 3, 2.6, 0, 7); ctx.fill(); ctx.restore(); }
}
function ground(){
  const w=innerWidth, h=innerHeight;
  const ivx=(x,y)=>((x-ox)/TW + (y-oy)/TH), ivy=(x,y)=>((y-oy)/TH - (x-ox)/TW);
  let g0x=1/0,g1x=-1/0,g0y=1/0,g1y=-1/0;
  for(const [x,y] of [[0,0],[w,0],[0,h],[w,h]]){ const a=ivx(x,y),b=ivy(x,y); g0x=Math.min(g0x,a);g1x=Math.max(g1x,a);g0y=Math.min(g0y,b);g1y=Math.max(g1y,b); }
  g0x=Math.floor(g0x)-1; g1x=Math.ceil(g1x)+1; g0y=Math.floor(g0y)-1; g1y=Math.ceil(g1y)+1;
  for(let gx=g0x; gx<g1x; gx++) for(let gy=g0y; gy<g1y; gy++){
    const a=P(gx,gy),b=P(gx+1,gy),c=P(gx+1,gy+1),d=P(gx,gy+1);
    poly([a,b,c,d], ((gx+gy)&1)?GRASS[0]:GRASS[1], 'rgba(0,0,0,.03)',1); }
  for(const r of ROADS) strip(r);
  for(const b of BUILDINGS){ const r=0.82; poly([P(b.gx-r,b.gy-r),P(b.gx+r,b.gy-r),P(b.gx+r,b.gy+r),P(b.gx-r,b.gy+r)],'#dcc9a0','rgba(120,98,55,.16)',1); }
  for(const p of WALKS){ const pts=p.along==='y'?[P(p.a,p.lo),P(p.b,p.lo),P(p.b,p.hi),P(p.a,p.hi)]:[P(p.lo,p.a),P(p.hi,p.a),P(p.hi,p.b),P(p.lo,p.b)];
    poly(pts,'#dcc9a0','rgba(120,98,55,.20)',1.3); const c=(p.a+p.b)/2;
    const q0=p.along==='y'?P(c,p.lo):P(p.lo,c), q1=p.along==='y'?P(c,p.hi):P(p.hi,c);
    if(TECH_PATHS){ // vạch giữa = mạch điện cyan phát sáng + nút ở 2 đầu (req #20)
      ctx.save(); ctx.shadowColor='#22d3ee'; ctx.shadowBlur=6; ctx.strokeStyle='rgba(125,233,255,.85)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.stroke();
      ctx.fillStyle='#d6fbff'; for(const q of [q0,q1]){ ctx.beginPath(); ctx.arc(q.x,q.y,1.7,0,7); ctx.fill(); } ctx.restore(); }
    else { ctx.strokeStyle='rgba(255,250,235,.5)'; ctx.lineWidth=1.3; ctx.setLineDash([5,7]);
      ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.stroke(); ctx.setLineDash([]); } }
  for(const f of FIELDS) drawField(f);
  // Plaza phẳng (flagpole) vẽ ngay trong ground vì rất thấp — không gây
  // z-overlap với buildings/cổng. CỔNG (3D có chiều cao) NGỌC chuyển sang
  // items sort theo depth ở draw() để building/tường phía Nam không đè lên cổng.
  for(const f of FIELDS){ if(f.type==='plaza') flagpole(f.gx+f.w/2, f.gy+f.d-0.4); }
}

function shadowAt(p,s){ ctx.fillStyle='rgba(0,0,0,.13)'; ctx.beginPath(); ctx.ellipse(p.x,p.y,TW*0.4*s,TH*0.4*s,0,0,7); ctx.fill(); }
function blit(t,img,p,scale){ t.drawImage(img, p.x-ANCHOR.x*scale, p.y-ANCHOR.y*scale, img.width*scale, img.height*scale); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function pinMarker(px,py,emoji,color){ const w=28,h=25,x=px-w/2,y=py-h-6; color=color||'#c0392b';
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(px,py+1,6,2.6,0,0,7); ctx.fill();
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-5,y+h-3); ctx.lineTo(px+5,y+h-3); ctx.closePath(); ctx.fill();
  ctx.fillStyle=color; rr(x,y,w,h,6); ctx.fill(); ctx.fillStyle='#fff'; rr(x+2.2,y+2.2,w-4.4,h-4.4,4.5); ctx.fill();
  ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(emoji,px,y+h/2); }
function flag(p,scale){ const x=p.x,y=p.y-ANCHOR.y*scale; ctx.strokeStyle='#7a7a7a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y-2); ctx.lineTo(x,y-24); ctx.stroke(); ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(x,y-24); ctx.lineTo(x+12,y-20); ctx.lineTo(x,y-16); ctx.fill(); }

function draw(){
  // Reset về identity để clearRect + background fill phủ toàn canvas (kể cả khi zoom out)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=(GRASS||['#a2d983'])[0]; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  hctx.save(); hctx.setTransform(1,0,0,1,0,0);
  hctx.clearRect(0,0,hit.width,hit.height); hctx.restore();
  ground();
  const items=[];
  BUILDINGS.forEach((b,i)=>items.push({d:b.gx+b.gy, b, i, p:P(b.gx,b.gy)}));
  DECOR.forEach(o=>{ if(esprite[o.k]) items.push({d:o.gx+o.gy-0.05, deco:o, p:P(o.gx,o.gy)}); });
  // Ô tô đang chạy trên đường lớn ngoài trường — depth-sort cùng mọi thứ để qua
  // cổng/tường đúng lớp (không hit-test → không vào hit canvas, không bấm được).
  TRAFFIC.forEach(o=>{ if(esprite[espriteCacheKey('car',o.rot)]||esprite.car) items.push({d:o.gx+o.gy-0.04, traffic:o, p:P(o.gx,o.gy)}); });
  PLAYS.forEach(o=>items.push({d:o.gx+o.gy, play:o, p:P(o.gx,o.gy)}));
  CRITTERS.forEach(o=>items.push({d:o.gx+o.gy-0.02, crit:o, p:P(o.gx,o.gy)}));
  // Cổng trường (type='gate') có chiều cao 3D — depth-sort cùng buildings.
  FIELDS.forEach(f=>{ if(f.type==='gate') items.push({d:f.gx+f.gy, gate:f, p:P(f.gx,f.gy)}); });
  // Tường bao: tường dài (W hoặc D > 1) phải CHIA NHỎ để mỗi đoạn có depth
  // riêng — không thì cây/nhà ở phía nam của tường ngắn (gần camera hơn 1 phần
  // tường) sẽ bị tường che mặc dù phần đó depth lớn hơn. Chunk size 1 grid.
  WALLS.forEach((w,i)=>{
    if(!w||!Number.isFinite(w.gx)||!Number.isFinite(w.gy)) return;
    const W=Math.max(0.1,Number(w.w)||0.15), D=Math.max(0.1,Number(w.d)||0.15);
    const CHUNK=1.0;
    if(W > CHUNK + 0.05){
      const n=Math.ceil(W/CHUNK), step=W/n;
      for(let k=0;k<n;k++){
        const sx=w.gx+k*step;
        items.push({d:(sx+step/2)+(w.gy+D/2)-0.03, wallChunk:{gx:sx,gy:w.gy,w:step,d:D}, wallIdx:i});
      }
    } else if(D > CHUNK + 0.05){
      const n=Math.ceil(D/CHUNK), step=D/n;
      for(let k=0;k<n;k++){
        const sy=w.gy+k*step;
        items.push({d:(w.gx+W/2)+(sy+step/2)-0.03, wallChunk:{gx:w.gx,gy:sy,w:W,d:step}, wallIdx:i});
      }
    } else {
      items.push({d:(w.gx+W/2)+(w.gy+D/2)-0.03, wallChunk:{gx:w.gx,gy:w.gy,w:W,d:D}, wallIdx:i, wholeWall:w});
    }
  });
  items.sort((a,b)=>a.d-b.d);
  const pins=[];
  for(const it of items){
    if(it.deco){
      const dk=espriteCacheKey(it.deco.k, it.deco.rot||0);
      const sp=esprite[dk]||esprite[it.deco.k];
      const selD=EDIT && it.deco===DECOR[selectedDecor];
      if(selD){ ctx.fillStyle='rgba(251,191,36,.45)'; ctx.beginPath(); ctx.ellipse(it.p.x,it.p.y,TW*0.5,TH*0.5,0,0,7); ctx.fill();
                ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2; ctx.stroke(); }
      const _dsc = DS*(BLIT[it.deco.k]||0.8)*(it.deco.s||1);
      if(sp) blit(ctx, sp, it.p, _dsc);
      // Pin màu: chấm tròn nhỏ bên trên item
      if(it.deco.pin){ const sc=_dsc;
        const py=it.p.y-sp.height*sc+ANCHOR.y*sc - 4;
        ctx.save(); ctx.fillStyle=it.deco.pin;
        ctx.beginPath(); ctx.arc(it.p.x, py, 5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore(); }
      continue;
    }
    if(it.traffic){ const sp=esprite[espriteCacheKey('car',it.traffic.rot)]||esprite.car;
      if(sp){ softShadow(it.p.x, it.p.y, TW*0.22, TH*0.22); blit(ctx, sp, it.p, DS*(BLIT.car||0.8)); }
      continue; }
    if(it.play){ drawPlay(it.play); continue; }
    if(it.crit){ critter(it.p.x, it.p.y, it.crit.e, it.crit.s); continue; }
    if(it.gate){ schoolGate(it.gate.gx, it.gate.gy, it.gate.label, it.gate.rot||0); continue; }
    if(it.wallChunk){ const c=it.wallChunk; drawWallPiece(c.gx,c.gy,c.w,c.d);
      // EDIT mode: chỉ vẽ outline highlight 1 LẦN cho cả tường (khi gặp chunk
      // cuối — wholeWall flag set ở chunk không bị chia, hoặc last chunk của
      // tường được chia). Để đơn giản: vẽ outline khi đoạn này là chunk CUỐI
      // có depth lớn nhất của wall đó.
      if(EDIT && selectedWall===it.wallIdx){
        const w = WALLS[it.wallIdx]; if(w){
          const W=Math.max(0.1,Number(w.w)||0.15), D=Math.max(0.1,Number(w.d)||0.15);
          // Chỉ vẽ outline ở chunk có depth = max trong wall đó (chunk gần nhất camera)
          const isLast = Math.abs(it.d - ((w.gx+W/2)+(w.gy+D/2)-0.03 + Math.max(W,D)/2 - 0.5)) < 1.0;
          // Simplification: vẽ luôn — outline ở mỗi chunk sẽ chồng nhưng cùng màu
          const a=P(w.gx,w.gy),b=P(w.gx+W,w.gy),cc=P(w.gx+W,w.gy+D),dd=P(w.gx,w.gy+D);
          ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2.5; ctx.beginPath();
          ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(cc.x,cc.y); ctx.lineTo(dd.x,dd.y); ctx.closePath(); ctx.stroke();
        }
      }
      continue;
    }
    const sp=bsprite[it.b.id]; if(!sp) continue; const sc=DS*it.b.s; const hl=it.i===hovered; const sel=EDIT && it.i===selected;
    // Shadow chỉ cho model cao (building-type-*). Path/fence/driveway/planter → bỏ qua.
    const _flatModel = it.b.url && /fence|path|driveway|planter/i.test(it.b.url);
    if(!_flatModel) shadowAt(it.p, it.b.s);
    if(sel){ ctx.fillStyle='rgba(96,165,250,.55)'; ctx.beginPath(); ctx.ellipse(it.p.x,it.p.y,TW*0.62*it.b.s,TH*0.62*it.b.s,0,0,7); ctx.fill();
             ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2.5; ctx.stroke(); ctx.filter='brightness(1.13)'; }
    if(hl && !sel){ ctx.fillStyle='rgba(255,206,84,.5)'; ctx.beginPath(); ctx.ellipse(it.p.x,it.p.y,TW*0.5*it.b.s,TH*0.5*it.b.s,0,0,7); ctx.fill(); ctx.filter='brightness(1.13)'; }
    blit(ctx, sp.spr, it.p, sc); ctx.filter='none'; blit(hctx, sp.tint, it.p, sc);
    if(it.b.flag) flag(it.p, sc);
  }
  // Pin marker đã bỏ theo yêu cầu UX: các thẻ đỏ-trắng có emoji nổi trên đầu
  // building/facility gây rối hình + che mái nhà. Click + legend vẫn hoạt động
  // bình thường (hit-test dựa vào hit-canvas của sprite, không phụ thuộc pin).
}

/** Item có thể bấm vào để có trải nghiệm thực? Building → trong whitelist domain.
 *  Facility → có entry trong SPORT_TARGETS. Khác → false (ẩn khỏi legend, vô hiệu hoá click). */
function hasInteractive(item) {

}

function enter(item, idx){

  // Không có trải nghiệm: noop. Trước đây toast "Vào: …" nhưng dẫn đến dead-end UX.

// Phân nhóm chú giải (req #1 Enderboy mục 7) ------------------------------
// Suy luận category từ tên/id để không phải thêm field `cat` cho từng building
// trong CAMPUSES (giữ cấu hình gọn). Thứ tự nhóm cố định để UX nhất quán.
const CAT_ORDER = ['lop', 'bomon', 'dieuhanh', 'sinhhoat', 'theduc', 'tienich'];
const CAT_LABEL = {
  lop:      { e:'📚', t:'Lớp học · Khối học' },
  bomon:    { e:'🔬', t:'Phòng bộ môn · Lab' },
  dieuhanh: { e:'🏫', t:'Điều hành · Hỗ trợ' },
  sinhhoat: { e:'🎨', t:'Sinh hoạt · Đoàn thể' },
  theduc:   { e:'⚽', t:'Thể chất · Sân bãi' },
  tienich:  { e:'🚪', t:'Tiện ích · Khuôn viên' },
};
function categorize(o) {
  const id = String(o.id||'').toLowerCase();
  const n  = String(o.name||'').toLowerCase();
  // Lớp học / khối lớp / cụm "Lớp N" ở tiểu học
  if (/^(grade\d|g\d|class|khoi|khối|lớp)/.test(id) || /^lớp |^khối /.test(n)) return 'lop';
  // Điều hành
  if (/^(admin|head|hieu|bgh)/.test(id) || /hiệu bộ|hiệu trưởng|bgh|hành chính|điều hành/.test(n)) return 'dieuhanh';
  // Thể chất - sân bãi
  if (/(gym|football|court|track|baseball|sport|bike|park|playground|playarea|playmat)/.test(id)
      || /sân|nhà thể|đa năng|bóng|chơi|xe đạp/.test(n)) return 'theduc';
  // Sinh hoạt - Đoàn thể - Y tế - Nghệ thuật - Ẩm thực
  if (/(youth|doi|tradition|medical|health|canteen|dorm|music|art|hall)/.test(id)
      || /đoàn|đội|y tế|truyền thống|căng tin|nhà ăn|ký túc|âm nhạc|nghệ thuật|mĩ thuật|hội trường/.test(n)) return 'sinhhoat';
  // Tiện ích khuôn viên (facilities + cổng + hồ + vườn)
  if (o.bi == null || /(gate|garden|lake|pond|flag|plaza)/.test(id)
      || /cổng|vườn|hồ|sân chào cờ/.test(n)) return 'tienich';
  // Default: phòng bộ môn / lab / chức năng
  return 'bomon';
}

function buildLegend(){ const host=document.getElementById('legend-rows');
  // CHỈ liệt items có trải nghiệm thực (hasInteractive). Item "trang trí" (nhà
  // không có space, sân không có sport target) bị ẩn để chú giải gọn + không
  // gây nhầm là bấm được.
  const all=[...BUILDINGS.map((b,i)=>({...b,bi:i})), ...FACILITIES.map(f=>({...f,bi:null}))]
    .filter(hasInteractive);
  // Gom theo nhóm
  const groups = {};
  for (const o of all) { const c = categorize(o); (groups[c] = groups[c] || []).push(o); }
  // Render theo thứ tự CAT_ORDER, bỏ nhóm rỗng
  const html = CAT_ORDER
    .filter(c => groups[c] && groups[c].length)
    .map(c => {
      const meta = CAT_LABEL[c];
      const rows = groups[c].map(o =>
        `<div class="lr" data-id="${o.id}"><span class="e">${o.emoji}</span><span>${o.name}</span></div>`
      ).join('');
      return `<div class="cat"><span>${meta.e}</span><span>${meta.t}</span></div>${rows}`;
    }).join('');
  host.innerHTML = html;
  // Đếm tổng item để hiện badge "N" cạnh title — user biết panel có bao nhiêu
  // điểm bấm được mà không cần mở ra.
  const cnt = document.getElementById('legend-count'); if (cnt) cnt.textContent = String(all.length);
  // Toggle collapse — mặc định collapsed để không đè toà nhà; lưu state để lần
  // sau nhớ. Mount 1 lần duy nhất (re-build legend không add listener trùng).
  const wrap = document.getElementById('legend');
  const toggle = document.getElementById('legend-toggle');
  if (toggle && !toggle.dataset.bound) {
    toggle.dataset.bound = '1';
    const KEY = 'tz-campus-legend-open';
    try { if (localStorage.getItem(KEY) === '1') wrap.classList.add('expanded'); } catch {}
    toggle.setAttribute('aria-expanded', wrap.classList.contains('expanded') ? 'true' : 'false');
    const flip = () => {
      const open = wrap.classList.toggle('expanded');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      try { localStorage.setItem(KEY, open ? '1' : '0'); } catch {}
    };
    toggle.addEventListener('click', flip);
    toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  }
  host.querySelectorAll('.lr').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.id; const bi=BUILDINGS.findIndex(b=>b.id===id);
    if(bi>=0) enter(BUILDINGS[bi], bi); else { const f=FACILITIES.find(x=>x.id===id); if(f) enter(f,null); } }));
  // Hover row trên legend → set hovered building để canvas highlight (req #1 mục 4)
  host.querySelectorAll('.lr').forEach(el=>{
    el.addEventListener('pointerenter', ()=>{
      const bi = BUILDINGS.findIndex(b=>b.id===el.dataset.id);
      if (bi >= 0 && hovered !== bi) { hovered = bi; draw(); }
    });
    el.addEventListener('pointerleave', ()=>{ if (hovered !== -1) { hovered = -1; draw(); } });
  });
}


let _zoom=1.0;   // zoom scale hiện tại (0.4 – 2.5)
let _panOx=0, _panOy=0;   // pan offset thêm vào ox/oy

// Tâm nội dung trong iso-space (không phụ thuộc ox/oy): ưu tiên 4 góc tường bao
// nếu có (fence định nghĩa rõ khuôn viên), nếu không có tường thì lấy bbox của
// BUILDINGS + FACILITIES. Trả về điểm pixel-iso để baseOx/baseOy đẩy ra giữa viewport.
function _contentCenterIso(){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  const eat=(gx,gy)=>{ const x=(gx-gy)*TW/2, y=(gx+gy)*TH/2;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; };
  if(WALLS && WALLS.length){
    for(const w of WALLS){
      const W=w.w||0, D=w.d||0;
      eat(w.gx,w.gy); eat(w.gx+W,w.gy); eat(w.gx,w.gy+D); eat(w.gx+W,w.gy+D);
    }
  } else {
    for(const b of (BUILDINGS||[])) eat(b.gx,b.gy);
    for(const f of (FACILITIES||[])) eat(f.gx,f.gy);
  }
  if(!isFinite(minX)) return {x:0,y:0};
  return { x:(minX+maxX)/2, y:(minY+maxY)/2 };
}
function baseOx(w){ return w/2 - _contentCenterIso().x; }
function baseOy(h){ return h/2 - _contentCenterIso().y; }

function applyZoom(){
  // P() dùng ox,oy trực tiếp — scale bằng cách inflate TW/TH sẽ phức tạp.
  // Dùng ctx.setTransform với zoom scale cho toàn bộ draw call thay vì.
  const w=innerWidth, h=innerHeight;
  const cx=w/2, cy=h/2;
  ctx.setTransform(DPR*_zoom, 0, 0, DPR*_zoom, (cx*(1-_zoom))*DPR + _panOx*DPR, (cy*(1-_zoom))*DPR + _panOy*DPR);
  hctx.setTransform(DPR*_zoom, 0, 0, DPR*_zoom, (cx*(1-_zoom))*DPR + _panOx*DPR, (cy*(1-_zoom))*DPR + _panOy*DPR);
}

function resize(){ const w=innerWidth,h=innerHeight;
  canvas.width=w*DPR; canvas.height=h*DPR; canvas.style.width=w+'px'; canvas.style.height=h+'px';
  hit.width=w*DPR; hit.height=h*DPR;
  // ox/oy là toạ độ gốc của world; pan được apply VIA ctx.setTransform trong
  // applyZoom() (tx += _panOx*DPR). Nếu cộng _panOx vào ox ở đây nữa sẽ bị
  // double-count (1 lần ở world coord, 1 lần ở canvas transform) → kéo lệch.
  ox=baseOx(w); oy=baseOy(h);
  applyZoom(); draw(); }
addEventListener('resize', resize); resize();

// ── Tính zoom tối thiểu: vừa đủ để thấy toàn bộ BUILDINGS ──
// Tính ở pixel-space (zoom=1): mỗi building chiếm TW*s/2 × TH*s*4 (ước tính chiều cao 3D).
// So sánh bounding box với viewport center → min scale theo cả 2 chiều.
function calcMinZoom(){
  if(!BUILDINGS.length) return 0.3;
  const cx=innerWidth/2, cy=innerHeight/2;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const b of BUILDINGS){
    const p=P(b.gx, b.gy);
    const hw=TW*(b.s||1)*0.55, hvBot=TH*(b.s||1)*0.5, hvTop=100*(b.s||1);
    minX=Math.min(minX,p.x-hw); maxX=Math.max(maxX,p.x+hw);
    minY=Math.min(minY,p.y-hvTop); maxY=Math.max(maxY,p.y+hvBot);
  }
  const PAD=48;
  minX-=PAD; maxX+=PAD; minY-=PAD; maxY+=PAD;
  // Min zoom theo chiều ngang: bounding box phải không vượt viewport khi scale quanh cx
  let zx=1, zy=1;
  if(maxX>cx) zx=Math.min(zx,(innerWidth-cx)/(maxX-cx));
  if(minX<cx) zx=Math.min(zx,cx/(cx-minX));
  if(maxY>cy) zy=Math.min(zy,(innerHeight-cy)/(maxY-cy));
  if(minY<cy) zy=Math.min(zy,cy/(cy-minY));
  return Math.max(0.2, Math.min(zx, zy));
}

function clampZoom(z){ return Math.max(calcMinZoom(), Math.min(2.8, z)); }

// Wheel zoom — cả desktop và editor iframe
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.111;
  _zoom = clampZoom(_zoom * delta);
  applyZoom(); draw();
  if(EDIT) postToParent({type:'campus-zoom', zoom:Math.round(_zoom*100)});
}, {passive:false});

// Expose zoom control cho parent (nút +/-  trong editor)
window.__zoomIn  = ()=>{ _zoom=clampZoom(_zoom*1.2); applyZoom(); draw(); };
window.__zoomOut = ()=>{ _zoom=clampZoom(_zoom*0.8); applyZoom(); draw(); };
window.__zoomReset=()=>{ _zoom=clampZoom(1); _panOx=0; _panOy=0; resize(); };

// ── Pan camera bằng kéo chuột/touch trên nền ──
// View mode: kéo nền (không trúng building/facility/decor) để di chuyển camera.
// Edit mode: vẫn pan được khi kéo nền — EDIT pointerdown phía dưới chỉ start drag
// khi hit nhà/decor; nền rỗng thì để outer handler này pan.
let _camPan = null;
let _suppressNextClick = false;
canvas.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  if(_placeMode || _wallMode || _roadMode) return;
  if(hitAt(e.clientX, e.clientY)) return;   // có item → không pan, để click/edit-drag xử lý
  _camPan = { sx:e.clientX, sy:e.clientY, ox:_panOx, oy:_panOy, moved:false, pid:e.pointerId };
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  canvas.style.cursor = 'grabbing';
});
// rAF-coalesce: pointermove bắn 60-120/giây nhưng màn hình chỉ render ~60fps.
// Trên iMac/iPad cũ, draw() ~10-20ms → gọi mỗi event = backlog → giật.
// Chỉ schedule 1 redraw per animation frame; nhiều move event trong cùng frame
// sẽ ghi đè _panOx/_panOy rồi draw 1 lần với giá trị mới nhất.
let _panRaf = 0;
canvas.addEventListener('pointermove', e=>{
  if(!_camPan) return;
  const dx = e.clientX - _camPan.sx, dy = e.clientY - _camPan.sy;
  if(!_camPan.moved && Math.hypot(dx,dy) > 3) _camPan.moved = true;
  _panOx = _camPan.ox + dx;
  _panOy = _camPan.oy + dy;
  if(_panRaf) return;
  _panRaf = requestAnimationFrame(()=>{ _panRaf = 0; applyZoom(); draw(); });
});
function _endCamPan(){
  if(!_camPan) return;
  const moved = _camPan.moved;
  _camPan = null;
  canvas.style.cursor = 'default';
  if(moved){
    // Sau khi kéo xong, click/touchend sẽ fire ngay → nuốt 1 lần để không enter nhầm.
    _suppressNextClick = true;
    setTimeout(()=>{ _suppressNextClick = false; }, 0);
  }
}
canvas.addEventListener('pointerup', _endCamPan);
canvas.addEventListener('pointercancel', _endCamPan);

// Cần cập nhật hitAt để transform ngược toạ độ click → canvas CSS coords
// hitAt nhận clientX/Y → cần compensate zoom+pan
function clientToCanvas(cx, cy){
  const w=innerWidth, h=innerHeight;
  const cx0=w/2, cy0=h/2;
  return { x:(cx-cx0)/_zoom + cx0 - _panOx/_zoom, y:(cy-cy0)/_zoom + cy0 - _panOy/_zoom };
}
window.__clientToCanvas = clientToCanvas;
if(EMBED){ const bk=document.querySelector('.back'); if(bk) bk.style.display='none'; }

// Hit-test tại toạ độ client → {kind:'building'|'facility'|'decor', idx, item} | null
// Building: đọc pixel hit-canvas. Facility/Decor: nearest neighbour trong bán kính.
// Edit mode (super-admin): bật cả decor (cây/prop/xe). View mode: chỉ building + facility.
// Chuyển toạ độ logical P(gx,gy) → screen CSS, compensate cho zoom+pan
function logicalToScreen(lx, ly){
  const w=innerWidth, h=innerHeight, cx0=w/2, cy0=h/2;
  return { x:(lx-cx0)*_zoom+cx0+_panOx, y:(ly-cy0)*_zoom+cy0+_panOy };
}

function hitAt(cx, cy){
  // Wall hit-test (chỉ ở EDIT mode) — kiểm tra grid coords có nằm trong
  // footprint wall nào không. Walls thường mỏng → check trước building để
  // ưu tiên click wall khi user nhắm vào tường nằm sát nhà.
  if(EDIT && WALLS.length){
    const g = pxToGrid(cx, cy);
    // Duyệt ngược: wall vẽ sau cùng (depth lớn hơn) được ưu tiên hit
    for(let i=WALLS.length-1; i>=0; i--){
      const w=WALLS[i]; if(!w) continue;
      const W=Math.max(0.1,Number(w.w)||0.15), D=Math.max(0.1,Number(w.d)||0.15);
      if(g.gx>=w.gx && g.gx<=w.gx+W && g.gy>=w.gy && g.gy<=w.gy+D){
        return {kind:'wall', idx:i, item:w};
      }
    }
  }
  // Building: pixel hit-canvas — đọc physical pixel. Zoom transform đã được baked vào hctx.
  // Cần tính physical pixel coords: clientXY → chia zoom+pan ngược.
  const lp=clientToCanvas(cx,cy);
  const phx=lp.x*DPR, phy=lp.y*DPR;
  const px = hctx.getImageData(Math.round(phx), Math.round(phy), 1, 1).data;
  if(px[3] > 10){ const id = colId(px[0], px[1], px[2]); if(id >= 0) return {kind:'building', idx:id, item:BUILDINGS[id]}; }

  // Edit mode: decor ưu tiên, radius 48px (screen-space, zoom-compensated)
  if(EDIT){
    let bestDecor=null, bestDecorD=Infinity;
    const R=(48*_zoom)*(48*_zoom);  // radius scale theo zoom
    for(let i=0; i<DECOR.length; i++){
      const d0=DECOR[i]; if(!esprite[d0.k] && !esprite[espriteCacheKey(d0.k,d0.rot||0)]) continue;
      const s=logicalToScreen(P(d0.gx,d0.gy).x, P(d0.gx,d0.gy).y);
      const dx=cx-s.x, dy=cy-(s.y-4*_zoom);
      const d=dx*dx+dy*dy;
      if(d<bestDecorD){ bestDecorD=d; bestDecor={kind:'decor',idx:i,item:d0}; }
    }
    if(bestDecor && bestDecorD<=R) return bestDecor;
  }

  // Facility pins (cả 2 mode) — radius 26px screen-space
  let best=null, bestD=Infinity;
  const FR=(26*_zoom)*(26*_zoom);
  for(let i=0; i<FACILITIES.length; i++){
    const f=FACILITIES[i]; const s=logicalToScreen(P(f.gx,f.gy).x, P(f.gx,f.gy).y);
    const dx=cx-s.x, dy=cy-(s.y-12*_zoom);
    const d=dx*dx+dy*dy;
    if(d<bestD){ bestD=d; best={kind:'facility',idx:i,item:f}; }
  }
  if(best && bestD<=FR) return best;

  // Field hit-test (EDIT mode) — vùng to nhất, priority cuối để facility/decor
  // sit-trên-field vẫn click được trước. 3 schema:
  //  · ellipse (cx,cy,rx,ry): pool/pond/track — flat trên ground, dùng grid
  //  · rect   (gx,gy[,w,d]): playmat/sandbox/plaza/garden/... — flat, dùng grid
  //  · gate   (gx,gy LÀM TÂM): 3D đứng (cột + xà), KHÔNG phải flat → hit theo
  //    SCREEN-space giống facility/decor; nếu dùng grid bbox, click vào cột/
  //    xà (cao trên màn hình) sẽ pxToGrid ra ô khác hẳn → miss.
  if(EDIT && FIELDS.length){
    const g = pxToGrid(cx, cy);
    for(let i=FIELDS.length-1; i>=0; i--){
      const f=FIELDS[i]; if(!f) continue;
      if(f.type === 'gate'){
        // Screen-space bbox quanh điểm ground (gx,gy): rộng ±48px (cột ±0.85
        // grid + bệ), cao 78px lên trên (POST_H=58 + LINTEL_H=14 + lùi 6), 14px xuống dưới.
        const sg = logicalToScreen(P(f.gx,f.gy).x, P(f.gx,f.gy).y);
        const sx = cx - sg.x, sy = cy - sg.y;
        const HW = 48*_zoom, UP = 78*_zoom, DOWN = 14*_zoom;
        if(Math.abs(sx) <= HW && sy >= -UP && sy <= DOWN){
          return {kind:'field', idx:i, item:f};
        }
      } else if(f.cx != null){
        const rx=Math.max(0.3, Number(f.rx)||0.5), ry=Math.max(0.3, Number(f.ry)||0.5);
        const dxn=(g.gx-f.cx)/rx, dyn=(g.gy-f.cy)/ry;
        if(dxn*dxn+dyn*dyn <= 1) return {kind:'field', idx:i, item:f};
      } else if(f.gx != null){
        const W = Number(f.w)||Number(f.sz)||1.2;
        const D = Number(f.d)||Number(f.sz)||1.2;
        if(g.gx>=f.gx && g.gx<=f.gx+W && g.gy>=f.gy && g.gy<=f.gy+D){
          return {kind:'field', idx:i, item:f};
        }
      }
    }
  }
  return null;
}

const tip = document.getElementById('tip');
// iPad/touch: không có hover → bỏ qua pointermove cho touch, tap trực tiếp chọn được.
canvas.addEventListener('pointermove', e=>{
  if(e.pointerType === 'touch') return;
  // Place mode — update ghost + draw
  if(_placeMode) {
    const g = pxToGrid ? pxToGrid(e.clientX, e.clientY) : {gx:(e.clientX-ox)/TW+(e.clientY-oy)/TH, gy:(e.clientY-oy)/TH-(e.clientX-ox)/TW};
    _ghostPos = {gx: Math.round(g.gx*2)/2, gy: Math.round(g.gy*2)/2};
    draw(); drawGhost(); return;
  }
  // Wall mode — update hover preview
  if(_wallMode) {
    const g = pxToGrid(e.clientX, e.clientY);
    _wallHover = _snapPoint(g.gx, g.gy);
    draw(); drawWallPreview(); return;
  }
  // Road mode — update hover preview
  if(_roadMode) {
    const g = pxToGrid(e.clientX, e.clientY);
    _roadHover = _snapPoint(g.gx, g.gy);
    draw(); drawRoadPreview(); return;
  }
  const h = hitAt(e.clientX, e.clientY);
  const id = (h && h.kind === 'building') ? h.idx : -1;
  if(id !== hovered){ hovered = id; draw(); }
  if(h){
    const label = (h.kind==='decor')    ? `${h.item.k} (${h.item.gx}, ${h.item.gy})`
                : (h.kind==='field')    ? `🟦 ${h.item.type}${h.item.label?` · ${h.item.label}`:''}`
                : (h.kind==='facility') ? `${h.item.emoji||''} ${h.item.name||h.item.id||''}`
                : `${h.item.emoji||''} ${h.item.name||''}`;
    tip.textContent = label; tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; tip.style.opacity = 1;
    // Pointer chỉ khi item interactive (đồng bộ với click handler ở handleTap).
    // Decor/facility/field edit-mode → grab. Non-interactive item → default cursor.
    const interactive = EDIT || h.kind === 'decor' || hasInteractive(h.item);
    const draggableInEdit = EDIT && (h.kind==='decor' || h.kind==='facility' || h.kind==='field');
    canvas.style.cursor = draggableInEdit ? 'grab' : (interactive ? 'pointer' : 'default');
  } else { tip.style.opacity = 0; canvas.style.cursor = EDIT ? 'default' : 'default'; }
});
canvas.addEventListener('pointerleave', ()=>{ tip.style.opacity = 0; if(hovered !== -1){ hovered = -1; draw(); } });

// Tap/click: tự hit-test tại điểm chạm thay vì dựa vào `hovered` (vì touch không có hover)
function handleTap(cx, cy){
  if(_placeMode) { if(_ghostPos) placeItem(_ghostPos.gx, _ghostPos.gy); return; }
  // Wall mode: click 1 chốt A, click 2 chốt B → tạo wall, B trở thành A mới
  if(_wallMode) {
    const g = pxToGrid(cx, cy);
    const pt = _snapPoint(g.gx, g.gy);
    if(!_wallStart){
      _wallStart = pt;
      postToParent({type:'campus-wall-anchor', gx:pt.gx, gy:pt.gy});
      draw(); drawWallPreview();
    } else {
      const seg = _buildWallSegment(_wallStart, pt);
      if(seg){
        WALLS.push(seg);
        postToParent({type:'campus-wall-added', idx:WALLS.length-1, wall:seg, total:WALLS.length});
        postToParent({type:'campus-dirty'});
      }
      _wallStart = pt;  // chain: B → next A
      draw(); drawWallPreview();
    }
    return;
  }
  // Road mode: click 1 chốt A, click 2 chốt B → tạo road, B trở thành A mới
  if(_roadMode) {
    const g = pxToGrid(cx, cy);
    const pt = _snapPoint(g.gx, g.gy);
    if(!_roadStart){
      _roadStart = pt;
      postToParent({type:'campus-road-anchor', gx:pt.gx, gy:pt.gy, kind:_roadKind});
      draw(); drawRoadPreview();
    } else {
      const seg = _buildRoadSegment(_roadStart, pt, _roadKind);
      if(seg){
        ROADS.push(seg);
        postToParent({type:'campus-road-added', idx:ROADS.length-1, road:seg, total:ROADS.length});
        postToParent({type:'campus-dirty'});
      }
      _roadStart = pt;
      draw(); drawRoadPreview();
    }
    return;
  }
  const h = hitAt(cx, cy);
  if(EDIT){
    if(h && h.kind==='building'){
      selected=h.idx; selectedDecor=-1; selectedWall=-1; draw();
      postToParent({type:'campus-select', idx:selected, item:BUILDINGS[selected]});
    } else if(h && h.kind==='decor'){
      selectedWall=-1; selectDecor(h.idx);
    } else if(h && h.kind==='wall'){
      selectedWall=h.idx; selected=-1; selectedDecor=-1; draw();
      postToParent({type:'campus-wall-select', idx:h.idx, wall:WALLS[h.idx]});
    } else if(!h){
      selectedWall=-1; deselectAll();
    }
    return;
  }
  if(!h) return;
  // Item không có trải nghiệm thực → click trên bản đồ noop (tránh dead-end UX).
  if(!hasInteractive(h.item)) return;
  if(h.kind === 'building') enter(h.item, h.idx);
  else enter(h.item, null);
}
canvas.addEventListener('click', e=>{
  if(_suppressNextClick){ _suppressNextClick = false; return; }
  handleTap(e.clientX, e.clientY);
});
// Trên touch, tránh delay 300ms và đảm bảo phản hồi ngay cả khi click bị nuốt
canvas.addEventListener('touchend', e=>{
  if(_suppressNextClick){ _suppressNextClick = false; return; }
  if(e.changedTouches && e.changedTouches.length){
    const t = e.changedTouches[0];
    e.preventDefault();
    handleTap(t.clientX, t.clientY);
  }
}, {passive:false});

// ====== EDIT MODE: drag-to-move + keyboard + lệnh từ parent ======
// pxToGrid dùng cả ngoài EDIT (place mode) — khai báo ở scope ngoài.
const pxToGrid=(cx,cy)=>({ gx:(cx-ox)/TW + (cy-oy)/TH, gy:(cy-oy)/TH - (cx-ox)/TW });
const snap=(v,step=0.5)=>Math.round(v/step)*step;

if(EDIT){

  let drag=null;   // {kind, idx, useCenter, startAx, startAy, offGx, offGy}
  // useCenter=true → item dùng (cx,cy) thay (gx,gy); áp dụng cho pool/pond/track.
  canvas.addEventListener('pointerdown', e=>{
    if(e.button!==0) return;
    if(_placeMode) return;   // place mode: pointerdown không kéo
    if(_wallMode) return;    // wall mode: handleTap đảm nhiệm
    if(_roadMode) return;    // road mode: handleTap đảm nhiệm
    const h=hitAt(e.clientX, e.clientY);
    if(!h || (h.kind!=='building' && h.kind!=='decor' && h.kind!=='facility' && h.kind!=='field')) return;
    const g=pxToGrid(e.clientX, e.clientY);
    let item;
    if(h.kind==='building')      item = BUILDINGS[h.idx];
    else if(h.kind==='decor')    item = DECOR[h.idx];
    else if(h.kind==='facility') item = FACILITIES[h.idx];
    else /* field */             item = FIELDS[h.idx];
    const useCenter = (item.cx != null);
    const ax = useCenter ? item.cx : item.gx;
    const ay = useCenter ? item.cy : item.gy;
    drag={ kind:h.kind, idx:h.idx, useCenter, startAx:ax, startAy:ay, offGx:g.gx-ax, offGy:g.gy-ay };
    if(h.kind==='building'){ selected=h.idx; }
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor='grabbing';
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drag) return;
    const g=pxToGrid(e.clientX, e.clientY);
    const newAx=snap(g.gx-drag.offGx), newAy=snap(g.gy-drag.offGy);
    if(drag.kind==='building'){
      const b=BUILDINGS[drag.idx]; b.gx=newAx; b.gy=newAy;
    } else if(drag.kind==='decor'){
      const d=DECOR[drag.idx]; d.gx=newAx; d.gy=newAy; syncDecorBack(d);
    } else if(drag.kind==='facility'){
      const f=FACILITIES[drag.idx]; f.gx=newAx; f.gy=newAy;
    } else /* field */ {
      const f=FIELDS[drag.idx];
      if(drag.useCenter){ f.cx=newAx; f.cy=newAy; }
      else              { f.gx=newAx; f.gy=newAy; }
    }
    draw();
  });
  function endDrag(e){
    if(!drag) return;
    if(drag.kind==='building'){
      const b=BUILDINGS[drag.idx];
      const moved = b.gx!==drag.startAx || b.gy!==drag.startAy;
      if(moved) postToParent({type:'campus-move', idx:drag.idx, gx:b.gx, gy:b.gy, item:b});
      else      postToParent({type:'campus-select', idx:drag.idx, item:b});
    } else if(drag.kind==='decor'){
      const d=DECOR[drag.idx];
      const moved = d.gx!==drag.startAx || d.gy!==drag.startAy;
      if(moved) postToParent({type:'campus-decor-move', idx:drag.idx, src:d._src, srcIdx:d._idx, k:d.k, gx:d.gx, gy:d.gy});
    } else if(drag.kind==='facility'){
      const f=FACILITIES[drag.idx];
      const moved = f.gx!==drag.startAx || f.gy!==drag.startAy;
      if(moved){
        postToParent({type:'campus-facility-move', idx:drag.idx, id:f.id, name:f.name, emoji:f.emoji, gx:f.gx, gy:f.gy});
        postToParent({type:'campus-dirty'});
      }
    } else /* field */ {
      const f=FIELDS[drag.idx];
      const curAx = drag.useCenter ? f.cx : f.gx;
      const curAy = drag.useCenter ? f.cy : f.gy;
      const moved = curAx!==drag.startAx || curAy!==drag.startAy;
      if(moved){
        const msg = {type:'campus-field-move', idx:drag.idx, ftype:f.type};
        if(drag.useCenter){ msg.cx=f.cx; msg.cy=f.cy; } else { msg.gx=f.gx; msg.gy=f.gy; }
        postToParent(msg);
        postToParent({type:'campus-dirty'});
      }
    }
    drag=null; canvas.style.cursor='default';
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Keyboard: Del/Backspace xoá (building hoặc decor), Esc bỏ chọn
  document.addEventListener('keydown', e=>{
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key==='Escape'){
      if(_wallMode){
        // 1st ESC: huỷ anchor A; 2nd ESC: thoát wall mode
        if(_wallStart){ _wallStart=null; draw(); drawWallPreview(); }
        else window.__stopWallMode();
      }
      else if(_roadMode){
        if(_roadStart){ _roadStart=null; draw(); drawRoadPreview(); }
        else window.__stopRoadMode();
      }
      else if(_placeMode){ window.__cancelPlaceMode(); draw(); }
      else deselectAll();
      e.preventDefault(); return;
    }
    if(e.key==='Delete' || e.key==='Backspace'){
      if(selectedWall>=0){ window.__deleteWall(selectedWall); e.preventDefault(); return; }
    }
    if(e.key==='Delete' || e.key==='Backspace'){
      if(selected>=0){
        const removed=BUILDINGS.splice(selected,1)[0];
        postToParent({type:'campus-delete', idx:selected, item:removed});
        selected=-1; draw();
      } else if(selectedDecor>=0){
        deleteDecor(selectedDecor);
      }
      e.preventDefault();
    }
  });

  // Nhận lệnh từ parent inspector: set field, delete, rotate
  window.addEventListener('message', e=>{
    const m=e.data; if(!m || !m.type) return;
    if(m.type==='campus-cmd-set'){
      const i=m.idx; if(i==null || !BUILDINGS[i]) return;
      const b=BUILDINGS[i];
      // chỉ cho sửa các field an toàn — không cho đổi url/model qua đây (dùng palette)
      const allowed=new Set(['name','emoji','pin','s','rot','flag','gx','gy']);
      if(m.key==='rot-delta'){
        b.rot=(((b.rot||0)+(m.value||90))%360+360)%360;
        window.__rerenderBuilding && window.__rerenderBuilding(i);
        draw();
        postToParent({type:'campus-rotate', idx:i, rot:b.rot, item:b});
        postToParent({type:'campus-dirty'});
      } else if(allowed.has(m.key)){
        b[m.key]=m.value;
        if(m.key==='rot' && window.__rerenderBuilding) window.__rerenderBuilding(i);
        draw();
        postToParent({type:'campus-dirty'});
      }
    } else if(m.type==='campus-cmd-delete'){
      const i=m.idx; if(i==null || !BUILDINGS[i]) return;
      BUILDINGS.splice(i,1); selected=-1; draw();
      postToParent({type:'campus-dirty'});
    } else if(m.type==='campus-cmd-select'){
      const i=m.idx; if(i==null || !BUILDINGS[i]) return;
      selected=i; draw();
      postToParent({type:'campus-select', idx:i, item:BUILDINGS[i]});
    } else if(m.type==='campus-cmd-state'){
      postToParent({type:'campus-state', layout: CAMPUSES[_dom]});
    } else if(m.type==='campus-cmd-place'){
      // parent chọn model từ palette → bắt đầu place mode
      window.__startPlaceMode(m); draw();
    } else if(m.type==='campus-cmd-set-decor'){
      const d=DECOR[m.idx]; if(!d) return;
      const allowed=new Set(['pin','rot','s','gx','gy']);
      if(allowed.has(m.key)){ d[m.key]=m.value; syncDecorBack(d); draw(); postToParent({type:'campus-dirty'}); }
    } else if(m.type==='campus-cmd-rotate-decor'){
      rotateDecor(m.idx, m.delta||90);
    } else if(m.type==='campus-cmd-delete-decor'){
      deleteDecor(m.idx);
    } else if(m.type==='campus-cmd-cancel-place'){
      window.__cancelPlaceMode(); draw();
    } else if(m.type==='campus-cmd-wall-start'){
      window.__startWallMode();
    } else if(m.type==='campus-cmd-wall-stop'){
      window.__stopWallMode();
    } else if(m.type==='campus-cmd-wall-delete'){
      window.__deleteWall(Number(m.idx));
    } else if(m.type==='campus-cmd-wall-clear'){
      window.__clearWalls();
    } else if(m.type==='campus-cmd-wall-select'){
      selectedWall = Number(m.idx); selected = -1; selectedDecor = -1;
      draw();
    } else if(m.type==='campus-cmd-wall-update'){
      // Update wall attr (gx/gy/w/d) — sửa số trong inspector
      const i=Number(m.idx); const w=WALLS[i]; if(!w) return;
      const allowed=new Set(['gx','gy','w','d']);
      if(allowed.has(m.key)){
        const v=Number(m.value); if(Number.isFinite(v)){ w[m.key]=v; draw(); postToParent({type:'campus-dirty'}); }
      }
    } else if(m.type==='campus-cmd-road-start'){
      window.__startRoadMode(m.kind || 'internal');
    } else if(m.type==='campus-cmd-road-stop'){
      window.__stopRoadMode();
    } else if(m.type==='campus-cmd-road-delete'){
      window.__deleteRoad(Number(m.idx));
    } else if(m.type==='campus-cmd-road-clear'){
      window.__clearRoads();
    } else if(m.type==='campus-cmd-thumb'){
      // Render sprite cho 1 model URL và trả DataURL về parent (dùng cho palette thumbnail)
      (async()=>{
        try{
          const url = m.url.startsWith('http') ? m.url : `/campus-proto/${m.url}`;
          if(!modelCache[m.url]) modelCache[m.url] = await load(url);
          const sc = modelCache[m.url].clone(true); prep(sc, __GS);
          const spr = renderSprite(sc);
          postToParent({type:'campus-thumb', canvasId:m.canvasId, dataUrl:spr.toDataURL()});
        }catch(e){ /* bỏ qua nếu model lỗi */ }
      })();
    }
  });

  // Báo parent đã sẵn sàng — gửi danh sách building để inspector dropdown
  postToParent({type:'campus-ready', domain:_dom, buildings:BUILDINGS.map((b,i)=>({i, id:b.id, name:b.name, emoji:b.emoji}))});

  console.log('[campus-editor] EDIT mode ON — click building để chọn, drag để di chuyển, R xoay, Del xoá');
}
</script>
