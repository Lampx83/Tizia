<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Campus 3D · Trường Dược</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; background: linear-gradient(180deg, #aee4ff 0%, #d8f3ff 52%, #eafff0 100%); }
  canvas { display: block; }
  .hud { position: fixed; left:0; right:0; top:0; padding: 14px 18px; display:flex; align-items:center; gap:12px; z-index:10; pointer-events:none; }
  .hud .title { pointer-events:auto; background:rgba(15,23,42,.72); color:#fff; backdrop-filter:blur(8px); padding:8px 16px; border-radius:12px; font-weight:800; font-size:16px; box-shadow:0 6px 20px rgba(0,0,0,.2); }
  .hud .title small { display:block; font-weight:600; font-size:11px; opacity:.7; }
  .hud .spacer { flex:1; }
  .hud .btns { pointer-events:auto; display:flex; gap:8px; }
  .hud button { border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:13px; padding:9px 14px; border-radius:10px; background:rgba(255,255,255,.85); color:#1f2937; box-shadow:0 4px 12px rgba(0,0,0,.15); transition:transform .1s, background .15s; }
  .hud button:hover { transform:translateY(-1px); background:#fff; }
  .hud button.on { background:#fbbf24; }
  .hint { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10; background:rgba(15,23,42,.7); color:#fff; padding:7px 14px; border-radius:20px; font-size:12.5px; backdrop-filter:blur(8px); pointer-events:none; }
  .back { position:fixed; left:18px; bottom:16px; z-index:11; background:rgba(15,23,42,.7); color:#fff; text-decoration:none; padding:7px 13px; border-radius:20px; font-size:12.5px; backdrop-filter:blur(8px); }
  .credit { position:fixed; right:14px; bottom:16px; z-index:11; color:#33506a; font-size:11px; opacity:.7; }
  .label { color:#1f2937; font-size:12px; font-weight:800; white-space:nowrap; pointer-events:none; background:rgba(255,255,255,.92); padding:3px 9px; border-radius:20px; box-shadow:0 3px 10px rgba(0,0,0,.18); border:1.5px solid rgba(0,0,0,.06); }
  .label .e { margin-right:4px; }
  #toast { position:fixed; left:50%; top:70px; transform:translateX(-50%) translateY(-10px); z-index:20; background:#16a34a; color:#fff; font-weight:800; padding:10px 18px; border-radius:12px; opacity:0; transition:opacity .25s, transform .25s; box-shadow:0 8px 24px rgba(0,0,0,.25); pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:30; background:rgba(216,243,255,.85); color:#23506a; font-weight:800; font-size:15px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three-0.160/build/three.module.js",
  "three/addons/": "/vendor/three-0.160/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="title">💊 Trường Dược <small>Campus 3D · KayKit + Poly Pizza · xoay 360°</small></div>
  <div class="spacer"></div>
  <div class="btns"><button id="rotL">⟲ 90°</button><button id="rotR">90° ⟳</button><button id="resetBtn">⌂ Về góc nhìn</button></div>
</div>
<div class="hint">🖱️ Kéo để xoay · cuộn để zoom · click vào toà nhà để vào</div>
<a class="back" href="/">← Tizia</a>
<div class="credit">3D: KayKit (CC0) · khán đài: Poly Pizza (CC-BY)</div>
<div id="toast"></div>
<div id="loading">Đang tải mô hình 3D…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const KAY = f => encodeURI(`assets/kaykit/${f}.gltf`);
const SUB = f => encodeURI(`assets/suburban/Models/GLB format/${f}.glb`);
const PP  = f => encodeURI(`assets/pp/${f}.glb`);

// lưới 3×3 — mỗi ô 1 toà; (0,0)=trung tâm. rot = hướng quay (độ)
const LOTS = [
  { role:'hospital', name:'BV Thực hành',      emoji:'🏥', url:KAY('building_A_withoutBase'), col:-1, row:-1, rot:90 },
  { role:'admin',    name:'Toà Hiệu bộ',       emoji:'🏛️', url:KAY('building_G_withoutBase'), col:0,  row:-1, rot:0  },
  { role:'lab',      name:'PTN Hoá – Bào chế',  emoji:'🧪', url:KAY('building_B_withoutBase'), col:1,  row:-1, rot:270},
  { role:'library',  name:'Thư viện',           emoji:'📚', url:KAY('building_C_withoutBase'), col:-1, row:0,  rot:90 },
  { role:'garden',   name:'Vườn dược liệu',     emoji:'🌿', url:KAY('building_E_withoutBase'), col:0,  row:0,  rot:180},
  { role:'lecture',  name:'Giảng đường',        emoji:'🎓', url:KAY('building_D_withoutBase'), col:1,  row:0,  rot:180},
  { role:'dorm',     name:'Ký túc xá',          emoji:'🛏️', url:KAY('building_H_withoutBase'), col:-1, row:1,  rot:270},
  { role:'pharmacy', name:'Nhà thuốc GPP',      emoji:'💊', url:KAY('building_F_withoutBase'), col:0,  row:1,  rot:0  },
  { role:'gmp',      name:'Nhà máy GMP',        emoji:'🏭', url:KAY('building_B_withoutBase'), col:1,  row:1,  rot:90 },
];

const FRONT_OFFSET = 0;   // tinh chỉnh nếu mặt chính KayKit quay sai
const app=document.getElementById('app'), W=()=>app.clientWidth, H=()=>app.clientHeight;
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0xdff1ff, 60, 120);
const camera=new THREE.PerspectiveCamera(46, W()/H(), 0.1, 1000);
const CAM0=new THREE.Vector3(50, 36, 62), TGT=new THREE.Vector3(0, 2, 0); camera.position.copy(CAM0);

const renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(W(),H()); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; app.appendChild(renderer.domElement);

const labelRenderer=new CSS2DRenderer(); labelRenderer.setSize(W(),H());
labelRenderer.domElement.style.cssText='position:fixed;top:0;left:0;pointer-events:none'; app.appendChild(labelRenderer.domElement);

const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08; controls.minDistance=20; controls.maxDistance=150;
controls.maxPolarAngle=Math.PI*0.46; controls.target.copy(TGT);

scene.add(new THREE.HemisphereLight(0xffffff, 0xa6c0a0, 1.0));
const sun=new THREE.DirectionalLight(0xfff4e0, 1.5); sun.position.set(22,36,18); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const s=42; Object.assign(sun.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:1,far:110}); sun.shadow.bias=-0.0004; scene.add(sun);

const ground=new THREE.Mesh(new THREE.CircleGeometry(51,56), new THREE.MeshStandardMaterial({color:0x9ed47f, roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.y=0.06; ground.receiveShadow=true; scene.add(ground);

// ===== BAO QUANH: biển + đảo + núi + mây (gợi campus có thể mở rộng) =====
scene.background=new THREE.Color(0xbfe6ff);
const sea=new THREE.Mesh(new THREE.CircleGeometry(320,64), new THREE.MeshStandardMaterial({color:0x4ea6da, roughness:.6, metalness:.05}));
sea.rotation.x=-Math.PI/2; sea.position.y=-1.2; scene.add(sea);
const island=new THREE.Mesh(new THREE.CylinderGeometry(52,46,4,48), new THREE.MeshStandardMaterial({color:0xdcc594, roughness:1}));
island.position.y=-2; island.receiveShadow=true; scene.add(island);
const mtnMat=new THREE.MeshStandardMaterial({color:0x6f8f64, roughness:1, flatShading:true});
const snowMat=new THREE.MeshStandardMaterial({color:0xf2f6fb, roughness:1, flatShading:true});
for(let i=0;i<16;i++){ const a=i/16*Math.PI*2+0.15; const r=82+Math.random()*55; const h=24+Math.random()*28;
  const rad=h*0.72; const m=new THREE.Mesh(new THREE.ConeGeometry(rad,h,5), mtnMat); m.position.set(Math.cos(a)*r,h/2-2.4,Math.sin(a)*r); m.rotation.y=Math.random()*6; scene.add(m);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(rad*0.34,h*0.3,5), snowMat); cap.position.set(m.position.x,h*0.86-2.4,m.position.z); cap.rotation.y=m.rotation.y; scene.add(cap); }
const cloudMat=new THREE.MeshStandardMaterial({color:0xffffff, roughness:1});
const clouds=[];
for(let i=0;i<11;i++){ const g=new THREE.Group(); const n=3+(i%3);
  for(let j=0;j<n;j++){ const s=new THREE.Mesh(new THREE.IcosahedronGeometry(2.4+Math.random()*2.2,0), cloudMat); s.position.set((j-n/2)*2.8,(Math.random()-.5)*2,(Math.random()-.5)*3); g.add(s); }
  const a=Math.random()*Math.PI*2, r=58+Math.random()*72; g.position.set(Math.cos(a)*r,24+Math.random()*16,Math.sin(a)*r); g.scale.setScalar(1.3+Math.random()*1.2); scene.add(g); clouds.push(g); }
function driftClouds(){ for(const c of clouds){ c.position.x+=0.013; if(c.position.x>165) c.position.x=-165; } }

const SPACING=12;
function roadStrip(x,z,w,d){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.08,d), new THREE.MeshStandardMaterial({color:0x9aa3ad, roughness:.95})); m.position.set(x,0.04,z); m.receiveShadow=true; scene.add(m); }
const HALF=SPACING/2, EXT=SPACING*1.5;
roadStrip(0,-HALF, EXT*2, 3.2); roadStrip(0,HALF, EXT*2, 3.2);
roadStrip(-HALF,0, 3.2, EXT*2); roadStrip(HALF,0, 3.2, EXT*2);
roadStrip(-22,0, 16, 3.2);    // đường nối ra sân vận động
const plaza=new THREE.Mesh(new THREE.CircleGeometry(4.2,32), new THREE.MeshStandardMaterial({color:0xe9dec0, roughness:.95}));
plaza.rotation.x=-Math.PI/2; plaza.position.y=0.05; plaza.receiveShadow=true; scene.add(plaza);

// ===== Sân vận động: sân cỏ (ground) + khán đài (model thật, render đúng trong 3D) =====
const FX=-30, FZ=2;
const pitch=new THREE.Mesh(new THREE.BoxGeometry(20,0.12,12), new THREE.MeshStandardMaterial({color:0x57bf4e, roughness:1}));
pitch.position.set(FX,0.06,FZ); pitch.receiveShadow=true; scene.add(pitch);
const pitch2=new THREE.Mesh(new THREE.BoxGeometry(17.5,0.14,9.5), new THREE.MeshStandardMaterial({color:0x69cf5e, roughness:1}));
pitch2.position.set(FX,0.08,FZ); pitch2.receiveShadow=true; scene.add(pitch2);
const circle=new THREE.Mesh(new THREE.RingGeometry(1.8,2.1,32), new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide}));
circle.rotation.x=-Math.PI/2; circle.position.set(FX,0.16,FZ); scene.add(circle);

const loader=new GLTFLoader();
const load=url=>new Promise((res,rej)=>loader.load(url, g=>res(g.scene), undefined, e=>{ console.error('LOAD FAIL',url,e); rej(e); }));
const sizeOf=o=>{ const b=new THREE.Box3().setFromObject(o); const v=new THREE.Vector3(); b.getSize(v); return {b,v}; };
const pickRoots=[]; let hovered=null;

function place(sc, gx, gz, scale){
  sc.scale.setScalar(scale);
  sc.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  const {b}=sizeOf(sc); const c=new THREE.Vector3(); b.getCenter(c);
  sc.position.x += gx - c.x; sc.position.z += gz - c.z; sc.position.y += -b.min.y;
  scene.add(sc); return sc;
}
function addLabel(gx,gy,gz,emoji,name){ const div=document.createElement('div'); div.className='label'; div.innerHTML=`<span class="e">${emoji}</span>${name}`; const l=new CSS2DObject(div); l.position.set(gx,gy,gz); scene.add(l); }

(async function build(){
  const loaded=[];
  for(const lot of LOTS){ try{ const sc=await load(lot.url); loaded.push({lot, sc}); }catch(e){ console.warn('skip',lot.url); } }
  let maxFoot=0; for(const it of loaded){ const {v}=sizeOf(it.sc); maxFoot=Math.max(maxFoot, v.x, v.z); }
  const GS = maxFoot? 7/maxFoot : 1;

  for(const {lot,sc} of loaded){
    const gx=lot.col*SPACING, gz=lot.row*SPACING;
    // mặt chính quay vào trục đường trung tâm (hướng về tâm campus)
    sc.rotation.y = Math.atan2(-gx, -gz) + FRONT_OFFSET;
    place(sc, gx, gz, GS);
    sc.userData.lot=lot; pickRoots.push(sc);
    const {v}=sizeOf(sc); addLabel(gx, v.y+1.4, gz, lot.emoji, lot.name);
  }

  // khán đài (Poly Pizza, CC-BY) — đặt cạnh sân cỏ
  try{ const gs=await load(PP('grandstand')); const {v}=sizeOf(gs); const gsc=16/Math.max(v.x,v.z);
    gs.rotation.y=Math.PI; place(gs, FX, FZ-8, gsc); gs.userData.lot={emoji:'🏟️',name:'Sân vận động'}; pickRoots.push(gs);
    addLabel(FX, 6.5, FZ-8, '🏟️', 'Sân vận động'); }catch(e){ console.warn('no grandstand'); }

  // cây
  let treeL=null, treeS=null; try{ treeL=await load(SUB('tree-large')); treeS=await load(SUB('tree-small')); }catch(e){}
  if(treeL){ const spots=[[-EXT,-EXT],[EXT,-EXT],[-EXT,EXT],[EXT,EXT],[0,-EXT],[0,EXT],[EXT,0],[-6,-6],[6,6],[6,-6],[-6,6],[-40,10],[-40,-6],[-20,12]];
    for(const [x,z] of spots){ const t=(Math.random()<.5?treeL:treeS).clone(); place(t, x, z, GS*(0.8+Math.random()*0.4)); t.rotation.y=Math.random()*Math.PI; } }

  document.getElementById('loading').style.display='none';
})();

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(ev){ const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((ev.clientX-r.left)/r.width)*2-1; mouse.y=-((ev.clientY-r.top)/r.height)*2+1; ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickRoots,true); if(!hits.length) return null;
  let o=hits[0].object; while(o && !o.userData.lot) o=o.parent; return o; }
function setHover(g){ if(hovered===g) return; if(hovered) hovered.position.y=hovered.userData.y0||0;
  hovered=g; if(g){ g.userData.y0=g.position.y; g.position.y+=0.6; renderer.domElement.style.cursor='pointer'; } else renderer.domElement.style.cursor='grab'; }
renderer.domElement.addEventListener('pointermove', e=>setHover(pick(e)));
renderer.domElement.addEventListener('click', e=>{ const g=pick(e); if(g) toast(`Vào: ${g.userData.lot.emoji} ${g.userData.lot.name}`); });
const toastEl=document.getElementById('toast'); let tT; function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>toastEl.classList.remove('show'),1600); }

const UP=new THREE.Vector3(0,1,0); let snapAz=null;
function rotate90(d){ snapAz=controls.getAzimuthalAngle()+d*Math.PI/2; }   // xoay campus 90°, hết vòng tự lặp
document.getElementById('rotL').onclick=()=>rotate90(-1);
document.getElementById('rotR').onclick=()=>rotate90(1);
document.getElementById('resetBtn').onclick=()=>{ camera.position.copy(CAM0); controls.target.copy(TGT); snapAz=null; };
function stepSnap(){ if(snapAz===null) return; const cur=controls.getAzimuthalAngle(); let diff=snapAz-cur; diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  const st=THREE.MathUtils.clamp(diff,-0.10,0.10); const off=camera.position.clone().sub(controls.target); off.applyAxisAngle(UP,st); camera.position.copy(controls.target).add(off); if(Math.abs(diff)<0.012) snapAz=null; }

function resize(){ camera.aspect=W()/H(); camera.updateProjectionMatrix(); renderer.setSize(W(),H()); labelRenderer.setSize(W(),H()); }
addEventListener('resize', resize);
(function loop(){ requestAnimationFrame(loop); stepSnap(); driftClouds(); controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera); })();
</script>
</body>
</html>
