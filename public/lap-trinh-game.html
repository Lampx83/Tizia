<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>💻 Lập trình điều khiển nhân vật · Tizia</title>
<meta name="description" content="Viết JS để điều khiển nhân vật đi qua các phòng, ăn coin, mở cửa — CodeCombat phong cách Tizia." />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --bg:#0b1020; --bg-2:#101733; --card:#151c3a; --card-2:#1d2547;
    --border:#2a3563; --text:#e6e9f5; --text-soft:#9aa3c7;
    --accent:#fbbf24; --good:#34d399; --bad:#fb7185; --purple:#a78bfa;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%;
    font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif; color:var(--text);
    background: radial-gradient(900px 600px at 20% 0%, rgba(34,197,94,.08), transparent 70%),
                radial-gradient(900px 600px at 90% 30%, rgba(167,139,250,.10), transparent 70%),
                var(--bg);
  }
  a { color:inherit; }
  .top { position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
    background:rgba(11,16,32,.7); border-bottom:1px solid var(--border);
    padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .back { text-decoration:none; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    font-size:13px; font-weight:600; color:inherit; }
  .top h1 { margin:0; font-size:18px; }
  .top .level-info { margin-left:auto; font-size:13px; color:var(--text-soft); }

  .wrap { max-width:none; margin:0 auto; padding:18px; display:grid;
    grid-template-columns: 1fr 1fr; gap:18px; }

  .panel { background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px; }
  .panel h3 { margin:0 0 10px; font-size:14px; font-weight:700; color:var(--text-soft); letter-spacing:.6px; text-transform:uppercase; }

  /* Game canvas */
  .game-host { background:#020617; border:2px solid var(--border); border-radius:12px;
    aspect-ratio:1; overflow:hidden; position:relative; }
  .game-host canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .game-meta { display:flex; gap:14px; margin-top:10px; font-size:12.5px; color:var(--text-soft); }
  .game-meta b { color:var(--accent); }
  .game-meta .ok { color:var(--good); }
  .game-meta .bad { color:var(--bad); }

  /* Editor */
  .editor { background:#0f172a; border:1px solid var(--border); border-radius:10px;
    overflow:hidden; }
  .editor textarea {
    width:100%; min-height:280px; padding:12px 14px;
    background:transparent; border:none; outline:none; resize:vertical;
    color:#a7f3d0; font-family:'JetBrains Mono', 'Courier New', monospace;
    font-size:13.5px; line-height:1.55;
  }
  .editor textarea::placeholder { color:rgba(255,255,255,.25); }
  .editor-toolbar {
    display:flex; gap:8px; padding:10px;
    border-top:1px solid rgba(255,255,255,0.06);
    background:rgba(255,255,255,0.02);
  }
  .editor-toolbar button {
    padding:8px 16px; border-radius:10px; border:none; cursor:pointer;
    font:700 13px 'Inter', sans-serif; transition:transform .12s;
  }
  .editor-toolbar button:hover:not(:disabled) { transform:scale(1.03); }
  .editor-toolbar .run { background:linear-gradient(135deg, var(--good), #10b981); color:#052e16; }
  .editor-toolbar .reset { background:rgba(255,255,255,.08); color:var(--text); }
  .editor-toolbar .hint { background:rgba(167,139,250,.18); color:#c4b5fd; border:1px solid rgba(167,139,250,.4); }
  .editor-toolbar button:disabled { opacity:.5; cursor:not-allowed; }

  .console { margin-top:10px; padding:10px 14px; border-radius:10px;
    background:rgba(0,0,0,.4); border:1px solid var(--border);
    font-family:'JetBrains Mono', monospace; font-size:12px;
    color:#cbd5e1; max-height:140px; overflow-y:auto; line-height:1.6; }
  .console .line.err { color:#fda4af; }
  .console .line.ok { color:#86efac; }
  .console .line.info { color:#fde68a; }

  /* Levels */
  .levels { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .levels .lv {
    padding:6px 14px; border-radius:18px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    font-size:12.5px; cursor:pointer; font-weight:700;
  }
  .levels .lv.cur { background:var(--good); color:#052e16; border-color:var(--good); }
  .levels .lv.done { background:rgba(34,197,94,.18); color:var(--good); }

  .desc { font-size:13.5px; color:var(--text-soft); margin-bottom:12px; line-height:1.55; }
  .desc b { color:var(--accent); }
  .desc code { background:rgba(167,139,250,.16); padding:1px 6px; border-radius:4px;
    color:#c4b5fd; font-family:'JetBrains Mono'; font-size:12.5px; }

  .victory {
    position:fixed; inset:0; z-index:300;
    background:rgba(2,6,23,.85); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .victory.open { opacity:1; pointer-events:auto; }
  .victory .card {
    background:linear-gradient(180deg, #1e293b, #0f172a);
    border:1px solid rgba(34,197,94,.5); border-radius:18px;
    padding:24px 32px; text-align:center;
  }
  .victory .star { font-size:72px; animation:vic-bounce 1.2s ease-in-out infinite; }
  @keyframes vic-bounce { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
  .victory h2 { font-size:24px; margin:8px 0;
    background:linear-gradient(135deg, #fbbf24, #22c55e);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .victory button { background:linear-gradient(135deg, var(--good), #10b981); color:#052e16;
    border:none; padding:11px 24px; border-radius:12px; font:800 14px 'Inter', system-ui, sans-serif; cursor:pointer; }

  @media (max-width:880px) { .wrap { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header id="auth-header"></header>
<script type="module" src="./js/auth-header.js"></script>

<div class="top">
  <a class="back" href="/index.html">← Trang chủ</a>
  <h1>💻 Lập trình điều khiển nhân vật</h1>
  <span class="level-info" id="lv-info">Level 1 / 5</span>
</div>

<div class="wrap">
  <div class="panel">
    <h3>🎮 Sân chơi</h3>
    <div class="levels" id="lv-tabs"></div>
    <div class="desc" id="lv-desc"></div>
    <div class="game-host">
      <canvas id="game" width="320" height="320"></canvas>
    </div>
    <div class="game-meta">
      <span>🪙 <b id="coin-count">0</b>/<span id="coin-max">0</span></span>
      <span>📍 <span id="pos">(?, ?)</span></span>
      <span id="status" class="ok">Sẵn sàng</span>
    </div>
  </div>

  <div class="panel">
    <h3>⌨ Viết code</h3>
    <div class="editor">
      <textarea id="code" placeholder="// Viết code điều khiển nhân vật ở đây
// Các hàm có sẵn:
//   forward()      → đi tới 1 ô theo hướng đang quay
//   right()        → quay phải 90°
//   left()         → quay trái 90°
//   pickup()       → nhặt coin tại ô hiện tại
//   sleep(ms)      → đợi (tùy chọn)
//   say('xin chào') → nói gì đó

// Ví dụ:
// forward();
// forward();
// right();
// pickup();
"></textarea>
      <div class="editor-toolbar">
        <button class="run" id="run">▶ Chạy</button>
        <button class="reset" id="reset">↻ Reset</button>
        <button class="hint" id="hint">💡 Gợi ý</button>
      </div>
    </div>
    <div class="console" id="cons"></div>
  </div>
</div>

<div class="victory" id="vic">
  <div class="card">
    <div class="star">🏆</div>
    <h2 data-vic-title>Hoàn thành!</h2>
    <p style="color:#cbd5e1" data-vic-msg>Em đã giải xong level.</p>
    <p data-reward style="color:#fde68a;font-weight:700"></p>
    <button data-vic-next>Level kế tiếp →</button>
  </div>
</div>

<script type="module">
// Lưu ý kỹ thuật: code HS chạy trong iframe sandbox để không truy cập DOM/cookie.
// Nhân vật điều khiển qua postMessage protocol giữa iframe ↔ host page.

const LEVELS = [
  {
    title: 'L1: Đi 3 bước',
    desc: 'Viết code đi 3 bước về phía trước. Hàm: <code>forward()</code>',
    grid: 5, hero: [0, 2, 'E'], coins: [], goal: [3, 2],
    reward: { coin: 20, xp: 30 },
  },
  {
    title: 'L2: Quẹo phải',
    desc: 'Đi 2 bước, quẹo phải, đi 2 bước nữa. Hàm: <code>forward()</code>, <code>right()</code>.',
    grid: 5, hero: [0, 0, 'E'], coins: [], goal: [2, 2],
    reward: { coin: 30, xp: 50 },
  },
  {
    title: 'L3: Ăn 3 coin',
    desc: 'Đi qua các ô có coin và <code>pickup()</code> chúng. Cuối cùng tới ô đích.',
    grid: 6, hero: [0, 0, 'E'], coins: [[2,0],[4,0],[4,3]], goal: [4, 5],
    reward: { coin: 40, xp: 70 },
  },
  {
    title: 'L4: Dùng vòng lặp',
    desc: 'Lưới 8x8 — đi đến ô (7,7). Dùng <code>for</code> loop để gọn code.',
    grid: 8, hero: [0, 0, 'E'], coins: [], goal: [7, 7],
    reward: { coin: 60, xp: 110 },
  },
  {
    title: 'L5: Mê cung coin',
    desc: 'Lưới 8x8, 5 coin rải rác. Code thông minh để gom hết coin trước khi tới đích.',
    grid: 8, hero: [0, 0, 'E'], coins: [[2,1],[5,2],[3,5],[6,4],[1,6]], goal: [7, 7],
    reward: { coin: 100, xp: 200 },
  },
];

let currentLv = parseInt(localStorage.getItem('lap-trinh:level') || '0', 10);
let state = null;
let abortRun = false;

const STORAGE_DONE = 'lap-trinh:done';
const done = JSON.parse(localStorage.getItem(STORAGE_DONE) || '[]');

function initLevel(idx) {
  currentLv = idx;
  localStorage.setItem('lap-trinh:level', String(idx));
  const lv = LEVELS[idx];
  state = {
    grid: lv.grid,
    hero: { x: lv.hero[0], y: lv.hero[1], dir: lv.hero[2] },
    coins: lv.coins.map(c => ({ x: c[0], y: c[1], taken: false })),
    coinsCollected: 0,
    coinsMax: lv.coins.length,
    goal: { x: lv.goal[0], y: lv.goal[1] },
    msgs: [],
    finished: false,
  };
  abortRun = true; setTimeout(() => abortRun = false, 100);
  document.getElementById('lv-info').textContent = `Level ${idx + 1} / ${LEVELS.length}`;
  document.getElementById('lv-desc').innerHTML = `<b>${lv.title}</b> — ${lv.desc}`;
  document.getElementById('coin-max').textContent = state.coinsMax;
  document.getElementById('coin-count').textContent = '0';
  document.getElementById('cons').innerHTML = '';
  document.getElementById('status').textContent = 'Sẵn sàng';
  document.getElementById('status').className = 'ok';
  renderTabs();
  draw();
}

function renderTabs() {
  const tabs = document.getElementById('lv-tabs');
  tabs.innerHTML = LEVELS.map((lv, i) => {
    const cls = i === currentLv ? 'cur' : (done.includes(i) ? 'done' : '');
    return `<div class="lv ${cls}" data-i="${i}">${done.includes(i) ? '✓ ' : ''}L${i+1}</div>`;
  }).join('');
  tabs.addEventListener('click', (e) => {
    const el = e.target.closest('.lv');
    if (el) initLevel(Number(el.dataset.i));
  });
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function draw() {
  const N = state.grid;
  const cell = canvas.width / N;
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
  }
  // Goal
  ctx.fillStyle = 'rgba(34,197,94,0.32)';
  ctx.fillRect(state.goal.x * cell, state.goal.y * cell, cell, cell);
  ctx.fillStyle = '#22c55e';
  ctx.font = `${cell * 0.55}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏁', state.goal.x * cell + cell/2, state.goal.y * cell + cell/2);
  // Coins
  for (const c of state.coins) {
    if (c.taken) continue;
    ctx.fillStyle = '#fbbf24';
    ctx.font = `${cell * 0.6}px sans-serif`;
    ctx.fillText('🪙', c.x * cell + cell/2, c.y * cell + cell/2);
  }
  // Hero
  const hx = state.hero.x * cell + cell/2;
  const hy = state.hero.y * cell + cell/2;
  ctx.save();
  ctx.translate(hx, hy);
  const angle = ({E:0, S:90, W:180, N:270})[state.hero.dir] || 0;
  ctx.rotate(angle * Math.PI / 180);
  ctx.font = `${cell * 0.7}px sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText('🤖', 0, 0);
  ctx.restore();
  // Position
  document.getElementById('pos').textContent = `(${state.hero.x}, ${state.hero.y})`;
}

const DELTAS = { E:[1,0], W:[-1,0], N:[0,-1], S:[0,1] };
const TURN_R = { E:'S', S:'W', W:'N', N:'E' };
const TURN_L = { E:'N', N:'W', W:'S', S:'E' };

function cnsLog(text, cls='') {
  const c = document.getElementById('cons');
  const ln = document.createElement('div');
  ln.className = 'line ' + cls;
  ln.textContent = text;
  c.appendChild(ln);
  c.scrollTop = c.scrollHeight;
}

async function runUserCode() {
  if (state.finished) initLevel(currentLv);
  abortRun = false;
  document.getElementById('cons').innerHTML = '';
  document.getElementById('status').textContent = 'Đang chạy…';
  document.getElementById('status').className = 'info';

  const code = document.getElementById('code').value;
  const stepDelay = 350;
  let stepCount = 0;
  const MAX_STEPS = 200;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const api = {
    forward: async () => {
      if (abortRun) throw new Error('aborted');
      if (++stepCount > MAX_STEPS) throw new Error('Quá nhiều bước (∞ loop?)');
      const [dx, dy] = DELTAS[state.hero.dir];
      const nx = state.hero.x + dx, ny = state.hero.y + dy;
      if (nx < 0 || ny < 0 || nx >= state.grid || ny >= state.grid) {
        cnsLog('💥 Đụng tường tại (' + nx + ',' + ny + ')', 'err');
        throw new Error('wall');
      }
      state.hero.x = nx; state.hero.y = ny;
      draw();
      await sleep(stepDelay);
    },
    right: async () => {
      if (abortRun) throw new Error('aborted');
      state.hero.dir = TURN_R[state.hero.dir];
      draw();
      await sleep(stepDelay / 2);
    },
    left: async () => {
      if (abortRun) throw new Error('aborted');
      state.hero.dir = TURN_L[state.hero.dir];
      draw();
      await sleep(stepDelay / 2);
    },
    pickup: async () => {
      if (abortRun) throw new Error('aborted');
      const here = state.coins.find(c => !c.taken && c.x === state.hero.x && c.y === state.hero.y);
      if (here) {
        here.taken = true; state.coinsCollected += 1;
        document.getElementById('coin-count').textContent = state.coinsCollected;
        cnsLog(`✨ Nhặt được coin (${here.x},${here.y})!`, 'ok');
        draw();
      } else {
        cnsLog('⚠️ Không có coin ở đây', 'err');
      }
      await sleep(stepDelay / 2);
    },
    say: (text) => cnsLog('💬 ' + String(text), 'info'),
    sleep,
  };

  try {
    // Build async function with API as scope vars
    const fn = new AsyncFunction(
      'forward', 'right', 'left', 'pickup', 'say', 'sleep',
      `'use strict';\n${code}`
    );
    await fn(api.forward, api.right, api.left, api.pickup, api.say, api.sleep);
    cnsLog('✓ Code chạy xong (' + stepCount + ' bước)', 'ok');
    checkVictory();
  } catch (e) {
    if (e.message !== 'aborted') cnsLog('✗ Lỗi: ' + e.message, 'err');
  } finally {
    document.getElementById('status').textContent = 'Sẵn sàng';
    document.getElementById('status').className = 'ok';
  }
}

const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;

function checkVictory() {
  if (state.finished) return;
  if (state.hero.x !== state.goal.x || state.hero.y !== state.goal.y) {
    cnsLog('🚩 Chưa tới ô đích', 'info'); return;
  }
  if (state.coinsCollected < state.coinsMax) {
    cnsLog(`💰 Còn ${state.coinsMax - state.coinsCollected} coin chưa nhặt`, 'info'); return;
  }
  state.finished = true;
  if (!done.includes(currentLv)) {
    done.push(currentLv);
    localStorage.setItem(STORAGE_DONE, JSON.stringify(done));
  }
  const lv = LEVELS[currentLv];
  const vic = document.getElementById('vic');
  vic.querySelector('[data-vic-title]').textContent = `🏆 Hoàn thành ${lv.title}!`;
  vic.querySelector('[data-vic-msg]').textContent = 'Em đã giải xong level bằng code.';
  vic.querySelector('[data-reward]').textContent = `+${lv.reward.coin} 🪙 · +${lv.reward.xp} ✨`;
  vic.classList.add('open');
  // Reward server: tận dụng claim quest code (chỉ cộng tracking, không trigger
  // chấm thực; gold/coin sẽ vào ví khi user làm các nhiệm vụ chính thức).
  fetch('/api/engagement/track', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: 'code', amount: 1 }),
    credentials: 'same-origin',
  }).catch(() => {});
  renderTabs();
  // Refresh widgets
  setTimeout(() => { try { window.__tziaEngagementHud?.refresh(); } catch{} try { window.__tziaPetWidget?.refresh(); } catch{} }, 500);
}

document.getElementById('run').addEventListener('click', runUserCode);
document.getElementById('reset').addEventListener('click', () => initLevel(currentLv));
document.getElementById('hint').addEventListener('click', () => {
  const hints = [
    'Gõ: forward(); forward(); forward();',
    'Gõ: forward(); forward(); right(); forward(); forward();',
    'Đi từng ô, đến ô có coin thì pickup(); rồi đi tiếp.',
    'Vòng lặp: for (let i = 0; i < 7; i++) { await forward(); }',
    'Chia làm 2 đoạn: gom coin trước, rồi đi đến goal.',
  ];
  cnsLog('💡 ' + hints[currentLv], 'info');
});

document.getElementById('vic').querySelector('[data-vic-next]').addEventListener('click', () => {
  document.getElementById('vic').classList.remove('open');
  if (currentLv + 1 < LEVELS.length) initLevel(currentLv + 1);
});

initLevel(currentLv);
</script>

<script type="module" src="./js/engagement-hud.js?v=2026-06-05-r2"></script>
<script type="module" src="./js/onboarding-60s.js?v=2026-06-08-r8"></script>
<script type="module" src="./js/pet-widget.js?v=2026-06-10-tl1"></script>
<script type="module" src="./js/daily-login.js?v=2026-06-07b"></script>
</body>
</html>
