<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎴 Memory Match — Tiếng Anh Lớp 2 · Tizia</title>
<style>
  :root { --bg-1:#eef2ff; --bg-2:#dbeafe; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444;
    --card:#ffffff; --border:rgba(0,0,0,.08); --ink:#1f2937; --muted:#6b7280; --back:#1e3a8a; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:'Inter','Quicksand',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse 90% 50% at 50% 0%, #dbeafe, transparent),linear-gradient(180deg,var(--bg-1),#e0e7ff)}
  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.7);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
  .back{color:var(--ink);text-decoration:none;opacity:.85;font-size:14px;background:rgba(0,0,0,.06);padding:8px 14px;border-radius:10px;font-weight:600}
  .back:hover{background:rgba(0,0,0,.12)}
  .top h1{margin:0;font-size:18px;font-weight:800}
  .top .sub{font-size:12.5px;opacity:.6;font-weight:500}
  .top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .stat{background:white;border:1px solid var(--border);border-radius:14px;padding:7px 13px;font-weight:700}
  .stat .v{color:var(--accent);font-size:16px}
  .wrap{max-width:none;margin:0 auto;padding:24px 18px 60px}
  .intro{text-align:center;margin:6px 0 18px;opacity:.85;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cell{aspect-ratio:3/4;perspective:800px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .cell.flip .inner,.cell.match .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;
    border:1.5px solid var(--border);font-weight:800;text-align:center;padding:6px;box-shadow:0 6px 16px rgba(0,0,0,.06)}
  .face.front{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:34px}
  .face.back{background:#fff;color:var(--ink);transform:rotateY(180deg);font-size:18px;line-height:1.2}
  .face.back .emo{font-size:30px;margin-bottom:4px}
  .cell.match .face.back{background:#dcfce7;border-color:#22c55e}
  .cell.bad .face.back{background:#fee2e2;border-color:#ef4444;animation:shake .35s}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.hide{display:none}
  .panel{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:28px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .panel .ic{font-size:64px;margin-bottom:6px}
  .panel h2{margin:6px 0 8px;font-size:22px}
  .panel p{margin:4px 0;color:var(--muted);font-size:14px}
  .panel .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
  .btn.ghost{background:rgba(0,0,0,.06);color:var(--ink)}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<script type="module">import { applyViewOnlyGate } from "/js/enrollment.js"; applyViewOnlyGate("primary");</script>
<div class="top">
  <a class="back" href="/space.html?b=g2&domain=primary">← Lớp 2</a>
  <div><h1>🎴 Memory Match</h1><div class="sub">Tiếng Anh Lớp 2 — lật thẻ ghép cặp Anh ↔ Việt</div></div>
  <div class="right">
    <div class="stat">⏱ <span class="v" id="time">0s</span></div>
    <div class="stat">🎯 <span class="v" id="moves">0</span></div>
    <div class="stat">⭐ <span class="v" id="pairs">0/6</span></div>
  </div>
</div>

<div class="wrap">
  <p class="intro">Bấm để lật. Tìm cặp <b>tiếng Anh ↔ tiếng Việt</b> đúng nghĩa. Càng ít lượt — càng nhiều XP!</p>
  <div class="grid" id="grid"></div>
</div>

<div class="modal hide" id="modal-over">
  <div class="panel">
    <div class="ic" id="ov-ic">🏆</div>
    <h2 id="ov-title">Hoàn thành!</h2>
    <p id="ov-msg">Bạn đã ghép xong 6 cặp.</p>
    <p>Điểm: <b id="ov-score">0</b> · Lượt: <b id="ov-moves">0</b> · Thời gian: <b id="ov-time">0s</b></p>
    <p>Best: <b id="ov-best">—</b></p>
    <div class="row">
      <button class="btn" id="btn-restart">🔁 Chơi lại</button>
      <a class="btn ghost" href="/space.html?b=g2&domain=primary">← Về Lớp 2</a>
    </div>
  </div>
</div>

<script type="module">
const POOL = await fetch('/api/content/lop2-anh-memory', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : { items: [] }).then(j => j.items || []).catch(() => []);
const $ = s => document.querySelector(s);
const grid = $('#grid');
let cards=[], flipped=[], moves=0, pairs=0, t0=0, timer=null, locked=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function build(){
  // Chọn 6 cặp ngẫu nhiên
  const picks = shuffle([...POOL]).slice(0,6);
  const deck = [];
  picks.forEach((p,i)=>{
    deck.push({pair:i,kind:'en',label:p.en,emo:p.emo});
    deck.push({pair:i,kind:'vi',label:p.vi,emo:p.emo});
  });
  cards = shuffle(deck);
  grid.innerHTML='';
  cards.forEach((c,idx)=>{
    const el=document.createElement('div');
    el.className='cell'; el.dataset.idx=idx;
    el.innerHTML=`<div class="inner">
      <div class="face front">?</div>
      <div class="face back"><div class="emo">${c.emo}</div>${c.label}</div>
    </div>`;
    el.addEventListener('click',()=>onFlip(idx));
    grid.appendChild(el);
  });
}

function onFlip(idx){
  if(locked) return;
  const cell = grid.children[idx];
  if(cell.classList.contains('flip')||cell.classList.contains('match')) return;
  if(!timer) start();
  cell.classList.add('flip');
  flipped.push(idx);
  if(flipped.length===2){
    moves++; $('#moves').textContent=moves;
    const [a,b]=flipped;
    if(cards[a].pair===cards[b].pair && cards[a].kind!==cards[b].kind){
      grid.children[a].classList.add('match');
      grid.children[b].classList.add('match');
      pairs++; $('#pairs').textContent=pairs+'/6';
      flipped=[];
      if(pairs===6) setTimeout(end,400);
    }else{
      locked=true;
      grid.children[a].classList.add('bad');
      grid.children[b].classList.add('bad');
      setTimeout(()=>{
        grid.children[a].classList.remove('flip','bad');
        grid.children[b].classList.remove('flip','bad');
        flipped=[]; locked=false;
      },720);
    }
  }
}

function start(){
  t0=performance.now();
  timer=setInterval(()=>{
    $('#time').textContent=Math.floor((performance.now()-t0)/1000)+'s';
  },200);
}

function end(){
  clearInterval(timer); timer=null;
  const secs=Math.floor((performance.now()-t0)/1000);
  // score: 200 * 6 cặp - moves penalty - time penalty
  const score = Math.max(50, 1200 - moves*30 - secs*4);
  const key='lop2-anh-memory.best';
  const prev=Number(localStorage.getItem(key)||0);
  const best = Math.max(prev, score);
  if(score>prev) localStorage.setItem(key,score);

  $('#ov-score').textContent=score;
  $('#ov-moves').textContent=moves;
  $('#ov-time').textContent=secs+'s';
  $('#ov-best').textContent=best;
  $('#ov-title').textContent = moves<=14 ? '🏆 Tuyệt vời!' : moves<=20 ? '🌟 Giỏi quá!' : '👍 Hoàn thành!';
  $('#ov-msg').textContent = moves<=14 ? 'Trí nhớ siêu phàm!' : 'Chơi lại để phá kỉ lục nhé!';
  $('#modal-over').classList.remove('hide');

  // Sync XP
  try{
    const xp = Math.floor(score/15);
    if(xp>0 && window.fetch){
      fetch('/api/wallet',{credentials:'include'}).then(r=>r.ok?r.json():null).then(w=>{
        if(!w) return;
        fetch('/api/wallet',{method:'PUT',credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({...w, xp:(w.xp||0)+xp})});
      });
    }
  }catch{}
}

$('#btn-restart').addEventListener('click',()=>{
  clearInterval(timer); timer=null; moves=0; pairs=0; flipped=[]; locked=false;
  $('#moves').textContent=0; $('#pairs').textContent='0/6'; $('#time').textContent='0s';
  $('#modal-over').classList.add('hide'); build();
});

build();
</script>
</body>
</html>
